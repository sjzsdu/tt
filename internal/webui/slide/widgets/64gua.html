<div class="gua64-card" data-lines="{{ lines }}">
  <div class="gua64-copy">
    <div class="gua64-name">{{ name }}</div>
    {{#if subtitle}}<div class="gua64-subtitle">{{ subtitle }}</div>{{/if}}
    {{#if noteSummary}}<div class="gua64-note">{{ noteSummary }}</div>{{/if}}
  </div>
  <div class="gua64-lines" aria-label="{{ name }} {{ lines }}">
    {{#each linesChars}}
      <div class="gua64-line-row" aria-label="{{ yaoLabel }} {{ yaoText }}">
        <div class="gua64-yao">
          <span class="gua64-yao-label">{{ yaoLabel }}</span>
          <span class="gua64-yao-text">{{ yaoText }}</span>
        </div>
        <div class="gua64-line {{#if isYang}}yang{{/if}}{{#if isYin}}yin{{/if}}">
          <span></span><span></span>
        </div>
      </div>
    {{/each}}
  </div>
</div>
