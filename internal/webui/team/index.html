<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>tt team</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0d12;
      --panel: rgba(20, 23, 31, .88);
      --panel-2: #171a23;
      --line: rgba(255,255,255,.09);
      --text: #f4f5f7;
      --muted: #969caa;
      --accent: #b6f36b;
      --accent-2: #7fd1ff;
      --warning: #ffd479;
      --danger: #ff8b8b;
      --shadow: 0 20px 70px rgba(0,0,0,.36);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 5%, rgba(127,209,255,.12), transparent 28rem),
        radial-gradient(circle at 95% 25%, rgba(182,243,107,.09), transparent 32rem),
        var(--bg);
      font: 14px/1.55 Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .shell { max-width: 1500px; margin: 0 auto; padding: 28px; }
    header {
      display: flex; align-items: flex-start; justify-content: space-between;
      gap: 24px; padding: 8px 2px 26px;
    }
    .eyebrow {
      display: flex; align-items: center; gap: 9px;
      color: var(--accent); font-size: 11px; font-weight: 800;
      letter-spacing: .18em; text-transform: uppercase;
    }
    .mark {
      width: 9px; height: 9px; border-radius: 50%; background: var(--accent);
      box-shadow: 0 0 18px var(--accent);
    }
    h1 { margin: 8px 0 3px; font-size: clamp(28px, 4vw, 48px); line-height: 1; letter-spacing: -.045em; }
    .subtitle { color: var(--muted); max-width: 720px; }
    .status-pill {
      display: flex; align-items: center; gap: 9px; min-width: 140px;
      border: 1px solid var(--line); border-radius: 999px; padding: 9px 13px;
      background: rgba(255,255,255,.035); color: var(--muted);
    }
    .status-pill strong { color: var(--text); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
    .pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
    .running .pulse { background: var(--accent); animation: pulse 1.5s infinite; }
    .failed .pulse { background: var(--danger); }
    @keyframes pulse { 50% { box-shadow: 0 0 0 7px rgba(182,243,107,0); } 0% { box-shadow: 0 0 0 0 rgba(182,243,107,.4); } }
    .grid { display: grid; grid-template-columns: minmax(0, 1fr) 370px; gap: 18px; }
    .panel {
      border: 1px solid var(--line); border-radius: 20px;
      background: var(--panel); box-shadow: var(--shadow); backdrop-filter: blur(18px);
      overflow: hidden;
    }
    .panel-head {
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
      padding: 17px 19px; border-bottom: 1px solid var(--line);
    }
    .panel-head h2 { margin: 0; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; }
    .meta { color: var(--muted); font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .timeline { min-height: 510px; max-height: calc(100vh - 215px); overflow: auto; padding: 20px; }
    .empty { color: var(--muted); padding: 60px 20px; text-align: center; }
    .event { display: grid; grid-template-columns: 46px minmax(0,1fr); gap: 13px; margin-bottom: 18px; }
    .avatar {
      width: 40px; height: 40px; border-radius: 13px; display: grid; place-items: center;
      background: #242936; border: 1px solid var(--line); color: var(--accent-2);
      font-weight: 800; text-transform: uppercase;
    }
    .event.user .avatar { color: var(--warning); }
    .event.final .avatar { color: var(--accent); background: rgba(182,243,107,.08); }
    .event.error .avatar { color: var(--danger); }
    .event-top { display: flex; align-items: baseline; flex-wrap: wrap; gap: 9px; margin: 1px 0 5px; }
    .speaker { font-weight: 760; }
    .event-meta { color: var(--muted); font-size: 11px; }
    .message {
      white-space: pre-wrap; overflow-wrap: anywhere; padding: 13px 15px;
      border: 1px solid var(--line); border-radius: 4px 15px 15px 15px;
      background: var(--panel-2);
    }
    .event.final .message { border-color: rgba(182,243,107,.25); background: rgba(182,243,107,.055); }
    .event.system .message { color: var(--muted); font-size: 12px; padding: 9px 12px; }
    .side { display: flex; flex-direction: column; gap: 18px; }
    .members, .memory { padding: 15px; }
    .member {
      display: grid; grid-template-columns: 38px minmax(0,1fr) auto; align-items: center;
      gap: 11px; padding: 11px; border-radius: 13px;
    }
    .member + .member { border-top: 1px solid var(--line); border-radius: 0; }
    .member-avatar {
      width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center;
      background: linear-gradient(145deg, rgba(127,209,255,.16), rgba(182,243,107,.09));
      color: var(--accent-2); font-weight: 800; text-transform: uppercase;
    }
    .member-name { font-weight: 720; }
    .member-role { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .badge {
      border: 1px solid var(--line); border-radius: 999px; padding: 3px 7px;
      color: var(--muted); font-size: 9px; letter-spacing: .08em; text-transform: uppercase;
    }
    .memory-body {
      max-height: 310px; overflow: auto; margin: 0; white-space: pre-wrap;
      color: #ced2db; font: 12px/1.65 ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .question {
      margin-bottom: 18px; padding: 16px 18px; border-left: 3px solid var(--warning);
      background: rgba(255,212,121,.045); border-radius: 0 14px 14px 0;
    }
    .question-label { color: var(--warning); font-size: 10px; font-weight: 800; letter-spacing: .13em; text-transform: uppercase; }
    .question-text { margin-top: 5px; font-size: 16px; }
    .error-banner { display: none; margin-bottom: 16px; padding: 12px 15px; border: 1px solid rgba(255,139,139,.3); border-radius: 12px; color: var(--danger); }
    .error-banner.visible { display: block; }
    @media (max-width: 940px) {
      .shell { padding: 18px; }
      header { flex-direction: column; }
      .grid { grid-template-columns: 1fr; }
      .timeline { max-height: none; }
      .side { display: grid; grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 620px) {
      .side { grid-template-columns: 1fr; }
      .event { grid-template-columns: 34px minmax(0,1fr); }
      .avatar { width: 32px; height: 32px; border-radius: 10px; font-size: 11px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <div class="eyebrow"><span class="mark"></span> tt collaborative runtime</div>
        <h1 id="team-title">Team</h1>
        <div class="subtitle" id="thread-id">Connecting to the team thread…</div>
      </div>
      <div class="status-pill" id="status-pill"><span class="pulse"></span><strong id="status">loading</strong><span id="phase"></span></div>
    </header>
    <div class="error-banner" id="error"></div>
    <div class="grid">
      <section class="panel">
        <div class="panel-head"><h2>Public room</h2><span class="meta" id="round-meta">round —</span></div>
        <div class="timeline" id="timeline"><div class="empty">Waiting for team activity…</div></div>
      </section>
      <aside class="side">
        <section class="panel">
          <div class="panel-head"><h2>Team members</h2><span class="meta" id="member-count">0</span></div>
          <div class="members" id="members"></div>
        </section>
        <section class="panel">
          <div class="panel-head"><h2>Durable memory</h2><span class="meta" id="memory-version">v0</span></div>
          <div class="memory"><pre class="memory-body" id="memory">No team memory yet.</pre></div>
        </section>
      </aside>
    </div>
  </main>
  <script>
    const $ = (id) => document.getElementById(id);
    let signature = "";
    function node(tag, cls, text) {
      const n = document.createElement(tag);
      if (cls) n.className = cls;
      if (text !== undefined) n.textContent = text;
      return n;
    }
    function initials(value) {
      return String(value || "?").split(/[-_\s]+/).filter(Boolean).slice(0,2).map(x => x[0]).join("");
    }
    function renderMembers(items) {
      const root = $("members"); root.replaceChildren();
      (items || []).forEach(item => {
        const row = node("div", "member");
        row.append(node("div", "member-avatar", initials(item.id)));
        const copy = node("div");
        copy.append(node("div", "member-name", "@" + item.id));
        copy.append(node("div", "member-role", item.role || item.agent || "team member"));
        row.append(copy);
        const badges = [];
        if (item.finalizer) badges.push("finalizer");
        else if (item.facilitator) badges.push("facilitator");
        if (item.memory_maintainer && !badges.length) badges.push("memory");
        row.append(node("span", "badge", badges.join(" · ") || "member"));
        root.append(row);
      });
      $("member-count").textContent = String((items || []).length);
    }
    function eventKind(event) {
      if (event.type === "user_message") return "user";
      if (event.type === "final_answer") return "final";
      if (event.type.includes("failed") || event.type === "agent_error") return "error";
      if (event.type === "agent_message" || event.type === "agent_yield") return "agent";
      return "system";
    }
    function visibleEvents(events) {
      return (events || []).filter(e => [
        "user_message", "agent_message", "agent_yield", "agent_error",
        "final_answer", "memory_updated", "memory_update_failed",
        "round_started", "round_resumed", "round_interrupted",
        "round_failed", "round_completed"
      ].includes(e.type));
    }
    function renderTimeline(state) {
      const root = $("timeline");
      const nearBottom = root.scrollHeight - root.scrollTop - root.clientHeight < 90;
      root.replaceChildren();
      if (state.round && state.round.question) {
        const q = node("div", "question");
        q.append(node("div", "question-label", "Current question"));
        q.append(node("div", "question-text", state.round.question));
        root.append(q);
      }
      const events = visibleEvents(state.events);
      if (!events.length) root.append(node("div", "empty", "Waiting for team activity…"));
      events.forEach(event => {
        const kind = eventKind(event);
        if (event.type === "round_started" && state.round && state.round.question) return;
        if (event.type === "user_message" && state.round && event.round === state.round.number) return;
        const row = node("article", "event " + kind);
        const who = event.from || (kind === "system" ? "tt" : "team");
        row.append(node("div", "avatar", initials(who)));
        const body = node("div");
        const top = node("div", "event-top");
        let label = who === "user" ? "You" : (who === "tt" ? "Runtime" : "@" + who);
        if (event.type === "final_answer") label += " · final";
        top.append(node("span", "speaker", label));
        const meta = [event.phase, event.wave ? "wave " + event.wave : "", event.at ? new Date(event.at).toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"}) : ""].filter(Boolean).join(" · ");
        top.append(node("span", "event-meta", meta));
        body.append(top);
        const content = event.content || event.error || event.type.replaceAll("_", " ");
        body.append(node("div", "message", content));
        row.append(body); root.append(row);
      });
      if (nearBottom) root.scrollTop = root.scrollHeight;
    }
    function render(state) {
      $("team-title").textContent = state.team.title || state.team.team || "Team";
      $("thread-id").textContent = state.thread.id || "—";
      const status = state.thread.status || "unknown";
      $("status").textContent = status;
      $("phase").textContent = state.round && state.round.phase ? "· " + state.round.phase : "";
      $("status-pill").className = "status-pill " + status;
      $("round-meta").textContent = state.round ? "round " + state.round.number + " · " + (state.round.phase || state.round.status) : "no active round";
      $("memory-version").textContent = "v" + ((state.memory && state.memory.version) || 0);
      $("memory").textContent = (state.memory && state.memory.content) || "No team memory yet.";
      renderMembers(state.agents);
      renderTimeline(state);
      const error = (state.round && state.round.error) || state.thread.error || "";
      $("error").textContent = error;
      $("error").className = "error-banner" + (error ? " visible" : "");
      document.title = (state.team.team || "team") + " · tt";
    }
    async function refresh() {
      try {
        const response = await fetch("/api/state", {cache: "no-store"});
        if (!response.ok) throw new Error("HTTP " + response.status);
        const state = await response.json();
        const next = JSON.stringify([state.thread.updated_at, state.round && state.round.phase, state.events && state.events.length, state.memory && state.memory.version]);
        if (next !== signature) { signature = next; render(state); }
      } catch (error) {
        $("error").textContent = "Dashboard disconnected: " + error.message;
        $("error").className = "error-banner visible";
      }
    }
    refresh();
    setInterval(refresh, 800);
  </script>
</body>
</html>
