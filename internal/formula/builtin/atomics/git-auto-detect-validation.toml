formula = "git-auto-detect-validation"
description = "原子 formula：根据仓库标记自动选择轻量验证命令并执行。"
version = 1
type = "atomic"
category = "git"
tags = ["git", "validation", "test", "atomic"]

[preflight]
[[preflight.checks]]
type = "command"
name = "python3"
command = "python3"
message = "需要安装 python3"
[[preflight.checks]]
type = "git"
name = "git-repo"
require_repo = true
message = "当前目录必须是 git 仓库"

[vars]
command = { description = "可选覆盖验证命令；为空则自动检测", default = "" }

[[steps]]
id = "validation"
title = "自动检测并运行验证"
execution = "script"
[steps.script]
command = ["python3", "-c", """
import json, os, subprocess
override=os.environ.get('TT_COMMAND','').strip()
if override:
    selected=['bash','-lc',override]
else:
    candidates=[(['go','test','./...'],'go.mod'),(['npm','test'],'package.json'),(['pnpm','test'],'pnpm-lock.yaml'),(['pytest'],'pyproject.toml')]
    selected=None
    for cmd, marker in candidates:
        if os.path.exists(marker): selected=cmd; break
if not selected:
    print(json.dumps({'attempted':False,'success':True,'command':[],'stdout':'','stderr':'no supported project marker found; skipped automatic validation'},ensure_ascii=False)); raise SystemExit(0)
p=subprocess.run(selected,text=True,capture_output=True)
print(json.dumps({'attempted':True,'success':p.returncode==0,'command':selected,'exit_code':p.returncode,'stdout':p.stdout if p.returncode==0 else '', 'stderr':'' if p.returncode==0 else (p.stderr or p.stdout)},ensure_ascii=False))
"""]
format = "json"
timeout = "20m"
continue_on_error = true
[steps.script.env]
TT_COMMAND = "{{command}}"
[steps.validate]
format = "json"
required = ["stdout"]
