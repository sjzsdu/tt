formula = "repo-evidence-map"
description = "原子 formula：扫描仓库 README、配置、入口、测试和主要源码摘要，形成轻量证据地图。"
version = 1
type = "atomic"
category = "repo"
tags = ["repo", "evidence", "docs", "atomic"]

[preflight]
[[preflight.checks]]
type = "command"
name = "python3"
command = "python3"
message = "需要安装 python3"

[vars]
repo_path = { description = "仓库目录", required = true }
focus = { description = "关注点", default = "" }

[[steps]]
id = "evidence"
title = "抽取证据地图"
execution = "script"
description = "扫描仓库内 README、配置、入口、测试和主要源码文件，输出带 excerpt 的轻量 evidence_files 列表。"
[steps.script]
command = ["python3", "-c", '''
import json, os
from pathlib import Path
repo=Path(os.environ.get('TT_REPO_PATH','')).resolve(); focus=os.environ.get('TT_FOCUS','')
if not repo.exists(): print(json.dumps({'ok':False,'error':'repo_path not found','repo_path':str(repo)},ensure_ascii=False,separators=(',',':'))); raise SystemExit(0)
ignore={'.git','node_modules','dist','build','.next','coverage','.tt','vendor','target'}; important={'README.md','package.json','go.mod','pyproject.toml','Cargo.toml','Makefile','Dockerfile','docker-compose.yml','tsconfig.json'}; items=[]
for root,dirs,files in os.walk(repo):
 relroot=Path(root).relative_to(repo); dirs[:]=[d for d in dirs if d not in ignore and not d.startswith('.')]
 for fn in files:
  rel=str(relroot/fn).replace('\\','/'); path=Path(root)/fn; score=0
  if fn in important or fn.lower().startswith('readme'): score+=5
  if rel.startswith(('src/','app/','pages/','routes/','cmd/','internal/','pkg/','lib/','server/','frontend/')): score+=3
  if any(x in rel.lower() for x in ['test','spec','config','router','route','main','index','entry','api','schema']): score+=2
  if score<=0: continue
  try: text=path.read_text(errors='ignore')[:2400]
  except Exception: text=''
  items.append({'path':rel,'score':score,'excerpt':text})
items.sort(key=lambda x:(-x['score'],x['path']))
print(json.dumps({'ok':True,'repo_path':str(repo),'focus':focus,'evidence_files':items[:60]},ensure_ascii=False,separators=(',',':')))
''']
format = "json"
timeout = "60s"
[steps.script.env]
TT_REPO_PATH = "{{repo_path}}"
TT_FOCUS = "{{focus}}"
[steps.validate]
format = "json"
required = ["stdout"]
