formula = "repo-prepare-local-or-clone"
description = "原子 formula：解析本地目录/GitHub URL/owner-repo，必要时浅克隆到 .tt/tmp，并输出仓库基础信息。"
version = 1
type = "atomic"
category = "repo"
tags = ["repo", "clone", "docs", "atomic"]

[preflight]
[[preflight.checks]]
type = "command"
name = "git"
command = "git"
message = "需要安装 git"
[[preflight.checks]]
type = "command"
name = "python3"
command = "python3"
message = "需要安装 python3"

[vars]
repo = { description = "GitHub 仓库 URL、owner/repo 或本地目录", required = true }
tmp_root = { description = "临时克隆根目录", default = ".tt/tmp/repos" }

[[steps]]
id = "repo"
title = "准备仓库"
execution = "script"
description = "把本地路径、GitHub URL 或 owner/repo 解析为可用仓库路径；必要时浅克隆到 .tt/tmp/repos。"
[steps.script]
command = ["python3", "-c", '''
import json, os, re, shutil, subprocess
from pathlib import Path
repo=os.environ.get('TT_REPO','').strip(); tmp=Path(os.environ.get('TT_TMP_ROOT') or '.tt/tmp/repos')
def slug(v):
 v=re.sub(r'^https?://github.com/','',v.strip()); v=re.sub(r'\.git$','',v); v=v.strip('/').replace('/','-'); return re.sub(r'[^A-Za-z0-9._-]+','-',v).strip('-').lower() or 'repo'
def run(cmd,cwd=None): return subprocess.run(cmd,cwd=cwd,text=True,capture_output=True)
def emit(**kw):
 base={'ok':False,'repo_input':repo,'repo_slug':slug(repo),'repo_path':'','source_type':'','default_branch':'','remote_url':'','readme_excerpt':'','tree_excerpt':'','key_files':[],'error':''}; base.update(kw); print(json.dumps(base,ensure_ascii=False,separators=(',',':')))
if not repo: emit(error='missing repo'); raise SystemExit(0)
c=Path(repo).expanduser()
if c.exists() and c.is_dir(): path=c.resolve(); st='local'
else:
 st='github'; clone=repo if repo.startswith(('http://','https://','git@')) else 'https://github.com/'+repo.strip('/')+'.git'; tmp.mkdir(parents=True,exist_ok=True); path=(tmp/slug(repo)).resolve()
 if not (path/'.git').exists():
  if path.exists(): shutil.rmtree(path)
  p=run(['git','clone','--depth','1',clone,str(path)])
  if p.returncode: emit(source_type=st,repo_path=str(path),remote_url=clone,error=p.stderr.strip() or p.stdout.strip() or 'git clone failed'); raise SystemExit(0)
remote=run(['git','config','--get','remote.origin.url'],cwd=path); branch=run(['git','rev-parse','--abbrev-ref','HEAD'],cwd=path)
readme=''
for n in ['README.md','README.MD','Readme.md','README','readme.md']:
 f=path/n
 if f.exists() and f.is_file(): readme=f.read_text(errors='ignore')[:6000]; break
ignore={'.git','node_modules','dist','build','.next','coverage','.tt','vendor','target'}; files=[]
for root,dirs,names in os.walk(path):
 relroot=Path(root).relative_to(path); dirs[:]=[d for d in dirs if d not in ignore and not d.startswith('.')]
 for name in names:
  rel=str(relroot/name).replace('\\','/'); files.append(name if rel=='.' else rel)
  if len(files)>=260: break
 if len(files)>=260: break
pat=re.compile(r'(^README|package.json$|go.mod$|pyproject.toml$|Cargo.toml$|Dockerfile$|Makefile$|src/|cmd/|internal/|app/|pages/|routes/|config)',re.I)
key=[f for f in files if pat.search(f)][:80]
emit(ok=True,source_type=st,repo_slug=slug(repo),repo_path=str(path),default_branch=(branch.stdout or '').strip(),remote_url=(remote.stdout or '').strip(),readme_excerpt=readme,tree_excerpt='\n'.join(files[:220]),key_files=key)
''']
format = "json"
timeout = "180s"
[steps.script.env]
TT_REPO = "{{repo}}"
TT_TMP_ROOT = "{{tmp_root}}"
[steps.validate]
format = "json"
required = ["stdout"]
