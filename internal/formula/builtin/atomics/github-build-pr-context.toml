formula = "github-build-pr-context"
description = "原子 formula：将 PR metadata、files、diff 摘要规整为审阅/处理上下文。"
version = 1
type = "atomic"
category = "github"
tags = ["github", "pr", "context", "atomic"]

[vars]
meta_json = { description = "PR metadata JSON", required = true }
files_json = { description = "PR files JSON", default = "{}" }
patch_chars = { description = "PR patch 字符数", default = "0" }
review_focus = { description = "审阅关注点", default = "正确性、风险与可维护性" }
submit_review = { description = "是否提交 review", default = "true", enum = ["true", "false"] }

[[steps]]
id = "context"
title = "整理 PR 上下文"
execution = "script"
description = "把 PR metadata、files 和 diff 大小归一化为上层 review/fix formula 可直接消费的上下文 JSON。"
[steps.script]
command = ["python3", "-c", """
import json, os
meta=json.loads(os.environ.get('TT_META') or '{}')
files_data=json.loads(os.environ.get('TT_FILES') or '{}')
patch_chars=int(os.environ.get('TT_PATCH_CHARS') or 0)
review_focus=os.environ.get('TT_REVIEW_FOCUS','').strip()
submit_review=os.environ.get('TT_SUBMIT_REVIEW','').strip().lower()=='true'
files=[]
for item in files_data.get('files') or []:
 files.append({'path':item.get('path') or item.get('filename') or '','additions':item.get('additions') or 0,'deletions':item.get('deletions') or 0,'change_type':item.get('changeType') or item.get('status') or ''})
commits=meta.get('commits') or []
summary=[]
if meta.get('body'): summary.append(str(meta.get('body'))[:1200])
if commits: summary.append('Commits: '+'; '.join((c.get('messageHeadline') or c.get('message') or '') for c in commits[:10] if isinstance(c,dict)))
out={'ready':bool(meta.get('ok', True)) and bool(meta.get('number')),'error':meta.get('error') or files_data.get('error') or '','pr_ref':meta.get('pr_ref') or '', 'repo_hint':meta.get('repo_hint') or '', 'number':meta.get('number'),'title':meta.get('title') or '', 'author':(meta.get('author') or {}).get('login') if isinstance(meta.get('author'),dict) else str(meta.get('author') or ''),'base_branch':meta.get('baseRefName') or '', 'head_branch':meta.get('headRefName') or '', 'head_sha':meta.get('headRefOid') or '', 'url':meta.get('url') or '', 'state':meta.get('state') or '', 'is_draft':bool(meta.get('isDraft')), 'review_decision':meta.get('reviewDecision') or '', 'changed_files_count':meta.get('changedFiles') or len(files), 'additions':meta.get('additions') or 0, 'deletions':meta.get('deletions') or 0, 'changed_files':files, 'pr_summary':'\\n'.join(x for x in summary if x).strip() or (meta.get('title') or ''), 'focus_areas':[x.strip() for x in review_focus.replace('，',',').split(',') if x.strip()], 'diff_overview':f'{len(files)} files changed, +{meta.get("additions") or 0}/-{meta.get("deletions") or 0}, patch_chars={patch_chars}', 'review_constraints':['Do not invent behavior not supported by the PR metadata or diff.','Use line comments only when the diff supports file and line evidence.'], 'submit_review':submit_review}
print(json.dumps(out,ensure_ascii=False,separators=(',',':')))
"""]
format = "json"
timeout = "30s"
[steps.script.env]
TT_META = "{{meta_json}}"
TT_FILES = "{{files_json}}"
TT_PATCH_CHARS = "{{patch_chars}}"
TT_REVIEW_FOCUS = "{{review_focus}}"
TT_SUBMIT_REVIEW = "{{submit_review}}"
[steps.validate]
format = "json"
required = ["stdout"]
