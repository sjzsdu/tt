formula = "github-pr-fix-comments"
description = "遍历 PR 的所有待处理 review comments，用 typed runtime foreach 并发内嵌 bug-fix 处理每条评论，最后汇总处理结果。"
version = 2
type = "workflow"

[preflight]

[[preflight.checks]]
type = "command"
name = "gh"
command = "gh"
message = "需要安装 GitHub CLI: https://cli.github.com/"

[[preflight.checks]]
type = "exec"
name = "gh-auth"
command = "gh auth status"
message = "GitHub CLI 未登录或不可用，请先执行 gh auth login"

[[preflight.checks]]
type = "git"
name = "git-repo"
require_repo = true
message = "需要在 GitHub git 仓库中运行"

[vars]
pr_ref = { description = "PR 编号、URL 或分支引用", required = true }
review_focus = { description = "处理评论时重点关注方面", default = "正确性、风险与可维护性" }

[[steps]]
id = "fetch-pr-metadata"
title = "获取 PR 元数据"
execution = "script"

[steps.script]
command = ["gh", "pr", "view", "{{pr_ref}}", "--json", "number,title,url,headRefName,baseRefName,state"]
format = "json"
timeout = "30s"

[[steps]]
id = "fetch-review-comments"
title = "获取待处理 review comments"
depends_on = ["fetch-pr-metadata"]
input_context = ["fetch-pr-metadata"]
description = """
收集 '{{pr_ref}}' 的 review comments，并输出标准化列表。

输出 ONLY compact JSON：
{
  "pr_number": 123,
  "pr_url": "...",
  "head_branch": "...",
  "pending_count": 2,
  "comment_items": [
    {
      "comment_id": "123",
      "thread_id": "abc",
      "author": "reviewer",
      "body": "...",
      "path": "a.go",
      "line": 10,
      "url": "..."
    }
  ]
}

约束：
- 仅保留仍需处理的评论。
- comment_items 每项必须保留 comment_id 与 body。
"""
agent.name = "coder"

[[steps]]
id = "normalize-comment-items"
title = "整理 comment 列表供循环使用"
depends_on = ["fetch-review-comments"]
input_context = ["fetch-review-comments"]
description = """
从 comment_context 生成循环用的数组。

输出 ONLY compact JSON：
{
  "items": [
    {
      "comment_id": "123",
      "thread_id": "abc",
      "body": "...",
      "path": "a.go",
      "line": 10,
      "url": "...",
      "issue_summary": "..."
    }
  ],
  "total": 1
}

要求：
- issue_summary 必须是可直接交给 bug-fix 的问题描述，包含评论诉求、代码位置与期望行为。
- 若没有待处理评论，items 为空数组，total=0。
"""
agent.name = "planner"

[[steps]]
id = "fix-each-comment"
title = "逐条执行 bug-fix"
depends_on = ["normalize-comment-items"]
input_context = ["normalize-comment-items"]
condition = "normalize-comment-items.total != 0"

  [steps.loop]
  for_each = "normalize-comment-items.items"
  var = "comment"
  parallel = true
  max_concurrency = 3

  [[steps.loop.body]]
  id = "run-bug-fix"
  title = "处理评论 {{comment.comment_id}}"
  embed = "bug-fix"

  [steps.loop.body.embed_vars]
  issue_summary = "{{comment.issue_summary}}"

  [[steps.loop.body]]
  id = "collect-result"
  title = "汇总评论 {{comment.comment_id}} 处理结果"
  depends_on = ["run-bug-fix"]
  input_context = ["comment", "run-bug-fix"]
  description = """
  汇总当前 comment 的处理结果。

  输出 ONLY compact JSON：
  {
    "comment_id": "123",
    "issue_exists": true,
    "status": "fixed|not-confirmed|needs-followup",
    "summary": "...",
    "next_action": "..."
  }
  """
  agent.name = "coder"

[[steps]]
id = "final-report"
title = "输出 PR 评论处理总报告"
depends_on = ["fix-each-comment"]
input_context = ["fetch-pr-metadata", "fetch-review-comments", "normalize-comment-items", "fix-each-comment"]
description = """
输出最终中文总结。

必须包含：
1. 总评论数与实际处理数；
2. 每条评论的结论摘要（fixed / not-confirmed / needs-followup）；
3. 需要人工继续处理的项；
4. 下一步建议。
5. 如果 comment_items.total == 0，明确说明没有待处理评论且没有执行 bug-fix。

要求：
- 结论先行。
- 控制在 8-12 条要点，避免冗长。
"""
agent.name = "reporter"
