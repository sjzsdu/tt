formula = "github-pr-review"
description = "使用 gh 收集 PR 信息与 diff，完成代码审阅、生成评论建议，并默认通过确定性脚本真实提交 GitHub review/comment，最后输出带表格汇总的最终报告。"
version = 5
type = "workflow"

[preflight]

[[preflight.checks]]
type = "command"
name = "gh"
command = "gh"
message = "需要安装 GitHub CLI: https://cli.github.com/"

[[preflight.checks]]
type = "exec"
name = "gh-auth"
command = "gh auth status"
message = "GitHub CLI 未登录或不可用，请先执行 gh auth login"

[[preflight.checks]]
type = "git"
name = "git-repo"
require_repo = true
message = "repo_hint 为空时需要在 GitHub git 仓库中运行"

[[preflight.checks]]
type = "command"
name = "python3"
command = "python3"
message = "需要安装 python3"

[vars]
pr_ref = { description = "PR 编号、URL 或分支引用", required = true }
review_focus = { description = "重点关注的方面，例如正确性、架构、性能、安全、兼容性", default = "正确性、风险与可维护性" }
repo_hint = { description = "可选的仓库提示，例如 owner/repo；若为空则使用当前仓库上下文", default = "" }
submit_review = { description = "是否真实提交 GitHub review/comment；默认 true。传 false 时仅生成草稿，不写入 GitHub。", default = "true", enum = ["true", "false"] }

[[steps]]
id = "fetch-pr"
title = "使用 gh 获取 PR 全量信息"
embed = "github-fetch-pr"

[steps.embed_vars]
pr_ref = "{{pr_ref}}"
repo_hint = "{{repo_hint}}"
review_focus = "{{review_focus}}"
submit_review = "{{submit_review}}"

[[steps]]
id = "analyze-review-findings"
title = "分析改动并产出审阅问题清单"
depends_on = ["fetch-pr"]
condition = "fetch-pr.pr.stdout.ready == true"
input_context = ["fetch-pr.pr.stdout", "fetch-pr.pr.stdout.patch"]
description = """
基于 fetch-pr.pr.stdout 与 fetch-pr.pr.stdout.patch 对该 PR 做代码审阅。

重点关注：正确性、边界条件、回归风险、安全性、性能、可维护性，以及 review_focus 明确相关的方面。

输出 ONLY compact JSON object，不要 Markdown，不要代码块，不要解释文字：
{
  "has_findings": true,
  "why_clean": "",
  "files_and_modules": [{"path":"...","module":"...","summary":"..."}],
  "behavior_changes": [{"area":"...","change":"...","risk":"low|medium|high"}],
  "impact_scope": [{"scope":"...","details":"..."}],
  "major_risks": [{"title":"...","severity":"low|medium|high","details":"..."}],
  "review_comments": [{"id":"finding-1","type":"line|conversation","path":"path/to/file","line":123,"side":"RIGHT","severity":"low|medium|high","category":"correctness|security|performance|maintainability|compatibility|testing|other","title":"简短标题","body":"给作者的评论正文，清楚说明问题、原因、建议","risk_reason":"为什么这是风险","suggested_action":"建议如何修复"}]
}

规则：
- 如果没有问题，has_findings=false，review_comments=[]，并填写 why_clean。
- 仅在确实能从 diff 支撑时给出 line 评论；否则使用 conversation。
- 不要编造未在输入中出现的文件、行号或行为。
- body 应可直接用于 GitHub review comment。
"""

[steps.agent]
name = "coder"

[steps.validate]
format = "json"
required = ["has_findings", "review_comments", "files_and_modules", "major_risks"]

[[steps]]
id = "prepare-review-summary"
title = "整理待提交评论与总评摘要"
depends_on = ["analyze-review-findings", "fetch-pr"]
condition = "fetch-pr.pr.stdout.ready == true"
input_context = ["analyze-review-findings.review_comments", "analyze-review-findings.has_findings", "analyze-review-findings.why_clean", "analyze-review-findings.major_risks", "fetch-pr.pr.stdout.submit_review", "fetch-pr.pr.stdout.title", "fetch-pr.pr.stdout.url"]
description = """
基于 review findings 与 PR context，整理提交计划。

输出 ONLY compact JSON object，不要 Markdown，不要代码块，不要解释文字：
{
  "submit_review": true,
  "has_findings": true,
  "summary_comment": "整体 review 摘要，可作为 PR conversation 或 review body",
  "inline_comments": [{"id":"finding-1","path":"...","line":123,"side":"RIGHT","body":"..."}],
  "conversation_comments": [{"id":"finding-2","body":"..."}],
  "table_rows": [{"id":"finding-1","severity":"high","category":"correctness","location":"path/to/file:123","status":"pending-submit|draft-only|no-issue","summary":"一句话总结"}]
}

要求：
- submit_review 直接沿用 fetch-pr.pr.stdout.submit_review。
- 将可行的 line 评论与 conversation 评论分开。
- summary_comment 需总结整体结论、风险重点、建议动作。
- table_rows 将用于最终报告中的汇总表格。
- 如果没有问题，也要生成一行 no-issue 汇总。
"""

[steps.agent]
name = "coder"

[steps.validate]
format = "json"
required = ["submit_review", "has_findings", "summary_comment", "inline_comments", "conversation_comments", "table_rows"]

[[steps]]
id = "submit-review-comments"
title = "提交 review summary 与 conversation comments"
execution = "script"
depends_on = ["prepare-review-summary"]
input_context = ["prepare-review-summary.summary_comment", "prepare-review-summary.conversation_comments", "prepare-review-summary.submit_review", "fetch-pr.pr.stdout.number", "fetch-pr.pr.stdout.repo_hint"]
condition = "prepare-review-summary.submit_review == true"

[steps.script]
command = ["python3", "-c", """
import json, subprocess, sys, traceback

def emit(result):
    print(json.dumps(result, ensure_ascii=False, separators=(',', ':')))

result = {'submitted': False, 'review_action': 'COMMENT', 'summary_comment': '', 'submitted_comments': [], 'failed_comments': [], 'conversation_comments_requested': 0, 'review_error': ''}
try:
    pr_ref = sys.argv[1] if len(sys.argv) > 1 else ''
    repo_hint = (sys.argv[2] if len(sys.argv) > 2 else '').strip()
    raw_plan = sys.argv[3] if len(sys.argv) > 3 else '{}'
    try:
        review_plan = json.loads(raw_plan or '{}')
    except Exception as exc:
        result['review_error'] = f'invalid review plan JSON: {exc}'
        result['raw_plan_preview'] = raw_plan[:1200]
        emit(result)
        raise SystemExit(0)
    result['summary_comment'] = review_plan.get('summary_comment', '')
    conversation_comments = review_plan.get('conversation_comments') or []
    result['conversation_comments_requested'] = len(conversation_comments)
    repo_args = ['--repo', repo_hint] if repo_hint else []
    if not pr_ref:
        result['review_error'] = 'missing pr_ref'
        emit(result)
        raise SystemExit(0)
    if not review_plan.get('has_findings', False):
        result['reason'] = 'No findings to submit'
        emit(result)
        raise SystemExit(0)

    body = (review_plan.get('summary_comment') or '').strip() or 'Automated PR review summary.'
    res = subprocess.run(['gh', 'pr', 'review', pr_ref, '--comment', '--body', body] + repo_args, capture_output=True, text=True)
    if res.returncode == 0:
        result['submitted'] = True
        result['submitted_review_body'] = True
    else:
        result['review_error'] = res.stderr.strip() or res.stdout.strip() or 'gh pr review failed'

    for item in conversation_comments:
        cbody = (item.get('body') or '').strip()
        if not cbody:
            continue
        cres = subprocess.run(['gh', 'pr', 'comment', pr_ref, '--body', cbody] + repo_args, capture_output=True, text=True)
        if cres.returncode == 0:
            result['submitted_comments'].append({'id': item.get('id'), 'type': 'conversation'})
        else:
            result['failed_comments'].append({'id': item.get('id'), 'type': 'conversation', 'error': cres.stderr.strip() or cres.stdout.strip() or 'gh pr comment failed'})
except SystemExit:
    raise
except Exception as exc:
    result['review_error'] = f'submit summary script failed: {exc}'
    result['traceback'] = traceback.format_exc()[-2000:]
emit(result)
""", "{{pr_ref}}", "{{repo_hint}}", "{{prepare-review-summary}}"]
format = "json"
timeout = "120s"
continue_on_error = true

[steps.validate]
format = "json"
required = ["stdout"]

[[steps]]
id = "submit-inline-comments"
title = "逐条提交 inline review comments"
depends_on = ["prepare-review-summary", "submit-review-comments"]
condition = "prepare-review-summary.submit_review == true"

  [steps.loop]
  for_each = "prepare-review-summary.inline_comments"
  var = "review_comment"
  parallel = false

  [[steps.loop.body]]
  id = "submit-inline-comment"
  title = "提交 inline comment {{review_comment.id}}"
  execution = "script"
  input_context = ["review_comment", "fetch-pr.pr.stdout.head_sha", "fetch-pr.pr.stdout.repo_hint"]

    [steps.loop.body.script]
    command = ["python3", "-c", """
import json, os, subprocess, sys, traceback

def emit(result):
    print(json.dumps(result, ensure_ascii=False, separators=(',', ':')))

result = {'submitted': False, 'id': '', 'type': 'line', 'path': '', 'line': None, 'side': 'RIGHT', 'error': ''}
try:
    pr_ref = os.environ.get('TT_PR_REF', '').strip()
    repo_hint = os.environ.get('TT_REPO_HINT', '').strip()
    head_sha = os.environ.get('TT_HEAD_SHA', '').strip()
    raw_comment = os.environ.get('TT_REVIEW_COMMENT') or '{}'
    try:
        item = json.loads(raw_comment)
    except Exception as exc:
        result['error'] = f'invalid review_comment JSON: {exc}'
        result['raw_comment_preview'] = raw_comment[:1200]
        emit(result)
        raise SystemExit(0)
    result.update({'id': item.get('id') or '', 'path': item.get('path') or '', 'line': item.get('line'), 'side': item.get('side') or 'RIGHT'})
    body = (item.get('body') or '').strip()
    if not pr_ref:
        result['error'] = 'missing pr_ref'
        emit(result)
        raise SystemExit(0)
    if not head_sha:
        result['error'] = 'missing head_sha'
        emit(result)
        raise SystemExit(0)
    if not body or not result['path'] or result['line'] is None:
        result['error'] = 'missing body/path/line'
        emit(result)
        raise SystemExit(0)
    try:
        line = int(result['line'])
    except Exception:
        result['error'] = 'line must be an integer'
        emit(result)
        raise SystemExit(0)
    if repo_hint and '/' in repo_hint:
        owner, name = repo_hint.split('/', 1)
        endpoint = f'repos/{owner}/{name}/pulls/{pr_ref}/comments'
    else:
        endpoint = f'repos/:owner/:repo/pulls/{pr_ref}/comments'
    cmd = ['gh', 'api', '--method', 'POST', endpoint, '-f', f'body={body}', '-f', f'commit_id={head_sha}', '-f', f'path={result["path"]}', '-F', f'line={line}', '-f', f'side={result["side"]}']
    res = subprocess.run(cmd, capture_output=True, text=True)
    if res.returncode == 0:
        result['submitted'] = True
    else:
        result['error'] = res.stderr.strip() or res.stdout.strip() or 'gh api inline comment failed'
except SystemExit:
    raise
except Exception as exc:
    result['error'] = f'inline comment script failed: {exc}'
    result['traceback'] = traceback.format_exc()[-2000:]
emit(result)
"""]
    format = "json"
    timeout = "60s"
    continue_on_error = true

    [steps.loop.body.script.env]
    TT_PR_REF = "{{pr_ref}}"
    TT_REPO_HINT = "{{fetch-pr.pr.stdout.repo_hint}}"
    TT_HEAD_SHA = "{{fetch-pr.pr.stdout.head_sha}}"
    TT_REVIEW_COMMENT = "{{review_comment}}"

  [steps.loop.body.validate]
  format = "json"
  required = ["stdout"]

[[steps]]
id = "draft-review-comments"
title = "生成 review 草稿但不真实提交"
depends_on = ["prepare-review-summary"]
input_context = ["prepare-review-summary", "fetch-pr.pr.stdout.url", "analyze-review-findings.why_clean"]
condition = "fetch-pr.pr.stdout.ready == true && prepare-review-summary.submit_review == false"
description = """
基于 review_plan、PR URL 和 why_clean 生成拟发送 review 草稿。

输出 Markdown，至少包含：总体结论、建议提交的 summary comment、拟发送的 inline comments 列表、拟发送的 conversation comments 列表、每个问题为什么值得关注。如果没有问题，明确说明 why_clean。

要求：不要假装已经真实提交；内容应与 review_plan 一致；文案应可直接复制到 GitHub。
"""

[steps.agent]
name = "coder"

[[steps]]
id = "final-report"
title = "输出最终 PR 审查报告"
depends_on = ["fetch-pr", "submit-review-comments", "submit-inline-comments", "draft-review-comments"]
input_context = ["fetch-pr.pr.stdout.ready", "fetch-pr.pr.stdout.error", "fetch-pr.pr.stdout.title", "fetch-pr.pr.stdout.url", "fetch-pr.pr.stdout.changed_files_count", "fetch-pr.pr.stdout.diff_overview", "analyze-review-findings.has_findings", "analyze-review-findings.files_and_modules", "analyze-review-findings.behavior_changes", "analyze-review-findings.impact_scope", "analyze-review-findings.major_risks", "prepare-review-summary.submit_review", "prepare-review-summary.table_rows", "prepare-review-summary.summary_comment", "submit-review-comments.stdout.submitted", "submit-review-comments.stdout.submitted_comments", "submit-review-comments.stdout.failed_comments", "submit-review-comments.stdout.review_error", "submit-inline-comments", "formula_repairs.submit-review-comments", "formula_repairs.submit-inline-comment", "draft-review-comments"]
description = """
请面向用户输出最终 PR 审查报告，使用清晰 Markdown。

必须包含：PR 概览、改动文件与模块、关键行为变化、影响范围、主要风险、评论提交结果、最终结论。

“评论提交结果”必须包含 Markdown 表格，列至少为：ID、Severity、Category、Location、Status、Summary。

生成规则：
- 表格基于 prepare-review-summary.table_rows。
- 如果 prepare-review-summary.submit_review=true：结合 submit-review-comments 与 submit-inline-comments，已成功提交的问题标记为 submitted，提交失败标记为 submit-failed，未尝试提交标记为 pending。
- 如果 prepare-review-summary.submit_review=false：所有问题标记为 draft-only。
- 如果没有问题，仍然输出 no-issue 行。
- 明确区分：哪些问题已真实通过 gh 发出，哪些只是草稿，哪些提交失败。
- 如果 formula_repairs.submit-review-comments 可用，必须在报告中增加“运行时脚本自修复”提示，说明本次使用了临时 fixed_command，并建议更新 github-pr-review formula 文档。
- 如果 fetch-pr.pr.stdout.ready=false，直接报告 PR 元数据获取失败和 fetch-pr.pr.stdout.error，不要继续编造 review 结果。

- 不要重复粘贴上游 step 的原始 JSON、stdout/stderr、diff、日志或完整子报告；只提炼每个 step 独有的结论、状态变化、文件/URL/commit 等关键增量。
"""

[steps.agent]
name = "reporter"
