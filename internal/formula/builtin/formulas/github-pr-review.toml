formula = "github-pr-review"
description = "使用 gh 收集 PR 信息与 diff，完成代码审阅、生成评论建议，并默认通过确定性脚本真实提交 GitHub review/comment，最后输出带表格汇总的最终报告。"
version = 4
type = "workflow"

[vars]
pr_ref = { description = "PR 编号、URL 或分支引用", required = true }
review_focus = { description = "重点关注的方面，例如正确性、架构、性能、安全、兼容性", default = "正确性、风险与可维护性" }
repo_hint = { description = "可选的仓库提示，例如 owner/repo；若为空则使用当前仓库上下文", default = "" }
submit_review = { description = "是否真实提交 GitHub review/comment；默认 true。传 false 时仅生成草稿，不写入 GitHub。", default = "true", enum = ["true", "false"] }

[[steps]]
id = "fetch-pr-metadata"
title = "使用 gh 获取 PR 基本信息"
execution = "script"
description = "使用 gh pr view 获取 PR 基本信息。repo_hint 为空时不传 --repo，使用当前仓库上下文。"

[steps.script]
command = ["python3", "-c", """
import json, os, subprocess, sys
pr = os.environ.get('TT_PR_REF', '').strip()
repo = os.environ.get('TT_REPO_HINT', '').strip()
fields = 'number,title,body,author,baseRefName,headRefName,url,state,isDraft,reviewDecision,changedFiles,commits,additions,deletions,maintainerCanModify'
cmd = ['gh', 'pr', 'view', pr, '--json', fields]
if repo:
    cmd += ['--repo', repo]
p = subprocess.run(cmd, text=True, capture_output=True)
if p.returncode != 0:
    print(json.dumps({'ok': False, 'error': p.stderr.strip() or p.stdout.strip() or 'gh pr view failed', 'pr_ref': pr, 'repo_hint': repo}, ensure_ascii=False, separators=(',', ':')))
    raise SystemExit(0)
try:
    data = json.loads(p.stdout or '{}')
except Exception as exc:
    print(json.dumps({'ok': False, 'error': f'parse gh output failed: {exc}', 'raw': p.stdout[-4000:], 'pr_ref': pr, 'repo_hint': repo}, ensure_ascii=False, separators=(',', ':')))
    raise SystemExit(0)
data['ok'] = True
data['pr_ref'] = pr
data['repo_hint'] = repo
print(json.dumps(data, ensure_ascii=False, separators=(',', ':')))
"""]
format = "json"
timeout = "30s"

[steps.script.env]
TT_PR_REF = "{{pr_ref}}"
TT_REPO_HINT = "{{repo_hint}}"

[steps.validate]
format = "json"
required = ["stdout"]

[[steps]]
id = "fetch-pr-files"
title = "使用 gh 获取 PR 改动文件清单"
execution = "script"
depends_on = ["fetch-pr-metadata"]
description = "使用 gh pr view 获取 PR files。repo_hint 为空时不传 --repo。"

[steps.script]
command = ["python3", "-c", """
import json, os, subprocess
pr = os.environ.get('TT_PR_REF', '').strip()
repo = os.environ.get('TT_REPO_HINT', '').strip()
cmd = ['gh', 'pr', 'view', pr, '--json', 'files']
if repo:
    cmd += ['--repo', repo]
p = subprocess.run(cmd, text=True, capture_output=True)
if p.returncode != 0:
    print(json.dumps({'ok': False, 'files': [], 'error': p.stderr.strip() or p.stdout.strip() or 'gh pr view files failed'}, ensure_ascii=False, separators=(',', ':')))
    raise SystemExit(0)
try:
    data = json.loads(p.stdout or '{}')
except Exception as exc:
    print(json.dumps({'ok': False, 'files': [], 'error': f'parse gh files failed: {exc}'}, ensure_ascii=False, separators=(',', ':')))
    raise SystemExit(0)
data['ok'] = True
print(json.dumps(data, ensure_ascii=False, separators=(',', ':')))
"""]
format = "json"
timeout = "30s"

[steps.script.env]
TT_PR_REF = "{{pr_ref}}"
TT_REPO_HINT = "{{repo_hint}}"

[steps.validate]
format = "json"
required = ["stdout"]

[[steps]]
id = "fetch-pr-diff"
title = "使用 gh 获取 PR diff"
execution = "script"
depends_on = ["fetch-pr-metadata"]
description = "使用 gh pr diff 获取 patch，并包装成 JSON，避免下游直接处理裸文本。"

[steps.script]
command = ["python3", "-c", """
import json, os, subprocess
pr = os.environ.get('TT_PR_REF', '').strip()
repo = os.environ.get('TT_REPO_HINT', '').strip()
cmd = ['gh', 'pr', 'diff', pr, '--patch']
if repo:
    cmd += ['--repo', repo]
p = subprocess.run(cmd, text=True, capture_output=True)
out = {
    'ok': p.returncode == 0,
    'patch': p.stdout,
    'patch_chars': len(p.stdout),
    'stderr': p.stderr.strip(),
}
print(json.dumps(out, ensure_ascii=False, separators=(',', ':')))
if p.returncode != 0:
    raise SystemExit(0)
"""]
format = "json"
timeout = "60s"

[steps.script.env]
TT_PR_REF = "{{pr_ref}}"
TT_REPO_HINT = "{{repo_hint}}"

[steps.validate]
format = "json"
required = ["stdout"]

[[steps]]
id = "build-pr-context"
title = "整理结构化 PR 上下文"
execution = "script"
depends_on = ["fetch-pr-metadata", "fetch-pr-files", "fetch-pr-diff"]
description = "用确定性脚本整理 PR 上下文，避免 agent 做字段抽取。"

[steps.script]
command = ["python3", "-c", """
import json, os
meta = json.loads(os.environ.get('TT_META') or '{}')
files_data = json.loads(os.environ.get('TT_FILES') or '{}')
diff_data = {'patch_chars': int(os.environ.get('TT_PATCH_CHARS') or 0)}
meta_error = meta.get('error') or ''
files_error = files_data.get('error') or ''
ready = bool(meta.get('ok')) and not meta_error and bool(meta.get('number'))
review_focus = os.environ.get('TT_REVIEW_FOCUS', '').strip()
submit_review = os.environ.get('TT_SUBMIT_REVIEW', '').strip().lower() == 'true'

files = []
for item in files_data.get('files') or []:
    files.append({
        'path': item.get('path') or item.get('filename') or '',
        'additions': item.get('additions') or 0,
        'deletions': item.get('deletions') or 0,
        'change_type': item.get('changeType') or item.get('status') or '',
    })
commits = meta.get('commits') or []
summary_bits = []
if meta.get('body'):
    summary_bits.append(str(meta.get('body'))[:1200])
if commits:
    summary_bits.append('Commits: ' + '; '.join((c.get('messageHeadline') or c.get('message') or '') for c in commits[:10] if isinstance(c, dict)))
out = {
    'ready': ready,
    'error': meta_error or files_error,
    'pr_ref': meta.get('pr_ref') or '',
    'repo_hint': meta.get('repo_hint') or '',
    'number': meta.get('number'),
    'title': meta.get('title') or '',
    'author': (meta.get('author') or {}).get('login') if isinstance(meta.get('author'), dict) else str(meta.get('author') or ''),
    'base_branch': meta.get('baseRefName') or '',
    'head_branch': meta.get('headRefName') or '',
    'url': meta.get('url') or '',
    'state': meta.get('state') or '',
    'is_draft': bool(meta.get('isDraft')),
    'review_decision': meta.get('reviewDecision') or '',
    'changed_files_count': meta.get('changedFiles') or len(files),
    'additions': meta.get('additions') or 0,
    'deletions': meta.get('deletions') or 0,
    'changed_files': files,
    'pr_summary': chr(10).join(x for x in summary_bits if x).strip() or (meta.get('title') or ''),
    'focus_areas': [x.strip() for x in review_focus.replace('，', ',').split(',') if x.strip()],
    'diff_overview': f"{len(files)} files changed, +{meta.get('additions') or 0}/-{meta.get('deletions') or 0}, patch_chars={diff_data.get('patch_chars') or 0}",
    'review_constraints': ['Do not invent behavior not supported by the PR metadata or diff.', 'Use line comments only when the diff supports file and line evidence.'],
    'submit_review': submit_review,
}
print(json.dumps(out, ensure_ascii=False, separators=(',', ':')))
"""]
format = "json"
timeout = "30s"

[steps.script.env]
TT_META = "{{fetch-pr-metadata.stdout}}"
TT_FILES = "{{fetch-pr-files.stdout}}"
TT_PATCH_CHARS = "{{fetch-pr-diff.stdout.patch_chars}}"
TT_REVIEW_FOCUS = "{{review_focus}}"
TT_SUBMIT_REVIEW = "{{submit_review}}"

[steps.validate]
format = "json"
required = ["stdout"]

[[steps]]
id = "analyze-review-findings"
title = "分析改动并产出审阅问题清单"
depends_on = ["build-pr-context", "fetch-pr-diff"]
condition = "build-pr-context.stdout.ready == true"
input_context = ["build-pr-context.stdout", "fetch-pr-diff.stdout.patch"]
description = """
基于 build-pr-context.stdout 与 fetch-pr-diff.stdout.patch 对该 PR 做代码审阅。

重点关注：正确性、边界条件、回归风险、安全性、性能、可维护性，以及 review_focus 明确相关的方面。

输出 ONLY compact JSON object，不要 Markdown，不要代码块，不要解释文字：
{
  "has_findings": true,
  "why_clean": "",
  "files_and_modules": [{"path":"...","module":"...","summary":"..."}],
  "behavior_changes": [{"area":"...","change":"...","risk":"low|medium|high"}],
  "impact_scope": [{"scope":"...","details":"..."}],
  "major_risks": [{"title":"...","severity":"low|medium|high","details":"..."}],
  "review_comments": [{"id":"finding-1","type":"line|conversation","path":"path/to/file","line":123,"side":"RIGHT","severity":"low|medium|high","category":"correctness|security|performance|maintainability|compatibility|testing|other","title":"简短标题","body":"给作者的评论正文，清楚说明问题、原因、建议","risk_reason":"为什么这是风险","suggested_action":"建议如何修复"}]
}

规则：
- 如果没有问题，has_findings=false，review_comments=[]，并填写 why_clean。
- 仅在确实能从 diff 支撑时给出 line 评论；否则使用 conversation。
- 不要编造未在输入中出现的文件、行号或行为。
- body 应可直接用于 GitHub review comment。
"""

[steps.agent]
name = "coder"

[steps.validate]
format = "json"
required = ["has_findings", "review_comments", "files_and_modules", "major_risks"]

[[steps]]
id = "prepare-review-summary"
title = "整理待提交评论与总评摘要"
depends_on = ["analyze-review-findings", "build-pr-context"]
condition = "build-pr-context.stdout.ready == true"
input_context = ["analyze-review-findings.review_comments", "analyze-review-findings.has_findings", "analyze-review-findings.why_clean", "analyze-review-findings.major_risks", "build-pr-context.stdout.submit_review", "build-pr-context.stdout.title", "build-pr-context.stdout.url"]
description = """
基于 review findings 与 PR context，整理提交计划。

输出 ONLY compact JSON object，不要 Markdown，不要代码块，不要解释文字：
{
  "submit_review": true,
  "has_findings": true,
  "summary_comment": "整体 review 摘要，可作为 PR conversation 或 review body",
  "inline_comments": [{"id":"finding-1","path":"...","line":123,"side":"RIGHT","body":"..."}],
  "conversation_comments": [{"id":"finding-2","body":"..."}],
  "table_rows": [{"id":"finding-1","severity":"high","category":"correctness","location":"path/to/file:123","status":"pending-submit|draft-only|no-issue","summary":"一句话总结"}]
}

要求：
- submit_review 直接沿用 build-pr-context.stdout.submit_review。
- 将可行的 line 评论与 conversation 评论分开。
- summary_comment 需总结整体结论、风险重点、建议动作。
- table_rows 将用于最终报告中的汇总表格。
- 如果没有问题，也要生成一行 no-issue 汇总。
"""

[steps.agent]
name = "coder"

[steps.validate]
format = "json"
required = ["submit_review", "has_findings", "summary_comment", "inline_comments", "conversation_comments", "table_rows"]

[[steps]]
id = "submit-review-comments"
title = "通过 gh 真实提交 review comments"
execution = "script"
depends_on = ["prepare-review-summary"]
input_context = ["prepare-review-summary.summary_comment", "prepare-review-summary.inline_comments", "prepare-review-summary.conversation_comments", "prepare-review-summary.submit_review", "build-pr-context.stdout.number", "build-pr-context.stdout.repo_hint"]
condition = "prepare-review-summary.submit_review == true"

[steps.script]
command = ["python3", "-c", """
import json, os, subprocess, sys, tempfile, traceback

def emit(result):
    print(json.dumps(result, ensure_ascii=False, separators=(',', ':')))

result = {
    'submitted': False,
    'review_action': 'COMMENT',
    'summary_comment': '',
    'submitted_comments': [],
    'failed_comments': [],
    'inline_comments_requested': 0,
    'conversation_comments_requested': 0,
}
try:
    pr_ref = sys.argv[1] if len(sys.argv) > 1 else ''
    repo_hint = (sys.argv[2] if len(sys.argv) > 2 else '').strip()
    raw_plan = sys.argv[3] if len(sys.argv) > 3 else '{}'
    try:
        review_plan = json.loads(raw_plan or '{}')
    except Exception as exc:
        result['review_error'] = f'invalid review plan JSON: {exc}'
        result['raw_plan_preview'] = raw_plan[:1200]
        emit(result)
        raise SystemExit(0)

    result['summary_comment'] = review_plan.get('summary_comment', '')
    result['inline_comments_requested'] = len(review_plan.get('inline_comments') or [])
    result['conversation_comments_requested'] = len(review_plan.get('conversation_comments') or [])
    repo_args = ['--repo', repo_hint] if repo_hint else []
    if not pr_ref:
        result['review_error'] = 'missing pr_ref'
        emit(result)
        raise SystemExit(0)
    if not review_plan.get('has_findings', False):
        result['reason'] = 'No findings to submit'
        emit(result)
        raise SystemExit(0)

    body = (review_plan.get('summary_comment') or '').strip() or 'Automated PR review summary.'

    for item in review_plan.get('conversation_comments') or []:
        cbody = (item.get('body') or '').strip()
        if not cbody:
            continue
        cmd = ['gh', 'pr', 'comment', pr_ref, '--body', cbody] + repo_args
        cres = subprocess.run(cmd, capture_output=True, text=True)
        if cres.returncode == 0:
            result['submitted_comments'].append({'id': item.get('id'), 'type': 'conversation', 'body': cbody})
        else:
            result['failed_comments'].append({'id': item.get('id'), 'type': 'conversation', 'body': cbody, 'error': cres.stderr.strip() or cres.stdout.strip() or 'gh pr comment failed'})

    inline_comments = []
    for item in review_plan.get('inline_comments') or []:
        cbody = (item.get('body') or '').strip()
        path = item.get('path')
        line = item.get('line')
        side = item.get('side') or 'RIGHT'
        if not cbody or not path or line is None:
            result['failed_comments'].append({'id': item.get('id'), 'type': 'line', 'path': path, 'line': line, 'error': 'missing path/line/body'})
            continue
        try:
            line_number = int(line)
        except Exception:
            result['failed_comments'].append({'id': item.get('id'), 'type': 'line', 'path': path, 'line': line, 'error': 'line must be an integer'})
            continue
        inline_comments.append({'path': path, 'line': line_number, 'side': side, 'body': cbody, '_id': item.get('id')})

    review_payload = {'event': 'COMMENT', 'body': body}
    if inline_comments:
        review_payload['comments'] = [{k: v for k, v in item.items() if k != '_id'} for item in inline_comments]
    if repo_hint and '/' in repo_hint:
        owner, name = repo_hint.split('/', 1)
        endpoint = f'repos/{owner}/{name}/pulls/{pr_ref}/reviews'
        api_repo_args = []
    else:
        endpoint = f'repos/:owner/:repo/pulls/{pr_ref}/reviews'
        api_repo_args = []
    with tempfile.NamedTemporaryFile('w', delete=False, encoding='utf-8') as f:
        json.dump(review_payload, f, ensure_ascii=False, separators=(',', ':'))
        payload_path = f.name
    try:
        cmd = ['gh', 'api'] + api_repo_args + ['--method', 'POST', endpoint, '--input', payload_path]
        res = subprocess.run(cmd, capture_output=True, text=True)
    finally:
        try:
            os.unlink(payload_path)
        except Exception:
            pass
    if res.returncode == 0:
        result['submitted'] = True
        result['submitted_review_body'] = True
        for item in inline_comments:
            result['submitted_comments'].append({'id': item.get('_id'), 'type': 'line', 'path': item.get('path'), 'line': item.get('line'), 'side': item.get('side')})
    else:
        result['review_error'] = res.stderr.strip() or res.stdout.strip() or 'gh api create review failed'
        for item in inline_comments:
            result['failed_comments'].append({'id': item.get('_id'), 'type': 'line', 'path': item.get('path'), 'line': item.get('line'), 'side': item.get('side'), 'error': result['review_error']})
except SystemExit:
    raise
except Exception as exc:
    result['review_error'] = f'submit script failed: {exc}'
    result['traceback'] = traceback.format_exc()[-2000:]
emit(result)
""", "{{pr_ref}}", "{{repo_hint}}", "{{prepare-review-summary}}"]
format = "json"
timeout = "120s"
continue_on_error = true

[steps.validate]
format = "json"
required = ["stdout"]

[[steps]]
id = "draft-review-comments"
title = "生成 review 草稿但不真实提交"
depends_on = ["prepare-review-summary"]
input_context = ["prepare-review-summary", "build-pr-context.stdout.url", "analyze-review-findings.why_clean"]
condition = "build-pr-context.stdout.ready == true && prepare-review-summary.submit_review == false"
description = """
基于 review_plan、PR URL 和 why_clean 生成拟发送 review 草稿。

输出 Markdown，至少包含：总体结论、建议提交的 summary comment、拟发送的 inline comments 列表、拟发送的 conversation comments 列表、每个问题为什么值得关注。如果没有问题，明确说明 why_clean。

要求：不要假装已经真实提交；内容应与 review_plan 一致；文案应可直接复制到 GitHub。
"""

[steps.agent]
name = "coder"

[[steps]]
id = "final-report"
title = "输出最终 PR 审查报告"
depends_on = ["submit-review-comments", "draft-review-comments"]
input_context = ["build-pr-context.stdout.ready", "build-pr-context.stdout.error", "build-pr-context.stdout.title", "build-pr-context.stdout.url", "build-pr-context.stdout.changed_files_count", "build-pr-context.stdout.diff_overview", "analyze-review-findings.has_findings", "analyze-review-findings.files_and_modules", "analyze-review-findings.behavior_changes", "analyze-review-findings.impact_scope", "analyze-review-findings.major_risks", "prepare-review-summary.submit_review", "prepare-review-summary.table_rows", "prepare-review-summary.summary_comment", "submit-review-comments.stdout.submitted", "submit-review-comments.stdout.submitted_comments", "submit-review-comments.stdout.failed_comments", "submit-review-comments.stdout.review_error", "formula_repairs.submit-review-comments", "draft-review-comments"]
description = """
请面向用户输出最终 PR 审查报告，使用清晰 Markdown。

必须包含：PR 概览、改动文件与模块、关键行为变化、影响范围、主要风险、评论提交结果、最终结论。

“评论提交结果”必须包含 Markdown 表格，列至少为：ID、Severity、Category、Location、Status、Summary。

生成规则：
- 表格基于 prepare-review-summary.table_rows。
- 如果 prepare-review-summary.submit_review=true：已成功提交的问题标记为 submitted，提交失败标记为 submit-failed，未尝试提交标记为 pending。
- 如果 prepare-review-summary.submit_review=false：所有问题标记为 draft-only。
- 如果没有问题，仍然输出 no-issue 行。
- 明确区分：哪些问题已真实通过 gh 发出，哪些只是草稿，哪些提交失败。
- 如果 formula_repairs.submit-review-comments 可用，必须在报告中增加“运行时脚本自修复”提示，说明本次使用了临时 fixed_command，并建议更新 github-pr-review formula 文档。
- 如果 build-pr-context.stdout.ready=false，直接报告 PR 元数据获取失败和 build-pr-context.stdout.error，不要继续编造 review 结果。
"""

[steps.agent]
name = "reporter"
