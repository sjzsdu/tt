formula = "github-my-prs-rebase-main"
description = "获取当前 GitHub 仓库中当前用户仍 open 的所有 PR，并并发复用 github-pr-rebase-main 将每个 PR 分支 rebase 到 main。"
version = 1
type = "workflow"
category = "github"
tags = ["github", "pr", "rebase", "batch", "parallel"]

[preflight]

[[preflight.checks]]
type = "command"
name = "gh"
command = "gh"
message = "需要安装 GitHub CLI: https://cli.github.com/"

[[preflight.checks]]
type = "exec"
name = "gh-auth"
command = "gh auth status"
message = "GitHub CLI 未登录或不可用，请先执行 gh auth login"

[[preflight.checks]]
type = "command"
name = "git"
command = "git"
message = "需要安装 git"

[[preflight.checks]]
type = "command"
name = "jq"
command = "jq"
message = "需要安装 jq"

[[preflight.checks]]
type = "git"
name = "git-repo"
require_repo = true
require_remote = true
message = "当前目录必须是带 origin remote 的 git 仓库"

[[preflight.checks]]
type = "command"
name = "python3"
command = "python3"
message = "需要安装 python3"

[vars]
repo_hint = { description = "可选 owner/repo；为空则使用当前仓库 gh 上下文", default = "" }
author = { description = "PR 作者筛选，默认 @me 表示当前 gh 登录用户", default = "@me" }
base_branch = { description = "目标 base 分支，默认 main", default = "main" }
worktree_root = { description = "隔离 worktree 根目录，默认 .tt/worktrees/github-pr-rebase-main；相对路径按执行命令时的目录解析", default = ".tt/worktrees/github-pr-rebase-main" }
validation_command = { description = "可选验证命令，会传给每个单 PR rebase 流程；为空则跳过", default = "" }
push = { description = "每个 PR rebase 成功后是否 push --force-with-lease 回 PR 分支；默认 true", default = "true", enum = ["true", "false"] }

[[steps]]
id = "fetch-open-prs"
title = "获取当前用户 open PR 列表"
execution = "script"
description = "使用 gh pr list 获取当前仓库中 author 匹配且 state=open 的 PR。"

[steps.script]
command = ["python3", "-c", """
import json, os, subprocess, sys, traceback

def emit(obj):
    print(json.dumps(obj, ensure_ascii=False, separators=(',', ':')))

repo = os.environ.get('TT_REPO_HINT', '').strip()
author = os.environ.get('TT_AUTHOR', '').strip() or '@me'
base = os.environ.get('TT_BASE_BRANCH', '').strip() or 'main'
fields = 'number,title,url,state,isDraft,baseRefName,headRefName,headRefOid,headRepositoryOwner,headRepository'
cmd = ['gh', 'pr', 'list', '--state', 'open', '--author', author, '--json', fields, '--limit', '200']
if repo:
    cmd += ['--repo', repo]
try:
    p = subprocess.run(cmd, text=True, capture_output=True)
    if p.returncode != 0:
        emit({'ok': False, 'error': (p.stderr or p.stdout or 'gh pr list failed').strip(), 'command': cmd, 'repo_hint': repo, 'author': author, 'base_branch': base, 'items': [], 'total': 0})
        raise SystemExit(0)
    raw = json.loads(p.stdout or '[]')
    items = []
    for pr in raw:
        number = pr.get('number')
        if number is None:
            continue
        items.append({
            'number': number,
            'pr_ref': str(number),
            'title': pr.get('title') or '',
            'url': pr.get('url') or '',
            'state': pr.get('state') or 'OPEN',
            'isDraft': bool(pr.get('isDraft')),
            'baseRefName': pr.get('baseRefName') or '',
            'target_base_branch': base,
            'headRefName': pr.get('headRefName') or '',
            'headRefOid': pr.get('headRefOid') or '',
        })
    emit({'ok': True, 'error': '', 'command': cmd, 'repo_hint': repo, 'author': author, 'base_branch': base, 'total': len(items), 'items': items})
except SystemExit:
    raise
except Exception as exc:
    emit({'ok': False, 'error': f'fetch open PRs failed: {exc}', 'traceback': traceback.format_exc()[-2000:], 'command': cmd, 'repo_hint': repo, 'author': author, 'base_branch': base, 'items': [], 'total': 0})
"""]
format = "json"
timeout = "60s"

[steps.script.env]
TT_REPO_HINT = "{{repo_hint}}"
TT_AUTHOR = "{{author}}"
TT_BASE_BRANCH = "{{base_branch}}"

[steps.validate]
format = "json"
required = ["stdout"]

[[steps]]
id = "rebase-each-pr"
title = "并发 rebase 每个 open PR"
depends_on = ["fetch-open-prs"]
condition = "fetch-open-prs.stdout.total != 0"

  [steps.loop]
  for_each = "fetch-open-prs.stdout.items"
  var = "pr"
  parallel = true
  max_concurrency = 3

  [[steps.loop.body]]
  id = "run-pr-rebase"
  title = "Rebase PR #{{pr.number}}"
  embed = "github-pr-rebase-main"

  [steps.loop.body.embed_vars]
  pr_ref = "{{pr.pr_ref}}"
  repo_hint = "{{repo_hint}}"
  base_branch = "{{base_branch}}"
  worktree_root = "{{worktree_root}}"
  validation_command = "{{validation_command}}"
  push = "{{push}}"

  [[steps.loop.body]]
  id = "collect-pr-result"
  title = "汇总 PR #{{pr.number}} rebase 结果"
  execution = "script"
  depends_on = ["run-pr-rebase"]

  [steps.loop.body.script]
  command = ["python3", "-c", """
import json, os, traceback

def parse(name, default=None):
    raw = os.environ.get(name, '').strip()
    if not raw:
        return default if default is not None else {}
    try:
        return json.loads(raw)
    except Exception:
        return {'_raw': raw}

try:
    pr = parse('TT_PR', {})
    check = parse('TT_CHECK', {})
    prepare = parse('TT_PREPARE', {})
    attempt = parse('TT_ATTEMPT', {})
    summary = parse('TT_SUMMARY', {})
    validation = parse('TT_VALIDATION', {})
    push = parse('TT_PUSH_RESULT', {})
    cleanup = parse('TT_CLEANUP', {})
    report = os.environ.get('TT_FINAL_REPORT', '').strip()
    already_on_pr_branch = bool(check.get('already_on_pr_branch'))
    rebase_done = bool(summary.get('rebase_done'))
    blocked = bool(summary.get('blocked'))
    status = 'success' if rebase_done else ('already_on_pr_branch' if already_on_pr_branch else ('blocked' if blocked or summary.get('blocker') or attempt.get('error') or prepare.get('error') else 'unknown'))
    result = {
        'pr_number': pr.get('number'),
        'title': pr.get('title') or '',
        'url': pr.get('url') or '',
        'head_branch': pr.get('headRefName') or '',
        'base_branch': prepare.get('base_branch') or pr.get('baseRefName') or pr.get('target_base_branch') or '',
        'status': status,
        'rebase_done': rebase_done,
        'conflict': bool(attempt.get('conflict') or summary.get('conflict_seen')),
        'blocker': summary.get('blocker') or attempt.get('error') or prepare.get('error') or '',
        'already_on_pr_branch': already_on_pr_branch,
        'worktree_path': prepare.get('worktree_path') or check.get('worktree_path') or '',
        'validation_requested': bool(validation.get('requested')),
        'validation_success': validation.get('success'),
        'push_requested': bool(push.get('requested')),
        'pushed': bool(push.get('pushed')),
        'push_remote': push.get('remote') or '',
        'push_branch': push.get('remote_branch') or '',
        'cleanup_removed': cleanup.get('removed'),
        'final_report_excerpt': report[:500],
    }
except Exception as exc:
    result = {'status': 'failed', 'error': f'collect result failed: {exc}', 'traceback': traceback.format_exc()[-2000:]}
print(json.dumps(result, ensure_ascii=False, separators=(',', ':')))
"""]
  format = "json"
  timeout = "30s"

  [steps.loop.body.script.env]
  TT_PR = "{{pr}}"
  TT_CHECK = "{{run-pr-rebase.check-current-pr-worktree.stdout}}"
  TT_PREPARE = "{{run-pr-rebase.prepare-rebase-worktree.stdout}}"
  TT_ATTEMPT = "{{run-pr-rebase.attempt-rebase.stdout}}"
  TT_SUMMARY = "{{run-pr-rebase.summarize-rebase-state.stdout}}"
  TT_VALIDATION = "{{run-pr-rebase.run-validation.stdout}}"
  TT_PUSH_RESULT = "{{run-pr-rebase.push-rebased-branch.stdout}}"
  TT_CLEANUP = "{{run-pr-rebase.cleanup-worktree.stdout}}"
  TT_FINAL_REPORT = "{{run-pr-rebase.final-report}}"

  [steps.loop.body.validate]
  format = "json"
  required = ["stdout"]

[[steps]]
id = "final-report"
title = "输出批量 PR rebase 报告"
depends_on = ["fetch-open-prs", "rebase-each-pr"]
input_context = ["fetch-open-prs.stdout", "rebase-each-pr"]
description = """
输出中文最终报告，必须简明、结论先行，不要展开长篇过程日志。

固定输出结构：
1. `## 结论`：1-3 句话说明总数、成功数、阻塞数、是否都已 push、是否还有 worktree 遗留。
2. `## PR 明细`：必须用 Markdown 表格，且只保留这些列：
   `PR`、`标题`、`分支`、`状态`、`Rebase`、`Push`、`清理`、`问题/下一步`。
3. `## 配置`：一行说明 author、state=open、repo_hint、base_branch、并发上限 3、validation_command、push 配置。

表格规则：
- `PR` 列使用 `#编号`，有 URL 时做成链接。
- `状态` 只能概括为：成功 / 冲突阻塞 / 执行失败 / 已跳过 / 未知。
- `Rebase` 用 ✅/❌/⚠️/➖ 表达是否完成，不要写长句。
- `Push` 用 ✅/❌/➖ 表达是否 push 到 origin。
- `清理` 用 ✅/❌/➖ 表达 worktree cleanup 结果；如果复用当前工作区没有删除，也要简短说明“复用当前”。
- `问题/下一步` 只写最关键的一句话，没有问题写“无”。
- 若没有 open PR，输出一句结论和配置即可，不要输出空表格。
- 不要编造子流程输出中没有出现的测试、push 或冲突结果。
- 不要粘贴每个子流程的完整 final_report，只能基于结构化字段总结。
"""

[steps.agent]
name = "reporter"
