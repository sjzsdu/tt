formula = "trend"
title = "跨平台热点聚合"
description = "从多个中文平台（微博、知乎、B站、小红书、雪球、V2EX、头条）并行抓取热点数据，按话题聚合、去重、打分，最终由 AI 生成一份结构化简报。"
version = 1
type = "workflow"
category = "research"
tags = ["热点", "跨平台", "舆情", "调研", "趋势"]

[preflight]

[[preflight.checks]]
type = "command"
name = "opencli"
command = "opencli"
message = "需要安装 opencli: npm install -g opencli"

[[preflight.checks]]
type = "command"
name = "jq"
command = "jq"
message = "需要安装 jq 用于 JSON 处理"

[vars]
topic = { description = "要追踪的话题关键词，留空则获取各平台热搜榜", required = false, default = "" }
platforms = { description = "要查询的平台列表，逗号分隔：weibo,zhihu,bilibili,xiaohongshu,xueqiu,v2ex,toutiao", required = false, default = "weibo,zhihu,bilibili,v2ex,toutiao" }
days = { description = "回溯天数，默认 1 天", required = false, default = "1" }
max_items = { description = "每个平台最多获取条目数", required = false, default = "20" }

[[steps]]
id = "fetch-platforms"
title = "并行抓取各平台数据"
execution = "script"
description = """
根据 topic="{{topic}}" 和 platforms="{{platforms}}"，并行调用 opencli 从各平台获取热点数据。

对每个平台执行对应的 opencli 命令：
- weibo: opencli weibo hot -f json（热搜）或 opencli weibo search "{{topic}}" -f json（搜索）
- zhihu: opencli zhihu hot -f json（热榜）或 opencli zhihu search "{{topic}}" -f json（搜索）
- bilibili: opencli bilibili hot -f json（热门）或 opencli bilibili search "{{topic}}" -f json（搜索）
- xiaohongshu: opencli xiaohongshu search "{{topic}}" -f json（搜索，无热搜公开接口）
- xueqiu: opencli xueqiu hot -f json（热门动态）或 opencli xueqiu search "{{topic}}" -f json（搜索）
- v2ex: opencli v2ex hot -f json（热门话题，不支持搜索）
- toutiao: opencli toutiao hot -f json（热榜，不支持搜索）

每个命令设置 60 秒超时。如果某个平台失败，记录错误但不阻塞其他平台。

输出 ONLY compact JSON array，每个元素代表一个平台的抓取结果：
[{"platform":"weibo","status":"ok","items":[...]}]

status 可以是 "ok" 或 "error"。error 时 items 为空，增加 "error_message" 字段。
"""

[steps.script]
command = ["bash", "-lc", """
# 不设置 set -e，因为 opencli 可能失败，我们需要捕获错误
export OPENCLI_NO_UPDATE_CHECK=1

TOPIC="{{topic}}"
PLATFORMS="{{platforms}}"
MAX_ITEMS="{{max_items}}"

# Parse platforms
IFS=',' read -ra PLATS <<< "$PLATFORMS"

RESULTS="[]"

for plat in "${PLATS[@]}"; do
  plat=$(echo "$plat" | tr -d '[:space:]')
  [ -z "$plat" ] && continue

  CMD=""
  case "$plat" in
    weibo)
      if [ -n "$TOPIC" ]; then
        CMD="opencli weibo search \"$TOPIC\" -f json --limit $MAX_ITEMS"
      else
        CMD="opencli weibo hot -f json --limit $MAX_ITEMS"
      fi
      ;;
    zhihu)
      if [ -n "$TOPIC" ]; then
        CMD="opencli zhihu search \"$TOPIC\" -f json --limit $MAX_ITEMS"
      else
        CMD="opencli zhihu hot -f json --limit $MAX_ITEMS"
      fi
      ;;
    bilibili)
      if [ -n "$TOPIC" ]; then
        CMD="opencli bilibili search \"$TOPIC\" -f json --limit $MAX_ITEMS"
      else
        CMD="opencli bilibili hot -f json --limit $MAX_ITEMS"
      fi
      ;;
    xiaohongshu)
      if [ -n "$TOPIC" ]; then
        CMD="opencli xiaohongshu search \"$TOPIC\" -f json --limit $MAX_ITEMS"
      else
        RESULTS=$(echo "$RESULTS" | jq -c --arg p "$plat" '. + [{"platform":$p,"status":"skipped","items":[],"error_message":"no public hot list"}]')
        continue
      fi
      ;;
    xueqiu)
      if [ -n "$TOPIC" ]; then
        CMD="opencli xueqiu search \"$TOPIC\" -f json --limit $MAX_ITEMS"
      else
        CMD="opencli xueqiu hot -f json --limit $MAX_ITEMS"
      fi
      ;;
    v2ex)
      CMD="opencli v2ex hot -f json --limit $MAX_ITEMS"
      ;;
    toutiao)
      CMD="opencli toutiao hot -f json --limit $MAX_ITEMS"
      ;;
    *)
      RESULTS=$(echo "$RESULTS" | jq -c --arg p "$plat" '. + [{"platform":$p,"status":"error","items":[],"error_message":"unknown platform"}]')
      continue
      ;;
  esac

  # Execute with timeout, capture both stdout and stderr
  OUTPUT=$(timeout 60 bash -c "$CMD" 2>&1) || {
    # opencli 失败，记录错误
    RESULTS=$(echo "$RESULTS" | jq -c --arg p "$plat" --arg e "$OUTPUT" '. + [{"platform":$p,"status":"error","items":[],"error_message":$e}]')
    continue
  }

  # Validate JSON output - opencli 可能输出 YAML 错误或非 JSON
  if echo "$OUTPUT" | jq empty 2>/dev/null; then
    # 有效 JSON，提取 items
    ITEMS=$(echo "$OUTPUT" | jq -c '[.[] // .] | if type == "array" then . else [.] end | .[0:'"$MAX_ITEMS"']' 2>/dev/null || echo "[]")
    RESULTS=$(echo "$RESULTS" | jq -c --arg p "$plat" --argjson items "$ITEMS" '. + [{"platform":$p,"status":"ok","items":$items}]')
  else
    # 非 JSON 输出，当作错误处理
    RESULTS=$(echo "$RESULTS" | jq -c --arg p "$plat" --arg e "$OUTPUT" '. + [{"platform":$p,"status":"error","items":[],"error_message":$e}]')
  fi
done

# 确保最终输出是有效的 JSON array
echo "$RESULTS" | jq -c .
"""]

# 注意：script step 的输出是 {"command":[], "stdout":"...", "stderr":"..."} 格式
# 实际 JSON 数据在 stdout 字段中，所以这里不设置 validation
# normalize step 会从 stdout 中解析 JSON

[[steps]]
id = "normalize"
title = "标准化各平台数据格式"
depends_on = ["fetch-platforms"]
input_context = ["fetch-platforms"]
description = """
将 fetch-platforms 的输出标准化为统一格式。

注意：fetch-platforms 是 script step，其输出格式为：
{"command":[], "exit_code":0, "stdout":"...", "stderr":"..."}
实际的 JSON 数据在 stdout 字段中，是一个平台数据数组。

你需要：
1. 从 stdout 字段中解析出平台数据数组
2. 遍历每个平台的 items
3. 提取关键字段，统一为以下格式：
   {"platform":"weibo","id":"unique_id","title":"标题/话题","url":"链接","author":"作者","engagement":100,"published_at":"时间","summary":"摘要","tags":["标签"]}
4. engagement 是互动量（点赞+评论+转发），无法获取时用 0
5. 过滤掉明显无效的内容（空标题、纯广告等）
6. 最多保留 100 条

输出 ONLY compact JSON array，不要 Markdown，不要代码块。
"""

[steps.agent]
name = "reporter"

[steps.validate]
format = "json"
min_items = 1
item_required = ["platform", "title"]

[[steps]]
id = "cluster"
title = "跨平台话题聚类去重"
depends_on = ["normalize"]
input_context = ["normalize"]
description = """
对 normalize 输出的标准化条目进行跨平台聚类，合并讨论同一话题的条目。

聚类规则：
1. 标题/话题名高度相似的归为一组（如 "AI芯片突破" 和 "国产AI芯片"）
2. 同一事件在不同平台的讨论归为一组
3. 每组计算总 engagement（各平台之和）
4. 每组保留 1-2 个最具代表性的原始条目链接

输出 ONLY compact JSON array，每组一个对象：
{"cluster_id":1,"topic":"话题名","platforms":["weibo","zhihu"],"total_engagement":5000,"items":[{"platform":"weibo","title":"...","url":"...","engagement":3000},{"platform":"zhihu","title":"...","url":"...","engagement":2000}],"summary":"一句话概括"}

按 total_engagement 降序排列，最多保留 30 个 cluster。
"""

[steps.agent]
name = "reporter"

[steps.validate]
format = "json"
min_items = 1
item_required = ["cluster_id", "topic", "platforms", "total_engagement", "items"]

[[steps]]
id = "synthesize"
title = "生成跨平台热点简报"
depends_on = ["cluster"]
input_context = ["cluster"]
description = """
基于 cluster 的聚类结果，生成一份跨平台热点简报。

简报格式：

# 跨平台热点简报

> 话题：{{topic}}（如为空则为"全网热搜"）
> 时间：当前日期
> 覆盖平台：列出成功查询的平台
> 数据来源：各平台条目数统计

## 🔥 热门话题 TOP {{max_items}}

对每个 cluster：

### 1. 话题名称

**热度**: total_engagement
**平台**: 涉及平台列表
**一句话**: cluster summary

- [平台A - 标题](url) (engagement)
- [平台B - 标题](url) (engagement)

## 📊 平台覆盖统计

| 平台 | 状态 | 条目数 |
|------|------|--------|
| weibo | ✅/❌ | N |
| ... | ... | ... |

## 💡 趋势洞察

2-3 条跨平台共性趋势或值得关注的信号。

要求：
- 语言简洁，信息密度高
- 每个话题必须有原始链接作为证据
- 不要编造数据，没有的数据写"未获取"
- 总长度控制在 2000 字以内
"""

[steps.agent]
name = "reporter"
