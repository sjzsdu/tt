formula = "git-status-check"
description = "原子 formula：采集当前 git 仓库状态，输出分支、HEAD、upstream、dirty、冲突、rebase/merge/cherry-pick 状态等结构化信息。"
version = 1
type = "atomic"
category = "git"
tags = ["git", "atomic", "status", "check"]

[preflight]

[[preflight.checks]]
type = "command"
name = "git"
command = "git"
message = "需要安装 git"

[[preflight.checks]]
type = "command"
name = "jq"
command = "jq"
message = "需要安装 jq"

[[preflight.checks]]
type = "git"
name = "git-repo"
require_repo = true
message = "当前目录必须是 git 仓库"

[vars]
require_clean = { description = "是否要求工作区干净；true 时 dirty/conflict/rebase/merge/cherry-pick 都会导致 ok=false", default = "false", enum = ["true", "false"] }
require_upstream = { description = "是否要求当前分支配置 upstream", default = "false", enum = ["true", "false"] }

[[steps]]
id = "status"
title = "采集 git 状态"
execution = "script"
description = "以结构化 JSON 输出当前仓库状态，供其它 formula 组合使用。"

[steps.script]
command = ["bash", "-lc", """
set -u
require_clean="${TT_REQUIRE_CLEAN:-false}"
require_upstream="${TT_REQUIRE_UPSTREAM:-false}"
repo_root="$(git rev-parse --show-toplevel 2>/dev/null || pwd)"
cd "$repo_root"
branch="$(git branch --show-current 2>/dev/null || true)"
head="$(git rev-parse HEAD 2>/dev/null || true)"
upstream="$(git rev-parse --abbrev-ref --symbolic-full-name '@{u}' 2>/dev/null || true)"
status_short="$(git status --short 2>/dev/null || true)"
conflict_files="$(git diff --name-only --diff-filter=U | jq -R . | jq -s .)"
dirty=false
if [ -n "$status_short" ]; then dirty=true; fi
in_rebase=false
if [ -d "$(git rev-parse --git-path rebase-merge 2>/dev/null)" ] || [ -d "$(git rev-parse --git-path rebase-apply 2>/dev/null)" ]; then in_rebase=true; fi
in_merge=false
if [ -f "$(git rev-parse --git-path MERGE_HEAD 2>/dev/null)" ]; then in_merge=true; fi
in_cherry_pick=false
if [ -f "$(git rev-parse --git-path CHERRY_PICK_HEAD 2>/dev/null)" ]; then in_cherry_pick=true; fi
ok=true
reason=""
if [ "$require_upstream" = true ] && [ -z "$upstream" ]; then ok=false; reason="missing upstream"; fi
if [ "$require_clean" = true ] && { [ "$dirty" = true ] || [ "$in_rebase" = true ] || [ "$in_merge" = true ] || [ "$in_cherry_pick" = true ]; }; then ok=false; reason="worktree is not clean"; fi
jq -cn \
  --argjson ok "$ok" \
  --arg reason "$reason" \
  --arg repo_root "$repo_root" \
  --arg branch "$branch" \
  --arg head "$head" \
  --arg upstream "$upstream" \
  --arg status_short "$status_short" \
  --argjson dirty "$dirty" \
  --argjson in_rebase "$in_rebase" \
  --argjson in_merge "$in_merge" \
  --argjson in_cherry_pick "$in_cherry_pick" \
  --argjson conflict_files "$conflict_files" \
  '{ok:$ok,reason:$reason,repo_root:$repo_root,branch:$branch,head:$head,upstream:$upstream,dirty:$dirty,in_rebase:$in_rebase,in_merge:$in_merge,in_cherry_pick:$in_cherry_pick,conflict_files:$conflict_files,status_short:$status_short}'
"""]
format = "json"
timeout = "30s"

[steps.script.env]
TT_REQUIRE_CLEAN = "{{require_clean}}"
TT_REQUIRE_UPSTREAM = "{{require_upstream}}"

[steps.validate]
format = "json"
required = ["stdout"]
