formula = "bug-fix"
description = "完成 bug 澄清、代码调研、确认问题是否真实存在、在最小影响范围内修复并验证，或在问题不成立时给出说明，并输出最终结论。"
version = 1
type = "workflow"

[vars]
issue_summary = { description = "用户反馈的 bug 摘要或问题描述", required = true }

[[steps]]
id = "analyze-issue"
title = "分析用户问题并判断是否需要人工澄清"
description = """
基于 '{{issue_summary}}' 先理解用户问题，不要急于判断代码是否有 bug。

目标：
1. 提炼问题现象、预期行为、可能的触发路径；
2. 判断当前信息是否足够进入代码调研；
3. 只有在信息不足时，将 needs_clarification 置为 true，并写清楚需要补充什么；
4. 若信息已足够，明确告诉后续步骤可以直接进入代码调研。

输出 ONLY compact JSON，格式必须严格如下：
{
  "issue_summary":"...",
  "needs_clarification":true,
  "clarification_reason":"...",
  "clarification_questions":["..."],
  "research_brief":"..."
}

约束：
- needs_clarification 必须是布尔值。
- 当 needs_clarification=false 时，research_brief 必须足够支撑后续代码调研。
- 当 needs_clarification=true 时，clarification_questions 必须列出 1-5 个具体问题，后续显式 human_input step 会负责暂停收集。
- research_brief 要写成给 code-research 使用的调研任务摘要。
"""
agent.name = "coder"

[steps.validate]
format = "json"
required = ["issue_summary", "needs_clarification", "research_brief"]

[[steps]]
id = "clarify-with-user"
title = "向用户收集缺失的 bug 复现信息"
execution = "human_input"
depends_on = ["analyze-issue"]
condition = "analyze-issue.needs_clarification == true"
description = """
issue_triage 判断当前信息不足，需要用户补充最小复现信息。
请根据表单填写复现路径、期望行为、实际行为和环境线索。
"""

[steps.form]
title = "补充 bug 复现信息"
description = "这些信息会被合并进后续代码调研摘要。若某项未知，可写“不确定”。"
submit_label = "继续调研"

[[steps.form.fields]]
name = "reproduction_steps"
label = "复现步骤"
type = "textarea"
required = true
placeholder = "请描述从什么入口、执行什么操作后出现问题"

[[steps.form.fields]]
name = "expected_behavior"
label = "期望行为"
type = "textarea"
required = true

[[steps.form.fields]]
name = "actual_behavior"
label = "实际行为 / 错误信息"
type = "textarea"
required = true

[[steps.form.fields]]
name = "environment"
label = "环境或上下文"
type = "input"
required = false
placeholder = "例如分支、版本、命令、浏览器、平台、账号状态等"

[[steps]]
id = "prepare-research-brief"
title = "整合用户问题与补充信息，生成代码调研摘要"
depends_on = ["analyze-issue", "clarify-with-user"]
input_context = ["analyze-issue.issue_summary", "analyze-issue.research_brief", "clarify-with-user"]
description = """
基于 issue_triage 与 user_clarification（如果存在）生成后续代码调研使用的统一摘要。

输出 ONLY compact JSON：
{
  "research_task":"...",
  "search_targets":["..."],
  "acceptance_criteria":["..."],
  "notes":["..."]
}

要求：
- 若没有 user_clarification，也要仅基于 issue_triage 生成可用结果。
- research_task 用 1-3 句写清楚要调研的问题、现象和期望。
- search_targets 只放最有用的模块名、功能点、关键词、错误文案、接口名或配置名。
- acceptance_criteria 用于后续确认“问题存在/不存在”和修复后验证。
"""
agent.name = "coder"

[steps.validate]
format = "json"
required = ["research_task", "search_targets", "acceptance_criteria"]

[[steps]]
id = "code-research"
title = "使用 code-research 调研代码并判断问题是否存在"
depends_on = ["prepare-research-brief"]
input_context = ["prepare-research-brief.research_task", "prepare-research-brief.search_targets", "prepare-research-brief.acceptance_criteria"]
description = """
你是 code-research agent。基于 research_brief 调研当前代码库，重点使用 code-context、grep、符号命名、调用链和配置入口来判断用户描述的问题在当前代码中是否真实存在。

任务：
1. 找出最相关的代码入口、模块、函数、配置或状态流；
2. 判断问题是 confirmed / likely / not-confirmed；
3. 如果不成立，说明为什么不成立，是现有代码没有这个问题、还是信息不足、还是用户理解有偏差；
4. 如果成立，定位最小修改范围与根因；
5. 给出验证点，避免误修。

输出 ONLY compact JSON：
{
  "issue_exists":true,
  "existence":"confirmed|likely|not-confirmed",
  "root_cause":"...",
  "evidence":["..."],
  "code_scope":["..."],
  "minimal_fix_scope":["..."],
  "risk_points":["..."],
  "why_not_exists":"",
  "verification_focus":["..."]
}

约束：
- issue_exists 必须是布尔值。
- existence=not-confirmed 时，issue_exists 必须为 false。
- existence=confirmed 时，issue_exists 必须为 true。
- code_scope / minimal_fix_scope 优先输出文件、模块、符号或责任层。
- 不要直接开始修代码，先给出研究结论。
"""
agent.name = "code-research"

[steps.validate]
format = "json"
required = ["issue_exists", "existence", "evidence"]

[[steps]]
id = "fix-plan"
title = "为已确认 bug 制定最小影响修复方案"
depends_on = ["code-research"]
input_context = ["prepare-research-brief.research_task", "prepare-research-brief.acceptance_criteria", "code-research.root_cause", "code-research.minimal_fix_scope", "code-research.risk_points", "code-research.verification_focus"]
condition = "code-research.issue_exists == true"
description = """
基于 research_brief 与 bug_verification，为已确认存在的 bug 制定最小影响范围修复方案。

输出 ONLY compact JSON：
{
  "fix_goal":"...",
  "minimal_change_strategy":"...",
  "files_to_touch":["..."],
  "do_not_touch":["..."],
  "regression_risk":"low|medium|high",
  "validation_plan":["..."],
  "why_minimal":"..."
}

要求：
- 只围绕 root_cause 和 minimal_fix_scope 设计修复。
- 明确哪些地方不要顺手重构。
- validation_plan 必须能支撑“修复 bug 同时不引入新问题”。
"""
agent.name = "coder"

[steps.validate]
format = "json"
required = ["fix_goal", "minimal_change_strategy", "validation_plan"]

[[steps]]
id = "execute-fix"
title = "执行最小影响修复并做必要验证"
depends_on = ["fix-plan"]
input_context = ["prepare-research-brief.acceptance_criteria", "code-research.root_cause", "code-research.minimal_fix_scope", "code-research.verification_focus", "fix-plan.files_to_touch", "fix-plan.do_not_touch", "fix-plan.minimal_change_strategy", "fix-plan.validation_plan"]
condition = "code-research.issue_exists == true"
description = """
基于 bug_verification 与 fix_plan 执行修复。

目标：
1. 只修改 files_to_touch 或等价最小范围；
2. 不顺手做无关清理；
3. 做必要验证，确保修复该 bug 时不引入新的明显问题；
4. 不编造未执行的测试结果。

输出 ONLY compact JSON：
{
  "files_changed":["..."],
  "change_summary":"...",
  "why_this_fix":"...",
  "verification_actions":["..."],
  "verification_result":"...",
  "fully_fixed":true,
  "remaining_risks":["..."]
}

约束：
- fully_fixed 必须是布尔值。
- verification_actions 要具体，不要写空泛“已测试”。
"""
agent.name = "coder"

[steps.validate]
format = "json"
required = ["files_changed", "change_summary", "verification_actions", "fully_fixed"]

[[steps]]
id = "no-bug-report"
title = "问题不成立时输出说明"
depends_on = ["code-research"]
input_context = ["prepare-research-brief.research_task", "code-research.existence", "code-research.why_not_exists", "code-research.evidence"]
condition = "code-research.issue_exists != true"
description = """
当 bug_verification 判断当前代码中问题不存在或未被确认时，输出给用户的清晰说明。

输出 ONLY compact JSON：
{
  "decision":"no-code-change",
  "reason":"...",
  "why_not_exists":"...",
  "evidence":["..."],
  "recommended_next_steps":["..."],
  "what_to_provide_if_user_wants_recheck":["..."]
}

要求：
- 明确说明是“代码中不存在该问题”还是“当前信息不足以确认”。
- 不要含糊其辞。
"""
agent.name = "reporter"

[steps.validate]
format = "json"
required = ["decision", "reason", "recommended_next_steps"]

[[steps]]
id = "final-report"
title = "输出最终 bug 处理结论"
depends_on = ["execute-fix", "no-bug-report"]
input_context = ["analyze-issue.issue_summary", "clarify-with-user", "prepare-research-brief.research_task", "code-research.existence", "code-research.root_cause", "code-research.why_not_exists", "execute-fix.change_summary", "execute-fix.verification_result", "execute-fix.remaining_risks", "no-bug-report.reason", "no-bug-report.recommended_next_steps"]
description = """
面向用户输出最终结论，整合 issue_triage、user_clarification、research_brief、bug_verification、fix_plan、fix_result 与 no_bug_resolution。

报告必须回答：
1. 用户问题是如何被理解和澄清的；
2. 代码调研覆盖了哪些重点；
3. 该问题在当前代码中是否真实存在；
4. 若不存在，为什么不存在，后续建议是什么；
5. 若存在，根因是什么；
6. 修复时如何控制最小影响范围；
7. 实际改了什么，做了哪些验证；
8. 是否完全解决，以及还剩哪些风险或待确认点。

要求：
- 结论先行。
- 控制在 8 条以内要点，优先写可执行结论与下一步。
- 若未修复或未完全修复，要明确写出原因与后续建议。
- 不要把不存在的执行结果写成已完成事实。
"""
agent.name = "reporter"
