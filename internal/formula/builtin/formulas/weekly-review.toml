formula = "weekly-review"
title = "周复盘"
description = "复盘一周成果、经验教训，并规划下周重点。"
version = 1
type = "workflow"
category = "效率"
tags = ["内置", "效率"]

[vars]
week = { description = "要复盘的周次、笔记或工作背景", required = true }

[[steps]]
id = "collect-week"
title = "收集本周素材"
description = """
收集或推断本周完成事项、会议、笔记、阻塞、习惯和情绪状态：{{week}}。输出结构化 JSON。
"""
output_key = "week_context"
agent.name = "planner"

[[steps]]
id = "summarize-outcomes"
title = "总结本周结果"
depends_on = ["collect-week"]
input_context = ["week_context"]
description = """
总结本周成果、未完成事项、意外情况和可量化产出。
"""
output_key = "outcomes"
agent.name = "reporter"

[[steps]]
id = "extract-lessons"
title = "提炼经验和模式"
depends_on = ["summarize-outcomes"]
input_context = ["week_context", "outcomes"]
description = """
识别有效做法、消耗精力的事情、反复出现的阻塞和行为模式。
"""
output_key = "lessons"
agent.name = "planner"

[[steps]]
id = "plan-next-week"
title = "规划下周重点"
depends_on = ["extract-lessons"]
input_context = ["outcomes", "lessons"]
description = """
生成下周优先级、需要重新协商的承诺、改进实验和一份简短周复盘。
"""
agent.name = "reporter"
