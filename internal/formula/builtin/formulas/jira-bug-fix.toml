formula = "jira-bug-fix"
description = "获取 Jira ticket 与最新评论后，直接用 typed runtime 内嵌 bug-fix workflow 分析、修复并输出最终结论。"
version = 3
type = "workflow"

[preflight]

[[preflight.checks]]
type = "command"
name = "jira"
command = "jira"
message = "需要安装并配置 Jira CLI，确保 jira issue view 可用"

[vars]
ticket_key = { description = "Jira ticket 编号，例如 PROJ-123", required = true }

[[steps]]
id = "fetch-ticket-data"
title = "获取 Jira ticket 与最新评论"
execution = "script"

[steps.script]
command = ["jira", "issue", "view", "{{ticket_key}}", "--comments", "20", "--raw"]
format = "json"
timeout = "30s"

[[steps]]
id = "run-bug-fix"
title = "内嵌 bug-fix workflow 处理 ticket"
depends_on = ["fetch-ticket-data"]
input_context = ["fetch-ticket-data"]
embed = "bug-fix"

[steps.embed_vars]
issue_summary = """
Jira ticket {{ticket_key}} 的原始内容与最新评论如下。请先在 bug-fix 的 analyze-issue 步骤中整理问题现象、期望行为、评论线索和必要假设，再继续代码调研与修复判断。

{{fetch-ticket-data}}
"""

[[steps]]
id = "final-report"
title = "输出 Jira 处理最终报告"
depends_on = ["run-bug-fix"]
input_context = ["fetch-ticket-data", "run-bug-fix"]
description = """
面向用户输出简明中文报告。

报告必须回答：
1. Jira ticket 核心内容与最新评论要点；
2. bug-fix 对问题的理解、代码调研和最终判断；
3. 若问题不存在，给出 no_bug_resolution 的核心说明；
4. 若问题存在，简述修复结果、验证结论与剩余风险；
5. 若流程卡在用户补充信息，也要说明当前卡点与所需补充内容。

要求：
- 结论先行。
- 不重复 bug-fix 内部细节，只做摘要。
- 控制在 6-10 条要点内，每条 1-2 句，避免冗长复述。
- 用用户能直接理解的语言，不要复述整条 workflow。
"""
agent.name = "product-manager"
