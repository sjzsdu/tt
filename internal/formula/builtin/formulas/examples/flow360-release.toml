formula = "flow360-release"
title = "flow360-release"
category = "release"
tags = ["flow360-next", "release", "github-actions", "deploy"]
description = "Flow360 发布流程：触发或复用固定 GitHub Actions workflow，默认使用 multi-branch/v2；显式 use_v1=true 时使用 multi-branch-v1 复用 tmp-deploy 缓存分支以减少重复冲突；循环检查目标 multi-branch job，失败则重置 tmp branch、merge 指定分支、交给 agent 解冲突、merge --continue、push、rerun failed jobs，再等待后继续循环。"
version = 1
type = "workflow"

[vars]
delete_blocked_run = { default = "true" }
env_name = { required = true }
fresh_deploy = { default = "false" }
job_name_pattern = { default = "" }
merge_branch = { default = "" }
poll_interval_seconds = { type = "int", default = "30" }
resume_run_id = { default = "" }
tag = { default = "" }
tmp_branch = { default = "" }
use_v1 = { default = "false" }

[[steps]]
id = "dispatch-run"
title = "触发或复用 Flow360 CD workflow"
execution = "script"

[steps.script]
command = ["bash", "-lc", '''
set -euo pipefail
repo='flexcompute/flex'
workflow='.github/workflows/frontend_flow360-ui-next-cd.yml'
env_name="${TT_ENV_NAME:-}"
tag="${TT_TAG:-}"
fresh="${TT_FRESH_DEPLOY:-false}"
use_v1="${TT_USE_V1:-false}"
resume_run_id="${TT_RESUME_RUN_ID:-}"
pass_tag=false
if [ -n "$tag" ] && [ "$tag" != "-" ]; then pass_tag=true; fi
emit() {
  jq -cn --arg repo "$repo" --arg workflow_path "$workflow" --arg env_name "$env_name" --arg tag "$tag" --arg fresh "$fresh" --arg use_v1 "$use_v1" --arg original_run_id "${1:-}" --arg run_url "${2:-}" --arg dispatch_error "${3:-}" --argjson run_created "${4:-false}" --argjson pass_tag "$pass_tag" '{repo:$repo,workflow_path:$workflow_path,env_name:$env_name,tag:$tag,pass_tag:$pass_tag,fresh_deploy:($fresh=="true"),use_v1:($use_v1=="true"),run_created:$run_created,original_run_id:$original_run_id,run_url:$run_url,dispatch_error:$dispatch_error}'
}
if [ -n "$resume_run_id" ] && [ "$resume_run_id" != "-" ]; then
  if run_data="$(gh run view "$resume_run_id" -R "$repo" --json databaseId,url 2>/dev/null)"; then
    emit "$resume_run_id" "$(jq -r '.url // ""' <<<"$run_data")" '' true
    exit 0
  fi
  emit '' '' "resume_run_id $resume_run_id was not found or is not accessible" false
  exit 1
fi
known="$(gh run list -R "$repo" --workflow "$workflow" --limit 20 --json databaseId 2>/dev/null | jq -r '.[].databaseId // empty' | sort -u || true)"
cmd=(gh workflow run "$workflow" -R "$repo" -f "envName=$env_name" -f "freshDeploy=$fresh" -f "use_v1=$use_v1")
if [ "$pass_tag" = true ]; then cmd+=(-f "tag=$tag"); fi
if ! dispatch_out="$("${cmd[@]}" 2>&1)"; then
  emit '' '' "$dispatch_out" false
  exit 1
fi
for _ in $(seq 1 12); do
  sleep 5
  runs="$(gh run list -R "$repo" --workflow "$workflow" --limit 20 --json databaseId,url,status,createdAt,event 2>/dev/null || true)"
  [ -n "$runs" ] || continue
  pick="$(jq -cn --argjson runs "$runs" --arg known "$known" '$known | split("
") as $known_ids | ($runs | map(select(((.databaseId|tostring) as $id | $known_ids | index($id) | not))) | .[0]) // ($runs[0] // null)')"
  rid="$(jq -r '.databaseId // empty' <<<"$pick")"
  if [ -n "$rid" ]; then
    emit "$rid" "$(jq -r '.url // ""' <<<"$pick")" '' true
    exit 0
  fi
done
emit '' '' 'workflow dispatched but new run id was not visible within polling window' false
exit 1

''']
format = "json"
timeout = "90s"

[steps.script.env]
TT_ENV_NAME = "{{env_name}}"
TT_FRESH_DEPLOY = "{{fresh_deploy}}"
TT_RESUME_RUN_ID = "{{resume_run_id}}"
TT_TAG = "{{tag}}"
TT_USE_V1 = "{{use_v1}}"

[steps.validate]
format = "json"
required = ["stdout"]

[[steps]]
id = "monitor-and-rerun"
title = "监控 multi-branch、修冲突并 rerun"
depends_on = ["dispatch-run"]
execution = "loop"

[steps.loop]
until = "release-progress.stdout.done == true"
max = 80

[[steps.loop.body]]
id = "check-multi-branch-job"
title = "获取目标 multi-branch job 状态"
execution = "script"

[steps.loop.body.script]
command = ["bash", "-lc", '''
set -euo pipefail
repo='flexcompute/flex'
rid="${TT_ORIGINAL_RUN_ID:-}"
known_run_url="${TT_RUN_URL:-}"
use_v1="${TT_USE_V1:-false}"
pattern="${TT_JOB_NAME_PATTERN:-}"
if [ -z "$pattern" ] || [ "$pattern" = "-" ]; then
  if [ "$use_v1" = "true" ]; then pattern='multi-branch-v1'; else pattern='multi-branch'; fi
fi
pattern_lc="$(printf '%s' "$pattern" | tr '[:upper:]' '[:lower:]')"
tmp_override="${TT_TMP_BRANCH_OVERRIDE:-}"
emit() {
  jq -cn --arg repo "$repo" --arg original_run_id "$rid" --arg run_url "${1:-}" --argjson jobs "${2:-[]}" --arg action "${3:-block}" --arg final_state "${4:-blocked}" --arg reason "${5:-}" --arg tmp_branch "${6:-}" --arg merge_branch "${7:-}" --arg failed_log_excerpt "${8:-}" --arg failed_job_id "${9:-}" '{repo:$repo,original_run_id:$original_run_id,run_url:$run_url,jobs:$jobs,action:$action,final_state:$final_state,done:($final_state=="succeeded" or $final_state=="blocked"),reason:$reason,tmp_branch:$tmp_branch,merge_branch:$merge_branch,failed_log_excerpt:$failed_log_excerpt,failed_job_id:$failed_job_id}'
}
if [ -z "$rid" ]; then emit '' '[]' block blocked 'missing original_run_id'; exit 0; fi
if ! data="$(gh run view "$rid" -R "$repo" --json databaseId,url,status,conclusion,jobs 2>&1)"; then
  if printf '%s
' "$data" | grep -qiE '(^|[^0-9])(404|not[ -]?found|no run found|does not exist|not accessible|bad credentials|requires authentication|resource not accessible)([^0-9]|$)'; then
    emit "$known_run_url" '[]' block blocked "failed to fetch run details: $data"
  else
    emit "$known_run_url" '[]' wait running "transient GitHub API error while fetching run details; retry polling: $data"
  fi
  exit 0
fi
run_url="$(jq -r '.url // ""' <<<"$data")"
jobs="$(jq --arg p "$pattern_lc" '[.jobs[]? | select((.name // "" | ascii_downcase) == $p)]' <<<"$data")"
if [ "$(jq 'length' <<<"$jobs")" -eq 0 ]; then
  jobs="$(jq --arg p "$pattern_lc" '[.jobs[]? | select(.conclusion != "skipped" and ((.name // "" | ascii_downcase | contains($p)) or (((.name // "" | ascii_downcase | contains("multi")) and (.name // "" | ascii_downcase | contains("branch"))))))]' <<<"$data")"
fi
count="$(jq 'length' <<<"$jobs")"
if [ "$count" -eq 0 ]; then
  emit "$run_url" "$jobs" wait running "target job '$pattern' has not appeared yet"
  exit 0
fi
if jq -e 'any(.[]; (.status // "") != "completed")' <<<"$jobs" >/dev/null; then
  emit "$run_url" "$jobs" wait running "target multi-branch job is still running or queued"
  exit 0
fi
if jq -e 'all(.[]; (.conclusion // "") == "success")' <<<"$jobs" >/dev/null; then
  emit "$run_url" "$jobs" none succeeded "target multi-branch job completed successfully"
  exit 0
fi
if jq -e 'any(.[]; (.conclusion // "") == "failure")' <<<"$jobs" >/dev/null; then
  failed_job_id="$(jq -r 'map(select((.conclusion // "") == "failure")) | .[0].databaseId // .[0].id // empty' <<<"$jobs")"
  if [ -z "$failed_job_id" ]; then
    failed_job_url="$(jq -r 'map(select((.conclusion // "") == "failure")) | .[0].url // .[0].htmlUrl // .[0].html_url // empty' <<<"$jobs")"
    failed_job_id="$(printf '%s
' "$failed_job_url" | sed -nE 's#.*/job/([0-9]+).*#\1#p' | tail -1)"
  fi
  failed_log=''
  if [ -n "$failed_job_id" ]; then
    failed_log="$(gh run view "$rid" -R "$repo" --job "$failed_job_id" --log 2>/dev/null || true)"
  fi
  if [ -z "$failed_log" ]; then
    failed_log="$(gh run view "$rid" -R "$repo" --log-failed 2>/dev/null || true)"
  fi
  if [ -z "$failed_log" ]; then
    emit "$run_url" "$jobs" wait running "failed multi-branch job log is not available yet; retry polling" "" "" "" "$failed_job_id"
    exit 0
  fi
  parsed_tmp="$(printf '%s
' "$failed_log" | sed -nE 's/.*--arg tmp_branch "([^"]+)".*/\1/p' | tail -1)"
  if [ -z "$parsed_tmp" ]; then parsed_tmp="$(printf '%s
' "$failed_log" | sed -nE 's/.*CURRENT="(tmp-deploy-[^"]+)".*/\1/p' | tail -1)"; fi
  if [ -z "$parsed_tmp" ]; then parsed_tmp="$(printf '%s
' "$failed_log" | sed -nE 's/.*tmp_branch: (tmp-deploy-[^[:space:]]+).*/\1/p' | tail -1)"; fi
  if [ -z "$parsed_tmp" ]; then parsed_tmp="$(printf '%s
' "$failed_log" | sed -nE 's/.*git checkout -b (tmp-deploy-[^[:space:]]+) origin\/.*/\1/p' | tail -1)"; fi
  if [ -z "$parsed_tmp" ]; then parsed_tmp="$(printf '%s
' "$failed_log" | sed -nE "s/.*branch '(tmp-deploy-[^']+)'.*/\1/p" | tail -1)"; fi
  if [ -z "$parsed_tmp" ]; then parsed_tmp="$(printf '%s
' "$failed_log" | sed -nE 's/.*TMP_BRANCH: ([^[:space:]]+).*/\1/p' | tail -1)"; fi
  if [ -z "$parsed_tmp" ]; then parsed_tmp="$(printf '%s
' "$failed_log" | sed -nE 's/.*TMP_BRANCH=([^[:space:]]+).*/\1/p' | tail -1)"; fi
  if [ -z "$parsed_tmp" ]; then parsed_tmp="$(printf '%s
' "$failed_log" | sed -nE 's/.*tmp_branch "([^"]+)".*/\1/p' | tail -1)"; fi
  if [ -z "$parsed_tmp" ]; then parsed_tmp="$(printf '%s
' "$failed_log" | sed -nE 's/.*git checkout -b ([^[:space:]]+) origin\/.*/\1/p' | tail -1)"; fi
  parsed_merge="$(printf '%s
' "$failed_log" | sed -nE 's/.*CONFLICT_BRANCH: ([^[:space:]]+).*/\1/p' | tail -1)"
  if [ -z "$parsed_merge" ]; then parsed_merge="$(printf '%s
' "$failed_log" | sed -nE 's/.*git merge --no-ff origin\/([^[:space:]]+) -m auto_manual_merge.*/\1/p' | tail -1)"; fi
  if [ -n "$tmp_override" ] && [ "$tmp_override" != "-" ]; then parsed_tmp="$tmp_override"; fi
  log_excerpt="$(printf '%s
' "$failed_log" | grep -E 'tmp-deploy|CONFLICT_BRANCH|auto_manual_merge|tmp_branch|conflict_branch|Checkout tmp branch' | tail -80 || true)"
  if [ -z "$log_excerpt" ]; then log_excerpt="$(printf '%s
' "$failed_log" | tail -80)"; fi
  emit "$run_url" "$jobs" repair_conflict running "target multi-branch job failed; repair tmp branch then rerun failed jobs" "$parsed_tmp" "$parsed_merge" "$log_excerpt" "$failed_job_id"
  exit 0
fi
emit "$run_url" "$jobs" block blocked "target multi-branch job completed with non-success conclusion"

''']
format = "json"
timeout = "60s"

[steps.loop.body.script.env]
TT_JOB_NAME_PATTERN = "{{job_name_pattern}}"
TT_ORIGINAL_RUN_ID = "{{dispatch-run.stdout.original_run_id}}"
TT_RUN_URL = "{{dispatch-run.stdout.run_url}}"
TT_TMP_BRANCH_OVERRIDE = "{{tmp_branch}}"
TT_USE_V1 = "{{dispatch-run.stdout.use_v1}}"

[steps.loop.body.validate]
format = "json"
required = ["stdout"]

[[steps.loop.body]]
id = "prepare-conflict-merge"
title = "重置 tmp branch 并 merge 指定分支"
depends_on = ["check-multi-branch-job"]
condition = "check-multi-branch-job.stdout.action == repair_conflict"
execution = "script"

[steps.loop.body.script]
command = ["bash", "-lc", '''
set -euo pipefail
repo_root="$(git rev-parse --show-toplevel 2>/dev/null || pwd)"
cd "$repo_root"
check_action="${TT_CHECK_ACTION:-}"
tmp_override="${TT_TMP_BRANCH_OVERRIDE:-}"
tmp_from_run="${TT_TMP_BRANCH_FROM_RUN:-}"
tmp_branch="$tmp_override"
if [ -z "$tmp_branch" ] || [ "$tmp_branch" = "-" ]; then tmp_branch="$tmp_from_run"; fi
merge_override="${TT_MERGE_BRANCH_OVERRIDE:-}"
merge_from_run="${TT_MERGE_BRANCH_FROM_RUN:-}"
merge_branch="$merge_override"
if [ -z "$merge_branch" ] || [ "$merge_branch" = "-" ]; then merge_branch="$merge_from_run"; fi
emit_prepare_blocker() {
  jq -cn --arg repo_root "$repo_root" --arg tmp_branch "$tmp_branch" --arg merge_branch "$merge_branch" --arg blocker_type "${1:-git_prepare_failed}" --arg blocker_summary "${2:-}" '{attempted:true,merge_complete:false,ready_for_agent:false,repo_root:$repo_root,tmp_branch:$tmp_branch,merge_branch:$merge_branch,conflicted_files:[],touched_files:[],stdout:"",stderr:$blocker_summary,blocker_type:$blocker_type}'
}
if [ "$check_action" != "repair_conflict" ]; then
  jq -cn --arg repo_root "$repo_root" '{attempted:false,merge_complete:false,ready_for_agent:false,repo_root:$repo_root,tmp_branch:"",merge_branch:"",conflicted_files:[],touched_files:[],stdout:"",stderr:"",blocker_type:"none",blocker_summary:"no repair needed in this iteration"}'
  exit 0
fi
if [ -z "$tmp_branch" ]; then emit_prepare_blocker missing_tmp_branch "tmp branch was not provided and could not be parsed from failed GitHub Actions logs"; exit 0; fi
if [ -z "$merge_branch" ]; then emit_prepare_blocker missing_merge_branch "merge/conflict branch was not provided and could not be parsed from failed GitHub Actions logs"; exit 0; fi
merge_head_path="$(git rev-parse --git-path MERGE_HEAD)"
rebase_merge_path="$(git rev-parse --git-path rebase-merge)"
rebase_apply_path="$(git rev-parse --git-path rebase-apply)"
cherry_pick_head_path="$(git rev-parse --git-path CHERRY_PICK_HEAD)"
if [ -e "$merge_head_path" ]; then git merge --abort >/tmp/tt-flow360-abort.log 2>&1 || true; fi
if [ -e "$rebase_merge_path" ] || [ -e "$rebase_apply_path" ]; then git rebase --abort >/tmp/tt-flow360-abort.log 2>&1 || true; fi
if [ -e "$cherry_pick_head_path" ]; then git cherry-pick --abort >/tmp/tt-flow360-abort.log 2>&1 || true; fi
is_transient_fetch_error() {
  printf '%s
' "$1" | grep -qiE 'connection (closed|reset|timed out)|could not read from remote repository|network|timeout|temporarily unavailable|early EOF|RPC failed|TLS|SSL|HTTP 5[0-9][0-9]|remote end hung up|operation timed out'
}
fetch_out=''
fetch_rc=1
for attempt in 1 2 3 4; do
  set +e
  fetch_out="$(git fetch origin 2>&1)"
  fetch_rc=$?
  set -e
  if [ "$fetch_rc" -eq 0 ]; then break; fi
  if ! is_transient_fetch_error "$fetch_out"; then break; fi
  if [ "$attempt" -lt 4 ]; then sleep $((attempt * 10)); fi
done
if [ "$fetch_rc" -ne 0 ]; then emit_prepare_blocker git_fetch_failed "$fetch_out"; exit 0; fi
if ! git show-ref --verify --quiet "refs/remotes/origin/$tmp_branch"; then emit_prepare_blocker missing_tmp_branch "origin/$tmp_branch not found"; exit 0; fi
if ! git show-ref --verify --quiet "refs/remotes/origin/$merge_branch"; then emit_prepare_blocker missing_merge_branch "origin/$merge_branch not found"; exit 0; fi
current="$(git branch --show-current 2>/dev/null || true)"
set +e
if [ "$current" = "$tmp_branch" ]; then
  prep_out="$(git reset --hard "origin/$tmp_branch" 2>&1)"
  prep_rc=$?
else
  prep_out="$(git checkout -B "$tmp_branch" "origin/$tmp_branch" 2>&1)"
  prep_rc=$?
fi
set -e
if [ "$prep_rc" -ne 0 ]; then emit_prepare_blocker git_checkout_or_reset_failed "$prep_out"; exit 0; fi
set +e
merge_out="$(git merge --no-ff "origin/$merge_branch" -m auto_manual_merge 2>&1)"
merge_rc=$?
set -e
conflicted_files="$(git diff --name-only --diff-filter=U | jq -R -s -c 'split("
") | map(select(length>0))')"
touched_files="$(git diff --name-only HEAD | jq -R -s -c 'split("
") | map(select(length>0))')"
if [ "$merge_rc" -eq 0 ]; then
  jq -cn --arg repo_root "$repo_root" --arg tmp_branch "$tmp_branch" --arg merge_branch "$merge_branch" --arg merge_out "$merge_out" --arg head "$(git rev-parse HEAD)" '{attempted:true,merge_complete:true,ready_for_agent:false,repo_root:$repo_root,tmp_branch:$tmp_branch,merge_branch:$merge_branch,conflicted_files:[],touched_files:[],stdout:$merge_out,stderr:"",head:$head}'
  exit 0
fi
if [ "$conflicted_files" = "[]" ]; then
  jq -cn --arg repo_root "$repo_root" --arg tmp_branch "$tmp_branch" --arg merge_branch "$merge_branch" --arg merge_out "$merge_out" '{attempted:true,merge_complete:false,ready_for_agent:false,repo_root:$repo_root,tmp_branch:$tmp_branch,merge_branch:$merge_branch,conflicted_files:[],touched_files:[],stdout:"",stderr:$merge_out,blocker_type:"merge_failed_without_conflicts"}'
  exit 0
fi
jq -cn --arg repo_root "$repo_root" --arg tmp_branch "$tmp_branch" --arg merge_branch "$merge_branch" --arg merge_out "$merge_out" --argjson conflicted_files "$conflicted_files" --argjson touched_files "$touched_files" '{attempted:true,merge_complete:false,ready_for_agent:true,repo_root:$repo_root,tmp_branch:$tmp_branch,merge_branch:$merge_branch,conflicted_files:$conflicted_files,touched_files:$touched_files,stdout:$merge_out,stderr:""}'

''']
format = "json"
timeout = "5m"

[steps.loop.body.script.env]
TT_CHECK_ACTION = "{{check-multi-branch-job.stdout.action}}"
TT_MERGE_BRANCH_FROM_RUN = "{{check-multi-branch-job.stdout.merge_branch}}"
TT_MERGE_BRANCH_OVERRIDE = "{{merge_branch}}"
TT_TMP_BRANCH_FROM_RUN = "{{check-multi-branch-job.stdout.tmp_branch}}"
TT_TMP_BRANCH_OVERRIDE = "{{tmp_branch}}"

[steps.loop.body.validate]
format = "json"
required = ["stdout"]

[[steps.loop.body]]
id = "resolve-conflict-rounds"
title = "并发解决 merge 冲突文件"
depends_on = ["prepare-conflict-merge"]
condition = "prepare-conflict-merge.stdout.ready_for_agent == true"
execution = "loop"

[steps.loop.body.loop]
until = "check-remaining-conflicts.stdout.done == true"
max = 5

[[steps.loop.body.loop.body]]
id = "list-conflict-files"
title = "列出本轮剩余冲突文件"
execution = "script"

[steps.loop.body.loop.body.script]
command = ["bash", "-lc", '''
set -euo pipefail
repo_root="$(git rev-parse --show-toplevel 2>/dev/null || pwd)"
cd "$repo_root"
tmp_branch="${TT_TMP_BRANCH:-}"
merge_branch="${TT_MERGE_BRANCH:-}"
files="$(git diff --name-only --diff-filter=U | jq -R -s -c 'split("
") | map(select(length>0))')"
items="$(jq -cn --argjson files "$files" --arg tmp_branch "$tmp_branch" --arg merge_branch "$merge_branch" '$files | map({path:.,tmp_branch:$tmp_branch,merge_branch:$merge_branch})')"
jq -cn --arg tmp_branch "$tmp_branch" --arg merge_branch "$merge_branch" --argjson files "$files" --argjson items "$items" '{done:(($files|length)==0),count:($files|length),files:$files,items:$items,tmp_branch:$tmp_branch,merge_branch:$merge_branch}'

''']
format = "json"
timeout = "30s"

[steps.loop.body.loop.body.script.env]
TT_MERGE_BRANCH = "{{prepare-conflict-merge.stdout.merge_branch}}"
TT_TMP_BRANCH = "{{prepare-conflict-merge.stdout.tmp_branch}}"

[steps.loop.body.loop.body.validate]
format = "json"
required = ["stdout"]

[[steps.loop.body.loop.body]]
id = "resolve-conflict-file"
title = "并发解决本轮冲突文件"
depends_on = ["list-conflict-files"]
condition = "list-conflict-files.stdout.done != true"
execution = "loop"

[steps.loop.body.loop.body.loop]
for_each = "list-conflict-files.stdout.items"
var = "conflict_file"
max_concurrency = 1

[[steps.loop.body.loop.body.loop.body]]
id = "fix-conflict-file"
title = "解决冲突文件 {{conflict_file.path}}"
input_context = ["prepare-conflict-merge.stdout", "list-conflict-files.stdout"]
description = """
Resolve exactly this merge-conflicted file in the current working tree: {{conflict_file.path}}

The deterministic workflow has already checked out the tmp branch and run the merge. Use the input context for:
- tmp branch and merge branch from `prepare-conflict-merge.stdout`
- the current conflict file manifest from `list-conflict-files.stdout`

Hard constraints:
- Only edit `{{conflict_file.path}}` unless an adjacent type/config update is strictly required to make that file valid.
- Do not run git checkout, git switch, git merge, git rebase, git reset, git push, gh, or workflow rerun commands.
- Do not create commits.
- Preserve compatible behavior from both sides of the conflict.
- If the conflict cannot be resolved safely, return JSON with `resolved:false` and a clear blocker.

Required workflow:
1. Inspect `{{conflict_file.path}}` and its conflict markers.
2. Determine the intent of both sides using local code context as needed.
3. Edit the file to remove conflict markers.
4. Verify no conflict markers remain in the file.
5. Stage only the resolved file with `git add {{conflict_file.path}}`.

Output ONLY compact JSON:
{
  "attempted": true,
  "resolved": true,
  "conflicted_files": ["{{conflict_file.path}}"],
  "touched_files": ["{{conflict_file.path}}"],
  "extra_touched_files": [],
  "resolution_summary": "",
  "validations_run": [],
  "blocker_type": "none|semantic_uncertainty|missing_context|validation_failed|unknown",
  "blocker_summary": ""
}
"""
agent.name = "coder"

[steps.loop.body.loop.body.loop.body.validate]
format = "json"
required = ["attempted", "resolved", "conflicted_files", "touched_files", "blocker_type", "blocker_summary"]


[[steps.loop.body.loop.body]]
id = "check-remaining-conflicts"
title = "复查剩余冲突"
depends_on = ["list-conflict-files", "resolve-conflict-file"]
execution = "script"

[steps.loop.body.loop.body.script]
command = ["bash", "-lc", '''
set -euo pipefail
repo_root="$(git rev-parse --show-toplevel 2>/dev/null || pwd)"
cd "$repo_root"
tmp_branch="${TT_TMP_BRANCH:-}"
merge_branch="${TT_MERGE_BRANCH:-}"
previous="${TT_PREVIOUS_FILES:-[] }"
unmerged="$(git diff --name-only --diff-filter=U | jq -R -s -c 'split("
") | map(select(length>0))')"
marker_files="$(git diff --name-only HEAD | while IFS= read -r file; do [ -f "$file" ] && git grep -n -E '^(<<<<<<<|=======|>>>>>>>)' -- "$file" 2>/dev/null | cut -d: -f1 || true; done | sort -u | jq -R -s -c 'split("
") | map(select(length>0))')"
remaining="$(jq -cn --argjson a "$unmerged" --argjson b "$marker_files" '($a+$b)|unique')"
prev_count="$(jq -r 'length' <<<"$previous" 2>/dev/null || echo 0)"
remaining_count="$(jq -r 'length' <<<"$remaining")"
resolved_count=$(( prev_count - remaining_count ))
if [ "$resolved_count" -lt 0 ]; then resolved_count=0; fi
jq -cn --arg tmp_branch "$tmp_branch" --arg merge_branch "$merge_branch" --argjson previous_files "$previous" --argjson remaining_conflicts "$remaining" --argjson unmerged "$unmerged" --argjson marker_files "$marker_files" --argjson resolved_count "$resolved_count" '{done:(($remaining_conflicts|length)==0),tmp_branch:$tmp_branch,merge_branch:$merge_branch,previous_files:$previous_files,remaining_conflicts:$remaining_conflicts,unmerged_files:$unmerged,marker_files:$marker_files,resolved_count:$resolved_count,validations_run:["git diff --name-only --diff-filter=U","git grep conflict markers"]}'

''']
format = "json"
timeout = "60s"

[steps.loop.body.loop.body.script.env]
TT_MERGE_BRANCH = "{{prepare-conflict-merge.stdout.merge_branch}}"
TT_PREVIOUS_FILES = "{{list-conflict-files.stdout.files}}"
TT_TMP_BRANCH = "{{prepare-conflict-merge.stdout.tmp_branch}}"

[steps.loop.body.loop.body.validate]
format = "json"
required = ["stdout"]


[[steps.loop.body]]
id = "continue-merge"
title = "完成 merge commit"
depends_on = ["prepare-conflict-merge", "resolve-conflict-rounds"]
execution = "script"

[steps.loop.body.script]
command = ["bash", "-lc", '''
set -euo pipefail
repo_root="$(git rev-parse --show-toplevel 2>/dev/null || pwd)"
cd "$repo_root"
prep="${TT_PREPARE:-}"
resolver="${TT_RESOLVER:-}"
prep_json="$(jq -cn --arg s "$prep" 'if ($s|length)==0 then {} else (($s|fromjson?)//{}) end | if type=="object" and (.stdout|type=="object") then .stdout elif type=="object" and (.stdout|type=="string") then ((.stdout|fromjson?)//.) else . end')"
resolver_json="$(jq -cn --arg s "$resolver" 'if ($s|length)==0 then {} else (($s|fromjson?)//{}) end | if type=="object" and (.stdout|type=="object") then .stdout elif type=="object" and (.stdout|type=="string") then ((.stdout|fromjson?)//.) else . end')"
tmp_branch="$(jq -r '.tmp_branch // ""' <<<"$prep_json")"
merge_branch="$(jq -r '.merge_branch // ""' <<<"$prep_json")"
prep_attempted="$(jq -r '.attempted == true' <<<"$prep_json")"
merge_complete="$(jq -r '.merge_complete == true' <<<"$prep_json")"
prep_blocker="$(jq -r '.blocker_type // ""' <<<"$prep_json")"
resolver_ok="$(jq -r '(.done == true) or (.resolved == true)' <<<"$resolver_json")"
if [ "$prep_attempted" != "true" ]; then
  jq -cn '{attempted:false,resolved:false,tmp_branch:"",merge_branch:"",local_commit:"",blocker_type:"none",blocker_summary:"no repair needed in this iteration",validations_run:[]}'
  exit 0
fi
if [ "$merge_complete" != "true" ] && [ -n "$prep_blocker" ]; then
  blocker="$(jq -r '.stderr // .blocker_summary // "prepare merge failed"' <<<"$prep_json")"
  jq -cn --arg tmp_branch "$tmp_branch" --arg merge_branch "$merge_branch" --arg blocker_type "$prep_blocker" --arg blocker "$blocker" '{attempted:true,resolved:false,tmp_branch:$tmp_branch,merge_branch:$merge_branch,local_commit:"",blocker_type:$blocker_type,blocker_summary:$blocker,validations_run:[]}'
  exit 0
fi
resolver_blocker=""
if [ "$merge_complete" != "true" ] && [ "$resolver_ok" != "true" ]; then
  resolver_blocker="$(jq -r '.blocker_summary // "resolver did not report success"' <<<"$resolver_json")"
fi
unmerged="$(git diff --name-only --diff-filter=U | jq -R -s -c 'split("
") | map(select(length>0))')"
if [ "$unmerged" != "[]" ]; then
  summary="unmerged files remain after parallel conflict resolver rounds"
  if [ -n "$resolver_blocker" ] && [ "$resolver_blocker" != "null" ]; then summary="$summary; resolver reported: $resolver_blocker"; fi
  jq -cn --arg tmp_branch "$tmp_branch" --arg merge_branch "$merge_branch" --arg summary "$summary" --argjson unmerged "$unmerged" '{attempted:true,resolved:false,tmp_branch:$tmp_branch,merge_branch:$merge_branch,local_commit:"",blocker_type:"unmerged_files",blocker_summary:$summary,remaining_conflicts:$unmerged,validations_run:["git diff --name-only --diff-filter=U"]}'
  exit 0
fi
marker_files="$(git diff --name-only HEAD | while IFS= read -r file; do [ -f "$file" ] && git grep -n -E '^(<<<<<<<|=======|>>>>>>>)' -- "$file" 2>/dev/null | cut -d: -f1 || true; done | sort -u | jq -R -s -c 'split("
") | map(select(length>0))')"
if [ "$marker_files" != "[]" ]; then
  jq -cn --arg tmp_branch "$tmp_branch" --arg merge_branch "$merge_branch" --argjson marker_files "$marker_files" '{attempted:true,resolved:false,tmp_branch:$tmp_branch,merge_branch:$merge_branch,local_commit:"",blocker_type:"conflict_markers",blocker_summary:"conflict markers remain",remaining_conflicts:$marker_files,validations_run:["git grep conflict markers"]}'
  exit 0
fi
git add -u
merge_head_path="$(git rev-parse --git-path MERGE_HEAD)"
if [ -e "$merge_head_path" ]; then
  set +e
  HUSKY=0 GIT_EDITOR=true GIT_MERGE_AUTOEDIT=no git -c core.hooksPath=/dev/null merge --continue >/tmp/tt-flow360-merge-continue.log 2>&1
  rc=$?
  if [ "$rc" -ne 0 ]; then
    HUSKY=0 GIT_EDITOR=true GIT_MERGE_AUTOEDIT=no git -c core.hooksPath=/dev/null commit --no-edit >>/tmp/tt-flow360-merge-continue.log 2>&1
    rc=$?
  fi
  set -e
  if [ "$rc" -ne 0 ]; then
    out="$(cat /tmp/tt-flow360-merge-continue.log 2>/dev/null || true)"
    jq -cn --arg tmp_branch "$tmp_branch" --arg merge_branch "$merge_branch" --arg out "$out" '{attempted:true,resolved:false,tmp_branch:$tmp_branch,merge_branch:$merge_branch,local_commit:"",blocker_type:"merge_continue_failed",blocker_summary:$out,validations_run:["git merge --continue"]}'
    exit 0
  fi
fi
jq -cn --arg tmp_branch "$tmp_branch" --arg merge_branch "$merge_branch" --arg head "$(git rev-parse HEAD)" '{attempted:true,resolved:true,tmp_branch:$tmp_branch,merge_branch:$merge_branch,local_commit:$head,blocker_type:"none",blocker_summary:"",validations_run:["git diff --name-only --diff-filter=U","git grep conflict markers","git merge --continue"]}'

''']
format = "json"
timeout = "5m"

[steps.loop.body.script.env]
TT_PREPARE = "{{prepare-conflict-merge.stdout}}"
TT_RESOLVER = "{{resolve-conflict-rounds.stdout}}"

[steps.loop.body.validate]
format = "json"
required = ["stdout"]

[[steps.loop.body]]
id = "push-and-rerun"
title = "push tmp branch 并重试 rerun failed job"
depends_on = ["continue-merge"]
execution = "script"

[steps.loop.body.script]
command = ["bash", "-lc", '''
set -u
repo='flexcompute/flex'
rid="${TT_ORIGINAL_RUN_ID:-}"
continue_resolved="${TT_CONTINUE_RESOLVED:-false}"
tmp_branch="${TT_TMP_BRANCH:-}"
remote_ref="refs/heads/${tmp_branch}"
head_sha="$(git rev-parse HEAD 2>/dev/null || true)"
if [ "$continue_resolved" != "true" ]; then
  jq -cn --arg head "$head_sha" --arg original_run_id "$rid" '{tmp_branch:"",head:$head,original_run_id:$original_run_id,pushed:false,rerun_requested:false,rerun_retryable:false,rerun_attempts:0,remote_sha:"",push_method:"no_repair_commit",push_stdout:"",push_stderr:"",rerun_stdout:"",rerun_stderr:""}'
  exit 0
fi
is_unrecoverable_rerun_error() {
  printf '%s
' "$1" | grep -qiE '(^|[^0-9])(404|not[ -]?found|no run found|does not exist|not accessible|bad credentials|requires authentication|resource not accessible)([^0-9]|$)'
}
if [ -z "$tmp_branch" ] || [ "$tmp_branch" = "-" ]; then
  jq -cn --arg head "$head_sha" --arg original_run_id "$rid" '{tmp_branch:"",head:$head,original_run_id:$original_run_id,pushed:false,rerun_requested:false,rerun_retryable:false,rerun_attempts:0,remote_sha:"",push_method:"missing_tmp_branch",push_stdout:"",push_stderr:"missing tmp_branch",rerun_stdout:"",rerun_stderr:""}'
  exit 0
fi
remote_sha="$(git ls-remote --heads origin "$tmp_branch" 2>/dev/null | awk 'NR==1{print $1}')"
if [ -n "$remote_sha" ]; then
  push_method="force-with-lease"
else
  push_method="create-missing-remote-branch"
fi
is_transient_push_error() {
  printf '%s
' "$1" | grep -qiE 'connection (closed|reset|timed out)|could not read from remote repository|network|timeout|temporarily unavailable|early EOF|RPC failed|TLS|SSL|HTTP 5[0-9][0-9]'
}
remote_contains_head=false
push_out=''
push_rc=1
push_attempts=0
for attempt in 1 2 3; do
  push_attempts=$attempt
  remote_sha="$(git ls-remote --heads origin "$tmp_branch" 2>/dev/null | awk 'NR==1{print $1}')"
  if [ -n "$remote_sha" ]; then
    push_method="force-with-lease"
    push_out="$(HUSKY=0 git push --no-verify --force-with-lease="${remote_ref}:${remote_sha}" origin "HEAD:${tmp_branch}" 2>&1)"
    push_rc=$?
  else
    push_method="create-missing-remote-branch"
    push_out="$(HUSKY=0 git push --no-verify origin "HEAD:${tmp_branch}" 2>&1)"
    push_rc=$?
  fi
  if [ "$push_rc" -eq 0 ]; then
    break
  fi
  # A network disconnect can happen after the remote accepted objects. Verify before blocking.
  verify_sha="$(git ls-remote --heads origin "$tmp_branch" 2>/dev/null | awk 'NR==1{print $1}')"
  if [ -n "$verify_sha" ] && git merge-base --is-ancestor "$head_sha" "$verify_sha" 2>/dev/null; then
    remote_contains_head=true
    remote_sha="$verify_sha"
    push_out="$push_out
remote already contains HEAD after failed push; treating push as successful"
    push_rc=0
    break
  fi
  if ! is_transient_push_error "$push_out"; then
    break
  fi
  if [ "$attempt" -lt 3 ]; then
    sleep $((attempt * 10))
  fi
done
rerun_out=''
rerun_rc=1
rerun_attempts=0
rerun_retryable=false
if [ "$push_rc" -eq 0 ]; then
  for attempt in 1 2 3; do
    rerun_attempts=$attempt
    rerun_out="$(gh run rerun "$rid" -R "$repo" --failed 2>&1)"
    rerun_rc=$?
    if [ "$rerun_rc" -eq 0 ]; then
      break
    fi
    if is_unrecoverable_rerun_error "$rerun_out"; then
      break
    fi
    if [ "$attempt" -lt 3 ]; then
      sleep 10
    fi
  done
  if [ "$rerun_rc" -ne 0 ] && ! is_unrecoverable_rerun_error "$rerun_out"; then
    rerun_retryable=true
  fi
fi
jq -cn   --arg tmp_branch "$tmp_branch"   --arg head "$head_sha"   --arg remote_sha "$remote_sha"   --arg push_method "$push_method"   --arg push_out "$push_out"   --arg rerun_out "$rerun_out"   --arg original_run_id "$rid"   --argjson pushed "$([ "$push_rc" -eq 0 ] && echo true || echo false)"   --argjson rerun_requested "$([ "$rerun_rc" -eq 0 ] && echo true || echo false)"   --argjson rerun_retryable "$rerun_retryable"   --argjson rerun_attempts "$rerun_attempts" --argjson push_attempts "$push_attempts" --argjson remote_contains_head "$remote_contains_head"   '{tmp_branch:$tmp_branch,head:$head,original_run_id:$original_run_id,pushed:$pushed,rerun_requested:$rerun_requested,rerun_retryable:$rerun_retryable,rerun_attempts:$rerun_attempts,push_attempts:$push_attempts,remote_contains_head:$remote_contains_head,remote_sha:$remote_sha,push_method:$push_method,push_stdout:(if $pushed then $push_out else "" end),push_stderr:(if $pushed then "" else $push_out end),rerun_stdout:(if $rerun_requested then $rerun_out else "" end),rerun_stderr:(if $rerun_requested then "" else $rerun_out end)}'


''']
format = "json"
timeout = "300s"

[steps.loop.body.script.env]
TT_CONTINUE_RESOLVED = "{{continue-merge.stdout.resolved}}"
TT_ORIGINAL_RUN_ID = "{{dispatch-run.stdout.original_run_id}}"
TT_TMP_BRANCH = "{{continue-merge.stdout.tmp_branch}}"

[steps.loop.body.validate]
format = "json"
required = ["stdout"]

[[steps.loop.body]]
id = "wait-next-poll"
title = "等待下一轮（workflow 仍运行）"
depends_on = ["check-multi-branch-job"]
condition = "check-multi-branch-job.stdout.action == wait"
execution = "script"

[steps.loop.body.script]
command = ["bash", "-lc", "s=${1:-30}\nsleep \"$s\"\njq -cn --argjson wait_seconds \"$s\" '{wait_seconds:$wait_seconds}'\n", "--", "{{poll_interval_seconds}}"]
format = "json"
timeout = "300s"

[steps.loop.body.validate]
format = "json"
required = ["stdout"]

[[steps.loop.body]]
id = "wait-after-rerun"
title = "rerun 后等待下一轮"
depends_on = ["push-and-rerun"]
condition = "push-and-rerun.stdout.rerun_requested == true"
execution = "script"

[steps.loop.body.script]
command = ["bash", "-lc", "s=${1:-30}\nsleep \"$s\"\njq -cn --argjson wait_seconds \"$s\" '{wait_seconds:$wait_seconds,reason:\"rerun_requested\"}'\n", "--", "{{poll_interval_seconds}}"]
format = "json"
timeout = "300s"

[steps.loop.body.validate]
format = "json"
required = ["stdout"]

[[steps.loop.body]]
id = "release-progress"
title = "更新发布进度"
depends_on = ["check-multi-branch-job", "continue-merge", "push-and-rerun", "wait-next-poll", "wait-after-rerun"]
execution = "script"

[steps.loop.body.script]
command = ["bash", "-lc", '''
set -euo pipefail
state_dir=".tt/flow360-release-state"
mkdir -p "$state_dir"
rid="${TT_ORIGINAL_RUN_ID:-unknown}"
state_file="$state_dir/${rid}-repair-history.json"
if [ ! -f "$state_file" ]; then printf '[]
' > "$state_file"; fi
history="$(cat "$state_file" 2>/dev/null || printf '[]')"
result="$(jq -cn --arg check "${TT_CHECK:-}" --arg cont "${TT_CONTINUE:-}" --arg push "${TT_PUSH:-}" --argjson history "$history" '
  def obj($s): if ($s|length)==0 then {} else (($s|fromjson?)//{}) end | if type=="object" and (.stdout|type=="object") then .stdout elif type=="object" and (.stdout|type=="string") then ((.stdout|fromjson?)//.) else . end;
  def history_fields($history):
    ($history | if type=="array" then . else [] end) as $repairs |
    {conflict_repaired:(($repairs|length)>0), conflict_repairs:$repairs, last_repair:($repairs[-1] // {})};
  obj($check) as $check |
  obj($cont) as $cont |
  obj($push) as $push |
  if $check.final_state == "succeeded" then
    ({done:true,final_state:"succeeded",summary:($check.reason // "multi-branch job succeeded"),run_url:($check.run_url // ""),jobs:($check.jobs // []),tmp_branch:(($history[-1].tmp_branch // "")),merge_branch:(($history[-1].merge_branch // "")),local_commit:(($history[-1].local_commit // "")),pushed:(($history[-1].pushed // false) == true),rerun_requested:(($history[-1].rerun_requested // false) == true),blocker_type:"none",blocker_summary:""} + history_fields($history))
  elif $check.action == "wait" then
    ({done:false,final_state:"running",summary:($check.reason // "waiting"),run_url:($check.run_url // ""),jobs:($check.jobs // []),tmp_branch:(($history[-1].tmp_branch // "")),merge_branch:(($history[-1].merge_branch // "")),local_commit:(($history[-1].local_commit // "")),pushed:(($history[-1].pushed // false) == true),rerun_requested:(($history[-1].rerun_requested // false) == true),blocker_type:"none",blocker_summary:""} + history_fields($history))
  elif $check.action == "repair_conflict" then
    if ($cont.resolved != true) then
      ({done:true,final_state:"blocked",summary:"merge conflict repair failed",run_url:($check.run_url // ""),jobs:($check.jobs // []),tmp_branch:($cont.tmp_branch // ""),merge_branch:($cont.merge_branch // ""),local_commit:"",pushed:false,rerun_requested:false,blocker_type:($cont.blocker_type // "repair_failed"),blocker_summary:($cont.blocker_summary // "")} + history_fields($history))
    elif ($push.pushed == true and $push.rerun_requested == true) then
      ({done:false,final_state:"running",summary:"conflict repaired, pushed, rerun failed jobs requested; continue polling",run_url:($check.run_url // ""),jobs:($check.jobs // []),tmp_branch:($push.tmp_branch // $cont.tmp_branch // ""),merge_branch:($cont.merge_branch // ""),local_commit:($cont.local_commit // $push.head // ""),pushed:true,rerun_requested:true,blocker_type:"none",blocker_summary:""} + history_fields($history))
    elif ($push.pushed == true and $push.rerun_requested != true and $push.rerun_retryable == true) then
      ({done:false,final_state:"running",summary:"rerun failed with transient GitHub API error after retries; continue polling and retry",run_url:($check.run_url // ""),jobs:($check.jobs // []),tmp_branch:($push.tmp_branch // $cont.tmp_branch // ""),merge_branch:($cont.merge_branch // ""),local_commit:($cont.local_commit // $push.head // ""),pushed:true,rerun_requested:false,blocker_type:"none",blocker_summary:""} + history_fields($history))
    else
      ({done:true,final_state:"blocked",summary:"push or rerun failed",run_url:($check.run_url // ""),jobs:($check.jobs // []),tmp_branch:($push.tmp_branch // $cont.tmp_branch // ""),merge_branch:($cont.merge_branch // ""),local_commit:($cont.local_commit // $push.head // ""),pushed:($push.pushed == true),rerun_requested:($push.rerun_requested == true),blocker_type:(if ($push.pushed == true) then "rerun_failed" else "push_failed" end),blocker_summary:(if ($push.pushed == true) then ($push.rerun_stderr // "") else ($push.push_stderr // "") end)} + history_fields($history))
    end
  else
    ({done:true,final_state:"blocked",summary:($check.reason // "blocked"),run_url:($check.run_url // ""),jobs:($check.jobs // []),tmp_branch:"",merge_branch:"",local_commit:"",pushed:false,rerun_requested:false,blocker_type:"job_failed",blocker_summary:($check.reason // "")} + history_fields($history))
  end')"
# Persist successful repair attempts so a later succeeded poll cannot erase them.
new_history="$(jq -cn --argjson history "$history" --argjson result "$result" '
  ($history | if type=="array" then . else [] end) as $h |
  if ($result.summary == "conflict repaired, pushed, rerun failed jobs requested; continue polling" or $result.summary == "rerun failed with transient GitHub API error after retries; continue polling and retry") then
    ($h + [{tmp_branch:$result.tmp_branch,merge_branch:$result.merge_branch,local_commit:$result.local_commit,pushed:$result.pushed,rerun_requested:$result.rerun_requested,summary:$result.summary}] | unique_by(.tmp_branch,.merge_branch,.local_commit))
  else $h end')"
printf '%s
' "$new_history" > "$state_file"
jq -cn --argjson result "$result" --argjson history "$new_history" '$result + {conflict_repaired:(($history|length)>0), conflict_repairs:$history, last_repair:($history[-1] // {})}'

''']
format = "json"
timeout = "30s"

[steps.loop.body.script.env]
TT_CHECK = "{{check-multi-branch-job.stdout}}"
TT_CONTINUE = "{{continue-merge.stdout}}"
TT_ORIGINAL_RUN_ID = "{{dispatch-run.stdout.original_run_id}}"
TT_PUSH = "{{push-and-rerun.stdout}}"

[steps.loop.body.validate]
format = "json"
required = ["stdout"]


[[steps]]
id = "delete-blocked-run"
title = "blocked 时删除本次 GitHub Actions run"
depends_on = ["monitor-and-rerun"]
condition = "release-progress.stdout.final_state == blocked"
execution = "script"

[steps.script]
command = ["bash", "-lc", '''
set -u
repo='flexcompute/flex'
rid="${TT_ORIGINAL_RUN_ID:-}"
run_url="${TT_RUN_URL:-}"
enabled="${TT_DELETE_BLOCKED_RUN:-true}"
if [ "$enabled" != "true" ]; then
  jq -cn --arg repo "$repo" --arg original_run_id "$rid" --arg run_url "$run_url" '{attempted:false,deleted:false,repo:$repo,original_run_id:$original_run_id,run_url:$run_url,reason:"delete_blocked_run disabled"}'
  exit 0
fi
if [ -z "$rid" ]; then
  jq -cn --arg repo "$repo" --arg run_url "$run_url" '{attempted:false,deleted:false,repo:$repo,original_run_id:"",run_url:$run_url,reason:"missing original_run_id"}'
  exit 0
fi
set +e
delete_out="$(gh api -X DELETE "repos/${repo}/actions/runs/${rid}" 2>&1)"
delete_rc=$?
set -u
jq -cn --arg repo "$repo" --arg original_run_id "$rid" --arg run_url "$run_url" --arg output "$delete_out" --argjson deleted "$([ "$delete_rc" -eq 0 ] && echo true || echo false)" '{attempted:true,deleted:$deleted,repo:$repo,original_run_id:$original_run_id,run_url:$run_url,stdout:(if $deleted then $output else "" end),stderr:(if $deleted then "" else $output end),reason:(if $deleted then "deleted blocked GitHub Actions run" else "delete blocked GitHub Actions run failed" end)}'

''']
format = "json"
timeout = "60s"

[steps.script.env]
TT_DELETE_BLOCKED_RUN = "{{delete_blocked_run}}"
TT_ORIGINAL_RUN_ID = "{{dispatch-run.stdout.original_run_id}}"
TT_RUN_URL = "{{dispatch-run.stdout.run_url}}"

[steps.validate]
format = "json"
required = ["stdout"]

[[steps]]
id = "final-report"
title = "最终收口报告"
depends_on = ["monitor-and-rerun", "delete-blocked-run"]
agent.name = "reporter"
input_context = ["dispatch-run.stdout.repo", "dispatch-run.stdout.workflow_path", "dispatch-run.stdout.original_run_id", "dispatch-run.stdout.run_url", "dispatch-run.stdout.dispatch_error", "release-progress.stdout.final_state", "release-progress.stdout.summary", "release-progress.stdout.run_url", "release-progress.stdout.jobs", "release-progress.stdout.conflict_repaired", "release-progress.stdout.conflict_repairs", "release-progress.stdout.last_repair", "release-progress.stdout.tmp_branch", "release-progress.stdout.merge_branch", "release-progress.stdout.local_commit", "release-progress.stdout.pushed", "release-progress.stdout.rerun_requested", "release-progress.stdout.blocker_type", "release-progress.stdout.blocker_summary", "delete-blocked-run.stdout"]
description = '''
这是整个 flow360-release formula 运行的最后收口步骤。输出中文最终报告，结论先行，简明说明：
- 本次 formula 是否 succeeded / running / blocked，以及核心原因
- repo/workflow/run id/run url
- 目标 multi-branch job 最终状态
- 如果修复过冲突，必须依据 release-progress.stdout.conflict_repaired / conflict_repairs / last_repair 判断，不要只看最后一轮 tmp_branch 是否为空；说明 tmp_branch、merge_branch、local_commit、push、rerun failed jobs 结果
- 如果 blocked，说明是否已删除本次 GitHub Actions run
- 如果 blocked，明确 blocker_type/blocker_summary 和下一步
不要输出长日志，不要编造 input_context 中没有的信息。

'''
