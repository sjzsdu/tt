formula = "fresh-topic-docs"
title = "新鲜事物系列文档"
description = "根据用户输入的新鲜事物、概念、趋势或话题，用动态表单按需澄清范围，再生成文章计划数组，并用 foreach loop 并发撰写每篇 Markdown 文档，最后汇总写入 .tt/docs。"
version = 9
type = "workflow"
category = "learning"
tags = ["学习", "调研", "新鲜事物", "系列文档", "知识整理", "foreach", "dynamic-form"]

[vars]
topic = { description = "想了解的新鲜事物、概念、趋势、产品、人物、技术或现象", required = true }

[[steps]]
id = "scope-analysis"
title = "分析话题并动态澄清范围"
form = true
description = """
深入分析话题「{{topic}}」的本质，并形成后续系列文章的写作范围配置。

你的目标不是套固定模板，而是根据话题本身判断：
- 它属于什么领域：技术、商业、历史、社会、文化、科学、政治、艺术、经济等，可能多领域交叉。
- 用户意图是否已经足够明确。
- 是否需要进一步澄清关注方向、读者背景、文章深度、交付风格或边界。

动态澄清原则：
1. 对于大多数宽泛话题，应该动态澄清。除非话题非常简单、具体、边界清晰，否则不要自作主张。
2. 需要问什么由话题决定，不要使用固定字段模板。
3. 问题数量由复杂度决定，通常 1-4 个，最多 5 个。
4. 只问会影响系列文章结构、深度或侧重点的问题。
5. 如果不需要澄清，直接完成输出。

输出要求：
- 如果需要用户补充信息，按运行时注入的 dynamic human input 协议发起表单。
- 如果信息已经足够，或用户已完成澄清，输出 ONLY compact JSON，不要 Markdown，不要代码块。
- JSON 格式：
{"topic":"{{topic}}","topic_type":"...","focus":"...","audience":"...","depth":"入门|进阶|深入","deliverable_preferences":["..."],"scope_notes":"...","plan_brief":"...","assumptions":["..."]}
"""

[steps.agent]
name = "planner"

[steps.validate]
format = "json"
required = ["topic", "topic_type", "focus", "audience", "depth", "plan_brief"]

[[steps]]
id = "article-plan"
title = "规划系列文章清单"
depends_on = ["scope-analysis"]
input_context = ["scope-analysis"]
description = """
根据 topic 和 scope-analysis 的完整范围配置，为「{{topic}}」规划一组系列文章。

你的输出会被后续 foreach loop 直接消费，因此必须输出 ONLY compact JSON array，不要 Markdown，不要代码块。

数组中每个对象代表一篇文章，格式如下：
{"filename":"01-xxx.md","title":"文章标题","angle":"写作角度","audience":"目标读者","depth":"入门/进阶/深入","must_cover":["要点1","要点2"],"mermaid_hint":"适合使用的 Mermaid 图类型","table_hint":"适合使用的表格类型"}

要求：
- 文章数量通常 3-6 篇，复杂话题可更多，简单话题可更少。
- filename 必须安全、简洁、以 .md 结尾，建议带两位数字前缀。
- 每篇文章边界清晰，避免大量重复。
- 覆盖理解、背景、机制/方法、应用、风险/争议、未来趋势等合适维度。
- 严格使用 scope-analysis 中的 focus、audience、depth 和边界。
- 不要编造具体数据或新闻；需要核实时可在 must_cover 中标注。
"""

[steps.agent]
name = "planner"

[steps.validate]
format = "json"

[[steps]]
id = "write-articles"
title = "并发撰写每篇系列文章"
depends_on = ["article-plan"]

  [steps.loop]
  for_each = "article-plan"
  var = "article"
  parallel = true
  max_concurrency = 4

  [[steps.loop.body]]
  id = "draft"
  title = "撰写 {{article.title}}"
  input_context = ["scope-analysis", "article"]
  description = """
根据当前 article 对象和 scope-analysis 的完整范围配置，撰写关于「{{topic}}」的一篇完整 Markdown 文章。

当前 article 对象可通过上下文 article 读取，常用字段包括：filename、title、angle、audience、depth、must_cover、mermaid_hint、table_hint。

输出要求：
- 输出 ONLY Markdown 正文，不要额外解释。
- 第一行使用 `# {{article.title}}`。
- 内容至少 500 字，必须有实质内容，不要只有提纲。
- 至少包含 1 个 Mermaid 图表，优先参考 article.mermaid_hint。
- 至少包含 1 个 Markdown 表格，优先参考 article.table_hint。
- 使用 blockquote、分隔线、列表、加粗、代码等方式增强可读性。
- 不要编造具体数据或新闻；不确定信息标注“需要进一步核实”。
"""

  [steps.loop.body.agent]
  name = "tech-blog-writer"

  [[steps.loop.body]]
  id = "package-entry"
  title = "整理 {{article.title}} 为文件条目"
  depends_on = ["draft"]
  input_context = ["article", "draft"]
  description = """
将当前文章整理为后续打包步骤可消费的 JSON 对象。

输出要求：
- 输出 ONLY compact JSON object。
- 格式：
{"filename":"...","title":"...","summary":"...","content":"完整 Markdown 内容"}
- filename 使用 article.filename。
- content 使用 draft 的完整 Markdown 内容，保留 Mermaid、表格和 Markdown 格式。
"""

  [steps.loop.body.agent]
  name = "planner"

  [steps.loop.body.validate]
  format = "json"
  required = ["filename", "title", "summary", "content"]

[[steps]]
id = "series-package"
title = "汇总为文档包并写入 .tt/docs/<topic-name>"
depends_on = ["write-articles"]
input_context = ["scope-analysis", "article-plan", "write-articles"]
description = """
把 foreach loop 生成的 write-articles 输出汇总为一系列 Markdown 文档，使用你的文件写入能力（write 工具）直接保存到 `.tt/docs/<topic-name>/` 主题子目录，避免不同主题的文档混在一起。

目录命名要求：
- 先为 topic 生成安全、可读、稳定的 `topic-name`。
- 中文话题可使用简短拼音或英文译名；英文话题使用小写 kebab-case。
- 只允许小写字母、数字、连字符 `-`，不要空格、斜杠、冒号或其它特殊字符。
- 如果 topic 很长，保留核心词，目录名控制在 40 个字符以内。
- 本次所有文件必须写入同一个 `.tt/docs/<topic-name>/` 目录，不要写到 `.tt/docs/` 根目录。

write-articles 是一个 JSON array，每个元素包含本次循环中 package-entry 的输出。你需要从中提取 filename、title、summary、content。

你的工作：
1. 创建 `.tt/docs/<topic-name>/` 目录（如果不存在）。
2. 撰写并写入 `.tt/docs/<topic-name>/README.md`，描述整个系列。
3. 将每篇文章的 content 写入 `.tt/docs/<topic-name>/<filename>`。
4. 撰写并写入 `.tt/docs/<topic-name>/附录-问题清单.md`。

README.md 应包含：
- 系列标题（基于 {{topic}}，参考 scope-analysis 和 article-plan）
- 适合谁读
- 阅读顺序建议（可用 Mermaid flowchart 展示）
- 每篇的简短摘要
- README 本身也建议用表格或 Mermaid 来组织内容

附录-问题清单.md：
- 列出 20 个后续可以继续追问的问题
- 覆盖不同层次：理解、应用、批判性思考
- 避免“是什么”类问题，侧重“为什么”和“如果”类问题
- 可以用表格组织（问题 | 类型 | 适合谁）

整体要求：
- 统一术语，删除重复内容。
- 明确标注不确定信息和需要进一步核实的地方。
- 最终结果要像一个完整的小型知识库。
- 最后输出 Markdown 汇总，明确写出主题目录 `.tt/docs/<topic-name>/`、已写入文件、阅读顺序和后续建议。
"""

[steps.agent]
name = "tech-blog-writer"
