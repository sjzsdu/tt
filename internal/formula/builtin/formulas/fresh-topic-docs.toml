formula = "fresh-topic-docs"
title = "新鲜事物系列文档"
description = "根据用户输入的新鲜事物、概念、趋势或话题，用动态表单按需澄清范围，再生成文章计划数组，并用 foreach loop 并发撰写每篇 Markdown 文档，最后汇总写入 docs。"
version = 12
type = "workflow"
category = "learning"
tags = ["学习", "调研", "新鲜事物", "系列文档", "知识整理", "foreach", "dynamic-form"]

[vars]
topic = { description = "想了解的新鲜事物、概念、趋势、产品、人物、技术或现象", required = true }

[[steps]]
id = "scope-analysis"
title = "分析话题并动态澄清范围"
form = true
description = """
深入分析话题「{{topic}}」的本质，并形成后续系列文章的写作范围配置。

你的目标不是套固定模板，而是根据话题本身判断：
- 它属于什么领域：技术、商业、历史、社会、文化、科学、政治、艺术、经济等，可能多领域交叉。
- 用户意图是否已经足够明确。
- 是否需要进一步澄清关注方向、读者背景、文章深度、交付风格或边界。

动态澄清原则：
1. 对于大多数宽泛话题，应该动态澄清。除非话题非常简单、具体、边界清晰，否则不要自作主张。
2. 需要问什么由话题决定，不要使用固定字段模板。
3. 问题数量由复杂度决定，通常 1-4 个，最多 5 个。
4. 只问会影响系列文章结构、深度或侧重点的问题。
5. 如果不需要澄清，直接完成输出。

输出要求：
- 如果需要用户补充信息，按运行时注入的 dynamic human input 协议发起表单。
- 如果信息已经足够，或用户已完成澄清，输出 ONLY compact JSON，不要 Markdown，不要代码块。
- JSON 格式：
{"topic":"{{topic}}","topic_type":"...","focus":"...","audience":"...","depth":"入门|进阶|深入","deliverable_preferences":["..."],"scope_notes":"...","plan_brief":"...","assumptions":["..."]}
"""

[steps.agent]
name = "planner"

[steps.validate]
format = "json"
required = ["topic", "topic_type", "focus", "audience", "depth", "plan_brief"]

[[steps]]
id = "article-plan"
title = "规划系列文章清单"
depends_on = ["scope-analysis"]
input_context = ["scope-analysis"]
description = """
根据 topic 和 scope-analysis 的完整范围配置，为「{{topic}}」规划一组系列文章。

你的输出会被后续 foreach loop 直接消费，因此必须输出 ONLY compact JSON array，不要 Markdown，不要代码块。

数组中每个对象代表一篇文章，格式如下：
{"filename":"01-xxx.md","title":"文章标题","angle":"写作角度","audience":"目标读者","depth":"入门/进阶/深入","must_cover":["要点1","要点2"],"mermaid_hint":"适合使用的 Mermaid 图类型","table_hint":"适合使用的表格类型"}

要求：
- 文章数量通常 3-6 篇，复杂话题可更多，简单话题可更少。
- filename 必须安全、简洁、以 .md 结尾，建议带两位数字前缀。
- 每篇文章边界清晰，避免大量重复。
- 覆盖理解、背景、机制/方法、应用、风险/争议、未来趋势等合适维度。
- 严格使用 scope-analysis 中的 focus、audience、depth 和边界。
- 不要编造具体数据或新闻；需要核实时可在 must_cover 中标注。
"""

[steps.agent]
name = "planner"

[steps.validate]
format = "json"
min_items = 1
item_required = ["filename", "title", "angle", "audience", "depth", "must_cover", "mermaid_hint", "table_hint"]

[[steps]]
id = "topic-package-plan"
title = "生成主题目录与 README 计划"
depends_on = ["article-plan"]
input_context = ["scope-analysis", "article-plan"]
description = """
基于 scope-analysis 和 article-plan，为最终文档包生成轻量级打包计划。这个步骤只输出目录名和 README 所需的摘要信息，不写文章正文。

输出 ONLY compact JSON object，不要 Markdown，不要代码块：
{"topic_name":"safe-topic-name","series_title":"...","audience":"...","reading_order":[{"filename":"01-xxx.md","title":"...","summary":"..."}],"readme_notes":["..."]}

要求：
- topic_name 必须安全、可读、稳定；中文话题可使用简短拼音或英文译名，英文话题使用小写 kebab-case。
- topic_name 只允许小写字母、数字、连字符 `-`，不要空格、斜杠、冒号或其它特殊字符，控制在 40 个字符以内。
- reading_order 必须覆盖 article-plan 中的每篇文章，但只保留 filename、title、summary，不要包含正文。
- readme_notes 只放 README 组织信息和阅读建议，避免大段正文。
"""

[steps.agent]
name = "planner"

[steps.validate]
format = "json"
required = ["topic_name", "series_title", "audience", "reading_order"]

[[steps]]
id = "write-articles"
title = "并发撰写每篇系列文章"
depends_on = ["article-plan"]

  [steps.loop]
  for_each = "article-plan"
  var = "article"
  parallel = true
  max_concurrency = 4

  [[steps.loop.body]]
  id = "draft"
  title = "撰写 {{article.title}}"
  input_context = ["scope-analysis", "article"]
  description = """
根据当前 article 对象和 scope-analysis 的完整范围配置，撰写关于「{{topic}}」的一篇完整 Markdown 文章。

当前 article 对象可通过上下文 article 读取，常用字段包括：filename、title、angle、audience、depth、must_cover、mermaid_hint、table_hint。

输出要求：
- 输出 ONLY Markdown 正文，不要额外解释。
- 第一行使用 `# {{article.title}}`。
- 内容至少 500 字，必须有实质内容，不要只有提纲。
- 按需包含Mermaid 图表，优先参考 article.mermaid_hint。
- 按需包含Markdown 表格，优先参考 article.table_hint。
- 使用 blockquote、分隔线、列表、加粗、代码等方式增强可读性。
- 不要编造具体数据或新闻；不确定信息标注“需要进一步核实”。
"""

  [steps.loop.body.agent]
  name = "writer"

  [[steps.loop.body]]
  id = "package-entry"
  title = "整理 {{article.title}} 为文件条目"
  depends_on = ["draft"]
  input_context = ["article", "draft"]
  description = """
将当前文章整理为后续打包步骤可消费的 JSON 对象。

输出要求：
- 输出 ONLY compact JSON object。
- 格式：
{"filename":"...","title":"...","summary":"...","content":"完整 Markdown 内容"}
- filename 使用 article.filename。
- content 使用 draft 的完整 Markdown 内容，保留 Mermaid、表格和 Markdown 格式。
"""

  [steps.loop.body.agent]
  name = "planner"

  [steps.loop.body.validate]
  format = "json"
  required = ["filename", "title", "summary", "content"]

[[steps]]
id = "article-manifest"
title = "聚合文章文件清单"
depends_on = ["write-articles"]
execution = "aggregate"

[steps.aggregate]
source = "write-articles"
as = "articles"
require = ["filename", "title", "summary", "content"]
exclude = ["content"]

[steps.validate]
format = "json"
required = ["articles"]

[[steps]]
id = "write-doc-files"
title = "写入文章文件并生成文件清单"
depends_on = ["topic-package-plan", "write-articles"]
execution = "script"

[steps.script]
command = ["python3", "-c", """
import json, os, pathlib, re, sys

topic_name = os.environ.get('TOPIC_NAME', '').strip()
if not re.fullmatch(r'[a-z0-9-]{1,40}', topic_name):
    raise SystemExit(f'invalid topic_name: {topic_name!r}')

raw = os.environ.get('ARTICLES_JSON', '').strip()
try:
    payload = json.loads(raw)
except Exception as exc:
    raise SystemExit(f'write-articles must be JSON: {exc}')

entries = []
def collect(value):
    if isinstance(value, dict):
        if all(k in value for k in ('filename', 'title', 'summary', 'content')):
            entries.append(value)
        for child in value.values():
            collect(child)
    elif isinstance(value, list):
        for child in value:
            collect(child)

collect(payload)
if not entries:
    raise SystemExit('no article package entries found in write-articles output')

root = pathlib.Path('docs') / topic_name
root.mkdir(parents=True, exist_ok=True)
written = []
for item in entries:
    filename = str(item['filename']).strip()
    if not filename.endswith('.md') or '/' in filename or '\\' in filename or filename.startswith('.'):
        raise SystemExit(f'unsafe filename: {filename!r}')
    path = root / filename
    path.write_text(str(item['content']).rstrip() + '\n', encoding='utf-8')
    written.append({'filename': filename, 'title': item.get('title', ''), 'summary': item.get('summary', ''), 'path': str(path)})

print(json.dumps({'topic_name': topic_name, 'directory': str(root), 'articles': written}, ensure_ascii=False, separators=(',', ':')))
"""]
format = "json"
timeout = "60s"

[steps.script.env]
TOPIC_NAME = "{{topic-package-plan.topic_name}}"
ARTICLES_JSON = "{{write-articles}}"

[steps.validate]
format = "json"
required = ["stdout", "exit_code"]

[[steps]]
id = "series-package"
title = "生成 README 并汇总文档包"
depends_on = ["write-doc-files", "article-manifest"]
input_context = ["topic-package-plan", "article-manifest", "write-doc-files.stdout"]
description = """
文章正文已经由 write-doc-files 这个 script 确定性写入磁盘。你只需要基于 topic-package-plan、article-manifest 和 write-doc-files.stdout 的轻量文件清单，写入 README 并输出最终汇总，不要再读取或复述所有文章正文。

目录命名要求：
- 使用 topic-package-plan.topic_name 和 write-doc-files.stdout.directory。
- 本次所有文件必须位于同一个 `docs/<topic-name>/` 目录，不要写到 `docs/` 根目录。

你的工作：
1. 撰写并写入 `docs/<topic-name>/README.md`，描述整个系列。
2. 不要重写各篇文章文件，文章文件已经由 write-doc-files 写入。
3. 输出 Markdown 汇总，列出主题目录、README、文章文件清单、阅读顺序和后续建议。

README.md 应包含：
- 系列标题（基于 {{topic}} 和 topic-package-plan.series_title）
- 适合谁读（使用 topic-package-plan.audience）
- 阅读顺序建议（使用 topic-package-plan.reading_order，可用 Mermaid flowchart 展示）
- 每篇的文件名、标题和简短摘要
- README 本身也建议用表格或 Mermaid 来组织内容

整体要求：
- 统一术语，删除重复内容。
- 明确标注不确定信息和需要进一步核实的地方。
- 最终结果要像一个完整的小型知识库。
- 控制 token，不要把文章正文复制进 README 或最终汇总。
"""

[steps.agent]
name = "writer"
