formula = "fresh-topic-docs"
title = "新鲜事物系列文档"
description = "根据用户输入的新鲜事物、概念、趋势或话题，先动态分析范围，再生成文章计划数组，并用 foreach loop 并发撰写每篇 Markdown 文档，最后汇总写入 .tt/docs。"
version = 7
type = "workflow"
category = "learning"
tags = ["学习", "调研", "新鲜事物", "系列文档", "知识整理", "foreach"]

[vars]
topic = { description = "想了解的新鲜事物、概念、趋势、产品、人物、技术或现象", required = true }

[[steps]]
id = "scope-analysis"
title = "分析话题并确定探索方向"
output_key = "scope_config"
description = """
首先，深入分析话题「{{topic}}」的本质。

判断这个话题属于什么领域——它可能涉及多个领域（技术、商业、历史、社会、文化、科学、政治、艺术、经济等），分析清楚它的核心属性。

然后，根据话题的特点，决定需要向用户了解哪些信息（如有），以便后续更好地撰写文档。

**关键：不要使用固定的字段模版。每一次都应该根据话题本身，决定需要问什么、需要问几个问题、甚至是否需要问问题。**

### 可能需要的用户信息（示例，仅供参考）：

不同话题可能需要不同的信息。以下是几种举例：

- 量子计算 → 需要问：关注的技术方向、读者背景、文章深度
- WebGPU → 需要问：读者背景、关注方向、技术深度
- 商鞅变法 → 需要问：关注维度、偏好的史观视角
- 小红书运营 → 需要问：当前阶段、主要平台、内容形式
- 什么是 P=NP 问题 → 可能需要问：数学背景程度、感兴趣的方面
- "登鹳雀楼"诗歌赏析 → 极大概率不需要额外问题

关键原则：
1. 对于大多数话题，默认应该弹表单。除非话题极其简单和聚焦，否则都应通过表单向用户确认方向。
2. 需要问什么，由话题决定。可以问方向选择、读者背景、深度偏好、关注维度等，不固定模版。
3. 需要问几个问题，由复杂度决定。简单话题 1-2 个问题，复杂话题 2-4 个问题合适。最少 1 个，最多不超过 5 个。
4. 有疑问时，倾向于弹表单让用户确认，而不是自作主张。
5. 只有极其简单的话题才跳过表单。

如果需要向用户了解信息，在分析文本末尾附加一个 ```tt-human-input JSON 块。分析文本在前，JSON 块在后。

输出要求：
- 输出分析文本。
- 如需用户输入，追加合法 tt-human-input 块。
- 如果不需要表单，直接输出分析文本即可。
"""

[[steps]]
id = "article-plan"
title = "规划系列文章清单"
depends_on = ["scope-analysis"]
input_context = ["scope_config"]
output_key = "article_specs"
description = """
根据 topic 和 scope_config，为「{{topic}}」规划一组系列文章。

你的输出会被后续 foreach loop 直接消费，因此必须输出 ONLY compact JSON array，不要 Markdown，不要代码块。

数组中每个对象代表一篇文章，格式如下：
{"filename":"01-xxx.md","title":"文章标题","angle":"写作角度","audience":"目标读者","depth":"入门/进阶/深入","must_cover":["要点1","要点2"],"mermaid_hint":"适合使用的 Mermaid 图类型","table_hint":"适合使用的表格类型"}

要求：
- 文章数量通常 3-6 篇，复杂话题可更多，简单话题可更少。
- filename 必须安全、简洁、以 .md 结尾，建议带两位数字前缀。
- 每篇文章边界清晰，避免大量重复。
- 覆盖理解、背景、机制/方法、应用、风险/争议、未来趋势等合适维度。
- 不要编造具体数据或新闻；需要核实时可在 must_cover 中标注。
"""

[[steps]]
id = "write-articles"
title = "并发撰写每篇系列文章"
depends_on = ["article-plan"]
output_key = "article_outputs"

  [steps.loop]
  for_each = "article_specs"
  var = "article"
  parallel = true
  max_concurrency = 4

  [[steps.loop.body]]
  id = "draft"
  title = "撰写 {{article.title}}"
  input_context = ["scope_config", "article"]
  output_key = "article_markdown"
  description = """
根据当前 article 对象和 scope_config，撰写关于「{{topic}}」的一篇完整 Markdown 文章。

当前 article 对象可通过上下文 article 读取，常用字段包括：filename、title、angle、audience、depth、must_cover、mermaid_hint、table_hint。

输出要求：
- 输出 ONLY Markdown 正文，不要额外解释。
- 第一行使用 `# {{article.title}}`。
- 内容至少 500 字，必须有实质内容，不要只有提纲。
- 至少包含 1 个 Mermaid 图表，优先参考 article.mermaid_hint。
- 至少包含 1 个 Markdown 表格，优先参考 article.table_hint。
- 使用 blockquote、分隔线、列表、加粗、代码等方式增强可读性。
- 不要编造具体数据或新闻；不确定信息标注“需要进一步核实”。
"""

  [[steps.loop.body]]
  id = "package-entry"
  title = "整理 {{article.title}} 为文件条目"
  depends_on = ["draft"]
  input_context = ["article", "article_markdown"]
  output_key = "package_entry"
  description = """
将当前文章整理为后续打包步骤可消费的 JSON 对象。

输出要求：
- 输出 ONLY compact JSON object。
- 格式：
{"filename":"...","title":"...","summary":"...","content":"完整 Markdown 内容"}
- filename 使用 article.filename。
- content 使用 article_markdown 的完整内容，保留 Mermaid、表格和 Markdown 格式。
"""

[[steps]]
id = "series-package"
title = "汇总为文档包并写入 .tt/docs"
depends_on = ["write-articles"]
input_context = ["scope_config", "article_specs", "article_outputs"]
output_key = "series_docs"
description = """
把 foreach loop 生成的 article_outputs 汇总为一系列 Markdown 文档，使用你的文件写入能力（write 工具）直接保存到 `.tt/docs/` 目录。

article_outputs 是一个 JSON array，每个元素包含本次循环中 package_entry 的输出。你需要从中提取 filename、title、summary、content。

你的工作：
1. 创建 `.tt/docs/` 目录（如果不存在）。
2. 撰写并写入 `README.md`，描述整个系列。
3. 将每篇文章的 content 写入 `.tt/docs/<filename>`。
4. 撰写并写入 `附录-问题清单.md`。

README.md 应包含：
- 系列标题（基于 {{topic}}，参考 scope_config 和 article_specs）
- 适合谁读
- 阅读顺序建议（可用 Mermaid flowchart 展示）
- 每篇的简短摘要
- README 本身也建议用表格或 Mermaid 来组织内容

附录-问题清单.md：
- 列出 20 个后续可以继续追问的问题
- 覆盖不同层次：理解、应用、批判性思考
- 避免“是什么”类问题，侧重“为什么”和“如果”类问题
- 可以用表格组织（问题 | 类型 | 适合谁）

整体要求：
- 统一术语，删除重复内容。
- 明确标注不确定信息和需要进一步核实的地方。
- 最终结果要像一个完整的小型知识库。
- 最后输出 Markdown 汇总，列出已写入文件、阅读顺序和后续建议。
"""
