formula = "web-bug-hunt"
aliases = ["web-bug-hunt"]
title = "Web Bug 探测器"
description = "输入 URL 和可选 metadata，使用 agent-browser 持续探索网站、持久化进度和 bug 复现路径，支持断点恢复与 fixed 复验。"
version = 2
type = "workflow"
category = "qa"
tags = ["web", "browser", "qa", "bug", "beads", "stateful", "resume"]

[vars]
url = { description = "要测试的网站入口 URL", required = true }
metadata = { description = "可选测试上下文，可包含账号、密码、登录提示、测试范围、禁止动作、期望流程等；支持 JSON 或自然语言", default = "" }
workspace_path = { description = "可选执行工作区路径；为空时使用 formula 运行目录", default = "" }
max_pages = { description = "本次扫描累计最多处理多少个页面/路由", default = "100", pattern = "^[1-9][0-9]*$" }
max_depth = { description = "导航探索最大深度", default = "6", pattern = "^[1-9][0-9]*$" }
max_steps = { description = "hunt 模式最多执行多少个页面探索循环", default = "30", pattern = "^[1-9][0-9]*$" }
max_bugs_to_verify = { description = "fixed 模式最多复验多少个历史 bug", default = "30", pattern = "^[1-9][0-9]*$" }
state_dir = { description = "保存 web bug hunt 状态的目录", default = ".tt/web-bug-hunt" }
resume = { description = "是否从已有状态恢复：true/false", default = "true" }
reset = { description = "是否清空该 URL 的历史状态重新开始：true/false", default = "false" }
fixed = { description = "是否进入修复复验模式：true/false；为 true 时读取历史 bug 复现路径并验证是否已修复", default = "false" }
screenshot_mode = { description = "截图策略：bugs/errors/all/none", default = "bugs" }
create_beads = { description = "hunt 模式结束后是否使用 bead-manager 为 high/medium bug 创建 beads：true/false", default = "false" }
severity_threshold = { description = "建议创建 bead 的最低严重级别：low/medium/high", default = "medium" }

[[steps]]
id = "normalize-scope"
title = "规范化测试输入和安全边界"
description = """
基于 URL='{{url}}' 和 metadata='{{metadata}}'，整理本次 Web bug hunt 的测试上下文、登录信息使用方式、允许/禁止动作和测试重点。

默认安全策略：
- 可以打开页面、浏览、搜索、填写低风险表单；
- 未经明确授权，不执行付款、删除真实数据、发送真实邮件、公开发布、修改真实生产配置、授权敏感权限等不可逆动作；
- 如果 metadata 没有明确允许 mutation，则把提交类动作视为需要确认或只做 dry-run；
- 如果包含用户名/密码，只用于登录目标站点，不要在报告中明文泄露密码。

输出 ONLY compact JSON：
{
  "target_url":"...",
  "metadata_summary":"...",
  "has_credentials":true,
  "login_strategy":"...",
  "allowed_actions":["..."],
  "forbidden_actions":["payment","delete","send-email","publish","destructive-admin-change"],
  "expected_flows":["..."],
  "bug_categories":["availability","login-auth","forms-input","navigation-flow","permissions","ui-ux","low-risk-security"],
  "safety_notes":["..."],
  "exploration_limits":{"max_pages":100,"max_depth":6},
  "resume_enabled":true,
  "fixed_mode":false,
  "screenshot_mode":"bugs|errors|all|none"
}

要求：
- 不要输出明文密码、token、cookie；
- forbidden_actions 至少包含 payment/delete/send-email/publish/destructive-admin-change，除非 metadata 明确允许；
- bug_categories 保持低侵入，不包含爆破、绕过、攻击性扫描；
- fixed_mode 来自 '{{fixed}}'，resume_enabled 来自 '{{resume}}'，screenshot_mode 来自 '{{screenshot_mode}}'。
"""
agent.name = "planner"
agent.cwd = "{{workspace_path}}"

[steps.validate]
format = "json"
required = ["target_url", "allowed_actions", "forbidden_actions", "expected_flows", "bug_categories", "safety_notes", "fixed_mode", "screenshot_mode"]

[[steps]]
id = "init-scan-state"
title = "初始化或恢复扫描状态"
depends_on = ["normalize-scope"]
execution = "script"
idempotent = true

[steps.script]
command = ["python3", "-c", """
import hashlib, json, os, pathlib, re, shutil, time, urllib.parse

url = os.environ['URL'].strip()
state_root = pathlib.Path(os.environ.get('STATE_DIR', '.tt/web-bug-hunt'))
resume = os.environ.get('RESUME', 'true').strip().lower() == 'true'
reset = os.environ.get('RESET', 'false').strip().lower() == 'true'
fixed = os.environ.get('FIXED', 'false').strip().lower() == 'true'
max_pages = int(os.environ.get('MAX_PAGES', '100') or '100')
max_depth = int(os.environ.get('MAX_DEPTH', '6') or '6')
metadata = os.environ.get('METADATA', '')
parsed = urllib.parse.urlparse(url)
host = parsed.netloc or 'site'
path = parsed.path.strip('/').replace('/', '_') or 'root'
site_slug = re.sub(r'[^a-zA-Z0-9_.-]+', '-', f'{host}_{path}').strip('-')[:80]
site_hash = hashlib.sha1((parsed.scheme + '://' + parsed.netloc + parsed.path).encode('utf-8')).hexdigest()[:10]
site_id = f'{site_slug}-{site_hash}'
site_dir = state_root / site_id
state_path = site_dir / 'scan-state.json'
pages_path = site_dir / 'pages.jsonl'
bugs_path = site_dir / 'bugs.jsonl'
screenshots_dir = site_dir / 'screenshots'
if reset and site_dir.exists():
    shutil.rmtree(site_dir)
site_dir.mkdir(parents=True, exist_ok=True)
screenshots_dir.mkdir(parents=True, exist_ok=True)
now = time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime())
state = None
if resume and state_path.exists():
    try:
        state = json.loads(state_path.read_text(encoding='utf-8'))
    except Exception:
        state = None
if not state:
    fp = hashlib.sha1(metadata.encode('utf-8')).hexdigest()[:12] if metadata else ''
    state = {
        'schema_version': 1,
        'site_id': site_id,
        'root_url': url,
        'metadata_fingerprint': fp,
        'created_at': now,
        'updated_at': now,
        'max_pages': max_pages,
        'max_depth': max_depth,
        'visited_pages': {},
        'pending_pages': [{'url': url, 'depth': 0, 'source': 'root', 'steps': [{'action': 'open', 'url': url}]}],
        'confirmed_bugs': [],
        'observations': [],
        'not_tested': [],
        'runs': []
    }
state['updated_at'] = now
state['last_mode'] = 'verify-fixed' if fixed else 'hunt'
state['paths'] = {'state': str(state_path), 'pages': str(pages_path), 'bugs': str(bugs_path), 'screenshots': str(screenshots_dir)}
state_path.write_text(json.dumps(state, ensure_ascii=False, indent=2), encoding='utf-8')
print(json.dumps({
    'site_id': site_id,
    'site_dir': str(site_dir),
    'state_path': str(state_path),
    'pages_path': str(pages_path),
    'bugs_path': str(bugs_path),
    'screenshots_dir': str(screenshots_dir),
    'resumed': bool(resume and not reset and state_path.exists()),
    'reset': reset,
    'mode': state['last_mode'],
    'pending_pages': len(state.get('pending_pages', [])),
    'visited_pages': len(state.get('visited_pages', {})),
    'confirmed_bugs': len(state.get('confirmed_bugs', [])),
}, ensure_ascii=False))
"""]
format = "json"
timeout = "30s"

[steps.script.env]
URL = "{{url}}"
METADATA = "{{metadata}}"
STATE_DIR = "{{state_dir}}"
RESUME = "{{resume}}"
RESET = "{{reset}}"
FIXED = "{{fixed}}"
MAX_PAGES = "{{max_pages}}"
MAX_DEPTH = "{{max_depth}}"

[steps.validate]
format = "json"
required = ["stdout"]

[[steps]]
id = "hunt-loop"
title = "持续探索未处理页面"
depends_on = ["init-scan-state"]
condition = "{{fixed}} != true"

[steps.loop]
max = "{{max_steps}}"
until = "persist-hunt-step.stdout.continue_scan == false"

[[steps.loop.body]]
id = "select-next-target"
title = "选择下一个未处理页面"
execution = "script"
idempotent = true

[steps.loop.body.script]
command = ["python3", "-c", """
import json, os, pathlib
state_path = pathlib.Path(os.environ['STATE_PATH'])
state = json.loads(state_path.read_text(encoding='utf-8'))
max_pages = int(os.environ.get('MAX_PAGES', state.get('max_pages', 100)) or '100')
visited = state.get('visited_pages', {})
pending = state.get('pending_pages', [])
selected = None
while pending and len(visited) < max_pages:
    item = pending.pop(0)
    url = item.get('url')
    if url and url not in visited:
        selected = item
        break
state['pending_pages'] = pending
state_path.write_text(json.dumps(state, ensure_ascii=False, indent=2), encoding='utf-8')
print(json.dumps({'selected': selected is not None, 'target': selected, 'pending_pages': len(pending), 'visited_pages': len(visited), 'max_pages': max_pages}, ensure_ascii=False))
"""]
format = "json"
timeout = "10s"

[steps.loop.body.script.env]
STATE_PATH = "{{init-scan-state.stdout.state_path}}"
MAX_PAGES = "{{max_pages}}"

[steps.loop.body.validate]
format = "json"
required = ["stdout"]

[[steps.loop.body]]
id = "explore-target"
title = "探索页面并记录候选 bug"
depends_on = ["select-next-target"]
condition = "select-next-target.stdout.selected == true"
input_context = ["normalize-scope", "init-scan-state.stdout", "select-next-target.stdout"]
description = """
你是 agent-browser agent。请探索 select-next-target.stdout.target 指定的页面/操作路径。

目标：处理一个页面或 flow，并输出可持久化的页面记录、后续待探索 URL、候选 bug 和确认 bug。

执行要求：
1. 通过 target.steps 或 target.url 到达页面；
2. 观察 URL、标题、主要文本、可交互元素、登录状态、错误提示、空状态、权限状态；
3. 在 normalize-scope 安全边界内尝试低风险交互；禁止执行 forbidden_actions；
4. 发现链接、菜单、表单入口、详情页、设置页等可继续探索的页面时，加入 discovered_pages；
5. 如果问题能在本页面低风险复现，可直接放入 confirmed_bugs；否则放入 candidate_bugs/observations；
6. 根据 screenshot_mode='{{screenshot_mode}}' 判断是否需要截图：bugs=确认 bug 截图，errors=错误页截图，all=页面基线也截图，none=不截图。截图路径建议放在 init-scan-state.stdout.screenshots_dir 下。

输出 ONLY compact JSON：
{
  "page":{"url":"...","final_url":"...","title":"...","depth":0,"status":"ok|error|empty|blocked|unknown","summary":"...","key_elements":["..."],"screenshot":""},
  "flows_attempted":[{"name":"...","steps":["..."],"result":"passed|failed|blocked|not-tested","notes":"..."}],
  "discovered_pages":[{"url":"...","depth":1,"source":"nav|link|form|button|redirect","steps":[{"action":"open","url":"..."}]}],
  "candidate_bugs":[{"temp_id":"OBS-1","page_url":"...","category":"...","summary":"...","evidence":"...","suspected_severity":"low|medium|high","repro_steps":[{"action":"open","url":"..."}]}],
  "confirmed_bugs":[{"id":"BUG-1","severity":"low|medium|high","category":"...","title":"...","page_url":"...","preconditions":["..."],"repro_steps":[{"action":"open","url":"..."}],"actual_result":"...","expected_result":"...","evidence":["..."],"screenshot":"","safe_to_retest":true,"suggested_fix_direction":"..."}],
  "observations":[{"summary":"...","page_url":"...","why_not_confirmed":"..."}],
  "not_tested":[{"area":"...","reason":"forbidden|blocked|needs-user-confirmation|out-of-scope","suggested_manual_check":"..."}],
  "safety_events":["..."]
}

要求：
- confirmed_bugs 必须包含可复验 repro_steps；
- 不要泄露密码、token、cookie；
- discovered_pages 只加入同站点或明确属于本任务范围的 URL；
- 不确定的问题不要放 confirmed_bugs。
"""
agent.name = "agent-browser"
agent.cwd = "{{workspace_path}}"

[steps.loop.body.validate]
format = "json"
required = ["page", "discovered_pages", "candidate_bugs", "confirmed_bugs", "observations", "not_tested", "safety_events"]

[[steps.loop.body]]
id = "persist-hunt-step"
title = "持久化页面和 bug 状态"
depends_on = ["select-next-target", "explore-target"]
execution = "script"
idempotent = true

[steps.loop.body.script]
command = ["python3", "-c", """
import hashlib, json, os, pathlib, time, urllib.parse
state_path = pathlib.Path(os.environ['STATE_PATH'])
pages_path = pathlib.Path(os.environ['PAGES_PATH'])
bugs_path = pathlib.Path(os.environ['BUGS_PATH'])
selected = os.environ.get('SELECTED', '').lower() == 'true'
state = json.loads(state_path.read_text(encoding='utf-8'))
now = time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime())
if not selected:
    state['updated_at'] = now
    state_path.write_text(json.dumps(state, ensure_ascii=False, indent=2), encoding='utf-8')
    print(json.dumps({'continue_scan': False, 'reason': 'no-pending-page', 'pending_pages': len(state.get('pending_pages', [])), 'visited_pages': len(state.get('visited_pages', {})), 'confirmed_bugs': len(state.get('confirmed_bugs', []))}, ensure_ascii=False))
    raise SystemExit(0)
raw = os.environ.get('EXPLORE_JSON', '').strip()
try:
    result = json.loads(raw)
except Exception:
    result = {}
page = result.get('page') or {}
url = page.get('final_url') or page.get('url') or (json.loads(os.environ.get('TARGET_JSON') or '{}').get('url'))
if url:
    state.setdefault('visited_pages', {})[url] = {**page, 'visited_at': now}
    pages_path.parent.mkdir(parents=True, exist_ok=True)
    with pages_path.open('a', encoding='utf-8') as f:
        f.write(json.dumps({'visited_at': now, **page}, ensure_ascii=False) + chr(10))
root_host = urllib.parse.urlparse(state.get('root_url','')).netloc
pending = state.setdefault('pending_pages', [])
visited = state.setdefault('visited_pages', {})
max_depth = int(state.get('max_depth', os.environ.get('MAX_DEPTH', '6')) or '6')
max_pages = int(state.get('max_pages', os.environ.get('MAX_PAGES', '100')) or '100')
known_pending = {p.get('url') for p in pending}
for item in result.get('discovered_pages') or []:
    u = item.get('url')
    if not u or u in visited or u in known_pending or len(visited) + len(pending) >= max_pages:
        continue
    parsed = urllib.parse.urlparse(u)
    if parsed.netloc and root_host and parsed.netloc != root_host:
        continue
    depth = int(item.get('depth') or 0)
    if depth > max_depth:
        continue
    pending.append(item)
    known_pending.add(u)
def bug_fp(bug):
    payload = json.dumps({'category': bug.get('category'), 'page_url': bug.get('page_url'), 'steps': bug.get('repro_steps'), 'expected': bug.get('expected_result')}, sort_keys=True, ensure_ascii=False)
    return hashlib.sha1(payload.encode('utf-8')).hexdigest()[:16]
existing = {b.get('fingerprint'): b for b in state.setdefault('confirmed_bugs', []) if b.get('fingerprint')}
new_bugs = []
for bug in result.get('confirmed_bugs') or []:
    fp = bug.get('fingerprint') or bug_fp(bug)
    bug['fingerprint'] = fp
    bug.setdefault('first_seen_at', now)
    bug['last_seen_at'] = now
    bug.setdefault('status', 'open')
    if fp in existing:
        existing[fp].update({k:v for k,v in bug.items() if v not in (None, '', [])})
        existing[fp]['last_seen_at'] = now
    else:
        state['confirmed_bugs'].append(bug)
        existing[fp] = bug
        new_bugs.append(bug)
        bugs_path.parent.mkdir(parents=True, exist_ok=True)
        with bugs_path.open('a', encoding='utf-8') as f:
            f.write(json.dumps(bug, ensure_ascii=False) + chr(10))
state.setdefault('observations', []).extend(result.get('observations') or [])
state.setdefault('not_tested', []).extend(result.get('not_tested') or [])
state['pending_pages'] = pending
state['updated_at'] = now
state_path.write_text(json.dumps(state, ensure_ascii=False, indent=2), encoding='utf-8')
continue_scan = len(pending) > 0 and len(visited) < max_pages
print(json.dumps({'continue_scan': continue_scan, 'visited_pages': len(visited), 'pending_pages': len(pending), 'confirmed_bugs': len(state.get('confirmed_bugs', [])), 'new_bugs': len(new_bugs), 'state_path': str(state_path)}, ensure_ascii=False))
"""]
format = "json"
timeout = "30s"

[steps.loop.body.script.env]
STATE_PATH = "{{init-scan-state.stdout.state_path}}"
PAGES_PATH = "{{init-scan-state.stdout.pages_path}}"
BUGS_PATH = "{{init-scan-state.stdout.bugs_path}}"
SELECTED = "{{select-next-target.stdout.selected}}"
TARGET_JSON = "{{select-next-target.stdout.target}}"
EXPLORE_JSON = "{{explore-target}}"
MAX_PAGES = "{{max_pages}}"
MAX_DEPTH = "{{max_depth}}"

[steps.loop.body.validate]
format = "json"
required = ["stdout"]

[[steps]]
id = "verify-fixed-loop"
title = "复验历史 bug 是否已修复"
depends_on = ["init-scan-state"]
condition = "{{fixed}} == true"

[steps.loop]
max = "{{max_bugs_to_verify}}"
until = "persist-verify-step.stdout.continue_verify == false"

[[steps.loop.body]]
id = "select-next-bug"
title = "选择下一个待复验 bug"
execution = "script"
idempotent = true

[steps.loop.body.script]
command = ["python3", "-c", """
import json, os, pathlib, time
state_path = pathlib.Path(os.environ['STATE_PATH'])
state = json.loads(state_path.read_text(encoding='utf-8'))
run_id = state.get('current_verify_run') or time.strftime('%Y%m%d%H%M%S', time.gmtime())
state['current_verify_run'] = run_id
selected = None
for bug in state.get('confirmed_bugs', []):
    if bug.get('last_verify_run') == run_id:
        continue
    if bug.get('status') in ('fixed', 'closed'):
        continue
    selected = bug
    bug['last_verify_run'] = run_id
    break
state_path.write_text(json.dumps(state, ensure_ascii=False, indent=2), encoding='utf-8')
print(json.dumps({'selected': selected is not None, 'bug': selected, 'remaining_unverified': sum(1 for b in state.get('confirmed_bugs', []) if b.get('last_verify_run') != run_id and b.get('status') not in ('fixed','closed'))}, ensure_ascii=False))
"""]
format = "json"
timeout = "10s"

[steps.loop.body.script.env]
STATE_PATH = "{{init-scan-state.stdout.state_path}}"

[steps.loop.body.validate]
format = "json"
required = ["stdout"]

[[steps.loop.body]]
id = "verify-bug"
title = "执行 bug 复现路径验证修复状态"
depends_on = ["select-next-bug"]
condition = "select-next-bug.stdout.selected == true"
input_context = ["normalize-scope", "init-scan-state.stdout", "select-next-bug.stdout"]
description = """
你是 agent-browser agent。请读取 select-next-bug.stdout.bug 的 repro_steps，重新执行复现路径，判断历史 bug 是否已修复。

要求：
- 不探索新页面，只复验这个 bug；
- 不执行 forbidden_actions；如果复现路径包含危险动作，停在危险动作前并输出 unknown；
- 判断状态：fixed=实际结果已符合预期；still-reproducible=问题仍然复现；unknown=登录、权限、页面变化、验证码、环境异常或安全边界导致无法判断；
- 保留证据，不要泄露密码/token/cookie；
- 根据 screenshot_mode='{{screenshot_mode}}' 对 still-reproducible 或 fixed 关键状态截图。

输出 ONLY compact JSON：
{
  "fingerprint":"...",
  "status":"fixed|still-reproducible|unknown",
  "verified_at":"...",
  "steps_executed":["..."],
  "actual_result":"...",
  "expected_result":"...",
  "evidence":["..."],
  "screenshot":"",
  "notes":"..."
}
"""
agent.name = "agent-browser"
agent.cwd = "{{workspace_path}}"

[steps.loop.body.validate]
format = "json"
required = ["fingerprint", "status", "actual_result", "expected_result", "evidence", "notes"]

[[steps.loop.body]]
id = "persist-verify-step"
title = "持久化复验结果"
depends_on = ["select-next-bug", "verify-bug"]
execution = "script"
idempotent = true

[steps.loop.body.script]
command = ["python3", "-c", """
import json, os, pathlib, time
state_path = pathlib.Path(os.environ['STATE_PATH'])
selected = os.environ.get('SELECTED', '').lower() == 'true'
state = json.loads(state_path.read_text(encoding='utf-8'))
now = time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime())
if not selected:
    state.pop('current_verify_run', None)
    state['updated_at'] = now
    state_path.write_text(json.dumps(state, ensure_ascii=False, indent=2), encoding='utf-8')
    print(json.dumps({'continue_verify': False, 'reason': 'no-bugs-to-verify', 'state_path': str(state_path)}, ensure_ascii=False))
    raise SystemExit(0)
raw = os.environ.get('VERIFY_JSON', '').strip()
try:
    result = json.loads(raw)
except Exception:
    result = {'status': 'unknown', 'notes': 'verify output was not parseable'}
fp = result.get('fingerprint')
for bug in state.get('confirmed_bugs', []):
    if fp and bug.get('fingerprint') == fp:
        bug['status'] = result.get('status', 'unknown')
        bug['last_verified_at'] = now
        bug['last_verify_result'] = result
        break
state.setdefault('verify_results', []).append({'verified_at': now, **result})
state['updated_at'] = now
remaining = sum(1 for b in state.get('confirmed_bugs', []) if b.get('last_verify_run') != state.get('current_verify_run') and b.get('status') not in ('fixed','closed'))
if remaining == 0:
    state.pop('current_verify_run', None)
state_path.write_text(json.dumps(state, ensure_ascii=False, indent=2), encoding='utf-8')
print(json.dumps({'continue_verify': remaining > 0, 'remaining_unverified': remaining, 'status': result.get('status'), 'state_path': str(state_path)}, ensure_ascii=False))
"""]
format = "json"
timeout = "20s"

[steps.loop.body.script.env]
STATE_PATH = "{{init-scan-state.stdout.state_path}}"
SELECTED = "{{select-next-bug.stdout.selected}}"
VERIFY_JSON = "{{verify-bug}}"

[steps.loop.body.validate]
format = "json"
required = ["stdout"]

[[steps]]
id = "load-final-state"
title = "读取最终扫描状态"
depends_on = ["hunt-loop", "verify-fixed-loop"]
execution = "script"
idempotent = true

[steps.script]
command = ["python3", "-c", """
import json, os, pathlib
state_path = pathlib.Path(os.environ['STATE_PATH'])
state = json.loads(state_path.read_text(encoding='utf-8'))
bugs = state.get('confirmed_bugs', [])
summary = {
  'site_id': state.get('site_id'),
  'root_url': state.get('root_url'),
  'mode': state.get('last_mode'),
  'state_path': str(state_path),
  'visited_pages': len(state.get('visited_pages', {})),
  'pending_pages': len(state.get('pending_pages', [])),
  'confirmed_bugs': len(bugs),
  'open_bugs': sum(1 for b in bugs if b.get('status') in ('open','still-reproducible', None)),
  'fixed_bugs': sum(1 for b in bugs if b.get('status') == 'fixed'),
  'unknown_bugs': sum(1 for b in bugs if b.get('status') == 'unknown'),
  'paths': state.get('paths', {}),
  'recent_bugs': bugs[-20:],
  'observations_count': len(state.get('observations', [])),
  'not_tested_count': len(state.get('not_tested', [])),
}
print(json.dumps(summary, ensure_ascii=False))
"""]
format = "json"
timeout = "10s"

[steps.script.env]
STATE_PATH = "{{init-scan-state.stdout.state_path}}"

[steps.validate]
format = "json"
required = ["stdout"]

[[steps]]
id = "create-bug-beads"
title = "可选创建 bug beads"
depends_on = ["load-final-state"]
condition = "{{create_beads}} == true"
input_context = ["normalize-scope", "load-final-state.stdout"]
description = """
你是 bead-manager agent。根据 load-final-state.stdout.recent_bugs 中 status=open 或 still-reproducible、严重级别不低于 '{{severity_threshold}}' 的确认 bug 创建或更新 beads。

规则：
- 先查重，避免重复创建；
- 每个 bug bead 必须包含页面 URL、前置条件、复现步骤、实际结果、预期结果、证据、状态文件路径和建议修复方向；
- 不为 observations/not_tested 创建 bug bead；
- 如果 bd 不可用或 workspace 不存在，不要假装创建。

输出 ONLY compact JSON：
{
  "mode":"create",
  "created_beads":[{"id":"...","title":"...","severity":"..."}],
  "updated_beads":[{"id":"...","title":"...","reason":"..."}],
  "skipped_bugs":[{"bug_id":"...","reason":"..."}],
  "commands_or_plan":["..."],
  "notes":["..."]
}
"""
agent.name = "bead-manager"
agent.cwd = "{{workspace_path}}"

[steps.validate]
format = "json"
required = ["mode", "created_beads", "updated_beads", "skipped_bugs", "notes"]

[[steps]]
id = "final-report"
title = "输出 Web Bug Hunt 报告"
depends_on = ["load-final-state", "create-bug-beads"]
input_context = ["normalize-scope", "init-scan-state.stdout", "hunt-loop", "verify-fixed-loop", "load-final-state.stdout", "create-bug-beads"]
description = """
基于全部上下文，输出中文 Markdown 报告。不要输出 JSON，不要用代码块包裹全文。

固定结构：

# Web Bug Hunt 报告

## 结论
说明本次是 hunt 还是 fixed 复验、是否发现/复验 bug、是否创建 beads、是否还有 pending 页面。

## 状态与恢复信息
必须列出 state_path、site_id、已访问页面数、待处理页面数、confirmed/open/fixed/unknown bug 数。说明再次运行同一 URL 且 resume=true 会从该状态继续；reset=true 会重扫。

## 测试范围与安全边界
- URL
- 身份/登录状态，禁止泄露密码
- 允许动作
- 未执行的高风险动作
- screenshot_mode

## 页面覆盖与剩余队列
总结本次 loop 处理了哪些页面/flow，以及还有哪些 pending 区域。

## Bug 列表或复验结果
hunt 模式列确认 bug；fixed 模式列 fixed/still-reproducible/unknown。
每个 bug 必须保留 URL + repro_steps 的定位方式。

## 详细复现路径
对最近的重要 bug 写页面 URL、前置条件、操作步骤、实际结果、预期结果、证据、截图路径或说明。

## Beads 落库情况
如果 create_beads=true，列出 created/updated/skipped；否则说明未创建。

## 下一步建议
给出 3-5 条可执行建议。

要求：
- 不要泄露 metadata 中的密码、token、cookie；
- 不要把未复现 observation 说成 bug；
- 报告应能直接交给 QA、开发或产品经理使用。
"""
agent.name = "reporter"
agent.cwd = "{{workspace_path}}"
