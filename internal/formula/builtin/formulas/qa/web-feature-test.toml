formula = "web-feature-test"
aliases = ["web-feature-test", "web-targeted-test"]
title = "Web 功能定点测试"
description = "根据提示只测试指定 Web 功能点，自动加载 .tt 项目文档，持久化用例路径、状态和截图等产物，支持后续只重跑失败/阻塞用例。"
version = 1
type = "workflow"
category = "qa"
tags = ["web", "browser", "qa", "feature-test", "stateful", "resume", "artifacts"]

[vars]
url = { description = "要测试的网站入口 URL 或功能入口 URL", required = true }
prompt = { description = "本次要定点测试的功能点/验收点提示。只会围绕这些点生成和执行测试用例" }
workspace_path = { description = "可选执行工作区路径；为空时使用 formula 运行目录", default = "" }
context_doc = { description = "自动加载的项目测试文档，建议写账号、登录方式、环境说明、约束等", default = ".tt/web-feature-test.md" }
state_dir = { description = "保存定点测试状态和产物的根目录", default = ".tt/web-feature-test" }
suite = { description = "可选测试套件名；为空时按 URL+prompt 生成稳定套件目录", default = "" }
resume = { description = "是否复用已有用例和状态：true/false", default = "true" }
reset = { description = "是否清空该套件历史状态重新开始：true/false", default = "false" }
only_failed = { description = "是否只运行历史失败/阻塞/未知/未完成用例：true/false", default = "false" }
max_cases = { description = "本次最多执行多少个测试用例", default = "20", pattern = "^[1-9][0-9]*$" }
screenshot_mode = { description = "截图策略：all/failures/none", default = "failures" }
vision_verify = { description = "是否对截图启用百炼视觉模型验收：true/false。默认开启，适合 canvas/WebGL 场景", default = "true" }
vision_verify_mode = { description = "视觉验收模式：auto/all/failures/none。auto 只验证截图、canvas/视觉相关或 DOM 受阻用例", default = "auto" }
vision_model = { description = "百炼视觉模型名称，用于 bl vision describe", default = "qwen3-vl-plus" }
max_concurrency = { description = "兼容旧配置的保留变量；当前执行阶段使用单次 agent 调用顺序跑全部用例，以避免多次 LLM agent 调用触发 provider cooldown", default = "1", pattern = "^[1-9][0-9]*$" }
browser_engine = { description = "agent-browser 浏览器引擎，Three.js/WebGL 测试必须使用 chrome，避免 lightpanda/headless", default = "chrome" }
browser_headed = { description = "是否显示 Chrome 窗口；默认 false 静默测试，调试时可设 true", default = "false" }
browser_executable_path = { description = "agent-browser 使用的 Chrome 可执行文件路径；为空则使用默认浏览器", default = "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" }
browser_session_name = { description = "agent-browser 自动保存/恢复登录态的 session-name；为空时按 suite 自动生成", default = "" }
close_browser_after_run = { description = "运行结束后是否关闭本次 agent-browser session，默认 true 防止 Chrome/agent-browser 残留；调试时可设 false", default = "true" }
ignore_https_errors = { description = "是否忽略本地/自签名 HTTPS 证书错误", default = "true" }
webgl_browser_args = { description = "agent-browser WebGL/GPU 启动参数，逗号分隔", default = "--ignore-gpu-blocklist,--ignore-certificate-errors,--allow-insecure-localhost,--enable-gpu-rasterization,--enable-webgl,--enable-webgl2,--use-angle=metal" }

[[steps]]
id = "load-project-context"
title = "加载 .tt 项目测试文档"
execution = "script"
idempotent = true

[steps.script]
command = ["python3", "-c", """
import json, os, pathlib
path = pathlib.Path(os.environ.get('CONTEXT_DOC') or '.tt/web-feature-test.md')
content = ''
exists = path.exists()
if exists:
    content = path.read_text(encoding='utf-8', errors='replace')
print(json.dumps({'context_doc': str(path), 'exists': exists, 'content': content}, ensure_ascii=False))
"""]
format = "json"
timeout = "10s"

[steps.script.env]
CONTEXT_DOC = "{{context_doc}}"

[steps.validate]
format = "json"
required = ["stdout"]

[[steps]]
id = "normalize-scope"
title = "规范化定点测试范围和安全边界"
depends_on = ["load-project-context"]
input_context = ["load-project-context.stdout"]
description = """
基于 URL='{{url}}'、测试提示='{{prompt}}'、以及 load-project-context.stdout.content，整理本次定点测试范围。

默认安全策略：
- 可以打开页面、浏览、登录、搜索、填写低风险表单；
- 未经项目文档或提示明确授权，不执行付款、删除真实数据、发送真实邮件、公开发布、修改生产配置等不可逆动作；
- 如果必须验证提交类动作，优先使用测试环境、测试账号、草稿、取消、dry-run 或到提交前停止；
- 不要在输出中泄露密码、token、cookie。

输出 ONLY compact JSON：
{
  "target_url":"...",
  "prompt_summary":"...",
  "context_doc":"...",
  "context_loaded":true,
  "has_credentials":true,
  "login_strategy":"...",
  "test_objectives":["..."],
  "allowed_actions":["..."],
  "forbidden_actions":["payment","delete","send-email","publish","destructive-admin-change"],
  "safety_notes":["..."],
  "screenshot_mode":"all|failures|none",
  "only_failed":false
}
"""
agent.name = "assistant"
agent.cwd = "{{workspace_path}}"

[steps.validate]
format = "json"
required = ["target_url", "prompt_summary", "context_doc", "context_loaded", "test_objectives", "allowed_actions", "forbidden_actions", "safety_notes", "screenshot_mode", "only_failed"]

[[steps]]
id = "init-test-state"
title = "初始化或恢复测试套件状态"
depends_on = ["normalize-scope"]
execution = "script"
idempotent = true

[steps.script]
command = ["python3", "-c", """
import hashlib, json, os, pathlib, re, shutil, time, urllib.parse
url = os.environ['URL'].strip()
prompt = os.environ['PROMPT']
state_root = pathlib.Path(os.environ.get('STATE_DIR') or '.tt/web-feature-test')
resume = os.environ.get('RESUME','true').lower() == 'true'
reset = os.environ.get('RESET','false').lower() == 'true'
only_failed = os.environ.get('ONLY_FAILED','false').lower() == 'true'
max_cases = int(os.environ.get('MAX_CASES') or '20')
browser_session_name_input = (os.environ.get('BROWSER_SESSION_NAME') or '').strip()
ignore_https_errors = os.environ.get('IGNORE_HTTPS_ERRORS','true').lower() == 'true'
suite = (os.environ.get('SUITE') or '').strip()
parsed = urllib.parse.urlparse(url)
if not suite:
    host = parsed.netloc or 'site'
    path = parsed.path.strip('/').replace('/', '_') or 'root'
    slug = re.sub(r'[^a-zA-Z0-9_.-]+', '-', f'{host}_{path}').strip('-')[:60]
    digest = hashlib.sha1((url + chr(10) + prompt).encode('utf-8')).hexdigest()[:10]
    suite = f'{slug}-{digest}'
else:
    suite = re.sub(r'[^a-zA-Z0-9_.-]+', '-', suite).strip('-')[:80]
suite_dir = state_root / suite
state_path = suite_dir / 'test-state.json'
cases_path = suite_dir / 'cases.jsonl'
runs_path = suite_dir / 'runs.jsonl'
artifacts_dir = suite_dir / 'artifacts'
screenshots_dir = artifacts_dir / 'screenshots'
if reset and suite_dir.exists():
    shutil.rmtree(suite_dir)
screenshots_dir.mkdir(parents=True, exist_ok=True)
now = time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime())
state = None
if resume and state_path.exists():
    try:
        state = json.loads(state_path.read_text(encoding='utf-8'))
    except Exception:
        state = None
if not state:
    state = {
      'schema_version': 1,
      'suite': suite,
      'root_url': url,
      'prompt': prompt,
      'prompt_fingerprint': hashlib.sha1(prompt.encode('utf-8')).hexdigest()[:12],
      'created_at': now,
      'updated_at': now,
      'cases': [],
      'runs': []
    }
state['updated_at'] = now
state['current_run_id'] = time.strftime('%Y%m%d%H%M%S', time.gmtime())
def sanitize_browser_session_name(value):
    value = re.sub(r'[^a-zA-Z0-9_-]+', '-', value or '')
    value = value.strip('-_')[:32]
    return value or 'web-feature-test-session'
session_seed = browser_session_name_input or f'web-feature-test-{suite}'
session_digest = hashlib.sha1(session_seed.encode('utf-8')).hexdigest()[:10]
session_prefix = sanitize_browser_session_name(browser_session_name_input or 'webft')[:20]
browser_session_name = f'{session_prefix}-{session_digest}'
browser_socket_dir = f'/tmp/tt-ab-{session_digest}'
state['run_options'] = {'only_failed': only_failed, 'max_cases': max_cases, 'screenshot_mode': os.environ.get('SCREENSHOT_MODE','failures'), 'vision_verify': os.environ.get('VISION_VERIFY','true').lower() == 'true', 'vision_verify_mode': os.environ.get('VISION_VERIFY_MODE','auto'), 'vision_model': os.environ.get('VISION_MODEL','qwen3-vl-plus'), 'max_concurrency': int(os.environ.get('MAX_CONCURRENCY') or '1'), 'browser_session_name': browser_session_name, 'browser_socket_dir': browser_socket_dir, 'ignore_https_errors': ignore_https_errors}
state['paths'] = {'suite_dir': str(suite_dir), 'state': str(state_path), 'cases': str(cases_path), 'runs': str(runs_path), 'artifacts': str(artifacts_dir), 'screenshots': str(screenshots_dir)}
state_path.write_text(json.dumps(state, ensure_ascii=False, indent=2), encoding='utf-8')
print(json.dumps({'suite': suite, 'suite_dir': str(suite_dir), 'state_path': str(state_path), 'cases_path': str(cases_path), 'runs_path': str(runs_path), 'artifacts_dir': str(artifacts_dir), 'screenshots_dir': str(screenshots_dir), 'browser_session_name': browser_session_name, 'browser_socket_dir': browser_socket_dir, 'ignore_https_errors': ignore_https_errors, 'resumed': bool(resume and not reset and state_path.exists()), 'only_failed': only_failed, 'existing_cases': len(state.get('cases', [])), 'current_run_id': state['current_run_id']}, ensure_ascii=False))
"""]
format = "json"
timeout = "30s"

[steps.script.env]
URL = "{{url}}"
PROMPT = "{{prompt}}"
STATE_DIR = "{{state_dir}}"
SUITE = "{{suite}}"
RESUME = "{{resume}}"
RESET = "{{reset}}"
ONLY_FAILED = "{{only_failed}}"
MAX_CASES = "{{max_cases}}"
SCREENSHOT_MODE = "{{screenshot_mode}}"
MAX_CONCURRENCY = "{{max_concurrency}}"
VISION_VERIFY = "{{vision_verify}}"
VISION_VERIFY_MODE = "{{vision_verify_mode}}"
VISION_MODEL = "{{vision_model}}"
BROWSER_SESSION_NAME = "{{browser_session_name}}"
IGNORE_HTTPS_ERRORS = "{{ignore_https_errors}}"

[steps.validate]
format = "json"
required = ["stdout"]

[[steps]]
id = "plan-test-cases"
title = "根据提示生成或更新定点测试用例"
depends_on = ["normalize-scope", "init-test-state"]
input_context = ["normalize-scope", "load-project-context.stdout", "init-test-state.stdout"]
description = """
你是 QA 测试计划 agent。请根据用户提示只生成需要测试的功能点，不要扩展成全站扫描。

请结合 .tt 项目文档中的登录方式、账号、环境说明和安全边界，生成稳定可复用的测试用例。已有状态路径为 init-test-state.stdout.state_path。

输出 ONLY compact JSON：
{
  "suite_title":"...",
  "assumptions":["..."],
  "coverage_points":[{"id":"P01","source":"提示原文中的编号或验收点","expected":"这个点的预期结果","case_ids":["TC-001"]}],
  "cases":[
    {
      "id":"TC-001",
      "title":"...",
      "objective":"...",
      "start_url":"...",
      "preconditions":["..."],
      "operation_path":[{"action":"open|click|type|select|assert|screenshot|note","target":"...","value":"...","expected":"..."}],
      "expected_result":"...",
      "risk":"low|medium|high",
      "safe_to_execute":true,
      "coverage_ids":["P01"]
    }
  ]
}

要求：
- 必须先把 '{{prompt}}' 中的每一个编号、验收点或可验证断言拆成 coverage_points；
- cases 可以按流程合并，但每个 coverage_point 必须被至少一个 case.coverage_ids 覆盖；
- 如果 prompt 有 17 个编号，coverage_points 通常也应有 17 项，报告必须能逐项说明通过/失败/阻塞/未知；
- 每个 case 必须有 start_url、operation_path、expected_result 和 coverage_ids；
- 危险操作 safe_to_execute=false，并在 operation_path 中停在危险动作前；
- id 应稳定，按功能点排序 TC-001、TC-002；
- 不要泄露密码、token、cookie。
"""
agent.name = "assistant"
agent.cwd = "{{workspace_path}}"

[steps.validate]
format = "json"
required = ["suite_title", "cases", "coverage_points"]

[[steps]]
id = "persist-test-plan"
title = "持久化测试计划和待运行状态"
depends_on = ["plan-test-cases"]
execution = "script"
idempotent = true

[steps.script]
command = ["python3", "-c", """
import hashlib, json, os, pathlib, time
state_path = pathlib.Path(os.environ['STATE_PATH'])
cases_path = pathlib.Path(os.environ['CASES_PATH'])
state = json.loads(state_path.read_text(encoding='utf-8'))
raw = os.environ.get('PLAN_JSON','').strip()
try:
    plan = json.loads(raw)
except Exception:
    plan = {'suite_title': '', 'cases': []}
now = time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime())
existing = {c.get('id'): c for c in state.get('cases', []) if c.get('id')}
merged = []
for case in plan.get('cases') or []:
    cid = case.get('id') or ('TC-' + hashlib.sha1(json.dumps(case, sort_keys=True, ensure_ascii=False).encode('utf-8')).hexdigest()[:8])
    case['id'] = cid
    old = existing.get(cid, {})
    keep = {k: old.get(k) for k in ['status','last_run_at','last_result','history'] if k in old}
    merged_case = {**old, **case, **keep}
    merged_case.setdefault('status', 'pending')
    merged_case.setdefault('history', [])
    merged.append(merged_case)
state['suite_title'] = plan.get('suite_title') or state.get('suite_title') or state.get('suite')
state['assumptions'] = plan.get('assumptions') or []
state['coverage_points'] = plan.get('coverage_points') or []
state['cases'] = merged
state['updated_at'] = now
state_path.write_text(json.dumps(state, ensure_ascii=False, indent=2), encoding='utf-8')
cases_path.write_text(''.join(json.dumps(c, ensure_ascii=False) + chr(10) for c in merged), encoding='utf-8')
runnable = [c for c in merged if (not state.get('run_options',{}).get('only_failed') or c.get('status') in ('failed','blocked','unknown','pending'))]
print(json.dumps({'state_path': str(state_path), 'cases_path': str(cases_path), 'total_cases': len(merged), 'runnable_cases': len(runnable), 'only_failed': state.get('run_options',{}).get('only_failed')}, ensure_ascii=False))
"""]
format = "json"
timeout = "30s"

[steps.script.env]
STATE_PATH = "{{init-test-state.stdout.state_path}}"
CASES_PATH = "{{init-test-state.stdout.cases_path}}"
PLAN_JSON = "{{plan-test-cases}}"

[steps.validate]
format = "json"
required = ["stdout"]

[[steps]]
id = "prepare-runnable-cases"
title = "选择本轮需执行的测试用例批次"
depends_on = ["persist-test-plan"]
execution = "script"
idempotent = true

[steps.script]
command = ["python3", "-c", """
import json, os, pathlib
state_path = pathlib.Path(os.environ['STATE_PATH'])
state = json.loads(state_path.read_text(encoding='utf-8'))
run_id = state.get('current_run_id')
opts = state.get('run_options', {})
only_failed = opts.get('only_failed', False)
max_cases = int(opts.get('max_cases') or 20)
runnable = []
for case in state.get('cases', []):
    if only_failed and case.get('status') not in ('failed','blocked','unknown','pending'):
        continue
    if len(runnable) >= max_cases:
        break
    case = dict(case)
    case['run_id'] = run_id
    runnable.append(case)
print(json.dumps({'cases': runnable, 'count': len(runnable), 'run_id': run_id, 'only_failed': only_failed, 'max_cases': max_cases}, ensure_ascii=False))
"""]
format = "json"
timeout = "10s"

[steps.script.env]
STATE_PATH = "{{init-test-state.stdout.state_path}}"

[steps.validate]
format = "json"
required = ["stdout"]

[[steps]]
id = "prepare-browser-session"
title = "准备共享浏览器会话和登录态"
depends_on = ["prepare-runnable-cases"]
execution = "script"
idempotent = true

[steps.script]
command = ["python3", "-c", """
import json, os, pathlib, subprocess, time


def load_json(value, default):
    try:
        if not value or value.lstrip().startswith('{{'):
            return default
        return json.loads(value)
    except Exception:
        return default


def compact(value, limit=600):
    text = str(value or '').strip()
    return text if len(text) <= limit else text[:limit] + '...'


init_state = load_json(os.environ.get('INIT_TEST_STATE', ''), {})
scope = load_json(os.environ.get('NORMALIZE_SCOPE', ''), {})
target_url = scope.get('target_url') or init_state.get('root_url') or os.environ.get('URL') or ''
session_name = init_state.get('browser_session_name') or os.environ.get('BROWSER_SESSION_NAME') or 'web-feature-test'
socket_dir = init_state.get('browser_socket_dir') or ''
screenshots_dir = pathlib.Path(init_state.get('screenshots_dir') or '.tt/web-feature-test/screenshots')
screenshots_dir.mkdir(parents=True, exist_ok=True)
preflight_png = screenshots_dir / ('preflight-' + str(int(time.time())) + '.png')

env = os.environ.copy()
env['AGENT_BROWSER_ENGINE'] = os.environ.get('BROWSER_ENGINE') or 'chrome'
env['AGENT_BROWSER_HEADED'] = os.environ.get('BROWSER_HEADED') or 'false'
if os.environ.get('BROWSER_EXECUTABLE_PATH'):
    env['AGENT_BROWSER_EXECUTABLE_PATH'] = os.environ['BROWSER_EXECUTABLE_PATH']
if os.environ.get('WEBGL_BROWSER_ARGS'):
    env['AGENT_BROWSER_ARGS'] = os.environ['WEBGL_BROWSER_ARGS']
env['AGENT_BROWSER_SESSION_NAME'] = session_name
if socket_dir:
    env['AGENT_BROWSER_SOCKET_DIR'] = socket_dir
env['AGENT_BROWSER_SCREENSHOT_DIR'] = str(screenshots_dir)

base = ['agent-browser']
common = ['--session', session_name]
evidence = []
artifacts = []
status = 'unknown'
final_url = ''
login_state = 'unknown'
webgl_state = 'unknown'
notes = ''


def run_ab(args, timeout=45):
    proc = subprocess.run(base + args + common, cwd=os.getcwd(), env=env, text=True, capture_output=True, timeout=timeout)
    return {'ok': proc.returncode == 0, 'code': proc.returncode, 'stdout': proc.stdout.strip(), 'stderr': proc.stderr.strip(), 'cmd': ' '.join(base + args + common)}

try:
    if not target_url:
        raise RuntimeError('target_url is empty')

    opened = run_ab(['open', target_url, '--json'], timeout=90)
    if not opened['ok']:
        status = 'blocked'
        notes = 'agent-browser open failed during deterministic preflight.'
        evidence.append('open failed: ' + compact(opened.get('stderr') or opened.get('stdout')))
    else:
        evidence.append('agent-browser open succeeded for shared session ' + session_name)
        url_result = run_ab(['get', 'url', '--json'], timeout=20)
        final_url = compact(url_result.get('stdout')) if url_result['ok'] else ''
        if final_url.startswith('{'):
            parsed_url = load_json(final_url, {})
            data = parsed_url.get('data') if isinstance(parsed_url, dict) else None
            if isinstance(data, dict):
                final_url = data.get('url') or data.get('value') or final_url
            else:
                final_url = parsed_url.get('url') or parsed_url.get('value') or final_url
        title_result = run_ab(['get', 'title', '--json'], timeout=20)
        title_text = compact(title_result.get('stdout')) if title_result['ok'] else ''
        login_markers = ['login', 'sign in', 'signin', 'auth', '登录']
        login_probe = (final_url + ' ' + title_text).lower()
        if any(marker in login_probe for marker in login_markers):
            status = 'blocked'
            login_state = 'blocked'
            notes = 'Browser reached an authentication page. Deterministic preflight does not guess login flows; provide saved session or add a deterministic login script.'
            evidence.append('authentication marker found in URL/title: ' + compact(final_url + ' ' + title_text))
        else:
            login_state = 'already-authenticated'
            webgl = run_ab(['eval', "(() => { const c = document.createElement('canvas'); const gl = c.getContext('webgl2') || c.getContext('webgl'); if (!gl) return JSON.stringify({available:false}); const dbg = gl.getExtension('WEBGL_debug_renderer_info'); return JSON.stringify({available:true, vendor: dbg ? gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL) : gl.getParameter(gl.VENDOR), renderer: dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER)}); })()", '--json'], timeout=20)
            if webgl['ok']:
                webgl_state = 'available' if 'true' in webgl.get('stdout', '').lower() else 'unavailable'
                evidence.append('WebGL probe: ' + compact(webgl.get('stdout')))
            else:
                webgl_state = 'unknown'
                evidence.append('WebGL probe failed: ' + compact(webgl.get('stderr') or webgl.get('stdout')))
            shot = run_ab(['screenshot', str(preflight_png)], timeout=30)
            if shot['ok'] and preflight_png.exists():
                artifacts.append({'type': 'screenshot', 'path': str(preflight_png), 'description': 'Deterministic preflight screenshot'})
                evidence.append('preflight screenshot saved: ' + str(preflight_png))
            status = 'ready'
            notes = 'Deterministic agent-browser preflight opened the target URL in the shared session.'
except subprocess.TimeoutExpired as exc:
    status = 'blocked'
    notes = 'agent-browser command timed out during deterministic preflight.'
    evidence.append('timeout: ' + compact(exc))
except Exception as exc:
    status = 'blocked'
    notes = 'deterministic preflight raised an exception.'
    evidence.append(type(exc).__name__ + ': ' + compact(exc))

if not final_url:
    final_url = target_url if status == 'ready' else 'unknown'

print(json.dumps({
    'status': status,
    'browser_session_name': session_name,
    'target_url': target_url,
    'final_url': final_url,
    'login_state': login_state,
    'webgl_state': webgl_state,
    'evidence': evidence,
    'artifacts': artifacts,
    'safe_to_run_cases': status == 'ready',
    'notes': notes,
}, ensure_ascii=False))
"""]
