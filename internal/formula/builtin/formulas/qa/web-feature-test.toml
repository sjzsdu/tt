[[steps]]
id = "validate-test-results"
title = "校验用例执行不是空跑"
depends_on = ["test-loop", "gate-runnable-cases"]
execution = "script"
idempotent = true

[steps.script]
command = ["python3", "-c", """
import json, os, sys

def load_json(value, default):
    try:
        if not value or value.lstrip().startswith('{{'):
            return default
        return json.loads(value)
    except Exception:
        return default

results = load_json(os.environ.get('RESULTS_JSON', ''), [])
gate = load_json(os.environ.get('GATE_RUNNABLE_CASES', ''), {})
if isinstance(results, dict):
    results = [results]
if not isinstance(results, list):
    results = []

cases = gate.get('cases') or []
safe = bool(gate.get('safe_to_run_cases'))
if not safe or not cases:
    print(json.dumps({'results': results, 'validated_count': len(results), 'skipped': True, 'notes': 'No runnable cases after browser preflight gate.'}, ensure_ascii=False))
    sys.exit(0)

errors = []
if not results:
    errors.append('test-loop returned no results for runnable cases')

known_case_ids = {c.get('id') for c in cases if c.get('id')}
result_case_ids = {r.get('case_id') for r in results if isinstance(r, dict)}
missing = sorted(known_case_ids - result_case_ids)
if missing:
    errors.append('test-loop omitted runnable cases: ' + ', '.join(missing))

all_unknown = bool(results) and all((r.get('status') == 'unknown') for r in results if isinstance(r, dict))
no_operations = bool(results) and all(not (r.get('operation_path') or []) for r in results if isinstance(r, dict))
corpus = json.dumps(results, ensure_ascii=False).lower()
command_misuse_markers = [
    'missing arguments for:',
    'usage: agent-browser get text <selector>',
    'did not complete the full ui interaction sequence',
    '未完成提示中要求的细粒度 ui 交互',
    'no actual ui validation',
]
if all_unknown and no_operations:
    errors.append('test-loop returned all unknown results with empty operation_path, which indicates a no-op execution')
if any(marker in corpus for marker in command_misuse_markers):
    errors.append('test-loop evidence contains agent-browser command misuse or explicit no-op language')

if errors:
    print(json.dumps({
        'status': 'failed',
        'errors': errors,
        'result_count': len(results),
        'case_count': len(cases),
        'advice': 'Retry test-loop with real agent-browser selector/snapshot/click/screenshot commands, or convert the deterministic selector operations into script steps.'
    }, ensure_ascii=False))
    sys.exit(1)

print(json.dumps({'status': 'passed', 'results': results, 'validated_count': len(results), 'case_count': len(cases)}, ensure_ascii=False))
"""]
format = "json"
timeout = "10s"

[steps.script.env]
RESULTS_JSON = "{{test-loop.stdout}}"
GATE_RUNNABLE_CASES = "{{gate-runnable-cases.stdout}}"

[steps.validate]
format = "json"
required = ["stdout"]

[[steps]]
id = "merge-case-results"
title = "串行合并并发测试结果"
depends_on = ["validate-test-results", "gate-runnable-cases"]
execution = "script"
idempotent = true

[steps.script]
command = ["python3", "-c", """
import json, os, pathlib, re, shutil, time
state_path = pathlib.Path(os.environ['STATE_PATH'])
runs_path = pathlib.Path(os.environ['RUNS_PATH'])
state = json.loads(state_path.read_text(encoding='utf-8'))
now = time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime())
raw = os.environ.get('RESULTS_JSON','') or '[]'
if raw.lstrip().startswith('{{') and raw.rstrip().endswith('}}'):
    raw = '[]'
skipped_raw = os.environ.get('SKIPPED_RESULTS_JSON','') or '[]'
if skipped_raw.lstrip().startswith('{{') and skipped_raw.rstrip().endswith('}}'):
    skipped_raw = '[]'
try:
    results = json.loads(raw)
except Exception:
    results = []
if isinstance(results, dict):
    results = [results]
try:
    skipped_results = json.loads(skipped_raw)
except Exception:
    skipped_results = []
if isinstance(skipped_results, dict):
    skipped_results = [skipped_results]
results.extend(skipped_results)
run_id = state.get('current_run_id')
runs_path.parent.mkdir(parents=True, exist_ok=True)
artifacts_dir = pathlib.Path(state.get('paths', {}).get('artifacts') or state_path.parent / 'artifacts')
screenshots_dir = pathlib.Path(state.get('paths', {}).get('screenshots') or artifacts_dir / 'screenshots')
screenshots_dir.mkdir(parents=True, exist_ok=True)
shot_re = re.compile(r'''(/[^\\s\"']*\\.agent-browser/tmp/screenshots/[^\\s\"']+\\.(?:png|jpg|jpeg|webp))''')

def relpath(path):
    try:
        return str(pathlib.Path(path).relative_to(pathlib.Path.cwd()))
    except Exception:
        return str(path)

def archive_temp_screenshots(result):
    case_id = result.get('case_id') or 'case'
    corpus = json.dumps(result, ensure_ascii=False)
    for artifact in result.get('artifacts') or []:
        if not isinstance(artifact, dict):
            continue
        path_text = artifact.get('path') or ''
        p = pathlib.Path(path_text)
        if not p.is_absolute():
            p = pathlib.Path.cwd() / p
        if p.exists() and p.is_file() and p.suffix.lower() in ('.txt', '.log', '.md'):
            try:
                corpus += chr(10) + p.read_text(encoding='utf-8', errors='replace')
            except Exception:
                pass
    added = []
    for raw_path in sorted(set(shot_re.findall(corpus))):
        src = pathlib.Path(raw_path)
        if not src.exists() or not src.is_file():
            continue
        safe_name = re.sub(r'[^A-Za-z0-9_.-]+', '-', f"{case_id}-{src.name}")
        dest = screenshots_dir / safe_name
        try:
            if src.resolve() != dest.resolve():
                shutil.copy2(src, dest)
            added.append({'type': 'screenshot', 'path': relpath(dest), 'description': 'Archived agent-browser screenshot from temporary directory'})
        except Exception as exc:
            added.append({'type': 'note', 'path': str(src), 'description': f'Failed to archive temporary screenshot: {exc}'})
    if added:
        existing = result.setdefault('artifacts', [])
        existing_paths = {a.get('path') for a in existing if isinstance(a, dict)}
        for item in added:
            if item.get('path') not in existing_paths:
                existing.append(item)
    return added

by_id = {c.get('id'): c for c in state.get('cases', [])}
archived_screenshots = []
for result in results:
    if not isinstance(result, dict):
        continue
    case_id = result.get('case_id')
    archived_screenshots.extend(archive_temp_screenshots(result))
    record = {'run_id': run_id, 'ran_at': now, **result}
    case = by_id.get(case_id)
    if case is not None:
        case['status'] = result.get('status','unknown')
        case['last_run_at'] = now
        case['last_selected_run'] = run_id
        case['last_result'] = result
        case.setdefault('history', []).append(record)
    state.setdefault('runs', []).append(record)
    with runs_path.open('a', encoding='utf-8') as f:
        f.write(json.dumps(record, ensure_ascii=False) + chr(10))
coverage_status = {}
for point in state.get('coverage_points', []):
    pid = point.get('id')
    matches = []
    for case in state.get('cases', []):
        lr = case.get('last_result') or {}
        for cr in lr.get('coverage_results') or []:
            if cr.get('coverage_id') == pid:
                matches.append(cr)
    if not matches:
        status = 'pending'
    elif any(m.get('status') == 'failed' for m in matches):
        status = 'failed'
    elif any(m.get('status') == 'blocked' for m in matches):
        status = 'blocked'
    elif any(m.get('status') == 'unknown' for m in matches):
        status = 'unknown'
    elif all(m.get('status') == 'passed' for m in matches):
        status = 'passed'
    else:
        status = 'unknown'
    point['status'] = status
    point['results'] = matches
    coverage_status[pid] = status
state['updated_at'] = now
state.pop('current_run_id', None)
state_path.write_text(json.dumps(state, ensure_ascii=False, indent=2), encoding='utf-8')
counts = {s: sum(1 for c in state.get('cases', []) if c.get('status') == s) for s in ['passed','failed','blocked','unknown','pending']}
coverage_counts = {s: sum(1 for p in state.get('coverage_points', []) if p.get('status') == s) for s in ['passed','failed','blocked','unknown','pending']}
print(json.dumps({'merged': len(results), 'counts': counts, 'coverage_counts': coverage_counts, 'archived_screenshots': archived_screenshots, 'state_path': str(state_path), 'runs_path': str(runs_path), 'screenshots_dir': str(screenshots_dir)}, ensure_ascii=False))
"""]
format = "json"
timeout = "30s"

