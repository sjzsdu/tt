[[steps]]
id = "cleanup-browser-session"
title = "关闭本次 agent-browser 会话"
depends_on = ["load-final-state"]
execution = "script"
idempotent = true

[steps.script]
command = ["python3", "-c", """
import json, os, subprocess


def load_json(value, default):
    try:
        if not value or value.lstrip().startswith('{{'):
            return default
        return json.loads(value)
    except Exception:
        return default


def compact(value, limit=1000):
    text = str(value or '').strip()
    return text if len(text) <= limit else text[:limit] + '...'


should_close = os.environ.get('CLOSE_BROWSER_AFTER_RUN', 'true').lower() not in ('0', 'false', 'no', 'off')
init_state = load_json(os.environ.get('INIT_TEST_STATE', ''), {})
prepared = load_json(os.environ.get('PREPARE_BROWSER_SESSION', ''), {})
session_name = prepared.get('browser_session_name') or init_state.get('browser_session_name') or os.environ.get('BROWSER_SESSION_NAME') or ''
socket_dir = init_state.get('browser_socket_dir') or ''
env = os.environ.copy()
if socket_dir:
    env['AGENT_BROWSER_SOCKET_DIR'] = socket_dir
if session_name:
    env['AGENT_BROWSER_SESSION_NAME'] = session_name

result = {
    'enabled': should_close,
    'session': session_name,
    'socket_dir': socket_dir,
    'status': 'skipped',
    'command': '',
    'stdout': '',
    'stderr': '',
    'exit_code': None,
}

if should_close and session_name:
    cmd = ['agent-browser', 'close', '--session', session_name]
    result['command'] = ' '.join(cmd)
    try:
        proc = subprocess.run(cmd, cwd=os.getcwd(), env=env, text=True, capture_output=True, timeout=30)
        result['exit_code'] = proc.returncode
        result['stdout'] = compact(proc.stdout)
        result['stderr'] = compact(proc.stderr)
        result['status'] = 'closed' if proc.returncode == 0 else 'failed'
    except subprocess.TimeoutExpired as exc:
        result['status'] = 'timeout'
        result['stderr'] = compact(exc)
    except FileNotFoundError:
        result['status'] = 'unavailable'
        result['stderr'] = 'agent-browser executable not found'
    except Exception as exc:
        result['status'] = 'failed'
        result['stderr'] = type(exc).__name__ + ': ' + compact(exc)
elif should_close:
    result['status'] = 'skipped'
    result['stderr'] = 'No session name found to close.'

print(json.dumps(result, ensure_ascii=False))
"""]
format = "json"
timeout = "45s"

