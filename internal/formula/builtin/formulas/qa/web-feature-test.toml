[steps.script]
command = ["python3", "-c", """
import json, os, pathlib, re, shutil, subprocess, time


def load_json(value, default):
    try:
        if not value or value.lstrip().startswith('{{'):
            return default
        return json.loads(value)
    except Exception:
        return default


def compact(value, limit=800):
    text = str(value or '').strip()
    return text if len(text) <= limit else text[:limit] + '...'


def parse_json_stdout(result):
    text = result.get('stdout') or ''
    try:
        obj = json.loads(text)
        if isinstance(obj, dict) and obj.get('success') and isinstance(obj.get('data'), dict):
            return obj['data']
        return obj
    except Exception:
        return text


def extract_selectors(text):
    text = str(text or '')
    selectors = []
    patterns = [
        r'\\[[^\\]]*(?:data-testid|data-sentry-event|aria-label|role|name|title|type|id|class)[^\\]]*\\]',
        r'(?:button|input|textarea|select|canvas|div|span|a)\\[[^\\]]+\\]',
        r'#[A-Za-z0-9_-]+',
        r'\\.[A-Za-z][A-Za-z0-9_-]+',
    ]
    for pat in patterns:
        for match in re.findall(pat, text):
            if match not in selectors:
                selectors.append(match)
    return selectors


def status_from_block(case, reason, evidence, artifacts=None, final_url=''):
    covs = case.get('coverage_ids') or []
    return {
        'case_id': case.get('id') or 'unknown-case',
        'status': 'blocked',
        'start_url': case.get('start_url') or target_url,
        'final_url': final_url,
        'coverage_results': [{'coverage_id': c, 'status': 'blocked', 'expected': '', 'actual': reason, 'evidence': evidence} for c in covs],
        'operation_path': [],
        'expected_result': case.get('expected_result') or '',
        'actual_result': reason,
        'evidence': evidence,
        'artifacts': artifacts or [],
        'failure_reason': reason,
        'safe_to_rerun': True,
        'notes': 'Blocked by deterministic action runner.'
    }


def run_ab(args, timeout=45):
    proc = subprocess.run(['agent-browser'] + args + common, cwd=os.getcwd(), env=env, text=True, capture_output=True, timeout=timeout)
    return {'ok': proc.returncode == 0, 'code': proc.returncode, 'stdout': proc.stdout.strip(), 'stderr': proc.stderr.strip(), 'cmd': ' '.join(['agent-browser'] + args + common)}


def get_current_url():
    r = run_ab(['get', 'url', '--json'], timeout=15)
    data = parse_json_stdout(r)
    if isinstance(data, dict):
        return data.get('url') or data.get('value') or compact(r.get('stdout'))
    return compact(data)


def page_is_signin():
    url = get_current_url().lower()
    title = compact(parse_json_stdout(run_ab(['get', 'title', '--json'], timeout=15))).lower()
    snap = run_ab(['snapshot'], timeout=20)
    body = (url + ' ' + title + ' ' + snap.get('stdout','')).lower()
    return ('sign-in' in url or 'login' in body or 'sign in' in body or 'password' in body), url, snap


def try_login(context_doc, target):
    email = ''
    password = ''
    m = re.search(r'(?:账号|email|user|username)\\s*[：:]\\s*(\\S+)', context_doc, re.I)
    if m:
        email = m.group(1).strip()
    m = re.search(r'(?:密码|password)\\s*[：:]\\s*(\\S+)', context_doc, re.I)
    if m:
        password = m.group(1).strip()
    evidence = []
    if not email or not password:
        return False, ['No deterministic credentials found in context_doc.']
    email_selectors = ['input[type="email"]', 'input[name="email"]', 'input[autocomplete="username"]', 'input[placeholder*="email" i]', 'input']
    pass_selectors = ['input[type="password"]', 'input[name="password"]', 'input[autocomplete="current-password"]']
    ok_email = False
    for sel in email_selectors:
        r = run_ab(['fill', sel, email], timeout=15)
        evidence.append(r['cmd'] + ' -> ' + ('ok' if r['ok'] else compact(r['stderr'] or r['stdout'])))
        if r['ok']:
            ok_email = True
            break
    ok_pass = False
    for sel in pass_selectors:
        r = run_ab(['fill', sel, password], timeout=15)
        evidence.append(r['cmd'] + ' -> ' + ('ok' if r['ok'] else compact(r['stderr'] or r['stdout'])))
        if r['ok']:
            ok_pass = True
            break
    if not (ok_email and ok_pass):
        return False, evidence
    for sel in ['button[type="submit"]', 'button:has-text("Sign In")', 'button:has-text("Log in")', 'button']:
        r = run_ab(['click', sel], timeout=20)
        evidence.append(r['cmd'] + ' -> ' + ('ok' if r['ok'] else compact(r['stderr'] or r['stdout'])))
        if r['ok']:
            break
    run_ab(['wait', '3000'], timeout=8)
    run_ab(['open', target, '--json'], timeout=60)
    run_ab(['wait', '3000'], timeout=8)
    still_signin, _, _ = page_is_signin()
    return not still_signin, evidence


def ensure_target_ready(target, context_doc):
    evidence = []
    opened = run_ab(['open', target, '--json'], timeout=90)
    evidence.append(opened['cmd'] + ' -> ' + ('ok' if opened['ok'] else compact(opened['stderr'] or opened['stdout'])))
    if not opened['ok']:
        return False, 'open failed', evidence
    run_ab(['wait', '3000'], timeout=8)
    signin, url, snap = page_is_signin()
    evidence.append('current_url=' + url)
    if signin:
        evidence.append('Sign-in page detected; attempting deterministic login from context_doc.')
        ok, login_evidence = try_login(context_doc, target)
        evidence.extend(login_evidence)
        if not ok:
            return False, 'login required but deterministic login failed', evidence
    signin, url, _ = page_is_signin()
    evidence.append('post_login_url=' + url)
    if signin:
        return False, 'still on sign-in page after login attempt', evidence
    return True, '', evidence


def execute_action(action, case_id, step_index):
    kind = str(action.get('action') or action.get('type') or '').lower().strip()
    target = str(action.get('target') or action.get('selector') or '')
    value = str(action.get('value') or '')
    expected = str(action.get('expected') or '')
    selectors = extract_selectors(target)
    before = get_current_url()
    evidence = []
    result = 'passed'
    observation = ''
    artifacts = []

    if kind in ('note', ''):
        observation = target or expected or 'note'
    elif kind == 'open':
        url = value or target or target_url
        if not re.match(r'^https?://', url, re.I):
            url = target_url
        r = run_ab(['open', url, '--json'], timeout=90)
        evidence.append(r['cmd'] + ' -> ' + ('ok' if r['ok'] else compact(r['stderr'] or r['stdout'])))
        result = 'passed' if r['ok'] else 'blocked'
        observation = 'opened ' + url if r['ok'] else 'open failed'
    elif kind in ('click', 'tap'):
        if not selectors:
            result = 'blocked'; observation = 'click target has no executable selector'
        else:
            r = run_ab(['click', selectors[0]], timeout=30)
            evidence.append(r['cmd'] + ' -> ' + ('ok' if r['ok'] else compact(r['stderr'] or r['stdout'])))
            result = 'passed' if r['ok'] else 'failed'
            observation = 'clicked ' + selectors[0] if r['ok'] else 'click failed for ' + selectors[0]
    elif kind in ('type', 'fill'):
        if not selectors:
            result = 'blocked'; observation = 'type/fill target has no executable selector'
        else:
            r = run_ab(['fill', selectors[0], value], timeout=30)
            evidence.append(r['cmd'] + ' -> ' + ('ok' if r['ok'] else compact(r['stderr'] or r['stdout'])))
            result = 'passed' if r['ok'] else 'failed'
            observation = 'filled ' + selectors[0] if r['ok'] else 'fill failed for ' + selectors[0]
    elif kind == 'select':
        if not selectors:
            result = 'blocked'; observation = 'select target has no executable selector'
        else:
            r = run_ab(['select', selectors[0], value], timeout=30)
            evidence.append(r['cmd'] + ' -> ' + ('ok' if r['ok'] else compact(r['stderr'] or r['stdout'])))
            result = 'passed' if r['ok'] else 'failed'
            observation = 'selected ' + value + ' in ' + selectors[0] if r['ok'] else 'select failed for ' + selectors[0]
    elif kind in ('assert', 'expect', 'expect_visible'):
        if selectors:
            r = run_ab(['is', 'visible', selectors[0]], timeout=20)
            evidence.append(r['cmd'] + ' -> ' + ('ok' if r['ok'] else compact(r['stderr'] or r['stdout'])))
            result = 'passed' if r['ok'] else 'failed'
            observation = selectors[0] + (' visible' if r['ok'] else ' not visible')
        else:
            result = 'blocked'; observation = 'assertion requires visual/manual interpretation or lacks selector: ' + compact(expected or target)
    elif kind == 'screenshot':
        shot = pathlib.Path(screenshots_dir) / f'{case_id}-{step_index}.png'
        r = run_ab(['screenshot', str(shot)], timeout=30)
        evidence.append(r['cmd'] + ' -> ' + ('ok' if r['ok'] else compact(r['stderr'] or r['stdout'])))
        if r['ok'] and shot.exists():
            artifacts.append({'type': 'screenshot', 'path': str(shot), 'description': f'{case_id} step {step_index} screenshot'})
        result = 'passed' if r['ok'] else 'blocked'
        observation = 'screenshot saved' if r['ok'] else 'screenshot failed'
    else:
        result = 'blocked'; observation = 'unsupported action kind: ' + kind

    after = get_current_url()
    return {
        'step': step_index,
        'action': kind or 'note',
        'target': target,
        'value': '<redacted>' if 'password' in target.lower() else value,
        'url_before': before,
        'url_after': after,
        'result': result,
        'observation': observation,
        'evidence': evidence,
        'artifacts': artifacts,
    }


def latest_screenshot_artifact(artifacts):
    for artifact in reversed(artifacts or []):
        if not isinstance(artifact, dict) or artifact.get('type') != 'screenshot':
            continue
        path = pathlib.Path(str(artifact.get('path') or ''))
        if not path.is_absolute():
            path = pathlib.Path.cwd() / path
        if path.exists() and path.is_file():
            return path
    return None


def ensure_final_screenshot(case_id, artifacts, evidence):
    existing = latest_screenshot_artifact(artifacts)
    if existing:
        return existing
    shot = pathlib.Path(screenshots_dir) / f'{case_id}-vision-final.png'
    r = run_ab(['screenshot', str(shot)], timeout=30)
    evidence.append(r['cmd'] + ' -> ' + ('ok' if r['ok'] else compact(r['stderr'] or r['stdout'])))
    if r['ok'] and shot.exists():
        artifacts.append({'type': 'screenshot', 'path': str(shot), 'description': f'{case_id} final screenshot for vision verification'})
        return shot
    return None


def parse_vision_json(text):
    raw = str(text or '').strip()
    if not raw:
        return None
    for candidate in [raw, raw[raw.find('{'):raw.rfind('}') + 1] if '{' in raw and '}' in raw else '']:
        if not candidate:
            continue
        try:
            parsed = json.loads(candidate)
            if isinstance(parsed, dict):
                if isinstance(parsed.get('data'), dict):
                    return parsed['data']
                if isinstance(parsed.get('data'), str):
                    nested = parse_vision_json(parsed.get('data'))
                    if isinstance(nested, dict):
                        return nested
                    parsed['raw_output'] = parsed.get('data')
                return parsed
        except Exception:
            pass
    return None


def should_verify_with_vision(case, artifacts, op_results, overall):
    if not vision_verify or vision_verify_mode in ('none', 'off', 'false'):
        return False, 'vision verification disabled'
    if vision_verify_mode == 'all':
        return True, 'mode=all'
    if vision_verify_mode in ('failures', 'failed'):
        return overall != 'passed', 'mode=failures and deterministic status=' + overall
    corpus = json.dumps({'case': case, 'operations': op_results}, ensure_ascii=False).lower()
    visual_keywords = [
        'canvas', 'webgl', 'screenshot', 'visual', 'visible', 'image', '3d', 'viewer', 'render', 'color', 'colour',
        'probe', 'visualization', 'field', 'surface', 'mesh', 'model', 'geometry', '截图', '视觉', '可见', '颜色',
        '模型', '探针', '云图', '渲染', '画布'
    ]
    if artifacts:
        return True, 'case has screenshot/artifacts'
    if overall != 'passed':
        return True, 'deterministic status=' + overall
    if any(keyword in corpus for keyword in visual_keywords):
        return True, 'visual keyword matched in case definition'
    if any((op.get('action') == 'screenshot') for op in (op_results or []) if isinstance(op, dict)):
        return True, 'case includes screenshot action'
    return False, 'auto skipped pure DOM passed case'


def verify_case_with_vision(case, artifacts, evidence, overall, op_results):
    if not vision_verify:
        return None, overall
    should_verify, mode_reason = should_verify_with_vision(case, artifacts, op_results, overall)
    if not should_verify:
        return {'enabled': True, 'status': 'skipped', 'mode': vision_verify_mode, 'reason': mode_reason}, overall
    cid = case.get('id') or 'unknown-case'
    shot = ensure_final_screenshot(cid, artifacts, evidence)
    if not shot:
        return {'enabled': True, 'status': 'unavailable', 'reason': 'no screenshot available for visual verification'}, overall
    if not shutil.which('bl'):
        return {'enabled': True, 'status': 'unavailable', 'screenshot': str(shot), 'reason': 'bl CLI not found'}, overall
    prompt_text = f'''
你是 WebGL/canvas 页面测试验收员。请只根据截图判断本用例的视觉结果是否满足预期。

测试用例：{case.get('id') or ''} {case.get('title') or ''}
测试目标：{case.get('objective') or ''}
预期结果：{case.get('expected_result') or ''}
覆盖点：{json.dumps(case.get('coverage_ids') or [], ensure_ascii=False)}

请输出 ONLY JSON，不要 Markdown：
{{"verdict":"passed|failed|uncertain","confidence":0.0,"reason":"简短中文原因","observations":["截图中可见的关键证据"]}}

判断规则：
- 如果截图清楚显示预期已经满足，verdict=passed。
- 如果截图清楚显示预期没有满足或出现错误，verdict=failed。
- 如果截图无法判断、内容被遮挡、还在 loading、需要交互后的动态状态但截图证据不足，verdict=uncertain。
'''.strip()
    try:
        proc = subprocess.run(['bl', 'vision', 'describe', '--image', str(shot), '--prompt', prompt_text, '--model', vision_model, '--output', 'json', '--quiet', '--non-interactive'], cwd=os.getcwd(), env=os.environ.copy(), text=True, capture_output=True, timeout=90)
    except Exception as exc:
        return {'enabled': True, 'status': 'unavailable', 'screenshot': str(shot), 'reason': 'vision command failed: ' + compact(exc)}, overall
    parsed = parse_vision_json(proc.stdout)
    if parsed is None:
        parsed = {'raw_output': compact(proc.stdout or proc.stderr, 2000)}
    verdict = str(parsed.get('verdict') or parsed.get('status') or '').lower().strip()
    if verdict not in ('passed', 'failed', 'uncertain'):
        lower = json.dumps(parsed, ensure_ascii=False).lower()
        if 'passed' in lower or '通过' in lower or '满足' in lower:
            verdict = 'passed'
        elif 'failed' in lower or '失败' in lower or '不满足' in lower:
            verdict = 'failed'
        else:
            verdict = 'uncertain'
    visual = {'enabled': True, 'status': verdict, 'mode': vision_verify_mode, 'mode_reason': mode_reason, 'screenshot': str(shot), 'model': vision_model, 'exit_code': proc.returncode, 'reason': parsed.get('reason') or parsed.get('raw_output') or '', 'observations': parsed.get('observations') or [], 'raw': parsed}
    evidence.append('vision verification -> ' + verdict + ': ' + compact(visual.get('reason')))
    if verdict == 'failed':
        overall = 'failed'
    elif verdict == 'passed' and overall in ('passed', 'blocked'):
        overall = 'passed'
    return visual, overall


gate = load_json(os.environ.get('GATE_RUNNABLE_CASES', ''), {})
prepared = load_json(os.environ.get('PREPARE_BROWSER_SESSION', ''), {})
init_state = load_json(os.environ.get('INIT_TEST_STATE', ''), {})
context_doc = load_json(os.environ.get('LOAD_PROJECT_CONTEXT', ''), {}).get('content') or ''
cases = gate.get('cases') or []
target_url = prepared.get('target_url') or init_state.get('root_url') or os.environ.get('URL') or ''
session_name = prepared.get('browser_session_name') or init_state.get('browser_session_name') or 'web-feature-test'
socket_dir = init_state.get('browser_socket_dir') or ''
screenshots_dir = pathlib.Path(init_state.get('screenshots_dir') or '.tt/web-feature-test/screenshots')
screenshots_dir.mkdir(parents=True, exist_ok=True)
vision_verify = os.environ.get('VISION_VERIFY', 'true').lower() == 'true'
vision_verify_mode = (os.environ.get('VISION_VERIFY_MODE') or init_state.get('vision_verify_mode') or 'auto').lower().strip()
vision_model = os.environ.get('VISION_MODEL') or init_state.get('vision_model') or 'qwen3-vl-plus'

env = os.environ.copy()
env['AGENT_BROWSER_ENGINE'] = os.environ.get('BROWSER_ENGINE') or 'chrome'
env['AGENT_BROWSER_HEADED'] = os.environ.get('BROWSER_HEADED') or 'false'
if os.environ.get('BROWSER_EXECUTABLE_PATH'):
    env['AGENT_BROWSER_EXECUTABLE_PATH'] = os.environ['BROWSER_EXECUTABLE_PATH']
if os.environ.get('WEBGL_BROWSER_ARGS'):
    env['AGENT_BROWSER_ARGS'] = os.environ['WEBGL_BROWSER_ARGS']
env['AGENT_BROWSER_SESSION_NAME'] = session_name
if socket_dir:
    env['AGENT_BROWSER_SOCKET_DIR'] = socket_dir
env['AGENT_BROWSER_SCREENSHOT_DIR'] = str(screenshots_dir)
common = ['--session', session_name]

results = []
for case in cases:
    cid = case.get('id') or 'unknown-case'
    start_url = case.get('start_url') or target_url
    ready, block_reason, ready_evidence = ensure_target_ready(start_url, context_doc)
    if not ready:
        results.append(status_from_block(case, block_reason, ready_evidence, final_url=get_current_url()))
        continue
    op_results = []
    artifacts = []
    evidence = list(ready_evidence)
    overall = 'passed'
    for idx, action in enumerate(case.get('operation_path') or [], start=1):
        step = execute_action(action, cid, idx)
        op_results.append({k: v for k, v in step.items() if k not in ('evidence','artifacts')})
        evidence.extend(step.get('evidence') or [])
        artifacts.extend(step.get('artifacts') or [])
        if step['result'] == 'failed' and overall == 'passed':
            overall = 'failed'
        elif step['result'] == 'blocked' and overall == 'passed':
            overall = 'blocked'
    if not op_results:
        overall = 'blocked'
        evidence.append('case has no executable operation_path')
    final_url = get_current_url()
    visual_verification, overall = verify_case_with_vision(case, artifacts, evidence, overall, op_results)
    cov_status = overall
    coverage_actual = 'deterministic runner status: ' + overall
    if visual_verification:
        coverage_actual += '; visual verification: ' + str(visual_verification.get('status'))
    coverage_results = [{'coverage_id': cov, 'status': cov_status, 'expected': case.get('expected_result') or '', 'actual': coverage_actual, 'evidence': evidence[-8:], 'visual_verification': visual_verification} for cov in (case.get('coverage_ids') or [])]
    results.append({
        'case_id': cid,
        'status': overall,
        'start_url': start_url,
        'final_url': final_url,
        'coverage_results': coverage_results,
        'operation_path': op_results,
        'expected_result': case.get('expected_result') or '',
        'actual_result': 'deterministic action runner completed with status ' + overall,
        'visual_verification': visual_verification,
        'evidence': evidence,
        'artifacts': artifacts,
        'failure_reason': '' if overall == 'passed' else 'one or more deterministic actions failed or were blocked',
        'safe_to_rerun': True,
        'notes': 'Executed by script-based action runner. Visual/canvas assertions are verified from screenshots by default with vision_verify_mode=auto; pure DOM passed cases may skip vision to control cost.'
    })

print(json.dumps(results, ensure_ascii=False))
"""]
format = "json"
timeout = "600s"

[steps.script.env]
GATE_RUNNABLE_CASES = "{{gate-runnable-cases.stdout}}"
PREPARE_BROWSER_SESSION = "{{prepare-browser-session.stdout}}"
INIT_TEST_STATE = "{{init-test-state.stdout}}"
LOAD_PROJECT_CONTEXT = "{{load-project-context.stdout}}"
URL = "{{url}}"
