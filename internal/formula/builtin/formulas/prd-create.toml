formula = "prd-create"
title = "生成 PRD"
description = "根据产品想法或功能需求生成产品需求文档。"
version = 1
type = "workflow"
category = "产品"
tags = ["内置", "产品"]

[vars]
idea = { description = "产品想法或功能需求", required = true }

[[steps]]
id = "problem"
title = "定义问题和用户"
description = """
澄清产品想法：{{idea}}。定义用户、问题、JTBD 和成功指标。
"""
output_key = "problem"
agent.name = "product-manager"

[[steps]]
id = "scope"
title = "定义 MVP 范围"
depends_on = ["problem"]
input_context = ["problem"]
description = """
定义 MVP、非目标、假设、约束和发布边界。
"""
output_key = "scope"
agent.name = "product-manager"

[[steps]]
id = "stories"
title = "生成用户故事"
depends_on = ["scope"]
input_context = ["problem", "scope"]
description = """
撰写用户故事、核心流程、边界情况和验收标准。
"""
output_key = "stories"
agent.name = "product-manager"

[[steps]]
id = "risks"
title = "审查风险和指标"
depends_on = ["stories"]
input_context = ["problem", "scope", "stories"]
description = """
识别产品、技术、体验、隐私和发布风险。定义指标和实验计划。
"""
output_key = "risk_metrics"
agent.name = "product-manager"

[[steps]]
id = "prd"
title = "撰写 PRD"
depends_on = ["risks"]
input_context = ["problem", "scope", "stories", "risk_metrics"]
description = """
输出完整 PRD，包含背景、目标、需求、验收标准、风险、指标和开放问题。
"""
agent.name = "reporter"
