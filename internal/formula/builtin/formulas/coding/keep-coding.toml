formula = "keep-coding"
aliases = ["keep-coding"]
title = "持续处理 Beads"
description = "循环执行 bead-coding：每轮选择一个 ready bead 树，用 coder 完成实现、验证、提交并关闭，最后输出持续编码报告。"
version = 1
type = "workflow"
category = "workflow"
tags = ["beads", "coding", "loop", "automation"]

[preflight]

[[preflight.checks]]
type = "command"
name = "bd"
command = "bd"
message = "keep-coding 需要安装 bd/beads。"

[[preflight.checks]]
type = "command"
name = "git"
command = "git"
message = "keep-coding 需要安装 git。"

[[preflight.checks]]
type = "git"
name = "git-repo"
require_repo = true
require_remote = false
message = "keep-coding 需要在 git 仓库中运行。"

[vars]
goal = { description = "本次持续编码的总体目标或筛选偏好；为空则处理当前 ready beads", default = "持续处理当前项目中 ready 的 beads，优先选择高优先级、依赖已满足、范围清晰的任务。" }
max_cycles = { description = "最多执行多少个 bead-coding 循环", default = "100", pattern = "^[1-9][0-9]*$" }
workspace_path = { description = "可选执行工作区路径；为空时使用 formula 运行目录", default = "" }
validation_command = { description = "可选验证命令；为空则自动检测轻量验证命令", default = "" }
close_on_success = { description = "每轮成功后是否关闭 bead", default = "true" }
ready_limit = { description = "每轮自动选择 ready bead 时最多读取多少个候选", default = "10" }
skip_file = { description = "本次 keep-coding 运行内跳过 partial/blocked bead 的临时文件", default = ".tt/tmp/keep-coding-skip.txt" }
cycle_log_file = { description = "本次 keep-coding 每轮机器摘要的 JSONL 文件", default = ".tt/tmp/keep-coding-cycles.jsonl" }

[[steps]]
id = "prepare-skip-list"
title = "初始化本次运行跳过列表"
execution = "script"
idempotent = true

[steps.script]
command = ["python3", "-c", """
import json, os, pathlib
skip_path = pathlib.Path(os.environ.get('SKIP_FILE', '.tt/tmp/keep-coding-skip.txt'))
cycle_log_path = pathlib.Path(os.environ.get('CYCLE_LOG_FILE', '.tt/tmp/keep-coding-cycles.jsonl'))
for path in (skip_path, cycle_log_path):
    path.parent.mkdir(parents=True, exist_ok=True)
    path.write_text('', encoding='utf-8')
print(json.dumps({"skip_file": str(skip_path), "cycle_log_file": str(cycle_log_path), "reset": True}, ensure_ascii=False))
"""]
format = "json"
timeout = "10s"

[steps.script.env]
SKIP_FILE = "{{skip_file}}"
CYCLE_LOG_FILE = "{{cycle_log_file}}"

[steps.validate]
format = "json"
required = ["stdout"]

[[steps]]
id = "cycle"
title = "循环执行 bead-coding"
depends_on = ["prepare-skip-list"]

[steps.loop]
max = "{{max_cycles}}"
until = "cycle-note.selected == false"

[[steps.loop.body]]
id = "run-bead-coding"
title = "处理一个 ready bead"
embed = "bead-coding"

[steps.loop.body.embed_vars]
bead_id = ""
goal = "{{goal}}"
workspace_path = "{{workspace_path}}"
validation_command = "{{validation_command}}"
close_on_success = "{{close_on_success}}"
ready_limit = "{{ready_limit}}"
exclude_bead_file = "{{skip_file}}"

[[steps.loop.body]]
id = "cycle-note"
title = "记录本轮结果"
depends_on = ["run-bead-coding"]
execution = "script"

[steps.loop.body.script]
command = ["python3", "-c", """
import json, os
status = os.environ.get('STATUS', '').strip() or 'partial'
bead_id = os.environ.get('BEAD_ID', '').strip()
closed = os.environ.get('CLOSED', '').strip().lower() == 'true'
committed = os.environ.get('COMMITTED', '').strip().lower() == 'true'
commit_hash = os.environ.get('COMMIT_HASH', '').strip()
summary = os.environ.get('SUMMARY', '').strip()
next_action = os.environ.get('NEXT_ACTION', '').strip()
selected_in = os.environ.get('SELECTED_IN', '').strip().lower() == 'true'
# Continue while a bead is selected. The skip step only excludes beads that are
# blocked/failed or made no useful progress, so a bead with a commit but not yet
# closed can be selected again to finish the closure loop.
selected = False if status == 'no-work' or not selected_in else True
if status == 'no-work':
    next_action = next_action or '没有可处理的 ready bead，keep-coding 可以正常结束。'
elif not closed and not next_action:
    if committed:
        next_action = '本 bead 已有提交但未闭环，下一轮应继续选择它完成验证/关闭。'
    else:
        next_action = '本 bead 未闭环且本轮没有提交；如无法继续推进，会加入本次运行跳过列表以避免空转。'
print(json.dumps({
  "selected": selected,
  "bead_id": bead_id,
  "status": status,
  "committed": committed,
  "commit_hash": commit_hash,
  "closed": closed,
  "summary": summary,
  "next_action": next_action,
}, ensure_ascii=False))
"""]
format = "json"
timeout = "10s"

[steps.loop.body.script.env]
SELECTED_IN = "{{run-bead-coding.cycle-summary.selected}}"
BEAD_ID = "{{run-bead-coding.cycle-summary.bead_id}}"
STATUS = "{{run-bead-coding.cycle-summary.status}}"
COMMITTED = "{{run-bead-coding.cycle-summary.committed}}"
COMMIT_HASH = "{{run-bead-coding.cycle-summary.commit_hash}}"
CLOSED = "{{run-bead-coding.cycle-summary.closed}}"
SUMMARY = "{{run-bead-coding.cycle-summary.summary}}"
NEXT_ACTION = "{{run-bead-coding.cycle-summary.next_action}}"

	[steps.loop.body.validate]
	format = "json"
	required = ["selected", "status", "committed", "closed", "summary", "next_action"]

	[[steps.loop.body]]
	id = "append-cycle-log"
	title = "记录本轮机器摘要"
	depends_on = ["cycle-note"]
	execution = "script"
	idempotent = true

	[steps.loop.body.script]
	command = ["python3", "-c", """
import json, os, pathlib
path = pathlib.Path(os.environ.get('CYCLE_LOG_FILE', '.tt/tmp/keep-coding-cycles.jsonl'))
path.parent.mkdir(parents=True, exist_ok=True)
entry = {
  "selected": os.environ.get('SELECTED', '').strip().lower() == 'true',
  "bead_id": os.environ.get('BEAD_ID', '').strip(),
  "status": os.environ.get('STATUS', '').strip(),
  "committed": os.environ.get('COMMITTED', '').strip().lower() == 'true',
  "commit_hash": os.environ.get('COMMIT_HASH', '').strip(),
  "closed": os.environ.get('CLOSED', '').strip().lower() == 'true',
  "summary": os.environ.get('SUMMARY', '').strip(),
  "next_action": os.environ.get('NEXT_ACTION', '').strip(),
}
with path.open('a', encoding='utf-8') as f:
    f.write(json.dumps(entry, ensure_ascii=False, sort_keys=True) + chr(10))
print(json.dumps({"cycle_log_file": str(path), "entry": entry}, ensure_ascii=False))
"""]
	format = "json"
	timeout = "10s"

	[steps.loop.body.script.env]
	CYCLE_LOG_FILE = "{{cycle_log_file}}"
	SELECTED = "{{cycle-note.selected}}"
	BEAD_ID = "{{cycle-note.bead_id}}"
	STATUS = "{{cycle-note.status}}"
	COMMITTED = "{{cycle-note.committed}}"
	COMMIT_HASH = "{{cycle-note.commit_hash}}"
	CLOSED = "{{cycle-note.closed}}"
	SUMMARY = "{{cycle-note.summary}}"
	NEXT_ACTION = "{{cycle-note.next_action}}"

	[steps.loop.body.validate]
	format = "json"
	required = ["cycle_log_file", "entry"]

	[[steps.loop.body]]
	id = "append-skip-list"
	title = "记录本轮需要跳过的 bead"
	depends_on = ["append-cycle-log"]
execution = "script"
idempotent = true

[steps.loop.body.script]
command = ["python3", "-c", """
import json, os, pathlib
bead_id = os.environ.get('BEAD_ID', '').strip()
status = os.environ.get('STATUS', '').strip()
closed = os.environ.get('CLOSED', '').strip().lower() == 'true'
selected = os.environ.get('SELECTED', '').strip().lower() == 'true'
committed = os.environ.get('COMMITTED', '').strip().lower() == 'true'
path = pathlib.Path(os.environ.get('SKIP_FILE', '.tt/tmp/keep-coding-skip.txt'))
path.parent.mkdir(parents=True, exist_ok=True)
should_skip = bool(bead_id) and selected and (status in {'blocked', 'failed'} or (status == 'partial' and not committed and not closed))
existing = []
if path.exists():
    existing = [line.strip() for line in path.read_text(encoding='utf-8').splitlines() if line.strip()]
if should_skip and bead_id not in existing:
    existing.append(bead_id)
newline = chr(10)
path.write_text(newline.join(existing) + (newline if existing else ''), encoding='utf-8')
print(json.dumps({"skip_file": str(path), "appended": should_skip, "bead_id": bead_id, "skipped_bead_ids": existing}, ensure_ascii=False))
"""]
format = "json"
timeout = "10s"

[steps.loop.body.script.env]
SKIP_FILE = "{{skip_file}}"
BEAD_ID = "{{cycle-note.bead_id}}"
STATUS = "{{cycle-note.status}}"
CLOSED = "{{cycle-note.closed}}"
SELECTED = "{{cycle-note.selected}}"
COMMITTED = "{{cycle-note.committed}}"

	[steps.loop.body.validate]
	format = "json"
	required = ["stdout"]

[[steps]]
id = "summarize-cycle-log"
title = "汇总 keep-coding 每轮结果"
depends_on = ["cycle"]
execution = "script"
idempotent = true

[steps.script]
command = ["python3", "-c", """
import json, os, pathlib, subprocess
path = pathlib.Path(os.environ.get('CYCLE_LOG_FILE', '.tt/tmp/keep-coding-cycles.jsonl'))
cycles = []
if path.exists():
    for line in path.read_text(encoding='utf-8').splitlines():
        line = line.strip()
        if not line:
            continue
        try:
            cycles.append(json.loads(line))
        except json.JSONDecodeError as exc:
            cycles.append({"status": "parse-error", "summary": str(exc), "raw": line})
completed = [c for c in cycles if c.get('selected') and c.get('status') == 'completed']
blocked = [c for c in cycles if c.get('selected') and c.get('status') == 'blocked']
partial = [c for c in cycles if c.get('selected') and c.get('status') in {'partial', 'failed'}]
no_work = [c for c in cycles if not c.get('selected') or c.get('status') == 'no-work']
commits = [c.get('commit_hash', '') for c in cycles if c.get('commit_hash')]
closed = [c for c in cycles if c.get('closed')]
ready = subprocess.run(['bd', 'ready', '--json', '--limit', os.environ.get('READY_LIMIT', '10') or '10'], text=True, capture_output=True)
ready_items = []
if ready.returncode == 0:
    try:
        ready_items = json.loads(ready.stdout or '[]')
    except Exception:
        ready_items = []
summary = {
  "cycle_log_file": str(path),
  "total_cycles": len(cycles),
  "worked_cycles": len([c for c in cycles if c.get('selected')]),
  "completed_count": len(completed),
  "blocked_count": len(blocked),
  "partial_count": len(partial),
  "no_work_count": len(no_work),
  "closed_count": len(closed),
  "commits": commits,
  "cycles": cycles,
  "remaining_ready": ready_items,
  "ready_raw": {"code": ready.returncode, "stderr": ready.stderr},
}
print(json.dumps(summary, ensure_ascii=False))
"""]
format = "json"
timeout = "30s"

[steps.script.env]
CYCLE_LOG_FILE = "{{cycle_log_file}}"
READY_LIMIT = "{{ready_limit}}"

[steps.validate]
format = "json"
required = ["cycles", "total_cycles", "worked_cycles", "completed_count", "remaining_ready"]

	[[steps]]
	id = "final-report"
	title = "输出持续编码最终报告"
	depends_on = ["summarize-cycle-log"]
	input_context = ["summarize-cycle-log.stdout", "cycle"]
	description = """
	输出中文 Markdown 最终报告，不要输出 JSON，不要粘贴完整子报告。

	你必须优先依据 summarize-cycle-log.stdout 生成报告，而不是只看 cycle 的最终 output；cycle 的最终 output 可能只是最后一轮 append-skip-list/no-work，不能代表整个 loop。你需要总结 keep-coding loop 的整体执行情况：处理了多少轮、哪些 bead、哪些提交、哪些关闭、哪些阻塞、是否因为 partial/blocked/no-work 停止，还有什么下一步。注意 cycle-note.selected=false 表示 loop 不应继续，不一定表示本轮没有选中 bead；committed=false 但 closed=true 是合法闭环。

固定结构：

# Keep Coding 报告

## 结论
1-3 句话说明本次持续编码是否有实际进展。

## 循环明细
用 Markdown 表格列出：轮次、bead、状态、commit、是否关闭、摘要、下一步。

## 代码与验证
总结每轮的验证情况，不要编造没有出现的测试结果。

## 剩余工作
列出仍然 ready/blocked/需要人工判断的后续事项。

## 建议下一步
给出 3-5 条建议。
"""
agent.name = "reporter"
agent.cwd = "{{workspace_path}}"
