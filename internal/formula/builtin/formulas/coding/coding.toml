formula = "coding"
title = "编码工作流"
aliases = ["coder", "coding"]
description = "兼容编码入口：先内嵌 coding-requirement 完成无交互需求计划，再内嵌 coding-implementation 完成实现、评审与验证，最后输出总报告。"
version = 1
type = "workflow"
category = "engineering"
tags = ["coding", "workflow", "planning", "implementation", "review", "loop", "external-agent", "codex"]

[preflight]

[[preflight.checks]]
type = "command"
name = "git"
command = "git"
message = "coding 需要安装 git。"

[[preflight.checks]]
type = "git"
name = "git-repo"
require_repo = true
require_remote = false
message = "coding 需要在 git 仓库中运行。"

[[preflight.checks]]
type = "command"
name = "codex"
command = "codex"
message = "driver = codex 时需要安装 Codex CLI。"
condition = "{{driver}} == codex"

[[preflight.checks]]
type = "command"
name = "jcode"
command = "jcode"
message = "driver = jcode 或 bl 时需要安装 jcode。"
condition = "{{driver}} == jcode"

[[preflight.checks]]
type = "command"
name = "opencode"
command = "opencode"
message = "driver = opencode 时需要安装 OpenCode CLI。"
condition = "{{driver}} == opencode"

[[preflight.checks]]
type = "command"
name = "forge"
command = "forge"
message = "driver = forge 时需要安装 Forge CLI。"
condition = "{{driver}} == forge"

[vars]
requirement = { description = "用户的原始需求描述，可以比较笼统和不完善", required = true }
workspace_path = { description = "可选执行工作区路径；为空时使用 formula 运行目录", default = "" }
validation_command = { description = "可选验证命令；为空则自动检测轻量验证命令", default = "" }
driver = { description = "外部 agent driver：codex/jcode/opencode/forge/bl。默认 codex；运行时也可用 --ext-driver 覆盖未声明 driver 的步骤。", default = "codex", enum = ["codex", "jcode", "opencode", "forge", "bl"] }
model = { description = "外部 agent model，可留空使用 CLI 默认值", default = "" }

[[steps]]
id = "plan"
title = "需求计划与评审"
embed = "coding-requirement"

[steps.embed_vars]
requirement = "{{requirement}}"
workspace_path = "{{workspace_path}}"

[[steps]]
id = "implement"
title = "编码实现与验证"
depends_on = ["plan.plan-review-loop"]
condition = "plan.plan-review.approved == true"
embed = "coding-implementation"

[steps.embed_vars]
requirement_plan_context = """
原始需求：{{requirement}}

需求计划输出：{{plan.plan-requirement}}
需求计划修订输出：{{plan.plan-revision}}
需求评审输出：{{plan.plan-review}}
"""
workspace_path = "{{workspace_path}}"
validation_command = "{{validation_command}}"
driver = "{{driver}}"
model = "{{model}}"

[[steps]]
id = "final-report"
title = "输出编码总报告"
depends_on = ["plan.plan-review-loop", "implement.final-report"]
input_context = ["plan.plan-requirement", "plan.plan-revision", "plan.plan-review", "implement.implement-code", "implement.code-review", "implement.run-validation.validation.stdout", "implement.final-report"]
description = """
面向用户输出最终总结报告。

输入说明：
- plan.plan-review.approved 可能为 false（需求评审未通过）；
- implement.implement-code.implemented 可能为 false（编码未完成）；
- implement.code-review.approved 可能为 false（编码评审未通过）；
- implement.run-validation.validation.stdout 可能不存在（验证未执行）。

报告只需汇总最终结果，不需要详述来回审批的细节。

固定结构：

# 编码工作流报告

## 结论
1-3 句话说明本次编码工作流是否完成、最终状态、总体质量。

## 需求与计划
- 原始需求摘要
- 计划步骤概览

## 编码改动
- 修改的文件列表
- 改动摘要

## 验证结果
- 已执行的验证/测试
- 验证结果

## 备注
如有待验证项或风险，简短列出；没有则省略。

## 建议下一步
给出 3-5 条建议。

要求：
- 使用 Markdown；
- 不要重复粘贴上游 step 的原始 JSON、stdout/stderr、diff、日志或完整子报告；只提炼关键增量结论。
"""
agent.name = "reporter"
agent.cwd = "{{workspace_path}}"
