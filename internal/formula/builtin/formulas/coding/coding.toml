formula = "coding"
title = "编码工作流"
aliases = ["coder", "coding"]
description = "统一编码入口：依次调用需求计划与编码实现 Formula，并通过公开输入输出契约组合最终报告。"
version = 1
type = "workflow"
category = "engineering"
tags = ["coding", "workflow", "planning", "implementation", "review", "loop", "external-agent", "codex"]

[preflight]

[[preflight.checks]]
type = "command"
name = "git"
command = "git"
message = "coding 需要安装 git。"

[[preflight.checks]]
type = "git"
name = "git-repo"
require_repo = true
require_remote = false
message = "coding 需要在 git 仓库中运行。"

[[preflight.checks]]
type = "command"
name = "codex"
command = "codex"
message = "driver = codex 时需要安装 Codex CLI。"
condition = "{{driver}} == codex"

[[preflight.checks]]
type = "command"
name = "jcode"
command = "jcode"
message = "driver = jcode 或 bl 时需要安装 jcode。"
condition = "{{driver}} == jcode"

[[preflight.checks]]
type = "command"
name = "opencode"
command = "opencode"
message = "driver = opencode 时需要安装 OpenCode CLI。"
condition = "{{driver}} == opencode"

[[preflight.checks]]
type = "command"
name = "forge"
command = "forge"
message = "driver = forge 时需要安装 Forge CLI。"
condition = "{{driver}} == forge"

[vars]
requirement = { description = "用户的原始需求描述，可以比较笼统和不完善", required = true }
workspace_path = { description = "可选执行工作区路径；为空时使用 formula 运行目录", default = "" }
validation_command = { description = "可选验证命令；为空则自动检测轻量验证命令", default = "" }
driver = { description = "外部 agent driver：codex/jcode/opencode/forge/bl。默认 codex；运行时也可用 --ext-driver 覆盖未声明 driver 的步骤。", default = "codex", enum = ["codex", "jcode", "opencode", "forge", "bl"] }
model = { description = "外部 agent model，可留空使用 CLI 默认值", default = "" }

[outputs.plan]
from = "plan.plan"
type = "json"
required = true
description = "需求计划"

[outputs.plan_revision]
from = "plan.revision"
type = "json"
description = "需求计划修订；未发生修订时省略"

[outputs.plan_review]
from = "plan.review"
type = "json"
required = true
description = "需求评审结论"

[outputs.implementation]
from = "implement.implementation"
type = "json"
description = "实现结果；需求评审未通过时省略"

[outputs.implementation_revision]
from = "implement.revision"
type = "json"
description = "代码修订；未发生修订时省略"

[outputs.implementation_review]
from = "implement.review"
type = "json"
description = "代码评审结论；未进入评审时省略"

[outputs.validation]
from = "implement.validation"
type = "json"
description = "实现阶段验证结果；未执行时省略"

[outputs.report]
from = "final-report"
type = "markdown"
required = true
description = "完整编码工作流报告"

[[steps]]
id = "plan"
title = "需求计划与评审"
execution = "formula"
formula = "coding-requirement"

[steps.with]
requirement = "{{requirement}}"
workspace_path = "{{workspace_path}}"
driver = "{{driver}}"
model = "{{model}}"

[[steps]]
id = "implement"
title = "编码实现与验证"
depends_on = ["plan"]
condition = "plan.review.approved == true"
execution = "formula"
formula = "coding-implementation"

[steps.with]
requirement_plan_context = """
原始需求：{{requirement}}

需求计划输出：{{plan.plan}}
需求计划修订输出：{{plan.revision}}
需求评审输出：{{plan.review}}
"""
workspace_path = "{{workspace_path}}"
validation_command = "{{validation_command}}"
driver = "{{driver}}"
model = "{{model}}"

[[steps]]
id = "final-report"
title = "输出编码总报告"
depends_on = ["plan", "implement"]
input_context = ["plan.plan", "plan.revision", "plan.review", "implement.implementation", "implement.review", "implement.validation", "implement.report"]
description = """
面向用户输出最终总结报告。

输入说明：
- plan.review.approved 可能为 false（需求评审未通过）；
- implement.implementation.implemented 可能为 false（编码未完成）；
- implement.review.approved 可能为 false（编码评审未通过）；
- implement.validation 可能不存在（验证未执行）。

报告只需汇总最终结果，不需要详述来回审批的细节。

固定结构：

# 编码工作流报告

## 结论
1-3 句话说明本次编码工作流是否完成、最终状态、总体质量。

## 需求与计划
- 原始需求摘要
- 计划步骤概览

## 编码改动
- 修改的文件列表
- 改动摘要

## 验证结果
- 已执行的验证/测试
- 验证结果

## 备注
如有待验证项或风险，简短列出；没有则省略。

## 建议下一步
给出 3-5 条建议。

要求：
- 使用 Markdown；
- 不要重复粘贴上游 step 的原始 JSON、stdout/stderr、diff、日志或完整子报告；只提炼关键增量结论。
"""
agent.name = "reporter"
agent.cwd = "{{workspace_path}}"
