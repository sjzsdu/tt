formula = "github-pr-rebase-main"
description = "将 GitHub PR 分支在隔离 worktree 中 rebase 到最新 base/main；遇到冲突时由 agent 修复，再用确定性脚本 continue。默认 push --force-with-lease 回 PR 分支，完成后清理临时 worktree。"
version = 1
type = "workflow"
category = "github"
tags = ["github", "pr", "rebase", "worktree", "conflict"]

[preflight]

[[preflight.checks]]
type = "command"
name = "gh"
command = "gh"
message = "需要安装 GitHub CLI: https://cli.github.com/"

[[preflight.checks]]
type = "exec"
name = "gh-auth"
command = "gh auth status"
message = "GitHub CLI 未登录或不可用，请先执行 gh auth login"

[[preflight.checks]]
type = "command"
name = "git"
command = "git"
message = "需要安装 git"

[[preflight.checks]]
type = "command"
name = "jq"
command = "jq"
message = "需要安装 jq"

[[preflight.checks]]
type = "git"
name = "git-repo"
require_repo = true
require_remote = true
message = "当前目录必须是带 origin remote 的 git 仓库"

[[preflight.checks]]
type = "command"
name = "bash"
command = "bash"
message = "需要安装 bash"

[vars]
pr_ref = { description = "PR 编号、URL 或分支引用", required = true }
base_branch = { description = "目标 base 分支，默认 main；为空时使用 PR 自身 baseRefName", default = "main" }
repo_hint = { description = "可选 owner/repo；为空则使用当前仓库 gh 上下文", default = "" }
worktree_root = { description = "隔离 worktree 根目录，默认 .tt/worktrees/github-pr-rebase-main；相对路径按执行命令时的目录解析", default = ".tt/worktrees/github-pr-rebase-main" }
validation_command = { description = "可选验证命令，例如 npm test 或 go test ./...；为空则跳过", default = "" }
push = { description = "rebase 成功后是否 push --force-with-lease 回 PR 分支；默认 true，可传 push=false 仅保留本地分支", default = "true", enum = ["true", "false"] }

[[steps]]
id = "fetch-pr-metadata"
title = "获取 PR 元数据"
embed = "github-fetch-pr"

[steps.embed_vars]
pr_ref = "{{pr_ref}}"
repo_hint = "{{repo_hint}}"

[[steps]]
id = "check-current-pr-worktree"
title = "检查是否已有 worktree 在 PR 分支"
execution = "script"
depends_on = ["fetch-pr-metadata"]
description = "检查当前目录或其它 worktree 是否已 checkout 到该 PR 的 head 分支。当前目录在 PR 分支时允许直接复用继续推进；其它 worktree 在 PR 分支时仍短路，避免并发操作同一分支。"

[steps.script]
command = ["bash", "-lc", """
set -u
meta="${TT_PR_META:-{}}"
root_input="${TT_WORKTREE_ROOT:-.tt/worktrees/github-pr-rebase-main}"
ok="$(jq -r '.ok // false' <<<"$meta")"
if [ "$ok" != true ]; then
  jq -cn --arg error "pr metadata unavailable" --arg metadata_raw "$meta" '{ok:false,already_on_pr_branch:false,error:$error,metadata_raw:$metadata_raw,current_branch:"",head_branch:"",worktree_path:""}'
  exit 0
fi
head="$(jq -r '.headRefName // empty' <<<"$meta")"
number="$(jq -r '.number // empty' <<<"$meta")"
if [ -z "$head" ]; then
  jq -cn --arg error "missing PR head branch" '{ok:false,already_on_pr_branch:false,error:$error,current_branch:"",head_branch:"",worktree_path:""}'
  exit 0
fi
if ! git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
  jq -cn --arg head_branch "$head" '{ok:true,already_on_pr_branch:false,error:"current directory is not inside a git repository",current_branch:"",head_branch:$head_branch,worktree_path:""}'
  exit 0
fi
repo_root="$(git rev-parse --show-toplevel 2>/dev/null || pwd)"
repo_root_real="$(cd "$repo_root" && pwd -P)"
current_branch="$(git branch --show-current 2>/dev/null || true)"
invocation_dir="$(pwd)"
safe_head="$(printf '%s' "$head" | tr -c 'A-Za-z0-9._-' '-')"
expected_root="$root_input"
case "$expected_root" in /*) ;; *) expected_root="$invocation_dir/$expected_root" ;; esac
expected_path="$expected_root/pr-${number}-${safe_head}"
expected_path_real="$(cd "$expected_path" 2>/dev/null && pwd -P || printf '%s' "$expected_path")"
match_path=""
match_head=""
current_path=""
current_head=""
while IFS= read -r line; do
  case "$line" in
    worktree' '*) current_path="${line#worktree }" ;;
    HEAD' '*) current_head="${line#HEAD }" ;;
    branch' 'refs/heads/*)
      branch="${line#branch refs/heads/}"
      if [ "$branch" = "$head" ]; then
        match_path="$current_path"
        match_head="$current_head"
      fi
      ;;
    "")
      if [ -n "$match_path" ]; then break; fi
      current_path=""
      current_head=""
      ;;
  esac
done < <(git -C "$repo_root" worktree list --porcelain)
if [ -n "$match_path" ]; then
  match_path_real="$(cd "$match_path" 2>/dev/null && pwd -P || printf '%s' "$match_path")"
  if [ "$match_path_real" = "$repo_root_real" ]; then
    jq -cn \
      --arg current_branch "$head" \
      --arg head_branch "$head" \
      --arg worktree_path "$repo_root" \
      --arg head_sha "$match_head" \
      '{ok:true,already_on_pr_branch:false,current_on_pr_branch:true,error:"",reason:"current workspace is already on the PR head branch",current_branch:$current_branch,head_branch:$head_branch,worktree_path:$worktree_path,head_sha:$head_sha}'
    exit 0
  fi
  if [ "$match_path_real" = "$expected_path_real" ]; then
    jq -cn \
      --arg current_branch "$current_branch" \
      --arg head_branch "$head" \
      --arg worktree_path "$match_path" \
      --arg head_sha "$match_head" \
      '{ok:true,already_on_pr_branch:false,current_on_pr_branch:false,target_worktree_on_pr_branch:true,error:"",reason:"formula target worktree is already on the PR head branch and will be reused",current_branch:$current_branch,head_branch:$head_branch,worktree_path:$worktree_path,head_sha:$head_sha}'
    exit 0
  fi
  jq -cn \
    --arg current_branch "$head" \
    --arg head_branch "$head" \
    --arg worktree_path "$match_path" \
    --arg head_sha "$match_head" \
    '{ok:true,already_on_pr_branch:true,current_on_pr_branch:false,error:"",reason:"an existing worktree is already on the PR head branch",current_branch:$current_branch,head_branch:$head_branch,worktree_path:$worktree_path,head_sha:$head_sha}'
  exit 0
fi
jq -cn \
  --arg current_branch "$current_branch" \
  --arg head_branch "$head" \
  --arg worktree_path "$repo_root" \
  '{ok:true,already_on_pr_branch:false,current_on_pr_branch:false,error:"",current_branch:$current_branch,head_branch:$head_branch,worktree_path:$worktree_path}'
"""]
format = "json"
timeout = "30s"

[steps.script.env]
TT_PR_META = "{{fetch-pr-metadata.pr.stdout}}"
TT_WORKTREE_ROOT = "{{worktree_root}}"

[steps.validate]
format = "json"
required = ["stdout"]

[[steps]]
id = "prepare-rebase-worktree"
title = "创建隔离 worktree 并 checkout PR 分支"
execution = "script"
depends_on = ["fetch-pr-metadata", "check-current-pr-worktree"]
condition = "check-current-pr-worktree.stdout.already_on_pr_branch != true"
description = "在执行命令目录的 .tt/worktrees 下创建隔离 worktree，使用 gh pr checkout 拉取 PR 分支，不污染当前工作区。"

[steps.script]
command = ["bash", "-lc", """
set -u
meta="${TT_PR_META:-{}}"
repo_hint="${TT_REPO_HINT:-}"
base_override="${TT_BASE_BRANCH:-}"
root_input="${TT_WORKTREE_ROOT:-.tt/worktrees/github-pr-rebase-main}"
current_check="${TT_CURRENT_CHECK:-{}}"
ok="$(jq -r '.ok // false' <<<"$meta")"
if [ "$ok" != true ]; then
  jq -cn --arg error "pr metadata unavailable" --arg metadata_raw "$meta" '{ok:false,error:$error,metadata_raw:$metadata_raw,worktree_path:"",base_branch:"",head_branch:""}'
  exit 0
fi
number="$(jq -r '.number // empty' <<<"$meta")"
head="$(jq -r '.headRefName // empty' <<<"$meta")"
base="$(jq -r '.baseRefName // empty' <<<"$meta")"
if [ -n "$base_override" ] && [ "$base_override" != "-" ]; then base="$base_override"; fi
if [ -z "$number" ] || [ -z "$head" ] || [ -z "$base" ]; then
  jq -cn --arg error "missing PR number/head/base" --arg metadata_raw "$meta" '{ok:false,error:$error,metadata_raw:$metadata_raw,worktree_path:"",base_branch:"",head_branch:""}'
  exit 0
fi
invocation_dir="$(pwd)"
repo_root="$(git rev-parse --show-toplevel 2>/dev/null)"
if [ -z "$repo_root" ]; then
  jq -cn '{ok:false,error:"current directory is not inside a git repository",worktree_path:"",base_branch:"",head_branch:""}'
  exit 0
fi
if [ "$(jq -r '.current_on_pr_branch // false' <<<"$current_check")" = true ]; then
  worktree_path="$(jq -r '.worktree_path // empty' <<<"$current_check")"
  [ -n "$worktree_path" ] || worktree_path="$repo_root"
  safe_head="$(printf '%s' "$head" | tr -c 'A-Za-z0-9._-' '-')"
  worktree_root="$root_input"
  case "$worktree_root" in /*) ;; *) worktree_root="$invocation_dir/$worktree_root" ;; esac
  stale_target="$worktree_root/pr-${number}-${safe_head}"
  stale_target_real="$(cd "$stale_target" 2>/dev/null && pwd -P || printf '%s' "$stale_target")"
  worktree_path_real="$(cd "$worktree_path" 2>/dev/null && pwd -P || printf '%s' "$worktree_path")"
  if [ "$stale_target_real" = "$worktree_path_real" ]; then
    stale_target=""
  elif [ ! -d "$stale_target/.git" ] && [ ! -f "$stale_target/.git" ]; then
    stale_target=""
  fi
  cd "$worktree_path"
  git fetch origin "$base" --prune >/dev/null 2>&1
  current_branch="$(git branch --show-current)"
  upstream="$(git rev-parse --abbrev-ref --symbolic-full-name '@{u}' 2>/dev/null || true)"
  head_sha="$(git rev-parse HEAD)"
  base_sha="$(git rev-parse "origin/$base" 2>/dev/null || true)"
  jq -cn \
    --arg worktree_path "$worktree_path" \
    --arg worktree_root "" \
    --arg invocation_dir "$invocation_dir" \
    --arg repo_root "$repo_root" \
    --arg base_branch "$base" \
    --arg head_branch "$head" \
    --arg current_branch "$current_branch" \
    --arg upstream "$upstream" \
    --arg head_sha "$head_sha" \
    --arg base_sha "$base_sha" \
    --arg stale_target_worktree_path "$stale_target" \
    '{ok:true,error:"",worktree_path:$worktree_path,worktree_root:$worktree_root,invocation_dir:$invocation_dir,repo_root:$repo_root,base_branch:$base_branch,head_branch:$head_branch,current_branch:$current_branch,upstream:$upstream,head_sha:$head_sha,base_sha:$base_sha,checkout_output:"",reused:true,created:false,reused_current:true,stale_target_worktree_path:$stale_target_worktree_path}'
  exit 0
fi
cd "$repo_root"
safe_head="$(printf '%s' "$head" | tr -c 'A-Za-z0-9._-' '-')"
worktree_root="$root_input"
case "$worktree_root" in /*) ;; *) worktree_root="$invocation_dir/$worktree_root" ;; esac
worktree_path="$worktree_root/pr-${number}-${safe_head}"
local_branch="$head"
pr_head_ref="refs/tt/pr-rebase/${number}/head"
mkdir -p "$worktree_root"
reused=false
created=false
reused_current=false
fetch_out=""
if [ -d "$worktree_path/.git" ] || [ -f "$worktree_path/.git" ]; then
  if git -C "$worktree_path" rev-parse --is-inside-work-tree >/dev/null 2>&1; then
    reused=true
  else
    jq -cn --arg error "existing path is not a valid git worktree" --arg worktree_path "$worktree_path" --arg base_branch "$base" --arg head_branch "$head" '{ok:false,error:$error,worktree_path:$worktree_path,base_branch:$base_branch,head_branch:$head_branch,reused:false,created:false}'
    exit 0
  fi
else
  if ! fetch_out="$(git fetch origin "+refs/pull/${number}/head:${pr_head_ref}" "$base" --prune 2>&1)"; then
    jq -cn --arg error "$fetch_out" --arg worktree_path "$worktree_path" --arg base_branch "$base" --arg head_branch "$head" '{ok:false,error:$error,worktree_path:$worktree_path,base_branch:$base_branch,head_branch:$head_branch,reused:false,created:false}'
    exit 0
  fi
  git branch -D "$local_branch" >/dev/null 2>&1 || true
  if ! git worktree add -B "$local_branch" "$worktree_path" "$pr_head_ref" >/tmp/tt-pr-rebase-worktree.log 2>&1; then
    err="$(cat /tmp/tt-pr-rebase-worktree.log)"
    jq -cn --arg error "$err" --arg worktree_path "$worktree_path" --arg base_branch "$base" --arg head_branch "$head" '{ok:false,error:$error,worktree_path:$worktree_path,base_branch:$base_branch,head_branch:$head_branch,reused:false,created:false}'
    exit 0
  fi
  created=true
fi
cd "$worktree_path"
if [ "$reused" = true ]; then
  if ! git diff --quiet || ! git diff --cached --quiet; then
    jq -cn --arg error "existing target worktree has uncommitted changes before PR checkout" --arg worktree_path "$worktree_path" --arg base_branch "$base" --arg head_branch "$head" '{ok:false,error:$error,worktree_path:$worktree_path,base_branch:$base_branch,head_branch:$head_branch,reused:true,created:false}'
    exit 0
  fi
  if ! fetch_out="$(git -C "$repo_root" fetch origin "+refs/pull/${number}/head:${pr_head_ref}" "$base" --prune 2>&1)"; then
    jq -cn --arg error "$fetch_out" --arg worktree_path "$worktree_path" --arg base_branch "$base" --arg head_branch "$head" '{ok:false,error:$error,worktree_path:$worktree_path,base_branch:$base_branch,head_branch:$head_branch,reused:true,created:false}'
    exit 0
  fi
  current_branch_before="$(git branch --show-current 2>/dev/null || true)"
  if [ "$current_branch_before" != "$head" ]; then
    checkout_out="$(git checkout -B "$local_branch" "$pr_head_ref" 2>&1)"
    checkout_rc=$?
    if [ "$checkout_rc" -ne 0 ]; then
      jq -cn --arg error "$checkout_out" --arg worktree_path "$worktree_path" --arg base_branch "$base" --arg head_branch "$head" '{ok:false,error:$error,worktree_path:$worktree_path,base_branch:$base_branch,head_branch:$head_branch,reused:true,created:false}'
      exit 0
    fi
  else
    checkout_out="target worktree already on PR head branch; fetched ${pr_head_ref}"
  fi
else
  checkout_out="$fetch_out"
fi
current_branch="$(git branch --show-current)"
if [ "$current_branch" != "$head" ]; then
  jq -cn --arg error "target worktree is on unexpected branch: $current_branch" --arg worktree_path "$worktree_path" --arg base_branch "$base" --arg head_branch "$head" '{ok:false,error:$error,worktree_path:$worktree_path,base_branch:$base_branch,head_branch:$head_branch,reused:false,created:false}'
  exit 0
fi
git fetch origin "$base" --prune >/dev/null 2>&1
upstream="$(git rev-parse --abbrev-ref --symbolic-full-name '@{u}' 2>/dev/null || true)"
head_sha="$(git rev-parse HEAD)"
base_sha="$(git rev-parse "origin/$base" 2>/dev/null || true)"
jq -cn \
  --arg worktree_path "$worktree_path" \
  --arg worktree_root "$worktree_root" \
  --arg invocation_dir "$invocation_dir" \
  --arg repo_root "$repo_root" \
  --arg base_branch "$base" \
  --arg head_branch "$head" \
  --arg current_branch "$current_branch" \
  --arg upstream "$upstream" \
  --arg head_sha "$head_sha" \
  --arg base_sha "$base_sha" \
  --arg checkout_output "$checkout_out" \
  --argjson reused "$reused" \
  --argjson created "$created" \
  '{ok:true,error:"",worktree_path:$worktree_path,worktree_root:$worktree_root,invocation_dir:$invocation_dir,repo_root:$repo_root,base_branch:$base_branch,head_branch:$head_branch,current_branch:$current_branch,upstream:$upstream,head_sha:$head_sha,base_sha:$base_sha,checkout_output:$checkout_output,reused:$reused,created:$created,reused_current:false}'
"""]
format = "json"
timeout = "120s"

[steps.script.env]
TT_PR_META = "{{fetch-pr-metadata.pr.stdout}}"
TT_REPO_HINT = "{{repo_hint}}"
TT_BASE_BRANCH = "{{base_branch}}"
TT_WORKTREE_ROOT = "{{worktree_root}}"
TT_CURRENT_CHECK = "{{check-current-pr-worktree.stdout}}"

[steps.validate]
format = "json"
required = ["stdout"]

[[steps]]
id = "attempt-rebase"
title = "尝试 rebase 到最新 base"
execution = "script"
depends_on = ["prepare-rebase-worktree"]
condition = "prepare-rebase-worktree.stdout.ok == true"
description = "在隔离 worktree 中执行 git rebase origin/<base>；若冲突则输出冲突文件并等待 agent 修复。"

[steps.script]
command = ["bash", "-lc", """
set -u
wt="${TT_WORKTREE_PATH:-}"
base="${TT_BASE_BRANCH:-main}"
if [ -z "$wt" ] || [ ! -d "$wt" ]; then
  jq -cn --arg error "worktree path missing" '{attempted:false,success:false,conflict:false,error:$error,conflict_files:[]}'
  exit 0
fi
cd "$wt"
if ! git diff --quiet || ! git diff --cached --quiet; then
  jq -cn '{attempted:false,success:false,conflict:false,error:"worktree has uncommitted changes before rebase",conflict_files:[]}'
  exit 0
fi
git fetch origin "$base" --prune >/dev/null 2>&1
out="$(git rebase "origin/$base" 2>&1)"
rc=$?
if [ "$rc" -eq 0 ]; then
  jq -cn --arg output "$out" --arg head "$(git rev-parse HEAD)" '{attempted:true,success:true,conflict:false,in_rebase:false,needs_resolution:false,error:"",stdout:$output,head:$head,conflict_files:[]}'
  exit 0
fi
files="$(git diff --name-only --diff-filter=U | jq -R . | jq -s .)"
in_rebase=false
if [ -d "$(git rev-parse --git-path rebase-merge 2>/dev/null)" ] || [ -d "$(git rev-parse --git-path rebase-apply 2>/dev/null)" ]; then
  in_rebase=true
fi
jq -cn --arg output "$out" --argjson conflict_files "$files" --argjson in_rebase "$in_rebase" '{attempted:true,success:false,conflict:($conflict_files|length>0),in_rebase:$in_rebase,needs_resolution:(($conflict_files|length>0) or $in_rebase),error:$output,stdout:$output,conflict_files:$conflict_files}'
"""]
format = "json"
timeout = "120s"

[steps.script.env]
TT_WORKTREE_PATH = "{{prepare-rebase-worktree.stdout.worktree_path}}"
TT_BASE_BRANCH = "{{prepare-rebase-worktree.stdout.base_branch}}"

[steps.validate]
format = "json"
required = ["stdout"]

[[steps]]
id = "resolve-conflicts"
title = "冲突时修复 rebase conflicts"
depends_on = ["attempt-rebase"]
condition = "attempt-rebase.stdout.needs_resolution == true"
input_context = ["fetch-pr-metadata.pr.stdout", "prepare-rebase-worktree.stdout", "attempt-rebase.stdout"]
cwd = "{{prepare-rebase-worktree.stdout.worktree_path}}"
description = """
在隔离 worktree 中完整修复 rebase 冲突并推进 rebase，直到 rebase 完成或遇到明确 blocker。你必须实际读取冲突文件、解决冲突、git add，并在每一轮冲突解决后执行 git rebase --continue。不要 push。

即使 attempt-rebase.stdout.conflict_files 为空，只要 attempt-rebase.stdout.in_rebase == true，也必须运行 git status / git diff 检查 rebase 停在哪一步，并尝试完成 rebase 或报告明确 blocker。

要求：
1. 先运行 git status --short 和 git diff --name-only --diff-filter=U 确认当前冲突文件。
2. 逐个冲突文件解决 conflict markers，保留 PR 语义并兼容最新 base。
3. 运行必要的轻量检查，如 grep 确认没有 <<<<<<<、=======、>>>>>>> 标记。
4. 执行 git add <resolved files>。
5. 执行 GIT_EDITOR=true git rebase --continue。
6. 如果 rebase --continue 后又出现新冲突，重复步骤 1-5，最多处理 30 轮，直到 git status 显示不再处于 rebase 中。
7. 不要创建额外 commit，不要 push。
8. 如果确实无法判断某个冲突怎么解决，保留 worktree 当前状态并在 blocker 中精确说明文件和原因。

输出 ONLY compact JSON：
{"resolved":true,"rebase_completed":true,"continue_attempts":2,"files_resolved":["..."],"validation_actions":["..."],"remaining_conflicts":[],"blocker":""}
"""

[steps.agent]
name = "coder"

[steps.validate]
format = "json"
required = ["resolved", "files_resolved", "remaining_conflicts"]

[[steps]]
id = "continue-rebase"
title = "继续 rebase 并确认无冲突"
execution = "script"
depends_on = ["resolve-conflicts"]
condition = "resolve-conflicts.resolved == true"
description = "冲突 agent 会循环解决冲突并推进 rebase；这里用确定性脚本做最终确认，必要时再执行一次 git rebase --continue。"

[steps.script]
command = ["bash", "-lc", """
set -u
wt="${TT_WORKTREE_PATH:-}"
cd "$wt" 2>/dev/null || { jq -cn '{attempted:false,success:false,error:"worktree path missing",conflict_files:[]}'; exit 0; }
remaining="$(git diff --name-only --diff-filter=U | jq -R . | jq -s .)"
if [ "$(jq 'length' <<<"$remaining")" != "0" ]; then
  jq -cn --argjson conflict_files "$remaining" '{attempted:false,success:false,error:"unresolved conflict files remain",conflict_files:$conflict_files}'
  exit 0
fi
in_rebase=false
if [ -d "$(git rev-parse --git-path rebase-merge 2>/dev/null)" ] || [ -d "$(git rev-parse --git-path rebase-apply 2>/dev/null)" ]; then
  in_rebase=true
fi
if [ "$in_rebase" != true ]; then
  jq -cn --arg head "$(git rev-parse HEAD)" '{attempted:false,success:true,error:"",stdout:"rebase already completed by conflict resolver",head:$head,conflict_files:[]}'
  exit 0
fi
out="$(GIT_EDITOR=true git rebase --continue 2>&1)"
rc=$?
if [ "$rc" -eq 0 ]; then
  jq -cn --arg output "$out" --arg head "$(git rev-parse HEAD)" '{attempted:true,success:true,error:"",stdout:$output,head:$head,conflict_files:[]}'
  exit 0
fi
files="$(git diff --name-only --diff-filter=U | jq -R . | jq -s .)"
jq -cn --arg output "$out" --argjson conflict_files "$files" '{attempted:true,success:false,error:$output,stdout:$output,conflict_files:$conflict_files}'
"""]
format = "json"
timeout = "120s"

[steps.script.env]
TT_WORKTREE_PATH = "{{prepare-rebase-worktree.stdout.worktree_path}}"

[steps.validate]
format = "json"
required = ["stdout"]

[[steps]]
id = "summarize-rebase-state"
title = "汇总 rebase 状态"
execution = "script"
depends_on = ["check-current-pr-worktree", "attempt-rebase", "resolve-conflicts", "continue-rebase"]
condition = "check-current-pr-worktree.stdout.already_on_pr_branch != true"
description = "统一判断 rebase 是否完成、是否仍被冲突阻塞。"

[steps.script]
command = ["bash", "-lc", """
set -euo pipefail
jq -cn \
  --arg metadata "${TT_METADATA:-}" \
  --arg prepare "${TT_PREPARE:-}" \
  --arg attempt "${TT_ATTEMPT:-}" \
  --arg resolve "${TT_RESOLVE:-}" \
  --arg cont "${TT_CONTINUE:-}" '
  def obj($s): if $s == null or ($s|length)==0 then {} else (($s|fromjson?) // {}) end;
  obj($metadata) as $m |
  obj($prepare) as $p |
  obj($attempt) as $a |
  obj($resolve) as $r |
  obj($cont) as $c |
  (($a.success == true) or ($c.success == true)) as $done |
  (($m.ok == false) and (($m.error // "") != "")) as $metadata_failed |
  (($p.ok == false) and (($p.error // "") != "")) as $prepare_failed |
  (($r.blocker // "") != "") as $resolver_blocked |
  (($a.conflict == true) or ($a.in_rebase == true)) as $rebase_interrupted |
  {
    rebase_done:$done,
    conflict_seen:$rebase_interrupted,
    blocked:(($done|not) and ($metadata_failed or $prepare_failed or $rebase_interrupted or $resolver_blocked or (($a.error // "") != "") or (($c.error // "") != ""))),
    blocker:(
      if $done then ""
      elif $metadata_failed then ("PR metadata unavailable: " + ($m.error // ""))
      elif $prepare_failed then ("prepare rebase worktree failed: " + ($p.error // ""))
      elif $resolver_blocked then ($r.blocker // "")
      elif ($c.error // "") != "" then $c.error
      elif ($a.error // "") != "" then $a.error
      else "rebase did not complete" end
    ),
    head:($c.head // $a.head // $p.head_sha // ""),
    conflict_files:($c.conflict_files // $r.remaining_conflicts // $a.conflict_files // [])
  }'
"""]
format = "json"
timeout = "30s"

[steps.script.env]
TT_METADATA = "{{fetch-pr-metadata.pr.stdout}}"
TT_PREPARE = "{{prepare-rebase-worktree.stdout}}"
TT_ATTEMPT = "{{attempt-rebase.stdout}}"
TT_RESOLVE = "{{resolve-conflicts}}"
TT_CONTINUE = "{{continue-rebase.stdout}}"

[steps.validate]
format = "json"
required = ["stdout"]

[[steps]]
id = "run-validation"
title = "运行可选验证命令"
depends_on = ["summarize-rebase-state"]
condition = "summarize-rebase-state.stdout.rebase_done == true"
embed = "git-run-validation"

[steps.embed_vars]
repo_path = "{{prepare-rebase-worktree.stdout.worktree_path}}"
command = "{{validation_command}}"

[[steps]]
id = "push-rebased-branch"
title = "push rebase 后的 PR 分支"
execution = "script"
depends_on = ["summarize-rebase-state", "run-validation"]
condition = "summarize-rebase-state.stdout.rebase_done == true"
description = "验证通过或未请求验证时，按 push 变量决定是否 git push --no-verify --force-with-lease 回 PR 分支；默认 push=true。"

[steps.script]
command = ["bash", "-lc", """
set -u
push_flag="${TT_PUSH:-true}"
wt="${TT_WORKTREE_PATH:-}"
head_branch="${TT_HEAD_BRANCH:-}"
validation="${TT_VALIDATION:-}"
validation_success="$(jq -r 'if length==0 then true else (.success // false) end' <<<"$validation")"
if [ "$push_flag" != true ]; then
  jq -cn '{requested:false,pushed:false,skipped_reason:"push=false",stdout:"",stderr:""}'
  exit 0
fi
if [ "$validation_success" != true ]; then
  jq -cn --arg stderr "validation failed; push skipped" '{requested:true,pushed:false,skipped_reason:"validation_failed",stdout:"",stderr:$stderr}'
  exit 0
fi
cd "$wt" 2>/dev/null || { jq -cn '{requested:true,pushed:false,skipped_reason:"",stdout:"",stderr:"worktree path missing"}'; exit 0; }
upstream="$(git rev-parse --abbrev-ref --symbolic-full-name '@{u}' 2>/dev/null || true)"
remote="origin"
remote_branch="$head_branch"
if [ -n "$upstream" ] && printf '%s' "$upstream" | grep -q '/'; then
  remote="${upstream%%/*}"
  remote_branch="${upstream#*/}"
fi
[ -n "$remote_branch" ] || remote_branch="$(git branch --show-current)"
out="$(git push --no-verify --force-with-lease "$remote" "HEAD:$remote_branch" 2>&1)"
rc=$?
jq -cn \
  --arg remote "$remote" \
  --arg remote_branch "$remote_branch" \
  --arg output "$out" \
  --arg head "$(git rev-parse HEAD)" \
  --argjson pushed "$([ "$rc" -eq 0 ] && echo true || echo false)" \
  '{requested:true,pushed:$pushed,remote:$remote,remote_branch:$remote_branch,head:$head,stdout:(if $pushed then $output else "" end),stderr:(if $pushed then "" else $output end),skipped_reason:""}'
"""]
format = "json"
timeout = "120s"

[steps.script.env]
TT_PUSH = "{{push}}"
TT_WORKTREE_PATH = "{{prepare-rebase-worktree.stdout.worktree_path}}"
TT_HEAD_BRANCH = "{{prepare-rebase-worktree.stdout.head_branch}}"
TT_VALIDATION = "{{run-validation.validation.stdout}}"

[steps.validate]
format = "json"
required = ["stdout"]

[[steps]]
id = "cleanup-worktree"
title = "清理临时 rebase worktree"
execution = "script"
depends_on = ["prepare-rebase-worktree", "summarize-rebase-state", "push-rebased-branch"]
condition = "prepare-rebase-worktree.stdout.worktree_path != \"\""
description = "rebase 完成后移除隔离 worktree；若仍被冲突阻塞，则保留 worktree 以便继续修复。复用当前工作区时不删除当前目录。只移除 worktree，不删除分支。"

[steps.script]
command = ["bash", "-lc", """
set -u
wt="${TT_WORKTREE_PATH:-}"
repo_root="${TT_REPO_ROOT:-}"
reused_current="${TT_REUSED_CURRENT:-false}"
stale_target="${TT_STALE_TARGET_WORKTREE_PATH:-}"
rebase_blocked="${TT_REBASE_BLOCKED:-false}"
if [ -z "$wt" ]; then
  jq -cn '{attempted:false,removed:false,worktree_path:"",stdout:"",stderr:"missing worktree_path"}'
  exit 0
fi
if [ "$rebase_blocked" = true ]; then
  jq -cn --arg worktree_path "$wt" '{attempted:true,removed:false,skipped_reason:"rebase_blocked",worktree_path:$worktree_path,stdout:"",stderr:""}'
  exit 0
fi
if [ "$reused_current" = true ]; then
  if [ -n "$stale_target" ] && [ -e "$stale_target" ]; then
    stale_out="$(git -C "$repo_root" worktree remove --force --force "$stale_target" 2>&1)"
    stale_rc=$?
    git -C "$repo_root" worktree prune >/dev/null 2>&1 || true
    jq -cn --arg worktree_path "$wt" --arg stale_target_worktree_path "$stale_target" --arg output "$stale_out" --argjson stale_removed "$([ "$stale_rc" -eq 0 ] && echo true || echo false)" '{attempted:true,removed:false,skipped_reason:"reused_current_workspace",worktree_path:$worktree_path,stale_target_worktree_path:$stale_target_worktree_path,stale_target_removed:$stale_removed,stdout:(if $stale_removed then $output else "" end),stderr:(if $stale_removed then "" else $output end)}'
    exit 0
  fi
  jq -cn --arg worktree_path "$wt" '{attempted:true,removed:false,skipped_reason:"reused_current_workspace",worktree_path:$worktree_path,stdout:"",stderr:""}'
  exit 0
fi
if [ -z "$repo_root" ] || [ ! -d "$repo_root/.git" ]; then
  repo_root="$(git rev-parse --show-toplevel 2>/dev/null || pwd)"
fi
if [ ! -e "$wt" ]; then
  git -C "$repo_root" worktree prune >/dev/null 2>&1 || true
  jq -cn --arg worktree_path "$wt" '{attempted:true,removed:true,already_absent:true,worktree_path:$worktree_path,stdout:"",stderr:""}'
  exit 0
fi
out="$(git -C "$repo_root" worktree remove --force --force "$wt" 2>&1)"
rc=$?
git -C "$repo_root" worktree prune >/dev/null 2>&1 || true
jq -cn --arg worktree_path "$wt" --arg output "$out" --argjson removed "$([ "$rc" -eq 0 ] && echo true || echo false)" '{attempted:true,removed:$removed,already_absent:false,worktree_path:$worktree_path,stdout:(if $removed then $output else "" end),stderr:(if $removed then "" else $output end)}'
"""]
format = "json"
timeout = "60s"
continue_on_error = true

[steps.script.env]
TT_WORKTREE_PATH = "{{prepare-rebase-worktree.stdout.worktree_path}}"
TT_REPO_ROOT = "{{prepare-rebase-worktree.stdout.repo_root}}"
TT_REUSED_CURRENT = "{{prepare-rebase-worktree.stdout.reused_current}}"
TT_STALE_TARGET_WORKTREE_PATH = "{{prepare-rebase-worktree.stdout.stale_target_worktree_path}}"
TT_REBASE_BLOCKED = "{{summarize-rebase-state.stdout.blocked}}"

[steps.validate]
format = "json"
required = ["stdout"]

[[steps]]
id = "final-report"
title = "输出 PR rebase 结果报告"
depends_on = ["fetch-pr-metadata", "check-current-pr-worktree", "prepare-rebase-worktree", "attempt-rebase", "resolve-conflicts", "continue-rebase", "summarize-rebase-state", "run-validation", "push-rebased-branch", "cleanup-worktree"]
input_context = ["fetch-pr-metadata.pr.stdout", "check-current-pr-worktree.stdout", "prepare-rebase-worktree.stdout", "attempt-rebase.stdout", "resolve-conflicts", "continue-rebase.stdout", "summarize-rebase-state.stdout", "run-validation.validation.stdout", "push-rebased-branch.stdout", "cleanup-worktree.stdout"]
description = """
输出中文最终报告，结论先行。

必须说明：
0. 如果 check-current-pr-worktree.stdout.already_on_pr_branch == true，说明当前仓库已有某个 worktree 已经 checkout 到该 PR head 分支，并给出 check-current-pr-worktree.stdout.worktree_path；本流程已按要求直接结束；此时不得声称执行了 rebase、validation、push 或 cleanup；
1. PR 编号、标题、URL、head/base 分支；
2. 使用的工作区路径，并说明 prepare-rebase-worktree.stdout.reused / created / reused_current；若 reused_current=true，表示复用了当前工作区，不应删除当前目录；若 reused=true 且 reused_current=false，表示复用了目标 .tt worktree；
3. rebase 是否成功，是否发生冲突；
4. 若发生冲突，列出冲突文件、修复动作与剩余 blocker；
5. validation_command 是否执行及结果；
6. 是否 push，push=false 时说明本地分支已保留；push=true 时说明目标 remote/branch，若未 push 说明原因；
7. worktree 是否已清理，如果清理失败给出路径和原因；
8. 给出下一步建议，例如刷新 PR、等待 CI、或人工处理 blocker。

不要编造未出现在 input_context 中的测试或 push 结果。
"""

[steps.agent]
name = "reporter"
