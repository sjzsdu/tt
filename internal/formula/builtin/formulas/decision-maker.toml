formula = "decision-maker"
title = "决策辅助"
description = "分析一个重要决策，给出选项、风险、反方意见和建议。"
version = 1
type = "workflow"
category = "思考"
tags = ["内置", "思考"]

[vars]
question = { description = "需要决策的问题", required = true }

[[steps]]
id = "frame-decision"
title = "界定决策问题"
description = """
澄清决策问题：{{question}}。识别相关人、时间窗口、约束、成功标准和缺失信息。
"""
output_key = "frame"
agent.name = "planner"

[[steps]]
id = "generate-options"
title = "生成可选方案"
depends_on = ["frame-decision"]
input_context = ["frame"]
description = """
列出现实可行的选项，包括不行动、可逆实验和混合方案。
"""
output_key = "options"
agent.name = "planner"

[[steps]]
id = "analyze-tradeoffs"
title = "分析取舍"
depends_on = ["generate-options"]
input_context = ["frame", "options"]
description = """
比较每个选项的收益、成本、风险、可逆性、机会成本和二阶影响。
"""
output_key = "tradeoffs"
agent.name = "planner"

[[steps]]
id = "red-team"
title = "反方审查"
depends_on = ["analyze-tradeoffs"]
input_context = ["tradeoffs"]
description = """
站在反方视角攻击最强选项，指出盲点、情绪偏差和失败模式。
"""
output_key = "red_team"
agent.name = "planner"

[[steps]]
id = "recommend"
title = "给出建议"
depends_on = ["red-team"]
input_context = ["frame", "options", "tradeoffs", "red_team"]
description = """
给出推荐方案、信心等级、什么条件下会改变判断，以及最小下一步行动。
"""
agent.name = "reporter"
