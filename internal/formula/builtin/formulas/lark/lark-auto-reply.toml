formula = "lark-auto-reply"
title = "Lark 自动回复"
description = "使用 lark-cli 搜索单聊或 @我的 Lark 消息，调用 agent 按项目上下文生成回复，并可选择 dry-run 或自动回复。适合配合 tt formula schedule 每隔数分钟运行。"
version = 1
type = "workflow"
category = "lark"
tags = ["lark", "feishu", "auto-reply", "schedule"]

[preflight]

[[preflight.checks]]
type = "command"
name = "lark-cli"
command = "lark-cli"
message = "需要安装并配置 lark-cli；可运行 lark-cli doctor 检查认证。"

[[preflight.checks]]
type = "command"
name = "python3"
command = "python3"
message = "需要安装 python3 来执行 Lark 消息适配脚本。"

[vars]
mode = { description = "运行模式：dry-run 只预览不发送，但会写本地 state 以便批处理继续推进；auto 会通过 lark-cli 回复并写入去重 state。", default = "dry-run", enum = ["dry-run", "auto"] }
lark_as = { description = "lark-cli 身份类型：user 或 bot。读取 @我/P2P 通常使用 user。", default = "user", enum = ["user", "bot"] }
chat_ids = { description = "可选 chat_id 白名单，多个用英文逗号分隔；为空则搜索当前身份可见范围。", default = "" }
self_open_id = { description = "可选：自己的 open_id，用于过滤自己发出的消息，形如 ou_xxx。", default = "" }
include_direct = { description = "是否搜索 P2P 单聊消息；仅在提供 chat_ids 时生效，避免 Lark 全局 P2P 搜索超时。", default = "false", enum = ["true", "false"] }
keywords = { description = "可选关键词过滤，多个用英文逗号分隔；为空不过滤。", default = "" }
lookback_minutes = { description = "每次向前搜索多少分钟的 @我/指定单聊消息；lark-cli 当前不提供未读过滤，未读但早于该窗口的消息不会被选中。", default = "60" }
page_size = { description = "lark-cli messages-search 每页大小，1-50。", default = "20" }
state_file = { description = "去重状态文件路径。", default = ".tt/lark-auto-reply/state.json" }
project_context = { description = "项目回复上下文文件路径；不存在时 agent 应基于当前仓库和消息内容谨慎回复。", default = ".tt/lark-auto-reply/context.md" }
persona_context = { description = "个人职场画像/回复门控上下文 Markdown。优先使用 TT_LARK_PERSONA_CONTEX 指向的存在文件，其次 ~/.tt/persona.md；也可用 --var persona_context=... 显式指定。", default = "" }
reply_style = { description = "回复风格约束。", default = "中文优先，简洁准确，1-3 段；不确定时说明需要确认；不要承诺上线时间、客户承诺或生产高风险操作。" }
max_reply_chars = { description = "自动发送前的最大回复字符数。", default = "1200" }
reply_in_thread = { description = "是否使用 Lark thread reply。", default = "true", enum = ["true", "false"] }
lark_cli = { description = "lark-cli 可执行文件路径。", default = "lark-cli" }
max_messages_per_run = { description = "单次运行最多处理多少条未处理候选消息；每条处理后写入 state，下一轮自动跳过。", default = "20", pattern = "^[1-9][0-9]*$" }

[[steps]]
id = "process-messages"
title = "批量处理搜索窗口内所有未处理 Lark 消息"

[steps.loop]
max = "{{max_messages_per_run}}"
until = "pick-message.has_message == false"

[[steps.loop.body]]
id = "pick-message"
title = "搜索并选择一条待回复 Lark 消息"
execution = "script"

[steps.loop.body.script]
script = "./scripts/fetch-pick-lark-message.py"
format = "json"
timeout = "60s"

[steps.loop.body.script.env]
TT_LARK_CLI = "{{lark_cli}}"
TT_LARK_AS = "{{lark_as}}"
TT_STATE_FILE = "{{state_file}}"
TT_SELF_OPEN_ID = "{{self_open_id}}"
TT_CHAT_IDS = "{{chat_ids}}"
TT_KEYWORDS = "{{keywords}}"
TT_INCLUDE_DIRECT = "{{include_direct}}"
TT_LOOKBACK_MINUTES = "{{lookback_minutes}}"
TT_PAGE_SIZE = "{{page_size}}"

[steps.loop.body.validate]
format = "json"
required = ["has_message"]

[[steps.loop.body]]
id = "load-reply-context"
title = "读取个人画像与项目上下文"
execution = "script"
depends_on = ["pick-message"]
condition = "pick-message.has_message == true"

[steps.loop.body.script]
command = ["python3", "-c", """
import json, os, pathlib

def exists_file(path):
    path = (path or '').strip()
    if not path:
        return False
    p = pathlib.Path(path).expanduser()
    return p.exists() and p.is_file()

def read(path):
    path = (path or '').strip()
    if not path:
        return {'path': '', 'exists': False, 'content': ''}
    p = pathlib.Path(path).expanduser()
    if not p.exists() or not p.is_file():
        return {'path': str(p), 'exists': False, 'content': ''}
    return {'path': str(p), 'exists': True, 'content': p.read_text(encoding='utf-8', errors='replace')[:20000]}

persona_env = os.environ.get('TT_LARK_PERSONA_CONTEX', '')
persona_env_compat = os.environ.get('TT_LARK_PERSONA_CONTEXT', '')
persona_default = '~/.tt/persona.md'
persona_var = os.environ.get('TT_PERSONA_CONTEXT', '')
if exists_file(persona_env):
    persona_path = persona_env
    persona_source = 'env:TT_LARK_PERSONA_CONTEX'
elif exists_file(persona_default):
    persona_path = persona_default
    persona_source = 'default:~/.tt/persona.md'
elif exists_file(persona_env_compat):
    persona_path = persona_env_compat
    persona_source = 'env:TT_LARK_PERSONA_CONTEXT'
else:
    persona_path = persona_var
    persona_source = 'var:persona_context' if persona_path else ''

print(json.dumps({
    'persona': read(persona_path),
    'persona_source': persona_source,
    'project': read(os.environ.get('TT_PROJECT_CONTEXT', '')),
}, ensure_ascii=False))
"""]
format = "json"
timeout = "15s"

[steps.loop.body.script.env]
TT_PERSONA_CONTEXT = "{{persona_context}}"
TT_PROJECT_CONTEXT = "{{project_context}}"

[steps.loop.body.validate]
format = "json"
required = ["persona", "project"]

[[steps.loop.body]]
id = "reply-gate"
title = "判断是否应该代为回复以及回复边界"
depends_on = ["pick-message", "load-reply-context"]
input_context = ["pick-message", "load-reply-context"]
condition = "pick-message.has_message == true"
description = """
你是用户的 Lark 职场回复门控。请基于个人职场画像、项目上下文和收到的消息，判断是否适合自动代用户回复。

个人职场画像文件：{{persona_context}}
内容：{{load-reply-context.persona.content}}

项目上下文文件：{{project_context}}
内容：{{load-reply-context.project.content}}

Lark 消息：
- 来源：{{pick-message.source}}
- 发送人：{{pick-message.sender_name}} / {{pick-message.sender_id}}
- chat_id：{{pick-message.chat_id}}
- message_id：{{pick-message.message_id}}
- 消息正文：{{pick-message.text}}

输出 ONLY compact JSON object，不要 Markdown，不要解释：
{
  "should_reply": true,
  "risk_level": "low|medium|high",
  "reason": "为什么应该或不应该回复",
  "reply_intent": "这次回复要达成什么",
  "must_include": ["必须包含的事实、限制或问题"],
  "must_avoid": ["必须避免的承诺、措辞、AI味表达或越权内容"],
  "tone": "像用户本人的自然职场表达风格",
  "needs_human": false
}

门控规则：
- 和用户职责、项目、知识储备明显相关，且风险低，可以 should_reply=true。
- 涉及承诺排期、客户口径、生产数据/权限/删除/迁移、组织决策、人事/绩效/合同/报价，默认 should_reply=false 或 needs_human=true。
- 信息不足但可以安全询问澄清时，可以 should_reply=true，但必须只问必要问题。
- 如果个人画像或项目上下文缺失，要更保守。
- must_avoid 必须包含“不要说作为AI/我是AI/无法访问”等 AI 味表达。
"""
agent.name = "coder"

[steps.loop.body.validate]
format = "json"
required = ["should_reply", "risk_level", "reason", "must_include", "must_avoid"]

[[steps.loop.body]]
id = "reply-decision"
title = "合并消息存在性与门控结果，避免循环上下文串轮"
execution = "script"
depends_on = ["pick-message", "reply-gate"]
input_context = ["pick-message", "reply-gate"]

[steps.loop.body.script]
script = "./scripts/lark-reply-decision.py"
format = "json"
timeout = "10s"

[steps.loop.body.script.env]
TT_PICK_MESSAGE = "{{pick-message}}"
TT_REPLY_GATE = "{{reply-gate}}"

[steps.loop.body.validate]
format = "json"
required = ["has_message", "should_reply", "gate_rejected"]

[[steps.loop.body]]
id = "code-research"
title = "必要时调研仓库代码实现逻辑"
depends_on = ["reply-decision"]
input_context = ["pick-message", "load-reply-context", "reply-gate", "reply-decision"]
condition = "reply-decision.should_reply == true"
description = """
你正在为 Lark 自动回复做代码事实核查。

收到的消息：{{pick-message.text}}
项目上下文：{{load-reply-context.project.content}}
门控结论：{{reply-gate}}

要求：
- 如果消息在询问代码实现、接口行为、bug 原因、配置位置、运行逻辑、函数/类/命令如何工作，必须先查看当前仓库相关文件，再总结可用于回复的事实。
- 如果项目上下文不足以定位，请使用代码搜索/读取文件来确认，不要凭印象回答。
- 如果消息不是代码/实现相关，只输出“无需代码调研”。
- 输出简洁中文，包含你查看到的关键文件/符号和结论；不需要生成最终飞书回复。
"""
agent.name = "coder"

[[steps.loop.body]]
id = "draft-reply"
title = "根据门控结果生成 Lark 回复草稿"
depends_on = ["reply-decision", "code-research"]
input_context = ["pick-message", "load-reply-context", "reply-gate", "reply-decision", "code-research"]
condition = "reply-decision.should_reply == true"
description = """
你正在代替用户回复 Lark/飞书消息。请严格基于 reply-gate 的门控结论、个人职场画像、项目上下文和收到的消息，生成可以直接发送的回复正文。

个人职场画像：{{load-reply-context.persona.content}}
项目上下文：{{load-reply-context.project.content}}
门控结论：{{reply-gate}}
代码调研结论：{{code-research}}

Lark 消息信息：
- 来源：{{pick-message.source}}
- 发送人：{{pick-message.sender_name}} / {{pick-message.sender_id}}
- chat_id：{{pick-message.chat_id}}
- message_id：{{pick-message.message_id}}
- 消息正文：{{pick-message.text}}

回复风格：{{reply_style}}

安全规则：
- 只输出最终要发送的回复正文，不要 Markdown 标题，不要解释生成过程。
- 不要编造事实；不确定时明确说“我需要确认一下”。
- 如果对方问代码实现/运行逻辑/bug/配置位置，必须依据“代码调研结论”回复；如果代码调研结论不足，不要给确定答案，只说明需要继续确认。
- 涉及上线时间、客户承诺、生产数据、账号权限、删除/迁移等高风险事项时，不要擅自承诺，只给谨慎建议或说明需要人工确认。
- 回复应尽量短，除非对方明确要求详细说明。
- 口吻要像真实同事本人在飞书里回复，避免“很高兴为你服务”“以下是我的建议”“作为AI”等 AI 味或客服味表达。
- 严格遵守 reply-gate.must_include 和 reply-gate.must_avoid。
"""
agent.name = "coder"

[[steps.loop.body]]
id = "send-or-preview"
title = "发送回复或 dry-run 预览"
execution = "script"
depends_on = ["reply-decision", "draft-reply"]
input_context = ["pick-message", "reply-gate", "reply-decision", "draft-reply"]
condition = "reply-decision.should_reply == true"

[steps.loop.body.script]
script = "./scripts/send-lark-reply.py"
format = "json"
timeout = "60s"

[steps.loop.body.script.env]
TT_LARK_CLI = "{{lark_cli}}"
TT_LARK_AS = "{{lark_as}}"
TT_MODE = "{{mode}}"
TT_STATE_FILE = "{{state_file}}"
TT_PICK_MESSAGE = "{{pick-message}}"
TT_REPLY_TEXT = "{{draft-reply}}"
TT_MAX_REPLY_CHARS = "{{max_reply_chars}}"
TT_REPLY_IN_THREAD = "{{reply_in_thread}}"

[steps.loop.body.validate]
format = "json"
required = ["sent", "marked"]


[[steps.loop.body]]
id = "mark-gate-rejected"
title = "记录不适合自动回复的 Lark 消息，避免重复处理"
execution = "script"
depends_on = ["reply-decision"]
input_context = ["pick-message", "reply-gate", "reply-decision"]
condition = "reply-decision.gate_rejected == true"

[steps.loop.body.script]
script = "./scripts/mark-lark-message.py"
format = "json"
timeout = "15s"

[steps.loop.body.script.env]
TT_STATE_FILE = "{{state_file}}"
TT_PICK_MESSAGE = "{{pick-message}}"
TT_REPLY_GATE = "{{reply-gate}}"
TT_MARK_REASON = "gate_rejected"

[steps.loop.body.validate]
format = "json"
required = ["marked"]

[[steps]]
id = "final-report"
title = "汇总本轮 Lark 自动回复处理结果"
execution = "script"
depends_on = ["process-messages"]

[steps.script]
script = "./scripts/lark-final-report.py"
format = "markdown"
timeout = "15s"
