formula = "github-pr-review"
description = "使用 gh 收集 PR 信息与 diff，完成代码审阅、生成评论建议，并默认通过确定性脚本真实提交 GitHub review/comment，最后输出带表格汇总的最终报告。"
version = 5
type = "workflow"

[preflight]

[[preflight.checks]]
type = "command"
name = "gh"
command = "gh"
message = "需要安装 GitHub CLI: https://cli.github.com/"

[[preflight.checks]]
type = "exec"
name = "gh-auth"
command = "gh auth status"
message = "GitHub CLI 未登录或不可用，请先执行 gh auth login"

[[preflight.checks]]
type = "git"
name = "git-repo"
require_repo = true
message = "repo_hint 为空时需要在 GitHub git 仓库中运行"

[[preflight.checks]]
type = "command"
name = "python3"
command = "python3"
message = "需要安装 python3"

[vars]
pr_ref = { description = "PR 编号、URL 或分支引用", required = true }
review_focus = { description = "重点关注的方面，例如正确性、架构、性能、安全、兼容性", default = "正确性、风险与可维护性" }
repo_hint = { description = "可选的仓库提示，例如 owner/repo；若为空则使用当前仓库上下文", default = "" }
submit_review = { description = "是否真实提交 GitHub review/comment；默认 true。传 false 时仅生成草稿，不写入 GitHub。", default = "true", enum = ["true", "false"] }

[[steps]]
id = "fetch-pr"
title = "使用 gh 获取 PR 全量信息"
execution = "formula"
formula = "github-fetch-pr"

[steps.with]
pr_ref = "{{pr_ref}}"
repo_hint = "{{repo_hint}}"
review_focus = "{{review_focus}}"
submit_review = "{{submit_review}}"

[[steps]]
id = "analyze-review-findings"
title = "分析改动并产出审阅问题清单"
depends_on = ["fetch-pr"]
condition = "fetch-pr.pr.stdout.ready == true"
input_context = ["fetch-pr.pr.stdout", "fetch-pr.pr.stdout.patch"]
description = """
基于 fetch-pr.pr.stdout 与 fetch-pr.pr.stdout.patch 对该 PR 做代码审阅。

重点关注：正确性、边界条件、回归风险、安全性、性能、可维护性，以及 review_focus 明确相关的方面。

输出 ONLY compact JSON object，不要 Markdown，不要代码块，不要解释文字：
{
  "has_findings": true,
  "why_clean": "",
  "files_and_modules": [{"path":"...","module":"...","summary":"..."}],
  "behavior_changes": [{"area":"...","change":"...","risk":"low|medium|high"}],
  "impact_scope": [{"scope":"...","details":"..."}],
  "major_risks": [{"title":"...","severity":"low|medium|high","details":"..."}],
  "review_comments": [{"id":"finding-1","type":"line|conversation","path":"path/to/file","line":123,"side":"RIGHT","severity":"low|medium|high","category":"correctness|security|performance|maintainability|compatibility|testing|other","title":"简短标题","body":"给作者的评论正文，清楚说明问题、原因、建议","risk_reason":"为什么这是风险","suggested_action":"建议如何修复"}]
}

规则：
- 如果没有问题，has_findings=false，review_comments=[]，并填写 why_clean。
- 仅在确实能从 diff 支撑时给出 line 评论；否则使用 conversation。
- 不要编造未在输入中出现的文件、行号或行为。
- body 应可直接用于 GitHub review comment。
"""

[steps.agent]
name = "assistant"

[steps.validate]
format = "json"
required = ["has_findings", "review_comments", "files_and_modules", "major_risks"]

[[steps]]
id = "prepare-review-summary"
title = "整理待提交评论与总评摘要"
depends_on = ["analyze-review-findings", "fetch-pr"]
condition = "fetch-pr.pr.stdout.ready == true"
input_context = ["analyze-review-findings.review_comments", "analyze-review-findings.has_findings", "analyze-review-findings.why_clean", "analyze-review-findings.major_risks", "fetch-pr.pr.stdout.submit_review", "fetch-pr.pr.stdout.title", "fetch-pr.pr.stdout.url"]
description = """
基于 review findings 与 PR context，整理提交计划。

输出 ONLY compact JSON object，不要 Markdown，不要代码块，不要解释文字：
{
  "submit_review": true,
  "has_findings": true,
  "summary_comment": "整体 review 摘要，可作为 PR conversation 或 review body",
  "inline_comments": [{"id":"finding-1","path":"...","line":123,"side":"RIGHT","body":"..."}],
  "conversation_comments": [{"id":"finding-2","body":"..."}],
  "table_rows": [{"id":"finding-1","severity":"high","category":"correctness","location":"path/to/file:123","status":"pending-submit|draft-only|no-issue","summary":"一句话总结"}]
}

要求：
- submit_review 直接沿用 fetch-pr.pr.stdout.submit_review。
- 将可行的 line 评论与 conversation 评论分开。
- summary_comment 需总结整体结论、风险重点、建议动作。
- table_rows 将用于最终报告中的汇总表格。
- 如果没有问题，也要生成一行 no-issue 汇总。
"""

[steps.agent]
name = "reporter"

[steps.validate]
format = "json"
required = ["submit_review", "has_findings", "summary_comment", "inline_comments", "conversation_comments", "table_rows"]

[[steps]]
id = "submit-review-comments"
title = "提交 review summary 与 conversation comments"
execution = "script"
depends_on = ["prepare-review-summary"]
input_context = ["prepare-review-summary.summary_comment", "prepare-review-summary.conversation_comments", "prepare-review-summary.submit_review", "fetch-pr.pr.stdout.number", "fetch-pr.pr.stdout.repo_hint"]
condition = "prepare-review-summary.submit_review == true"

[steps.script]
script = "./scripts/submit-review-comments.py"
args = ["{{pr_ref}}", "{{repo_hint}}", "{{prepare-review-summary}}"]
format = "json"
timeout = "120s"
continue_on_error = true

[steps.validate]
format = "json"
required = ["stdout"]

[[steps]]
id = "submit-inline-comments"
title = "逐条提交 inline review comments"
depends_on = ["prepare-review-summary", "submit-review-comments"]
condition = "prepare-review-summary.submit_review == true"

  [steps.loop]
  for_each = "prepare-review-summary.inline_comments"
  var = "review_comment"
  parallel = false

  [[steps.loop.body]]
  id = "submit-inline-comment"
  title = "提交 inline comment {{review_comment.id}}"
  execution = "script"
  input_context = ["review_comment", "fetch-pr.pr.stdout.head_sha", "fetch-pr.pr.stdout.repo_hint"]

    [steps.loop.body.script]
    script = "./scripts/submit-inline-comment.py"
    format = "json"
    timeout = "60s"
    continue_on_error = true

    [steps.loop.body.script.env]
    TT_PR_REF = "{{pr_ref}}"
    TT_REPO_HINT = "{{fetch-pr.pr.stdout.repo_hint}}"
    TT_HEAD_SHA = "{{fetch-pr.pr.stdout.head_sha}}"
    TT_REVIEW_COMMENT = "{{review_comment}}"

  [steps.loop.body.validate]
  format = "json"
  required = ["stdout"]

[[steps]]
id = "draft-review-comments"
title = "生成 review 草稿但不真实提交"
depends_on = ["prepare-review-summary"]
input_context = ["prepare-review-summary", "fetch-pr.pr.stdout.url", "analyze-review-findings.why_clean"]
condition = "fetch-pr.pr.stdout.ready == true && prepare-review-summary.submit_review == false"
description = """
基于 review_plan、PR URL 和 why_clean 生成拟发送 review 草稿。

输出 Markdown，至少包含：总体结论、建议提交的 summary comment、拟发送的 inline comments 列表、拟发送的 conversation comments 列表、每个问题为什么值得关注。如果没有问题，明确说明 why_clean。

要求：不要假装已经真实提交；内容应与 review_plan 一致；文案应可直接复制到 GitHub。
"""

[steps.agent]
name = "assistant"

[[steps]]
id = "report-data"
title = "整理 PR 审查报告数据"
depends_on = ["fetch-pr", "submit-review-comments", "submit-inline-comments", "draft-review-comments"]
execution = "aggregate"

[steps.aggregate.fields]
ready = "fetch-pr.pr.stdout.ready"
fetch_error = "fetch-pr.pr.stdout.error"
title = "fetch-pr.pr.stdout.title"
url = "fetch-pr.pr.stdout.url"
changed_files_count = "fetch-pr.pr.stdout.changed_files_count"
files_and_modules = "analyze-review-findings.files_and_modules"
behavior_changes = "analyze-review-findings.behavior_changes"
impact_scope = "analyze-review-findings.impact_scope"
major_risks = "analyze-review-findings.major_risks"
has_findings = "analyze-review-findings.has_findings"
table_rows = "prepare-review-summary.table_rows"
summary_comment = "prepare-review-summary.summary_comment"
submit_review = "prepare-review-summary.submit_review"
submitted = "submit-review-comments.stdout.submitted"
submitted_comments = "submit-review-comments.stdout.submitted_comments"
failed_comments = "submit-review-comments.stdout.failed_comments"
review_error = "submit-review-comments.stdout.review_error"
inline_results = "submit-inline-comments"
draft = "draft-review-comments"
repair_submit_comments = "formula_repairs.submit-review-comments"
repair_inline_comment = "formula_repairs.submit-inline-comment"

[[steps]]
id = "final-report"
title = "输出最终 PR 审查报告"
depends_on = ["report-data"]
input_context = ["report-data"]
description = """
请面向用户输出最终 PR 审查报告，使用清晰 Markdown。

必须包含：PR 概览、改动文件与模块、关键行为变化、影响范围、主要风险、评论提交结果、最终结论。

"评论提交结果"必须包含 Markdown 表格，列至少为：ID、Severity、Category、Location、Status、Summary。

生成规则：
- 表格基于 prepare-review-summary.table_rows。
- 如果 prepare-review-summary.submit_review=true：结合 submit-review-comments 与 submit-inline-comments，已成功提交的问题标记为 submitted，提交失败标记为 submit-failed，未尝试提交标记为 pending。
- 如果 prepare-review-summary.submit_review=false：所有问题标记为 draft-only。
- 如果没有问题，仍然输出 no-issue 行。
- 明确区分：哪些问题已真实通过 gh 发出，哪些只是草稿，哪些提交失败。
- 如果 formula_repairs.submit-review-comments 可用，必须在报告中增加"运行时脚本自修复"提示，说明本次使用了临时 fixed_command，并建议更新 github-pr-review formula 文档。
- 如果 fetch-pr.pr.stdout.ready=false，直接报告 PR 元数据获取失败和 fetch-pr.pr.stdout.error，不要继续编造 review 结果。

- 不要重复粘贴上游 step 的原始 JSON、stdout/stderr、diff、日志或完整子报告；只提炼每个 step 独有的结论、状态变化、文件/URL/commit 等关键增量。
"""

[steps.agent]
name = "reporter"
