formula = "git-merge-branches"
title = "Merge multiple branches into a temporary branch"
description = "从当前 Git 分支或指定 base_branch 切出一个 tmp 开头的新分支，按逗号分隔的分支列表顺序合并；允许 fast-forward，冲突时复用 git-resolve-conflicts，无法解决的分支会 abort 本次 merge 后跳过，并在报告中呈现。"
version = 1
type = "workflow"
category = "git"
tags = ["git", "merge", "branch", "conflict"]

[preflight]

[[preflight.checks]]
type = "command"
name = "git"
command = "git"
message = "需要安装 git"

[[preflight.checks]]
type = "command"
name = "bash"
command = "bash"
message = "需要安装 bash"

[[preflight.checks]]
type = "command"
name = "python3"
command = "python3"
message = "需要安装 python3"

[[preflight.checks]]
type = "command"
name = "jq"
command = "jq"
message = "需要安装 jq"

[[preflight.checks]]
type = "git"
name = "git-repo"
require_repo = true
message = "当前目录必须在 git 仓库内"

[vars]
branches = { description = "待合并分支列表，使用逗号分隔，例如 feature/a,feature/b,origin/feature/c", required = true }
base_branch = { description = "可选起始 ref/branch；为空时从当前分支/当前 HEAD 切出 tmp 分支", default = "" }
target_branch = { description = "可选目标分支名；为空时自动生成 tmp-merge-YYYYmmdd-HHMMSS", default = "" }
validation_command = { description = "全部可合并分支处理完成后的可选验证命令；为空或 - 表示跳过", default = "" }
conflict_context_root = { description = "传给 git-resolve-conflicts 的 context JSON 根目录；为空时由 git-resolve-conflicts 自行判断", default = "" }

[[steps]]
id = "prepare-merge-branch"
title = "创建临时合并分支"
execution = "script"
description = "从当前分支或指定 base_branch 创建目标 tmp 分支，并把逗号分隔的 branches 解析成顺序合并清单。要求当前没有未提交修改，也没有 merge/rebase/cherry-pick 进行中。"

[steps.script]
script = "../../scripts/git/prepare-merge-branch.sh"
format = "json"
timeout = "60s"

[steps.script.env]
TT_BRANCHES = "{{branches}}"
TT_TARGET_BRANCH = "{{target_branch}}"
TT_BASE_BRANCH = "{{base_branch}}"

[steps.validate]
format = "json"
required = ["stdout"]

[[steps]]
id = "merge-branches"
title = "顺序合并分支"
depends_on = ["prepare-merge-branch"]
condition = "prepare-merge-branch.stdout.ok == true"

[steps.loop]
for_each = "prepare-merge-branch.stdout.items"
var = "merge_item"
parallel = false

[[steps.loop.body]]
id = "attempt-merge"
title = "合并 {{merge_item.branch}}"
execution = "script"
description = "尝试合并当前分支。成功则继续下一项；冲突则交给 git-resolve-conflicts。脚本本身不因普通 merge 冲突失败。"

[steps.loop.body.script]
script = "../../scripts/git/attempt-merge.sh"
format = "json"
timeout = "120s"

[steps.loop.body.script.env]
TT_REPO_ROOT = "{{prepare-merge-branch.stdout.repo_root}}"
TT_BRANCH = "{{merge_item.branch}}"
TT_INDEX = "{{merge_item.index}}"

[steps.loop.body.validate]
format = "json"
required = ["stdout"]

[[steps.loop.body]]
id = "resolve-merge-conflicts"
title = "修复 {{merge_item.branch}} 的 merge 冲突"
depends_on = ["attempt-merge"]
condition = "attempt-merge.stdout.needs_resolution == true"
embed = "git-resolve-conflicts"
continue_on_error = true

[steps.loop.body.embed_vars]
validation_command = "-"
context_root = "{{conflict_context_root}}"

[[steps.loop.body]]
id = "finalize-merge"
title = "收口 {{merge_item.branch}} 的合并结果"
execution = "script"
depends_on = ["attempt-merge", "resolve-merge-conflicts"]
description = "若无冲突则确认成功；若冲突已清除则只 stage 当前 unmerged 文件并完成 merge；若仍有冲突或 resolver 失败，则 abort 本次 merge 并标记该分支 skipped，继续后续分支。"

[steps.loop.body.script]
script = "../../scripts/git/finalize-merge.sh"
format = "json"
timeout = "120s"

[steps.loop.body.script.env]
TT_REPO_ROOT = "{{prepare-merge-branch.stdout.repo_root}}"
TT_BRANCH = "{{merge_item.branch}}"
TT_INDEX = "{{merge_item.index}}"
TT_ATTEMPT = "{{attempt-merge.stdout}}"
TT_RESOLVE = "{{resolve-merge-conflicts}}"

[steps.loop.body.validate]
format = "json"
required = ["stdout"]

[[steps]]
id = "merge-results"
title = "汇总分支合并结果"
depends_on = ["merge-branches"]
execution = "aggregate"

[steps.aggregate]
source = "merge-branches"
as = "results"
require = ["branch", "merged", "skipped", "final"]

[steps.validate]
format = "json"
required = ["results"]

[[steps]]
id = "run-validation"
title = "运行可选验证"
depends_on = ["merge-results"]
condition = "validation_command != '' && validation_command != '-'"
embed = "run-validation"

[steps.embed_vars]
repo_path = "{{prepare-merge-branch.stdout.repo_root}}"
command = "{{validation_command}}"

[[steps]]
id = "final-report"
title = "输出多分支合并报告"
depends_on = ["prepare-merge-branch", "merge-results", "run-validation"]
input_context = ["prepare-merge-branch.stdout", "merge-results.stdout", "run-validation.validation.stdout"]
description = """
输出中文最终报告，结论先行。

必须包含：
1. 目标分支、起始分支/HEAD、最终 HEAD。
2. 分支合并总览：成功合并、跳过、发生冲突后成功解决、发生冲突但跳过。
3. 对每个分支列出状态：merged/skipped、是否发生冲突、冲突文件、skip_reason。
4. 如果有 skipped 分支，明确说明它们没有进入目标分支，后续需要人工处理或重跑。
5. validation_command 是否执行，以及结果。

不要重复粘贴上游完整 JSON、stdout/stderr 或 git 输出，只提炼关键状态和文件列表。
"""
agent.name = "assistant"
