formula = "git-resolve-conflicts"
title = "Resolve current git conflicts"
description = "通用 Git 冲突修复公式：只接管当前 git 项目中已经存在的代码冲突，不负责 checkout/merge/rebase/cherry-pick continue/push。为每个冲突文件生成 base/ours/theirs 三方上下文，并发调用 merge-conflict-resolver 修复，自动重建 lockfile，并输出冲突解决报告。"
version = 3
type = "workflow"
category = "git"
tags = ["git", "conflict", "resolver"]

[preflight]

[[preflight.checks]]
type = "command"
name = "git"
command = "git"
message = "需要安装 git"

[[preflight.checks]]
type = "command"
name = "python3"
command = "python3"
message = "需要安装 python3"

[[preflight.checks]]
type = "command"
name = "jq"
command = "jq"
message = "需要安装 jq"

[[preflight.checks]]
type = "git"
name = "git-repo"
require_repo = true
message = "当前目录必须在 git 仓库内"

[vars]
validation_command = { description = "可选验证命令；冲突修复后执行，例如 npm test / go test ./...", default = "" }

[[steps]]
id = "inspect-conflicts"
title = "检查当前工作区冲突状态"
execution = "script"
description = "只检查当前 git repo 是否已有 unmerged files 或 conflict markers；不执行 checkout/merge/push。"

[steps.script]
command = ["bash", "-lc", """
set -euo pipefail
repo_root="$(git rev-parse --show-toplevel 2>/dev/null || true)"
started_at="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
started_epoch="$(date +%s)"
if [ -z "$repo_root" ]; then jq -cn --arg started_at "$started_at" --argjson started_epoch "$started_epoch" '{ok:false,needs_resolution:false,repo_root:"",started_at:$started_at,started_epoch:$started_epoch,blocker_type:"not_git_repo",blocker_summary:"not inside a git repository",conflicted_files:[]}'; exit 0; fi
cd "$repo_root"
current_branch="$(git branch --show-current 2>/dev/null || true)"
merge_head_path="$(git rev-parse --git-path MERGE_HEAD)"
rebase_merge_path="$(git rev-parse --git-path rebase-merge)"
rebase_apply_path="$(git rev-parse --git-path rebase-apply)"
cherry_pick_head_path="$(git rev-parse --git-path CHERRY_PICK_HEAD)"
operation="none"
[ -e "$merge_head_path" ] && operation="merge"
if [ -d "$rebase_merge_path" ] || [ -d "$rebase_apply_path" ]; then operation="rebase"; fi
[ -e "$cherry_pick_head_path" ] && operation="cherry-pick"
unmerged="$(git diff --name-only --diff-filter=U | jq -R -s -c 'split("\n") | map(select(length>0))')"
marker_files="$(git diff --name-only HEAD | while IFS= read -r file; do [ -f "$file" ] && git grep -n -E '^(<<<<<<<|=======|>>>>>>>)' -- "$file" 2>/dev/null | cut -d: -f1 || true; done | sort -u | jq -R -s -c 'split("\n") | map(select(length>0))')"
conflicted="$(jq -cn --argjson a "$unmerged" --argjson b "$marker_files" '($a+$b)|unique')"
needs=false
[ "$(jq -r 'length' <<<"$conflicted")" -gt 0 ] && needs=true
jq -cn --arg repo_root "$repo_root" --arg current_branch "$current_branch" --arg operation "$operation" --arg started_at "$started_at" --argjson started_epoch "$started_epoch" --argjson unmerged "$unmerged" --argjson marker_files "$marker_files" --argjson conflicted "$conflicted" --argjson needs "$needs" '{ok:true,repo_root:$repo_root,current_branch:$current_branch,operation:$operation,started_at:$started_at,started_epoch:$started_epoch,needs_resolution:$needs,conflicted_files:$conflicted,unmerged_files:$unmerged,marker_files:$marker_files,blocker_type:(if $needs then "none" else "none" end),blocker_summary:(if $needs then "" else "no current git conflict detected" end)}'
"""]
format = "json"
timeout = "60s"

[steps.validate]
format = "json"
required = ["stdout"]

[[steps]]
id = "list-conflict-files"
title = "生成冲突文件索引"
depends_on = ["inspect-conflicts"]
condition = "inspect-conflicts.stdout.needs_resolution == true"
execution = "script"

[steps.script]
command = ["bash", "-lc", """
set -uo pipefail
json_error() {
  python3 -c 'import json,sys; print(json.dumps({"done":False,"files":[],"items":[],"error":sys.argv[1]}, ensure_ascii=False))' "$1" 2>/dev/null \
    || printf '{"done":false,"files":[],"items":[],"error":"script setup failed before python could report details"}\n'
}
repo_root="${TT_REPO_ROOT:-}"
[ -n "$repo_root" ] && cd "$repo_root" || { json_error "failed to enter repo root: ${repo_root:-<empty>}"; exit 0; }
command -v python3 >/dev/null 2>&1 || { json_error "python3 is required for conflict indexing but was not found in PATH"; exit 0; }
python3 - <<'PY'
import hashlib, json, os, pathlib, subprocess, sys, traceback

def run(args):
    p = subprocess.run(args, capture_output=True)
    return p.stdout.decode("utf-8", "replace")

def run_text(args):
    p = subprocess.run(args, capture_output=True)
    return p.returncode, p.stdout.decode("utf-8", "replace"), p.stderr.decode("utf-8", "replace")

def trunc(text, limit=24000):
    if text is None: return ""
    if len(text) <= limit: return text
    return text[:limit] + f"\\n...<truncated {len(text) - limit} chars>"
def stage(path, n):
    rc, stdout, stderr = run_text(["git", "show", f":{n}:{path}"])
    if rc != 0:
        return ""
    return stdout
def hunks(path, radius=24, limit=32000):
    try: lines=open(path, encoding="utf-8", errors="replace").read().splitlines()
    except OSError: return ""
    ranges=[]
    for i,line in enumerate(lines):
        if line.startswith("<<<<<<<"):
            start=max(0,i-radius); end=min(len(lines),i+radius); j=i+1
            while j < len(lines):
                if lines[j].startswith(">>>>>>>"):
                    end=min(len(lines),j+radius+1); break
                j+=1
            ranges.append((start,end))
    merged=[]
    for start,end in ranges:
        if merged and start <= merged[-1][1]: merged[-1]=(merged[-1][0], max(merged[-1][1], end))
        else: merged.append((start,end))
    chunks=[]
    for start,end in merged:
        chunks.append("\\n".join(f"{idx+1}: {lines[idx]}" for idx in range(start,end)))
    return trunc("\\n\\n--- conflict hunk ---\\n\\n".join(chunks), limit)
def conflict_regions(path):
    try: lines=open(path, encoding="utf-8", errors="replace").read().splitlines()
    except OSError: return []
    regions=[]
    i=0
    while i < len(lines):
        if lines[i].startswith("<<<<<<<"):
            start=i+1; sep=None; end=None; j=i+1
            while j < len(lines):
                if lines[j].startswith("=======") and sep is None:
                    sep=j+1
                if lines[j].startswith(">>>>>>>"):
                    end=j+1; break
                j+=1
            regions.append({"start_line":start,"separator_line":sep,"end_line":end,"summary":f"lines {start}-{end or '?'}"})
            i=j if end else i+1
        i+=1
    return regions
try:
    unmerged_files=[p for p in run(["git","diff","--name-only","--diff-filter=U"]).splitlines() if p]
    marker_files=[]
    for candidate in [p for p in run(["git","diff","--name-only","HEAD"]).splitlines() if p]:
        if os.path.isfile(candidate):
            grep=subprocess.run(["git","grep","-n","-E",r"^(<<<<<<<|=======|>>>>>>>)","--",candidate], capture_output=True)
            if grep.returncode == 0:
                marker_files.append(candidate)
    files=sorted(set(unmerged_files + marker_files))
    unmerged_set=set(unmerged_files)
    ctx_dir=pathlib.Path(".tt/conflict-context/git-resolve-conflicts")
    ctx_dir.mkdir(parents=True, exist_ok=True)
    items=[]
    for path in files:
        if path in unmerged_set:
            ours=stage(path,2); theirs=stage(path,3); base=stage(path,1)
            context_note="ours is the current side; theirs is the incoming side; base is the merge base. Preserve compatible intent from both sides."
        else:
            ours=theirs=base=""
            context_note="This file has conflict markers in the working tree but no unmerged index stages. Resolve markers conservatively from the file content and nearby project context."
        key=hashlib.sha1(path.encode()).hexdigest()[:12]
        context_file=str(ctx_dir / f"{key}.json")
        regions=conflict_regions(path)
        payload={"path":path,"context_note":context_note,"conflict_regions":regions,"base_excerpt":trunc(base,16000),"ours_excerpt":trunc(ours,24000),"theirs_excerpt":trunc(theirs,24000),"conflict_hunks":hunks(path),"ours_stat":{"chars":len(ours),"lines":ours.count("\\n")+(1 if ours else 0)},"theirs_stat":{"chars":len(theirs),"lines":theirs.count("\\n")+(1 if theirs else 0)}}
        pathlib.Path(context_file).write_text(json.dumps(payload, ensure_ascii=False, indent=2), encoding="utf-8")
        items.append({"path":path,"file_kind":os.path.splitext(path)[1].lstrip('.') or os.path.basename(path),"context_file":context_file,"conflict_regions":regions,"conflict_region_count":len(regions),"ours_stat":payload["ours_stat"],"theirs_stat":payload["theirs_stat"]})
    print(json.dumps({"done":len(files)==0,"files":files,"items":items}, ensure_ascii=False))
except Exception as exc:
    print(json.dumps({"done":False,"files":[],"items":[],"error":str(exc),"traceback":traceback.format_exc(limit=6)}, ensure_ascii=False))
    sys.exit(0)
PY
rc=$?
if [ "$rc" -ne 0 ]; then
  json_error "conflict indexing python helper exited with status $rc"
fi
exit 0
"""]
format = "json"
timeout = "60s"

[steps.script.env]
TT_REPO_ROOT = "{{inspect-conflicts.stdout.repo_root}}"

[steps.validate]
format = "json"
required = ["stdout"]

[[steps]]
id = "resolve-conflict-file"
title = "并发修复冲突文件"
depends_on = ["list-conflict-files"]
condition = "list-conflict-files.stdout.done != true"

[steps.loop]
for_each = "list-conflict-files.stdout.items"
var = "conflict_file"
parallel = true
max_concurrency = 3

[[steps.loop.body]]
id = "fix-conflict-file"
title = "修复 {{conflict_file.path}}"
input_context = ["conflict_file", "inspect-conflicts.stdout.operation"]
cwd = "{{inspect-conflicts.stdout.repo_root}}"
description = """
当前 git 工作区已经存在冲突。本任务只允许处理当前 conflict_file.path 指定的一个文件：{{conflict_file.path}}

上下文说明：
- 三方上下文已写入 {{conflict_file.context_file}}，开始前必须读取该 JSON 文件。
- JSON 中的 base_excerpt 是 merge base，ours_excerpt 是当前 side，theirs_excerpt 是 incoming side，conflict_hunks 是带行号的冲突片段。

合并原则：
- 先根据 base/ours/theirs 判断双方各自改了什么。
- 能兼容时保留双方意图，并让最终代码符合当前项目模式。
- 不能整块盲选一边，除非另一边明确过期/重复，并在 resolution_summary 说明。
- 如果上下文被截断，或需要跨文件业务上下文才能判断，返回 resolved:false，blocker_type:"missing_context" 或 "semantic_uncertainty"，不要硬合。
- lockfile 不要编造条目；不确定时 block，后续自动 lockfile 重建会处理。

要求：
- 只修改 {{conflict_file.path}}，不要修改其他文件。
- 不要 checkout/switch/reset/merge/rebase/push/gh。
- 解决所有冲突标记后 git add <file>。
- resolution_summary 简要说明 ours/theirs 各自意图和你如何合并。

输出 ONLY compact JSON object：
{"attempted":true,"resolved":true,"conflicted_files":["{{conflict_file.path}}"],"touched_files":["{{conflict_file.path}}"],"extra_touched_files":[],"resolution_summary":"","validations_run":[],"blocker_type":"none|semantic_uncertainty|missing_context|validation_failed|unknown","blocker_summary":""}
"""

[steps.loop.body.agent]
name = "merge-conflict-resolver"

[steps.loop.body.validate]
format = "json"
required = ["attempted", "resolved", "blocker_type"]

[[steps]]
id = "check-remaining-conflicts"
title = "复查剩余冲突"
execution = "script"
depends_on = ["list-conflict-files", "resolve-conflict-file"]

[steps.script]
command = ["bash", "-lc", """
set -euo pipefail
repo_root="${TT_REPO_ROOT:-}"
[ -n "$repo_root" ] && cd "$repo_root"
previous_raw="${TT_PREVIOUS_FILES:-[]}"
previous="$(jq -cn --arg s "$previous_raw" '($s|fromjson?) // []')"
unmerged="$(git diff --name-only --diff-filter=U | jq -R -s -c 'split("\n") | map(select(length>0))')"
marker_files="$(git diff --name-only HEAD | while IFS= read -r file; do [ -f "$file" ] && git grep -n -E '^(<<<<<<<|=======|>>>>>>>)' -- "$file" 2>/dev/null | cut -d: -f1 || true; done | sort -u | jq -R -s -c 'split("\n") | map(select(length>0))')"
remaining="$(jq -cn --argjson a "$unmerged" --argjson b "$marker_files" '($a+$b)|unique')"
prev_count="$(jq -r 'length' <<<"$previous")"
remaining_count="$(jq -r 'length' <<<"$remaining")"
resolved_count=$(( prev_count - remaining_count )); [ "$resolved_count" -lt 0 ] && resolved_count=0
jq -cn --argjson remaining_conflicts "$remaining" --argjson resolved_count "$resolved_count" '{done:(($remaining_conflicts|length)==0),remaining_conflicts:$remaining_conflicts,resolved_count:$resolved_count}'
"""]
format = "json"
timeout = "60s"

[steps.script.env]
TT_REPO_ROOT = "{{inspect-conflicts.stdout.repo_root}}"
TT_PREVIOUS_FILES = "{{list-conflict-files.stdout.files}}"

[steps.validate]
format = "json"
required = ["stdout"]

[[steps]]
id = "auto-resolve-lockfiles"
title = "自动重建剩余 lockfile 冲突"
execution = "script"
depends_on = ["inspect-conflicts", "check-remaining-conflicts"]
condition = "inspect-conflicts.stdout.needs_resolution == true"
description = "如果只剩 pnpm/yarn/npm lockfile 冲突，基于 package manifest 重新生成 lockfile 并 git add。"

[steps.script]
command = ["bash", "-lc", """
set -euo pipefail
repo_root="${TT_REPO_ROOT:-}"
[ -n "$repo_root" ] && cd "$repo_root"
lock_re='(^|/)(pnpm-lock\\.yaml|package-lock\\.json|yarn\\.lock)$'
unmerged="$(git diff --name-only --diff-filter=U | jq -R -s -c 'split("\n") | map(select(length>0))')"
marker_files="$(git diff --name-only HEAD | while IFS= read -r file; do [ -f "$file" ] && git grep -n -E '^(<<<<<<<|=======|>>>>>>>)' -- "$file" 2>/dev/null | cut -d: -f1 || true; done | sort -u | jq -R -s -c 'split("\n") | map(select(length>0))')"
remaining="$(jq -cn --argjson a "$unmerged" --argjson b "$marker_files" '($a+$b)|unique')"
if [ "$(jq -r 'length' <<<"$remaining")" -eq 0 ]; then jq -cn '{attempted:false,resolved:true,lockfiles:[],reason:"no remaining conflicts"}'; exit 0; fi
non_lock="$(jq -r '.[]' <<<"$remaining" | grep -Ev "$lock_re" || true)"
if [ -n "$non_lock" ]; then jq -cn --argjson remaining "$remaining" '{attempted:false,resolved:false,lockfiles:[],remaining_conflicts:$remaining,reason:"non-lockfile conflicts remain"}'; exit 0; fi
lockfiles="$(jq -c <<<"$remaining")"
for f in $(jq -r '.[]' <<<"$remaining"); do
  case "$f" in
    */pnpm-lock.yaml|pnpm-lock.yaml) rm -f "$f"; d="$(dirname "$f")"; [ -f "$d/package.json" ] || d="."; (cd "$d" && pnpm install --lockfile-only --ignore-scripts); git add "$f" ;;
    */package-lock.json|package-lock.json) rm -f "$f"; d="$(dirname "$f")"; [ -f "$d/package.json" ] || d="."; (cd "$d" && npm install --package-lock-only --ignore-scripts); git add "$f" ;;
    */yarn.lock|yarn.lock) rm -f "$f"; d="$(dirname "$f")"; [ -f "$d/package.json" ] || d="."; (cd "$d" && yarn install --mode=update-lockfile --ignore-scripts); git add "$f" ;;
  esac
done
post_unmerged="$(git diff --name-only --diff-filter=U | jq -R -s -c 'split("\n") | map(select(length>0))')"
post_markers="$(jq -r '.[]' <<<"$lockfiles" | while IFS= read -r file; do [ -f "$file" ] && git grep -n -E '^(<<<<<<<|=======|>>>>>>>)' -- "$file" 2>/dev/null | cut -d: -f1 || true; done | sort -u | jq -R -s -c 'split("\n") | map(select(length>0))')"
resolved=false; [ "$post_unmerged" = "[]" ] && [ "$post_markers" = "[]" ] && resolved=true
remaining_after="$(jq -cn --argjson a "$post_unmerged" --argjson b "$post_markers" '($a+$b)|unique')"
jq -cn --argjson lockfiles "$lockfiles" --argjson remaining "$remaining_after" --argjson resolved "$resolved" '{attempted:true,resolved:$resolved,lockfiles:$lockfiles,remaining_conflicts:$remaining,reason:(if $resolved then "lockfiles regenerated" else "lockfile regeneration left conflicts" end)}'
"""]
format = "json"
timeout = "10m"

[steps.script.env]
TT_REPO_ROOT = "{{inspect-conflicts.stdout.repo_root}}"

[steps.validate]
format = "json"
required = ["stdout"]

[[steps]]
id = "finalize-conflicts"
title = "确认冲突已解决"
execution = "script"
depends_on = ["inspect-conflicts", "check-remaining-conflicts", "auto-resolve-lockfiles"]
description = "确认无 unmerged 和冲突标记，并 stage 已解决文件；不执行 merge/rebase/cherry-pick --continue。"

[steps.script]
command = ["bash", "-lc", """
set -euo pipefail
repo_root="${TT_REPO_ROOT:-}"
[ -n "$repo_root" ] && cd "$repo_root"
inspect_raw="${TT_INSPECT:-}"
lockfix_raw="${TT_LOCKFIX:-}"
inspect_json="$(jq -cn --arg s "$inspect_raw" 'if ($s|length)==0 then {} else (($s|fromjson?)//{}) end | if type=="object" and (.stdout|type=="object") then .stdout elif type=="object" and (.stdout|type=="string") then ((.stdout|fromjson?)//.) else . end')"
lockfix_json="$(jq -cn --arg s "$lockfix_raw" 'if ($s|length)==0 then {} else (($s|fromjson?)//{}) end | if type=="object" and (.stdout|type=="object") then .stdout elif type=="object" and (.stdout|type=="string") then ((.stdout|fromjson?)//.) else . end')"
initial_conflicts="$(jq -c '.conflicted_files // []' <<<"$inspect_json")"
operation="$(jq -r '.operation // "none"' <<<"$inspect_json")"
started_at="$(jq -r '.started_at // ""' <<<"$inspect_json")"
started_epoch="$(jq -r '.started_epoch // 0' <<<"$inspect_json")"
completed_at="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
completed_epoch="$(date +%s)"
elapsed_seconds=$(( completed_epoch - started_epoch )); [ "$elapsed_seconds" -lt 0 ] && elapsed_seconds=0
lockfix_summary="$(jq -c '{attempted:(.attempted == true),resolved:(.resolved == true),lockfiles:(.lockfiles // []),reason:(.reason // "")}' <<<"$lockfix_json")"
unmerged="$(git diff --name-only --diff-filter=U | jq -R -s -c 'split("\n") | map(select(length>0))')"
if [ "$unmerged" != "[]" ]; then jq -cn --arg operation "$operation" --arg started_at "$started_at" --arg completed_at "$completed_at" --argjson elapsed_seconds "$elapsed_seconds" --argjson initial_conflicts "$initial_conflicts" --argjson lockfix "$lockfix_summary" --argjson unmerged "$unmerged" '{resolved:false,operation:$operation,started_at:$started_at,completed_at:$completed_at,elapsed_seconds:$elapsed_seconds,initial_conflicts:$initial_conflicts,lockfile_resolution:$lockfix,remaining_conflicts:$unmerged,continued:false,head:"",blocker_type:"unmerged_files",blocker_summary:"unmerged files remain"}'; exit 0; fi
marker_files="$(git diff --name-only HEAD | while IFS= read -r file; do [ -f "$file" ] && git grep -n -E '^(<<<<<<<|=======|>>>>>>>)' -- "$file" 2>/dev/null | cut -d: -f1 || true; done | sort -u | jq -R -s -c 'split("\n") | map(select(length>0))')"
if [ "$marker_files" != "[]" ]; then jq -cn --arg operation "$operation" --arg started_at "$started_at" --arg completed_at "$completed_at" --argjson elapsed_seconds "$elapsed_seconds" --argjson initial_conflicts "$initial_conflicts" --argjson lockfix "$lockfix_summary" --argjson marker_files "$marker_files" '{resolved:false,operation:$operation,started_at:$started_at,completed_at:$completed_at,elapsed_seconds:$elapsed_seconds,initial_conflicts:$initial_conflicts,lockfile_resolution:$lockfix,remaining_conflicts:$marker_files,continued:false,head:"",blocker_type:"conflict_markers",blocker_summary:"conflict markers remain"}'; exit 0; fi
git add -u
staged="$(git diff --cached --name-only | jq -R -s -c 'split("\n") | map(select(length>0))')"
jq -cn --arg operation "$operation" --arg head "$(git rev-parse HEAD)" --arg started_at "$started_at" --arg completed_at "$completed_at" --argjson elapsed_seconds "$elapsed_seconds" --argjson initial_conflicts "$initial_conflicts" --argjson lockfix "$lockfix_summary" --argjson staged "$staged" '{resolved:true,operation:$operation,started_at:$started_at,completed_at:$completed_at,elapsed_seconds:$elapsed_seconds,initial_conflicts:$initial_conflicts,lockfile_resolution:$lockfix,remaining_conflicts:[],staged_files:$staged,continued:false,head:$head,blocker_type:"none",blocker_summary:""}'
"""]
format = "json"
timeout = "5m"

[steps.script.env]
TT_REPO_ROOT = "{{inspect-conflicts.stdout.repo_root}}"
TT_INSPECT = "{{inspect-conflicts.stdout}}"
TT_LOCKFIX = "{{auto-resolve-lockfiles.stdout}}"

[steps.validate]
format = "json"
required = ["stdout"]

[[steps]]
id = "run-validation"
title = "运行可选验证命令"
execution = "script"
depends_on = ["finalize-conflicts"]
condition = "finalize-conflicts.stdout.resolved == true"

[steps.script]
command = ["bash", "-lc", """
set -u
repo_root="${TT_REPO_ROOT:-}"
cmd="${TT_VALIDATION_COMMAND:-}"
[ -n "$repo_root" ] && cd "$repo_root"
if [ -z "$cmd" ] || [ "$cmd" = "-" ]; then jq -cn '{attempted:false,success:true,command:"",stdout:"",stderr:"",exit_code:0}'; exit 0; fi
out="$(bash -lc "$cmd" 2>&1)"; rc=$?
jq -cn --arg command "$cmd" --arg output "$out" --argjson exit_code "$rc" '{attempted:true,success:($exit_code==0),command:$command,stdout:(if $exit_code==0 then $output else "" end),stderr:(if $exit_code==0 then "" else $output end),exit_code:$exit_code}'
"""]
format = "json"
timeout = "20m"

[steps.script.env]
TT_REPO_ROOT = "{{inspect-conflicts.stdout.repo_root}}"
TT_VALIDATION_COMMAND = "{{validation_command}}"

[steps.validate]
format = "json"
required = ["stdout"]

[[steps]]
id = "final-report"
title = "当前冲突修复报告"
depends_on = ["inspect-conflicts", "list-conflict-files", "resolve-conflict-file", "check-remaining-conflicts", "auto-resolve-lockfiles", "finalize-conflicts", "run-validation"]
input_context = ["inspect-conflicts.stdout", "list-conflict-files.stdout", "resolve-conflict-file", "check-remaining-conflicts.stdout", "auto-resolve-lockfiles.stdout", "finalize-conflicts.stdout", "run-validation.stdout"]
description = """
输出中文最终报告，结论先行。

必须包含：
- 当前 git 项目是否还有冲突，是否已解决
- repo/current branch/operation/head
- 总耗时：使用 finalize-conflicts.stdout.elapsed_seconds，同时给出 started_at/completed_at
- 初始冲突文件 initial_conflicts，并用表格列出每个冲突文件
- 冲突位置：从 list-conflict-files.stdout.items[].conflict_regions 提取行号范围；如果 conflict_regions 为空，说明“未记录具体行号/仅 index stage 冲突”
- 解决方式：从 resolve-conflict-file 的每个子结果提取 resolution_summary、resolved、blocker_type；lockfile 使用 lockfile_resolution
- staged_files 与 validation_command 结果
- 不执行 merge/rebase/cherry-pick continue，只说明当前 operation 状态
- 剩余冲突 remaining_conflicts 或 blocker_type/blocker_summary
- validation_command 结果

报告结构必须包含这些小节：
1. 结论
2. 耗时
3. 冲突文件与位置，表格列：文件、冲突位置、状态
4. 解决方式，表格列：文件、解决摘要、是否已解决、blocker
5. 验证与 staged 文件
6. 后续操作提示

不要输出长日志，不要重复粘贴各 step 原始 JSON，不要输出 context_file 中的大块 excerpt，不要编造 input_context 没有的信息。
"""

[steps.agent]
name = "reporter"

[steps.validate]
format = "markdown"
