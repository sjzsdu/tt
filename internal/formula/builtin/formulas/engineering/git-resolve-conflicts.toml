formula = "git-resolve-conflicts"
title = "Resolve current git conflicts"
description = "通用 Git 冲突修复公式：只接管当前 git 项目中已经存在的代码冲突，不负责 checkout/merge/rebase/cherry-pick continue/push，不执行构建、生成或项目特定命令。为每个冲突文件生成 base/ours/theirs 三方上下文，并发调用 merge-conflict-resolver 修复，并输出冲突解决报告。"
version = 3
type = "workflow"
category = "git"
tags = ["git", "conflict", "resolver"]

[preflight]

[[preflight.checks]]
type = "command"
name = "git"
command = "git"
message = "需要安装 git"

[[preflight.checks]]
type = "command"
name = "python3"
command = "python3"
message = "需要安装 python3"

[[preflight.checks]]
type = "command"
name = "jq"
command = "jq"
message = "需要安装 jq"

[[preflight.checks]]
type = "git"
name = "git-repo"
require_repo = true
message = "当前目录必须在 git 仓库内"

[vars]
validation_command = { description = "可选验证命令；冲突修复后执行，例如 go test ./... / pytest / cargo test / npm test", default = "" }
context_root = { description = "可选 context JSON 根目录；为空时使用 TT_INVOCATION_CWD，再退回当前工作目录。最终写入 <context_root>/.tt/conflict-context/git-resolve-conflicts", default = "" }

[[steps]]
id = "prepare-conflict-context"
title = "准备冲突上下文"
execution = "script"
description = "检查当前 repo 的冲突文件，并为每个冲突文件生成三方上下文；context JSON 写入执行命令目录的 .tt/conflict-context/git-resolve-conflicts；不修改文件，不执行 git add。"

[steps.script]
command = ["bash", "-lc", """
set -uo pipefail
json_error() {
  python3 -c 'import json,sys; print(json.dumps({"ok":False,"needs_resolution":False,"files":[],"items":[],"error":sys.argv[1]}, ensure_ascii=False))' "$1" 2>/dev/null \
    || printf '{"ok":false,"needs_resolution":false,"files":[],"items":[],"error":"script setup failed before python could report details"}\n'
}
repo_root="${TT_REPO_ROOT:-}"
[ -n "$repo_root" ] || repo_root="$(git rev-parse --show-toplevel 2>/dev/null || true)"
started_at="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
started_epoch="$(date +%s)"
[ -n "$repo_root" ] && cd "$repo_root" || { json_error "not inside a git repository"; exit 1; }
command -v python3 >/dev/null 2>&1 || { json_error "python3 is required for conflict indexing but was not found in PATH"; exit 1; }
TT_STARTED_AT="$started_at" TT_STARTED_EPOCH="$started_epoch" python3 - <<'PY'
import hashlib, json, os, pathlib, subprocess, sys, traceback

def run(args):
    p = subprocess.run(args, capture_output=True)
    return p.stdout.decode("utf-8", "replace")

def run_text(args):
    p = subprocess.run(args, capture_output=True)
    return p.returncode, p.stdout.decode("utf-8", "replace"), p.stderr.decode("utf-8", "replace")

def trunc(text, limit=24000):
    if text is None: return ""
    if len(text) <= limit: return text
    return text[:limit] + f"\\n...<truncated {len(text) - limit} chars>"

def stage(path, n):
    rc, stdout, stderr = run_text(["git", "show", f":{n}:{path}"])
    if rc != 0:
        return ""
    return stdout

def hunks(path, radius=24, limit=160000):
    try: lines=open(path, encoding="utf-8", errors="replace").read().splitlines()
    except OSError: return ""
    ranges=[]
    for i,line in enumerate(lines):
        if line.startswith("<<<<<<<"):
            start=max(0,i-radius); end=min(len(lines),i+radius); j=i+1
            while j < len(lines):
                if lines[j].startswith(">>>>>>>"):
                    end=min(len(lines),j+radius+1); break
                j+=1
            ranges.append((start,end))
    merged=[]
    for start,end in ranges:
        if merged and start <= merged[-1][1]: merged[-1]=(merged[-1][0], max(merged[-1][1], end))
        else: merged.append((start,end))
    chunks=[]
    for start,end in merged:
        chunks.append("\\n".join(f"{idx+1}: {lines[idx]}" for idx in range(start,end)))
    return trunc("\\n\\n--- conflict hunk ---\\n\\n".join(chunks), limit)

def conflict_regions(path):
    try: lines=open(path, encoding="utf-8", errors="replace").read().splitlines()
    except OSError: return []
    regions=[]; i=0
    while i < len(lines):
        if lines[i].startswith("<<<<<<<"):
            start=i+1; sep=None; end=None; j=i+1
            while j < len(lines):
                if lines[j].startswith("=======") and sep is None:
                    sep=j+1
                if lines[j].startswith(">>>>>>>"):
                    end=j+1; break
                j+=1
            regions.append({"start_line":start,"separator_line":sep,"end_line":end,"summary":f"lines {start}-{end or '?'}"})
            i=j if end else i+1
        i+=1
    return regions

try:
    repo_root=run(["git","rev-parse","--show-toplevel"]).strip()
    current_branch=run(["git","branch","--show-current"]).strip()
    merge_head=run(["git","rev-parse","--git-path","MERGE_HEAD"]).strip()
    rebase_merge=run(["git","rev-parse","--git-path","rebase-merge"]).strip()
    rebase_apply=run(["git","rev-parse","--git-path","rebase-apply"]).strip()
    cherry_pick=run(["git","rev-parse","--git-path","CHERRY_PICK_HEAD"]).strip()
    operation="none"
    if merge_head and os.path.exists(merge_head): operation="merge"
    if (rebase_merge and os.path.isdir(rebase_merge)) or (rebase_apply and os.path.isdir(rebase_apply)): operation="rebase"
    if cherry_pick and os.path.exists(cherry_pick): operation="cherry-pick"

    unmerged_files=[p for p in run(["git","diff","--name-only","--diff-filter=U"]).splitlines() if p]
    marker_files=[]
    for candidate in [p for p in run(["git","diff","--name-only","HEAD"]).splitlines() if p]:
        if os.path.isfile(candidate):
            grep=subprocess.run(["git","grep","-n","-E",r"^(<<<<<<<|=======|>>>>>>>)","--",candidate], capture_output=True)
            if grep.returncode == 0:
                marker_files.append(candidate)
    files=sorted(set(unmerged_files + marker_files))
    unmerged_set=set(unmerged_files)
    context_root=os.environ.get("TT_CONTEXT_ROOT", "").strip() or os.environ.get("TT_INVOCATION_CWD", "").strip() or os.getcwd()
    ctx_dir=pathlib.Path(context_root) / ".tt/conflict-context/git-resolve-conflicts"
    ctx_dir.mkdir(parents=True, exist_ok=True)
    items=[]
    for path in files:
        if path in unmerged_set:
            ours=stage(path,2); theirs=stage(path,3); base=stage(path,1)
            context_note="ours is the current side; theirs is the incoming side; base is the merge base. Preserve compatible intent from both sides."
        else:
            ours=theirs=base=""
            context_note="This file has conflict markers in the working tree but no unmerged index stages. Resolve markers conservatively from the file content and nearby project context."
        key=hashlib.sha1(path.encode()).hexdigest()[:12]
        context_file=str(ctx_dir / f"{key}.json")
        regions=conflict_regions(path)
        payload={"path":path,"context_note":context_note,"conflict_regions":regions,"base_excerpt":trunc(base,40000),"ours_excerpt":trunc(ours,80000),"theirs_excerpt":trunc(theirs,80000),"conflict_hunks":hunks(path),"ours_stat":{"chars":len(ours),"lines":ours.count("\\n")+(1 if ours else 0)},"theirs_stat":{"chars":len(theirs),"lines":theirs.count("\\n")+(1 if theirs else 0)}}
        pathlib.Path(context_file).write_text(json.dumps(payload, ensure_ascii=False, indent=2), encoding="utf-8")
        items.append({"path":path,"file_kind":os.path.splitext(path)[1].lstrip('.') or os.path.basename(path),"context_file":context_file,"conflict_regions":regions,"conflict_region_count":len(regions),"ours_stat":payload["ours_stat"],"theirs_stat":payload["theirs_stat"]})
    started_at=os.environ.get("TT_STARTED_AT", "")
    started_epoch=int(os.environ.get("TT_STARTED_EPOCH", "0") or "0")
    print(json.dumps({"ok":True,"repo_root":repo_root,"invocation_cwd":os.environ.get("TT_INVOCATION_CWD", ""),"context_root":context_root,"context_dir":str(ctx_dir),"current_branch":current_branch,"operation":operation,"started_at":started_at,"started_epoch":started_epoch,"needs_resolution":len(files)>0,"done":len(files)==0,"files":files,"items":items,"conflicted_files":files,"unmerged_files":unmerged_files,"marker_files":sorted(set(marker_files)),"blocker_type":"none" if files else "none","blocker_summary":"" if files else "no current git conflict detected"}, ensure_ascii=False))
except Exception as exc:
    print(json.dumps({"ok":False,"needs_resolution":False,"done":False,"files":[],"items":[],"error":str(exc),"traceback":traceback.format_exc(limit=6)}, ensure_ascii=False))
    sys.exit(1)
PY
"""]
format = "json"
timeout = "60s"

[steps.script.env]
TT_CONTEXT_ROOT = "{{context_root}}"

[steps.validate]
format = "json"
required = ["stdout"]

[[steps]]
id = "resolve-conflict-file"
title = "并发修复冲突文件"
depends_on = ["prepare-conflict-context"]
condition = "prepare-conflict-context.stdout.done != true"

[steps.loop]
for_each = "prepare-conflict-context.stdout.items"
var = "conflict_file"
parallel = true
max_concurrency = 3

[[steps.loop.body]]
id = "fix-conflict-file"
title = "修复 {{conflict_file.path}}"
input_context = ["conflict_file", "prepare-conflict-context.stdout.operation"]
cwd = "{{prepare-conflict-context.stdout.repo_root}}"
description = """
当前 git 工作区已经存在冲突。本任务只允许处理当前 conflict_file.path 指定的一个文件：{{conflict_file.path}}

上下文说明：
- 三方上下文已写入 {{conflict_file.context_file}}，开始前必须读取该 JSON 文件。
- JSON 中的 base_excerpt 是 merge base，ours_excerpt 是当前 side，theirs_excerpt 是 incoming side，conflict_hunks 是带行号的冲突片段。
- 如果 JSON 中出现 truncated，或者你认为上下文不足，必须先主动补充上下文：读取当前完整文件，并可使用 `git show :1:{{conflict_file.path}}`、`git show :2:{{conflict_file.path}}`、`git show :3:{{conflict_file.path}}` 查看完整 base/ours/theirs；必要时搜索同目录相关符号。即使仍有语义不确定，也要给出保守合并并清除 conflict markers，把不确定点写入 resolution_summary/blocker_summary。

合并原则：
- 先根据 base/ours/theirs 判断双方各自改了什么。
- 能兼容时保留双方意图，并让最终代码符合当前项目模式。
- 不能整块盲选一边，除非另一边明确过期/重复，并在 resolution_summary 说明。
- 本 formula 的首要目标是清除工作区 conflict markers。复杂业务语义不确定时，选择保守、可编译倾向的合并：优先保留当前架构主线，吸收 incoming 中独立且兼容的守卫/补充逻辑；无法完全证明的风险写入 resolution_summary，不要留下 conflict markers。
- 不要编造不存在的 API、导入或机器生成内容；如必须在两边选择，优先选择当前文件已有导入和当前 side 的架构，说明舍弃另一边的原因。
- 如果当前文件已经没有任何 conflict marker，且不需要进一步修改即可作为当前工作区的 resolved 内容，返回 resolved:true；不要仅因为 git index 仍处于 unmerged 状态而 block，因为本 formula 不执行 git add。

要求：
- 只修改 {{conflict_file.path}}，不要修改其他文件。
- 不要 checkout/switch/reset/merge/rebase/push/gh，不要执行 git add。
- 解决所有冲突标记后，保持文件在工作区中；是否 `git add` 由用户决定。除非读取/写入文件失败，否则不要返回 resolved:false。
- 判断冲突标记必须使用精确行首规则，例如 `git grep -n -E '^(<<<<<<<|=======|>>>>>>>)' -- <file>`；不要用宽泛的 `grep =======`，避免把普通分隔注释误判为冲突。
- resolution_summary 简要说明 ours/theirs 各自意图和你如何合并。

输出 ONLY compact JSON object：
{"input":{"path":"{{conflict_file.path}}","context_file":"{{conflict_file.context_file}}","conflict_region_count":{{conflict_file.conflict_region_count}},"conflict_regions":[{"start_line":1,"separator_line":2,"end_line":3,"summary":"lines 1-3"}],"file_kind":"{{conflict_file.file_kind}}"},"attempted":true,"resolved":true,"conflicted_files":["{{conflict_file.path}}"],"touched_files":["{{conflict_file.path}}"],"extra_touched_files":[],"resolution_summary":"","validations_run":[],"assumptions":[],"blocker_type":"none|io_error|validation_failed|unknown","blocker_summary":""}
其中 input 必须回显本次 iteration 的输入摘要；conflict_regions 请从 conflict_file/context_file 中复制真实数组，不要使用上面的示例行号。
"""

[steps.loop.body.agent]
name = "merge-conflict-resolver"

[steps.loop.body.validate]
format = "json"
required = ["input", "attempted", "resolved", "blocker_type"]

[[steps]]
id = "verify-conflict-resolution"
title = "确认冲突已解决"
execution = "script"
depends_on = ["prepare-conflict-context", "resolve-conflict-file"]
description = "检查工作区剩余 conflict markers；不执行 git add，也不要求 index 已标记 resolved。resolver 的 unresolved 结果只报告，不作为硬失败。若仍有冲突标记，直接失败中断。"

[steps.script]
command = ["bash", "-lc", """
set -euo pipefail
repo_root="${TT_REPO_ROOT:-}"
[ -n "$repo_root" ] && cd "$repo_root"
prepare_raw="${TT_PREPARE:-}"
resolve_raw="${TT_RESOLVE:-}"
prepare_json="$(jq -cn --arg s "$prepare_raw" 'if ($s|length)==0 then {} else (($s|fromjson?)//{}) end | if type=="object" and (.stdout|type=="object") then .stdout elif type=="object" and (.stdout|type=="string") then ((.stdout|fromjson?)//.) else . end')"
resolve_json="$(jq -cn --arg s "$resolve_raw" 'if ($s|length)==0 then [] else (($s|fromjson?)//[]) end | if type=="object" and (.stdout|type)=="array" then .stdout elif type=="object" and (.stdout|type)=="string" then ((.stdout|fromjson?)//[]) elif type=="array" then . else [] end')"
initial_conflicts="$(jq -c '.files // .conflicted_files // []' <<<"$prepare_json")"
operation="$(jq -r '.operation // "none"' <<<"$prepare_json")"
started_at="$(jq -r '.started_at // ""' <<<"$prepare_json")"
started_epoch="$(jq -r '.started_epoch // 0' <<<"$prepare_json")"
completed_at="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
completed_epoch="$(date +%s)"
elapsed_seconds=$(( completed_epoch - started_epoch )); [ "$elapsed_seconds" -lt 0 ] && elapsed_seconds=0
unmerged_index_files="$(git diff --name-only --diff-filter=U | jq -R -s -c 'split("\n") | map(select(length>0))')"
marker_files="$(jq -r '.[]' <<<"$initial_conflicts" | while IFS= read -r file; do [ -f "$file" ] && git grep -n -E '^(<<<<<<<|=======|>>>>>>>)' -- "$file" 2>/dev/null | cut -d: -f1 || true; done | sort -u | jq -R -s -c 'split("\n") | map(select(length>0))')"
resolver_unresolved="$(jq -c '[.[] | select((.resolved != true) or ((.blocker_type // "none") != "none")) | (.conflicted_files // .touched_files // [])[]] | unique' <<<"$resolve_json")"
remaining="$(jq -cn --argjson a "$marker_files" '$a|unique')"
if [ "$(jq -r 'length' <<<"$remaining")" -gt 0 ]; then
  jq -cn --arg operation "$operation" --arg started_at "$started_at" --arg completed_at "$completed_at" --argjson elapsed_seconds "$elapsed_seconds" --argjson initial_conflicts "$initial_conflicts" --argjson remaining "$remaining" --argjson marker_files "$marker_files" --argjson resolver_unresolved "$resolver_unresolved" --argjson unmerged_index_files "$unmerged_index_files" '{resolved:false,operation:$operation,started_at:$started_at,completed_at:$completed_at,elapsed_seconds:$elapsed_seconds,initial_conflicts:$initial_conflicts,remaining_conflicts:$remaining,remaining_marker_files:$marker_files,resolver_unresolved_files:$resolver_unresolved,unmerged_index_files:$unmerged_index_files,continued:false,blocker_type:"unresolved_conflict_markers",blocker_summary:"conflict markers remain in working tree"}'
  exit 1
fi
resolved_files="$(jq -c <<<"$initial_conflicts")"
jq -cn --arg operation "$operation" --arg head "$(git rev-parse HEAD)" --arg started_at "$started_at" --arg completed_at "$completed_at" --argjson elapsed_seconds "$elapsed_seconds" --argjson initial_conflicts "$initial_conflicts" --argjson resolved_files "$resolved_files" --argjson resolver_unresolved "$resolver_unresolved" --argjson unmerged_index_files "$unmerged_index_files" '{resolved:true,operation:$operation,started_at:$started_at,completed_at:$completed_at,elapsed_seconds:$elapsed_seconds,initial_conflicts:$initial_conflicts,remaining_conflicts:[],remaining_marker_files:[],resolver_unresolved_files:$resolver_unresolved,resolved_files:$resolved_files,needs_user_add:$resolved_files,unmerged_index_files:$unmerged_index_files,continued:false,head:$head,blocker_type:"none",blocker_summary:""}'
"""]
format = "json"
timeout = "5m"

[steps.script.env]
TT_REPO_ROOT = "{{prepare-conflict-context.stdout.repo_root}}"
TT_PREPARE = "{{prepare-conflict-context.stdout}}"
TT_RESOLVE = "{{resolve-conflict-file}}"

[steps.validate]
format = "json"
required = ["stdout"]

[[steps]]
id = "run-validation"
title = "运行可选验证命令"
execution = "script"
depends_on = ["verify-conflict-resolution"]
condition = "verify-conflict-resolution.stdout.resolved == true"

[steps.script]
command = ["bash", "-lc", """
set -u
repo_root="${TT_REPO_ROOT:-}"
cmd="${TT_VALIDATION_COMMAND:-}"
[ -n "$repo_root" ] && cd "$repo_root"
if [ -z "$cmd" ] || [ "$cmd" = "-" ]; then jq -cn '{attempted:false,success:true,command:"",stdout:"",stderr:"",exit_code:0}'; exit 0; fi
out="$(bash -lc "$cmd" 2>&1)"; rc=$?
jq -cn --arg command "$cmd" --arg output "$out" --argjson exit_code "$rc" '{attempted:true,success:($exit_code==0),command:$command,stdout:(if $exit_code==0 then $output else "" end),stderr:(if $exit_code==0 then "" else $output end),exit_code:$exit_code}'
exit "$rc"
"""]
format = "json"
timeout = "20m"

[steps.script.env]
TT_REPO_ROOT = "{{prepare-conflict-context.stdout.repo_root}}"
TT_VALIDATION_COMMAND = "{{validation_command}}"

[steps.validate]
format = "json"
required = ["stdout"]

[[steps]]
id = "final-report"
title = "当前冲突修复报告"
depends_on = ["prepare-conflict-context", "resolve-conflict-file", "verify-conflict-resolution", "run-validation"]
input_context = ["prepare-conflict-context.stdout", "resolve-conflict-file", "verify-conflict-resolution.stdout", "run-validation.stdout"]
description = """
输出中文最终报告，结论先行。只报告用户关心的结果，不复述内部约束。

必须包含：
- 是否已解决所有冲突
- 冲突文件与冲突位置
- 每个文件的解决摘要
- 每个文件如有 assumptions、blocker_summary 或 resolver_unresolved_files，必须作为“语义风险/待复核点”列出；不要把清除 conflict marker 伪装成业务完全正确。
- 总耗时
- validation_command 结果
- 需要用户手动 git add 的文件

不要输出长日志，不要重复粘贴各 step 原始 JSON，不要输出 context_file 中的大块 excerpt，不要编造 input_context 没有的信息。
"""

[steps.agent]
name = "reporter"

[steps.validate]
format = "markdown"
