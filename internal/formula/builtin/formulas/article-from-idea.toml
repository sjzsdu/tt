formula = "article-from-idea"
title = "从想法写文章"
description = "把一个想法经过角度、提纲、初稿、批判和润色，变成完整文章。"
version = 1
type = "workflow"
category = "写作"
tags = ["内置", "写作"]

[vars]
idea = { description = "文章想法", required = true }

[[steps]]
id = "clarify-angle"
title = "澄清角度和读者"
description = """
围绕想法 {{idea}}，定义目标读者、文章承诺、切入角度、核心论点和不覆盖的范围。
"""
output_key = "brief"
agent.name = "reporter"

[[steps]]
id = "outline"
title = "生成文章提纲"
depends_on = ["clarify-angle"]
input_context = ["brief"]
description = """
生成有逻辑的文章提纲，包含开头钩子、章节、例子和结论。
"""
output_key = "outline"
agent.name = "reporter"

[[steps]]
id = "draft"
title = "撰写初稿"
depends_on = ["outline"]
input_context = ["brief", "outline"]
description = """
按合适语气写出清晰的一版初稿。
"""
output_key = "draft"
agent.name = "reporter"

[[steps]]
id = "critique"
title = "批判性编辑"
depends_on = ["draft"]
input_context = ["draft"]
description = """
从结构、清晰度、证据、节奏、原创性和读者价值角度批判初稿。
"""
output_key = "critique"
agent.name = "reporter"

[[steps]]
id = "final"
title = "润色最终稿"
depends_on = ["critique"]
input_context = ["brief", "draft", "critique"]
description = """
基于批判意见重写最终稿，并给出 10 个标题候选和一段摘要。
"""
agent.name = "reporter"
