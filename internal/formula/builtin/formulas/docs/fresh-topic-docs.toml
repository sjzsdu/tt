formula = "fresh-topic-docs"
title = "新鲜事物系列文档"
description = "根据用户输入的新鲜事物、概念、趋势或话题，用动态表单按需澄清范围，再生成文章计划数组，并用 foreach loop 并发撰写每篇 Markdown 文档，最后汇总写入 docs。"
version = 16
type = "workflow"
category = "learning"
tags = ["学习", "调研", "新鲜事物", "系列文档", "知识整理", "foreach", "dynamic-form"]

[vars]
topic = { description = "想了解的新鲜事物、概念、趋势、产品、人物、技术或现象", required = true }

[[steps]]
id = "scope-analysis"
title = "分析话题并按需澄清范围"
form = true
description = """
分析用户给出的主题「{{topic}}」，并决定后续系列文档的写作范围。

你拥有完全自主权：是否要问、问什么、问多少、输出什么结构，全由你根据主题本身判断。
不要套用任何固定字段模板，不要因为 prompt 提示了某些维度就一定要问。

判断要不要追问：
- 如果主题已经足够具体、边界清晰、读者与深度可推断，直接进入规划阶段，不要为了澄清而澄清。
- 如果主题宽泛、含多义、或下游文章结构高度依赖某些未知信息，再发起动态表单。
- 字段数量、字段类型、问题措辞都由你决定，通常 1-4 个，最多 5 个。
- 只问会影响后续系列结构、深度、侧重点或交付形态的问题，不要问 nice-to-have。

输出要求（二选一，运行时协议决定）：
- 如果需要用户补充信息：按 dynamic human input 协议，发起 tt-human-input 表单。
- 如果信息已经足够、或用户已完成澄清：输出 ONLY 一个 compact JSON object。
  - JSON 的 schema 自由决定，只包含你认为对后续步骤有用的字段。
  - 不要再回到任何固定字段模板。
  - 不要 Markdown，不要代码块。

注意事项：
- 这是一个会驱动后续全部系列文档的步骤，请认真判断，宁可一次问清也不要下游返工。
- 主题的中英文、领域、读者人群、深度、风格、是否需视觉辅助，都由你判断决定要不要在表单中澄清。
- 假设用户没有专业背景，问题应通俗；用户已给上下文时不要重复。
"""

[steps.agent]
name = "assistant"

[steps.validate]
format = "json"
required = []

[[steps]]
id = "article-plan"
title = "规划系列文章清单"
depends_on = ["scope-analysis"]
input_context = ["scope-analysis"]
description = """
基于 scope-analysis 中你（planner）自己决定保留的字段，为「{{topic}}」规划一组系列文章。

scope-analysis 的输出结构由你在上一步自主决定，本步骤只需要遵守其中的写作范围约定（无论它把信息放在哪些字段里）。
不要再回头去假设固定的字段名。

你的输出会被后续 foreach loop 直接消费，因此必须输出 ONLY compact JSON array，不要 Markdown，不要代码块。

数组中每个对象代表一篇文章，每个对象包含你判断对下游写作有用的字段。建议至少包含：
- filename：安全、简洁、以 .md 结尾，建议带两位数字前缀，整体不超过 40 个字符
- title：文章标题，必须简短，中文不超过 18 个字，英文不超过 8 个单词；不要使用副标题、冒号、破折号或解释型长句
- angle：本篇文章的写作角度
- audience：目标读者
- depth：入门/进阶/深入 或你认为合适的层级表达
- must_cover：要覆盖的要点
- mermaid_hint / table_hint：如适用

要求：
- 文章数量通常 3-6 篇，复杂话题可更多，简单话题可更少。
- 每篇文章边界清晰，避免大量重复。
- 每篇 title 必须适合导航展示：中文不超过 18 个字，英文不超过 8 个单词；标题只表达主题，不写解释句。
- 覆盖理解、背景、机制/方法、应用、风险/争议、未来趋势等合适维度（按话题需要取舍）。
- 严格遵守 scope-analysis 留下的写作范围、读者与深度约束。
- 不要编造具体数据或新闻；需要核实时可在 must_cover 中标注。
"""

[steps.agent]
name = "assistant"

[steps.validate]
format = "json"
min_items = 1
item_required = ["filename", "title", "angle", "audience", "depth", "must_cover", "mermaid_hint", "table_hint"]

[[steps]]
id = "topic-package-plan"
title = "生成主题目录与 README 计划"
depends_on = ["article-plan"]
input_context = ["scope-analysis", "article-plan"]
description = """
基于 scope-analysis 和 article-plan，为最终文档包生成轻量级打包计划。这个步骤只输出目录名和 README 所需的摘要信息，不写文章正文。

输出 ONLY compact JSON object，不要 Markdown，不要代码块：
{"topic_name":"safe-topic-name","series_title":"...","audience":"...","reading_order":[{"filename":"01-xxx.md","title":"...","summary":"..."}],"readme_notes":["..."]}

标题长度硬约束：
- series_title：中文不超过 20 个字，英文不超过 10 个单词。
- reading_order[].title：必须沿用或压缩 article-plan 的短 title，中文不超过 18 个字，英文不超过 8 个单词。
- 不要使用副标题、冒号、破折号、括号解释或长句式标题。

要求：
- topic_name 必须安全、可读、稳定；中文话题可使用简短拼音或英文译名，英文话题使用小写 kebab-case。
- topic_name 只允许小写字母、数字、连字符 `-`，不要空格、斜杠、冒号或其它特殊字符，控制在 40 个字符以内。
- reading_order 必须覆盖 article-plan 中的每篇文章，但只保留 filename、短 title、summary，不要包含正文。
- readme_notes 只放 README 组织信息和阅读建议，避免大段正文。
- audience 可以从 scope-analysis 的写作范围中推断（无论 scope-analysis 用什么字段名），如果你无法推断，写一个通用占位即可。
"""

[steps.agent]
name = "assistant"

[steps.validate]
format = "json"
required = ["topic_name", "series_title", "reading_order"]

[[steps]]
id = "write-articles"
title = "并发撰写每篇系列文章"
depends_on = ["article-plan"]

  [steps.loop]
  for_each = "article-plan"
  var = "article"
  parallel = true
  max_concurrency = 4

  [[steps.loop.body]]
  id = "draft"
  title = "撰写 {{article.title}}"
  input_context = ["scope-analysis", "article"]
  description = """
根据当前 article 对象和 scope-analysis 留下的写作范围（结构由 planner 自主决定），撰写关于「{{topic}}」的一篇完整 Markdown 文章，并整理成文件条目。

当前 article 对象可通过上下文 article 读取，字段由 article-plan 步骤决定；scope-analysis 同样以自由结构提供范围信息。
请遵守其中关于读者、深度、风格、边界的所有约束，不要假设固定字段名。

输出要求：
- 输出 ONLY compact JSON object，不要 Markdown 代码块，不要额外解释。
- 格式：
{"filename":"...","title":"...","summary":"...","content":"完整 Markdown 内容"}
- filename 必须使用 article.filename。
- title 必须使用 article.title；如果 article.title 超长，先压缩到中文不超过 18 个字或英文不超过 8 个单词，再用于输出和正文一级标题。
- summary 用 1-2 句话概括本文。
- content 是完整 Markdown 正文，第一行使用 `# <压缩后的短标题>`，不要使用超长标题。
- content 中的一级标题 `#` 和二级标题 `##` 都必须简明扼要，中文通常控制在 18 个字以内，英文通常控制在 8 个单词以内；不要写成长句或带多个逗号的解释型标题，避免导航栏拥挤。
- content 至少 500 字，必须有实质内容，不要只有提纲。
- 按需包含 Mermaid 图表、Markdown 表格、blockquote、分隔线、列表、加粗、代码等。
- 不要编造具体数据或新闻；不确定信息标注“需要进一步核实”。
"""

  [steps.loop.body.agent]
  name = "assistant"

  [steps.loop.body.validate]
  format = "json"
  required = ["filename", "title", "summary", "content"]

[[steps]]
id = "write-doc-files"
title = "写入文章文件并生成文件清单"
depends_on = ["topic-package-plan", "write-articles"]
execution = "tool"

[steps.tool]
name = "write_files"

[steps.tool.write_files]
source = "write-articles"
root = "docs"
dir_name = "{{topic-package-plan.topic_name}}"

[steps.validate]
format = "json"
required = ["directory", "files"]

[[steps]]
id = "series-package"
title = "生成 README 并验收文档包"
depends_on = ["write-doc-files"]
input_context = ["topic-package-plan", "write-doc-files"]
description = """
文章正文已经由 write-doc-files 这个确定性步骤写入磁盘。你只需要基于 topic-package-plan 和 write-doc-files 的轻量文件清单，写入 README 并做最终验收，不要再读取、复述或改写所有文章正文。

目录命名要求：
- 使用 topic-package-plan.topic_name 和 write-doc-files.directory。
- 本次所有文件必须位于同一个 `docs/<topic-name>/` 目录，不要写到 `docs/` 根目录。

你的工作：
1. 撰写并写入 `docs/<topic-name>/README.md`，简要介绍整个系列。
2. 不要重写各篇文章文件，文章文件已经由 write-doc-files 写入。
3. 输出 Markdown 验收汇总，列出主题目录、README 路径、文章文件清单和阅读顺序即可。

README.md 应包含：
- 系列标题（基于 {{topic}} 和 topic-package-plan.series_title，必须使用短标题：中文不超过 20 个字，英文不超过 10 个单词）
- 适合谁读（使用 topic-package-plan.audience）
- 阅读顺序建议（使用 topic-package-plan.reading_order）
- 每篇的文件名、标题和简短摘要
- 简短验收说明：已生成哪些文件、建议从哪篇读起

整体要求：
- README 控制在 300-600 字，不要做复杂设计。
- 控制 token，不要把文章正文复制进 README 或最终汇总。
"""

[steps.agent]
name = "reporter"
