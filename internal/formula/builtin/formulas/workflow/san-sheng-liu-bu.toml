formula = "san-sheng-liu-bu"
title = "三省六部工作流"
description = "三省六部工作流：皇上提出宏观需求，中书省起草，门下省循环审核修订，审核通过后尚书省一次性拆成任务数组，各部并发生成启动文稿，最后尚书省汇总统筹。"
version = 3
type = "workflow"
category = "workflow"
tags = ["工作流", "需求", "审批", "任务拆分", "foreach", "aggregate"]

[vars]
requirement = { description = "皇上的宏观需求", required = true }
execute_gongbu = { description = "是否在尚书省统筹后调用 gongbu 真正执行代码类计划；默认 false，避免未经确认修改/提交代码", default = "false", enum = ["true", "false"] }

[[steps]]
id = "zhongshu-draft"
title = "中书省起草可审议需求方案"
description = """
你是中书省。基于皇上的宏观需求 {{requirement}}，完成需求澄清、调研和方案起草。

输出 Markdown，结构必须包含：送审说明、背景、目标、范围、非目标、现状假设、方案摘要、约束与依赖、风险与权衡、验收标准、待确认问题。

要求：
- 将宏观需求改写成可执行的问题定义。
- 结合现有项目上下文，但不要做任务拆分。
- 信息不足时列入“待确认问题”，不要在此 step 发起固定表单。
"""
agent.name = "assistant"

[[steps]]
id = "review-loop"
title = "门下省审核循环"
depends_on = ["zhongshu-draft"]

  [steps.loop]
  until = "loop-review.approved == true"
  max = 5

  [[steps.loop.body]]
  id = "loop-review"
  title = "门下省审核当前版本（第 {{iteration}} 轮）"
  input_context = ["zhongshu-draft", "loop-improve"]
  description = """
你是门下省。审核当前需求方案。

输入使用方式：
- 第 1 轮审核 zhongshu-draft。
- 若 loop-improve 存在，则审核最新 loop-improve，并将其视为当前有效版本。

审核重点：清晰性、目标/范围/非目标完整性、约束/依赖完整性、风险与权衡合理性、验收标准可验证性、是否具备下发尚书省拆分执行的条件。

输出 ONLY compact JSON：
{"approved":true,"summary":"...","issues":[],"suggestions":[]}
或
{"approved":false,"summary":"...","issues":["..."],"suggestions":["..."]}
issues 和 suggestions 必须具体、可操作。
"""
  agent.name = "assistant"

  [steps.loop.body.validate]
  format = "json"
  required = ["approved", "summary", "issues", "suggestions"]

  [[steps.loop.body]]
  id = "loop-improve"
  title = "中书省按审核意见修订（第 {{iteration}} 轮）"
  depends_on = ["loop-review"]
  condition = "loop-review.approved == false"
  input_context = ["zhongshu-draft", "loop-improve", "loop-review"]
  description = """
你是中书省。根据门下省 loop-review 中的 issues 和 suggestions 修订需求方案。

输入使用方式：
- 第 1 次修订时，以 zhongshu-draft 为基底。
- 若已有 loop-improve，则以最新 loop-improve 为基底继续修订。
- 必须逐条回应 loop-review.issues。

输出 Markdown，沿用原需求方案结构，并新增“修订说明”章节。不要做执行拆分。
"""
  agent.name = "assistant"

[[steps]]
id = "shangshu-assign"
title = "尚书省确认通过版本并拆分任务数组"
depends_on = ["review-loop"]
input_context = ["zhongshu-draft", "loop-improve", "loop-review"]
description = """
你是尚书省。门下省已审核通过。请基于最终需求版本直接完成执行拆分，并输出可被 foreach loop 消费的任务数组。

输入使用方式：
- 若 loop-improve 存在，以最新 loop-improve 为最终通过版本。
- 否则使用 zhongshu-draft。
- loop-review.approved 必须为 true；用其 summary 理解核可理由。

拆分要求：
- 将最终需求拆成边界清晰、可执行、可验收的任务包。
- 识别并行工作线、前后依赖、交付件、验收方式、风险和协作接口。
- 不要输出长篇执行文档；把必要信息结构化进任务对象，避免后续 agent 重读大段正文。

输出 ONLY compact JSON array，不要 Markdown，不要代码块。
数组中每个对象格式：
{"id":"T01","title":"任务名称","department":"吏部/户部/礼部/兵部/刑部/工部/跨部门","objective":"目标","context":"任务背景与边界","inputs":["输入1"],"outputs":["交付物1"],"depends_on":["T00"],"collaboration":["需要协作方"],"acceptance":["验收标准"],"risks":["风险"]}

规则：
- id 稳定唯一，建议 T01、T02 递增。
- department 必须是六部之一或“跨部门”。
- depends_on 只能引用数组中存在的任务 id；可并行任务 depends_on 为空或只依赖共同前置。
- context 控制在 80-160 字，足够各部执行，不要塞完整需求正文。
"""
agent.name = "assistant"

[steps.validate]
format = "json"
min_items = 1
item_required = ["id", "title", "department", "objective", "context", "inputs", "outputs", "depends_on", "collaboration", "acceptance", "risks"]

[[steps]]
id = "execute"
title = "各部并发生成执行启动文稿"
depends_on = ["shangshu-assign"]

  [steps.loop]
  for_each = "shangshu-assign"
  var = "assignment"
  parallel = true
  max_concurrency = 6

  [[steps.loop.body]]
  id = "brief"
  title = "{{assignment.department}}启动 {{assignment.id}} {{assignment.title}}"
  input_context = ["assignment"]
  description = """
你是 assignment.department 对应部门的执行负责人。仅基于当前 assignment 对象生成该任务包的执行启动文稿，并输出给尚书省汇总可消费的 JSON 对象。

当前 assignment 包含完整任务上下文：id、title、department、objective、context、inputs、outputs、depends_on、collaboration、acceptance、risks。

输出 ONLY compact JSON object，不要代码块，不要额外解释：
{"id":"...","title":"...","department":"...","summary":"...","brief_markdown":"完整启动文稿","needs_coordination":["..."],"next_checkpoint":"..."}

brief_markdown 是 Markdown，包含：任务编号与名称、部门职责、目标、上下文边界、输入、首批动作、依赖与协作接口、交付物、验收标准、风险提示。
不要声称任务已经完成；这里只是进入执行阶段的启动文稿。只针对当前 assignment，不展开其他任务。
"""
  agent.name = "assistant"

  [steps.loop.body.validate]
  format = "json"
  required = ["id", "title", "department", "summary", "brief_markdown", "needs_coordination", "next_checkpoint"]

[[steps]]
id = "execution-manifest"
title = "聚合各部启动结果清单"
depends_on = ["execute"]
execution = "aggregate"

[steps.aggregate]
source = "execute"
as = "tasks"
require = ["id", "title", "department", "summary", "brief_markdown", "needs_coordination", "next_checkpoint"]
exclude = ["brief_markdown"]

[steps.validate]
format = "json"
required = ["tasks"]

[[steps]]
id = "shangshu-summary"
title = "尚书省汇总各部启动结果"
depends_on = ["execution-manifest"]
input_context = ["shangshu-assign", "execution-manifest"]
description = """
你是尚书省。基于 shangshu-assign 和 execution-manifest，形成最终统筹报告。

输入说明：
- shangshu-assign 是任务数组，包含任务目标、边界、依赖和验收标准。
- execution-manifest 是去除大段 brief_markdown 的轻量任务清单，包含各任务摘要、协调点和下一检查节点。

输出 Markdown，包含：总体启动结论、任务-部门总表、并行推进分组、跨部门协调点、下一轮检查节点、主要风险。
不要声称任务已经完成，只说明已完成分派和启动文稿生成。不要复述所有 brief_markdown 正文。
"""
agent.name = "assistant"

[[steps]]
id = "gongbu-feature-request"
title = "尚书省整理工部执行需求包"
depends_on = ["shangshu-summary"]
condition = "{{execute_gongbu}} == true"
input_context = ["zhongshu-draft", "loop-improve", "loop-review", "shangshu-assign", "execution-manifest", "shangshu-summary"]
description = """
你是尚书省，准备把已核准的执行计划下发给 gongbu formula 执行。请将最终通过的需求、尚书省任务拆分、各部启动摘要和统筹报告，压缩成一个适合 gongbu 的 feature_request。

要求：
- 只输出 compact JSON object，不要 Markdown 代码块。
- feature_request 要完整表达要实现的代码类目标、范围、验收标准、优先级、约束、风险和参考上下文。
- 如果三省六部计划中包含多个任务，请明确哪些属于本次 gongbu 要执行的最小闭环；非代码/非工程任务放入 coordination_notes。
- 不要声称已经执行，只是生成 gongbu 的输入。

输出格式：
{"feature_request":"...","execution_scope":["..."],"acceptance":["..."],"coordination_notes":["..."],"risks":["..."]}
"""
agent.name = "assistant"

[steps.validate]
format = "json"
required = ["feature_request", "execution_scope", "acceptance"]

[[steps]]
id = "gongbu-execute"
title = "调用 gongbu 执行尚书省计划"
depends_on = ["gongbu-feature-request"]
condition = "{{execute_gongbu}} == true"
execution = "script"
description = "调用 tt formula run gongbu，将尚书省生成的 feature_request 交给 gongbu。保留 gongbu 自身的 worktree 隔离、验证和提交逻辑。"

[steps.script]
command = [
  "python3",
  "-c",
  """
import json, os, subprocess, sys
feature_request = os.environ.get('GONGBU_FEATURE_REQUEST', '').strip()
if not feature_request:
    print(json.dumps({'ok': False, 'error': 'GONGBU_FEATURE_REQUEST is empty'}, ensure_ascii=False))
    raise SystemExit(1)
cmd = ['tt', 'formula', 'run', 'gongbu', '--no-web', '--verbose', '--var', 'feature_request=' + feature_request]
p = subprocess.run(cmd, text=True, capture_output=True)
print(json.dumps({
    'ok': p.returncode == 0,
    'command': cmd[:5] + ['--var', 'feature_request=<redacted>'],
    'exit_code': p.returncode,
    'stdout': p.stdout,
    'stderr': p.stderr,
}, ensure_ascii=False))
raise SystemExit(p.returncode)
""",
]
timeout = "2h"

[steps.script.env]
GONGBU_FEATURE_REQUEST = "{{gongbu-feature-request.feature_request}}"

[steps.validate]
format = "json"
required = ["ok", "exit_code", "stdout"]
