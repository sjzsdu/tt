formula = "keep-coding"
aliases = ["keep-coding"]
title = "持续处理 Beads"
description = "循环执行 bead-coding：每轮选择一个 ready bead 树，用 coder 完成实现、验证、提交并关闭，最后输出持续编码报告。"
version = 1
type = "workflow"
category = "workflow"
tags = ["beads", "coding", "loop", "automation"]

[preflight]

[[preflight.checks]]
type = "command"
name = "bd"
command = "bd"
message = "keep-coding 需要安装 bd/beads。"

[[preflight.checks]]
type = "command"
name = "git"
command = "git"
message = "keep-coding 需要安装 git。"

[[preflight.checks]]
type = "git"
name = "git-repo"
require_repo = true
require_remote = false
message = "keep-coding 需要在 git 仓库中运行。"

[vars]
goal = { description = "本次持续编码的总体目标或筛选偏好；为空则处理当前 ready beads", default = "持续处理当前项目中 ready 的 beads，优先选择高优先级、依赖已满足、范围清晰的任务。" }
max_cycles = { description = "最多执行多少个 bead-coding 循环", default = "100", pattern = "^[1-9][0-9]*$" }
workspace_path = { description = "可选执行工作区路径；为空时使用 formula 运行目录", default = "" }
validation_command = { description = "可选验证命令；为空则自动检测轻量验证命令", default = "" }
close_on_success = { description = "每轮成功后是否关闭 bead", default = "true" }
ready_limit = { description = "每轮自动选择 ready bead 时最多读取多少个候选", default = "10" }
skip_file = { description = "本次 keep-coding 运行内跳过 partial/blocked bead 的临时文件", default = ".tt/tmp/keep-coding-skip.txt" }

[[steps]]
id = "prepare-skip-list"
title = "初始化本次运行跳过列表"
execution = "script"
idempotent = true

[steps.script]
command = ["python3", "-c", """
import json, os, pathlib
path = pathlib.Path(os.environ.get('SKIP_FILE', '.tt/tmp/keep-coding-skip.txt'))
path.parent.mkdir(parents=True, exist_ok=True)
path.write_text('', encoding='utf-8')
print(json.dumps({"skip_file": str(path), "reset": True}, ensure_ascii=False))
"""]
format = "json"
timeout = "10s"

[steps.script.env]
SKIP_FILE = "{{skip_file}}"

[steps.validate]
format = "json"
required = ["stdout"]

[[steps]]
id = "cycle"
title = "循环执行 bead-coding"
depends_on = ["prepare-skip-list"]

[steps.loop]
max = "{{max_cycles}}"
until = "cycle-note.selected == false"

[[steps.loop.body]]
id = "run-bead-coding"
title = "处理一个 ready bead"
embed = "bead-coding"

[steps.loop.body.embed_vars]
bead_id = ""
goal = "{{goal}}"
workspace_path = "{{workspace_path}}"
validation_command = "{{validation_command}}"
close_on_success = "{{close_on_success}}"
ready_limit = "{{ready_limit}}"
exclude_bead_file = "{{skip_file}}"

[[steps.loop.body]]
id = "cycle-note"
title = "记录本轮结果"
depends_on = ["run-bead-coding"]
execution = "script"

[steps.loop.body.script]
command = ["python3", "-c", """
import json, os
status = os.environ.get('STATUS', '').strip() or 'partial'
bead_id = os.environ.get('BEAD_ID', '').strip()
closed = os.environ.get('CLOSED', '').strip().lower() == 'true'
committed = os.environ.get('COMMITTED', '').strip().lower() == 'true'
commit_hash = os.environ.get('COMMIT_HASH', '').strip()
summary = os.environ.get('SUMMARY', '').strip()
next_action = os.environ.get('NEXT_ACTION', '').strip()
selected_in = os.environ.get('SELECTED_IN', '').strip().lower() == 'true'
# Continue after partial/blocked/failed so append-skip-list can exclude this bead
# and the next iteration can try another ready bead. Stop only when no selectable
# ready bead remains.
selected = False if status == 'no-work' or not selected_in else True
if status == 'no-work':
    next_action = next_action or '没有可处理的 ready bead，keep-coding 可以正常结束。'
elif not closed and not next_action:
    next_action = '本 bead 未闭环，已加入本次运行跳过列表，继续尝试其它 ready bead。'
print(json.dumps({
  "selected": selected,
  "bead_id": bead_id,
  "status": status,
  "committed": committed,
  "commit_hash": commit_hash,
  "closed": closed,
  "summary": summary,
  "next_action": next_action,
}, ensure_ascii=False))
"""]
format = "json"
timeout = "10s"

[steps.loop.body.script.env]
SELECTED_IN = "{{run-bead-coding.cycle-summary.selected}}"
BEAD_ID = "{{run-bead-coding.cycle-summary.bead_id}}"
STATUS = "{{run-bead-coding.cycle-summary.status}}"
COMMITTED = "{{run-bead-coding.cycle-summary.committed}}"
COMMIT_HASH = "{{run-bead-coding.cycle-summary.commit_hash}}"
CLOSED = "{{run-bead-coding.cycle-summary.closed}}"
SUMMARY = "{{run-bead-coding.cycle-summary.summary}}"
NEXT_ACTION = "{{run-bead-coding.cycle-summary.next_action}}"

[steps.loop.body.validate]
format = "json"
required = ["selected", "status", "committed", "closed", "summary", "next_action"]

[[steps.loop.body]]
id = "append-skip-list"
title = "记录本轮需要跳过的 bead"
depends_on = ["cycle-note"]
execution = "script"
idempotent = true

[steps.loop.body.script]
command = ["python3", "-c", """
import json, os, pathlib
bead_id = os.environ.get('BEAD_ID', '').strip()
status = os.environ.get('STATUS', '').strip()
closed = os.environ.get('CLOSED', '').strip().lower() == 'true'
selected = os.environ.get('SELECTED', '').strip().lower() == 'true'
path = pathlib.Path(os.environ.get('SKIP_FILE', '.tt/tmp/keep-coding-skip.txt'))
path.parent.mkdir(parents=True, exist_ok=True)
should_skip = bool(bead_id) and selected and (not closed or status in {'partial', 'blocked', 'failed'})
existing = []
if path.exists():
    existing = [line.strip() for line in path.read_text(encoding='utf-8').splitlines() if line.strip()]
if should_skip and bead_id not in existing:
    existing.append(bead_id)
path.write_text('\n'.join(existing) + ('\n' if existing else ''), encoding='utf-8')
print(json.dumps({"skip_file": str(path), "appended": should_skip, "bead_id": bead_id, "skipped_bead_ids": existing}, ensure_ascii=False))
"""]
format = "json"
timeout = "10s"

[steps.loop.body.script.env]
SKIP_FILE = "{{skip_file}}"
BEAD_ID = "{{cycle-note.bead_id}}"
STATUS = "{{cycle-note.status}}"
CLOSED = "{{cycle-note.closed}}"
SELECTED = "{{cycle-note.selected}}"

[steps.loop.body.validate]
format = "json"
required = ["stdout"]

[[steps]]
id = "final-report"
title = "输出持续编码最终报告"
depends_on = ["cycle"]
input_context = ["cycle", "append-skip-list.stdout"]
description = """
输出中文 Markdown 最终报告，不要输出 JSON，不要粘贴完整子报告。

你需要总结 keep-coding loop 的整体执行情况：处理了多少轮、哪些 bead、哪些提交、哪些关闭、哪些阻塞、是否因为 partial/blocked/no-work 提前停止，还有什么下一步。注意 cycle-note.selected=false 表示 loop 不应继续，不一定表示本轮没有选中 bead；committed=false 但 closed=true 是合法闭环。

固定结构：

# Keep Coding 报告

## 结论
1-3 句话说明本次持续编码是否有实际进展。

## 循环明细
用 Markdown 表格列出：轮次、bead、状态、commit、是否关闭、摘要、下一步。

## 代码与验证
总结每轮的验证情况，不要编造没有出现的测试结果。

## 剩余工作
列出仍然 ready/blocked/需要人工判断的后续事项。

## 建议下一步
给出 3-5 条建议。
"""
agent.name = "reporter"
agent.cwd = "{{workspace_path}}"
