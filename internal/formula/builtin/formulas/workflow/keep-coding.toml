formula = "keep-coding"
description = "Iterative codebase-research driven development workflow with architecture gates, code review/fix loops, commit checkpoints, and final cycle summary."
version = 2
type = "workflow"

[preflight]

[[preflight.checks]]
type = "command"
name = "git"
command = "git"
message = "需要安装 git。"

[[preflight.checks]]
type = "command"
name = "python3"
command = "python3"
message = "需要安装 python3。"

[[preflight.checks]]
type = "git"
require_repo = true
require_remote = false

[vars]
goal = { description = "本轮要持续推进的总体目标或改进主题。架构和实现必须从当前代码探究后得出，不允许脱离代码空想。", default = "持续研究当前仓库，选择一项小而完整、可验证、符合现有代码模式的改进并推进。" }
max_cycles = { description = "最大开发循环轮数", default = "3", pattern = "^[1-9][0-9]*$" }
max_arch_review_cycles = { description = "每轮架构文档最多修订次数", default = "3", pattern = "^[1-9][0-9]*$" }
max_code_review_cycles = { description = "每轮代码实现最多 review/fix 次数", default = "3", pattern = "^[1-9][0-9]*$" }

[[steps]]
id = "repo-scan"
title = "Deep deterministic repository scan"
execution = "script"
idempotent = true

[steps.script]
command = [
  "python3",
  "-c",
  """
import collections, json, os, pathlib, subprocess

EXCLUDE_DIRS = {'.git', '.tt', 'node_modules', 'dist', 'build', '.idea', '.vscode', '.next', 'coverage', 'target', '__pycache__'}
IMPORTANT_NAMES = {'README.md','README','AGENTS.md','CODEX.md','package.json','pnpm-workspace.yaml','pnpm-lock.yaml','yarn.lock','package-lock.json','go.mod','Cargo.toml','pyproject.toml','requirements.txt','Makefile','justfile','tsconfig.json','vite.config.ts','next.config.js'}
MAX_FILE_SAMPLE = 500
MAX_EXCERPT = 12000

def run(cmd):
    p = subprocess.run(cmd, capture_output=True, text=True)
    return {'ok': p.returncode == 0, 'code': p.returncode, 'stdout': p.stdout.strip(), 'stderr': p.stderr.strip()}

def read_excerpt(path):
    try:
        data = pathlib.Path(path).read_text(encoding='utf-8', errors='replace')
    except Exception as exc:
        return {'path': path, 'error': str(exc), 'excerpt': ''}
    return {'path': path, 'chars': len(data), 'excerpt': data[:MAX_EXCERPT]}

files = []
ext_counts = collections.Counter()
important = []
for root, dirs, filenames in os.walk('.'):
    dirs[:] = [d for d in dirs if d not in EXCLUDE_DIRS and not d.startswith('.')]
    rel_root = os.path.relpath(root, '.')
    depth = 0 if rel_root == '.' else rel_root.count(os.sep) + 1
    if depth > 5:
        dirs[:] = []
    for name in filenames:
        path = os.path.normpath(os.path.join(root, name))
        rel = path[2:] if path.startswith('./') else path
        if len(files) < MAX_FILE_SAMPLE:
            files.append(rel)
        ext_counts[pathlib.Path(name).suffix or '<none>'] += 1
        if name in IMPORTANT_NAMES or rel in IMPORTANT_NAMES:
            important.append(rel)

important = sorted(set(important))[:40]
status = run(['git', 'status', '--short'])
result = {
    'cwd': os.getcwd(),
    'goal': '''{{goal}}''',
    'git_status': status,
    'git_branch': run(['git', 'branch', '--show-current']),
    'recent_commits': run(['git', 'log', '--oneline', '-8']),
    'diff_stat': run(['git', 'diff', '--stat']),
    'staged_diff_stat': run(['git', 'diff', '--cached', '--stat']),
    'tracked_file_count': len(run(['git', 'ls-files']).get('stdout','').splitlines()),
    'files_sample': files,
    'language_hint_by_extension': dict(ext_counts.most_common(30)),
    'important_files': [read_excerpt(p) for p in important],
    'test_command_hints': [],
}
if os.path.exists('package.json'):
    result['test_command_hints'].extend(['npm test', 'pnpm test', 'npm run lint', 'pnpm lint'])
if os.path.exists('go.mod'):
    result['test_command_hints'].append('go test ./...')
if os.path.exists('pyproject.toml') or os.path.exists('requirements.txt'):
    result['test_command_hints'].extend(['pytest', 'python -m pytest'])
if os.path.exists('Cargo.toml'):
    result['test_command_hints'].append('cargo test')
print(json.dumps(result, ensure_ascii=False))
"""
]
format = "json"
timeout = "60s"

[steps.validate]
format = "json"
required = ["cwd", "goal", "git_status", "git_branch", "recent_commits", "files_sample", "important_files", "language_hint_by_extension"]

[[steps]]
id = "cycle"
title = "Codebase-research driven development cycles"
depends_on = ["repo-scan"]

[steps.loop]
# Keep this as a runtime loop node instead of compile-time expansion so later
# steps can depend on the stable `cycle` node. The impossible until condition
# means the loop runs to max unless a child step fails or waits.
max = "{{max_cycles}}"
until = "steps.completed < 0"

[[steps.loop.body]]
id = "codebase-research"
title = "Research current code for cycle {{iteration}}"
input_context = ["repo-scan", "cycle-report"]
description = """
你是代码研究员。围绕用户目标研究当前仓库，必须从现有代码、目录结构、已有模式和当前 git 状态出发，找出本 cycle 最值得推进的一件小而完整的开发任务。

要求：
- 主动阅读相关文件，不要只依赖 repo-scan 的摘要。
- 如果上一轮 cycle-report 存在，优先衔接上一轮 next_focus 和 residual_risks。
- 输出的 development_focus 必须能在一个 cycle 内实现和 review。
- 不要修改代码。

输出 ONLY compact JSON:
{"cycle":1,"development_focus":"...","evidence_files":["..."],"current_patterns":["..."],"problem_or_gap":"...","recommended_scope":["..."],"non_goals":["..."],"acceptance_criteria":["..."],"risk_notes":["..."]}
"""

[steps.loop.body.agent]
name = "planner"

[steps.loop.body.validate]
format = "json"
required = ["cycle", "development_focus", "evidence_files", "current_patterns", "problem_or_gap", "recommended_scope", "non_goals", "acceptance_criteria", "risk_notes"]

[[steps.loop.body]]
id = "architecture-gate-loop"
title = "Iterate development document until architecture gate passes"
depends_on = ["codebase-research"]

[steps.loop.body.loop]
max = "{{max_arch_review_cycles}}"
until = "architecture-review.approved == true"

[[steps.loop.body.loop.body]]
id = "development-doc"
title = "Draft or revise development document"
input_context = ["repo-scan", "codebase-research", "architecture-review"]
description = """
你是需求架构师。基于当前代码研究结果，产出或修订本 cycle 的开发文档。文档必须来自当前代码事实，而不是泛泛设计。

如果已有 architecture-review 且 approved=false，必须逐条吸收 required_changes 后重写文档。

输出 ONLY compact JSON:
{"cycle":1,"topic":"...","why_now":"...","code_evidence":[{"file":"...","finding":"..."}],"scope":["..."],"non_goals":["..."],"implementation_plan":["..."],"acceptance_criteria":["..."],"test_plan":["..."],"risks":["..."],"architecture_doc_markdown":"..."}
"""

[steps.loop.body.loop.body.agent]
name = "planner"

[steps.loop.body.loop.body.validate]
format = "json"
required = ["cycle", "topic", "why_now", "code_evidence", "scope", "non_goals", "implementation_plan", "acceptance_criteria", "test_plan", "risks", "architecture_doc_markdown"]

[[steps.loop.body.loop.body]]
id = "architecture-review"
title = "Architecture gate review"
depends_on = ["development-doc"]
input_context = ["codebase-research", "development-doc"]
description = """
你是架构 gate reviewer。判断 development-doc 是否足以进入实现。

批准标准：
- 文档确实基于当前代码证据；
- scope 小且可实现；
- acceptance criteria 可验证；
- test_plan 合理；
- 没有明显过度设计或目标漂移。

如果不通过，required_changes 必须具体到下一轮如何改。

输出 ONLY compact JSON:
{"approved":true,"summary":"...","issues":["..."],"required_changes":["..."],"confidence":0.0}
"""

[steps.loop.body.loop.body.agent]
name = "docs-analyst"

[steps.loop.body.loop.body.validate]
format = "json"
required = ["approved", "summary", "issues", "required_changes", "confidence"]

[[steps.loop.body]]
id = "architecture-gate"
title = "Compute architecture gate result"
depends_on = ["architecture-gate-loop"]
execution = "script"
idempotent = true

[steps.loop.body.script]
command = ["python3", "-c", """
import json, os

def load(name):
    raw = os.environ.get(name, '')
    return json.loads(raw) if raw else None

doc = load('DEVELOPMENT_DOC')
review = load('ARCHITECTURE_REVIEW')
approved = bool(review and review.get('approved') is True and doc)
print(json.dumps({'approved': approved, 'doc': doc, 'review': review, 'blocked_reason': '' if approved else 'architecture gate did not approve within max_arch_review_cycles'}, ensure_ascii=False))
"""]
format = "json"
timeout = "30s"

[steps.loop.body.script.env]
DEVELOPMENT_DOC = "{{development-doc}}"
ARCHITECTURE_REVIEW = "{{architecture-review}}"

[steps.loop.body.validate]
format = "json"
required = ["approved", "doc", "review", "blocked_reason"]

[[steps.loop.body]]
id = "code-review-loop"
title = "Implement and review until code gate passes"
depends_on = ["architecture-gate"]
condition = "architecture-gate.approved == true"

[steps.loop.body.loop]
max = "{{max_code_review_cycles}}"
until = "code-review.approved == true"

[[steps.loop.body.loop.body]]
id = "code-implement-or-fix"
title = "Implement or fix code"
input_context = ["architecture-gate", "code-review", "worktree-diff"]
description = """
你是 coder。根据 architecture-gate.doc 实现本 cycle。若已有 code-review 且 approved=false，则优先逐条修复 required_fixes。

要求：
- 可以编辑代码和必要配置，包括 .gitignore，用于避免提交不该提交的生成物/临时文件。
- 不要 commit。
- 保持 scope 与 development document 一致，不要顺手做无关重构。
- 完成后说明改了哪些文件、为什么。

输出 ONLY compact JSON:
{"implemented":true,"summary":"...","files_touched":["..."],"tests_run":["..."],"tests_recommended":["..."],"residual_risks":["..."]}
"""

[steps.loop.body.loop.body.agent]
name = "coder"

[steps.loop.body.loop.body.validate]
format = "json"
required = ["implemented", "summary", "files_touched", "tests_run", "tests_recommended", "residual_risks"]

[[steps.loop.body.loop.body]]
id = "worktree-diff"
title = "Collect implementation diff"
depends_on = ["code-implement-or-fix"]
execution = "script"
idempotent = true

[steps.loop.body.loop.body.script]
command = ["python3", "-c", """
import json, subprocess

def run(cmd):
    p = subprocess.run(cmd, capture_output=True, text=True)
    return p.returncode, p.stdout, p.stderr

code1, diff_cached, err1 = run(['git', 'diff', '--cached'])
code2, diff_worktree, err2 = run(['git', 'diff'])
code3, status, err3 = run(['git', 'status', '--short'])
code4, stat, err4 = run(['git', 'diff', '--stat'])
print(json.dumps({'status': status.strip(), 'diff_cached': diff_cached, 'diff_worktree': diff_worktree, 'diff_stat': stat.strip(), 'ok': code1 == 0 and code2 == 0 and code3 == 0}, ensure_ascii=False))
"""]
format = "json"
timeout = "30s"

[steps.loop.body.loop.body.validate]
format = "json"
required = ["status", "diff_cached", "diff_worktree", "diff_stat", "ok"]

[[steps.loop.body.loop.body]]
id = "code-review"
title = "Code gate review"
depends_on = ["worktree-diff"]
input_context = ["architecture-gate", "code-implement-or-fix", "worktree-diff"]
description = """
你是 code gate reviewer。审查当前 diff 是否满足 architecture-gate.doc。

批准标准：
- 符合开发文档 scope 和 acceptance criteria；
- 没有明显 bug/regression；
- 不包含不该提交的文件；如果有，要求 coder 修改 .gitignore 或清理；
- 测试或验证策略足够明确。

如果不通过，required_fixes 必须是下一轮 coder 可以直接执行的具体修复项。

输出 ONLY compact JSON:
{"approved":true,"summary":"...","bugs":["..."],"architecture_gaps":["..."],"required_fixes":["..."],"confidence":0.0}
"""

[steps.loop.body.loop.body.agent]
name = "tester"

[steps.loop.body.loop.body.validate]
format = "json"
required = ["approved", "summary", "bugs", "architecture_gaps", "required_fixes", "confidence"]

[[steps.loop.body]]
id = "code-gate"
title = "Compute code gate result"
depends_on = ["architecture-gate", "code-review-loop"]
execution = "script"
idempotent = true

[steps.loop.body.script]
command = ["python3", "-c", """
import json, os

def load(name):
    raw = os.environ.get(name, '')
    return json.loads(raw) if raw else None

impl = load('CODE_IMPL')
review = load('CODE_REVIEW')
diff = load('WORKTREE_DIFF')
approved = bool(review and review.get('approved') is True and impl)
print(json.dumps({'approved': approved, 'implementation': impl, 'review': review, 'diff': diff, 'blocked_reason': '' if approved else 'code gate did not approve within max_code_review_cycles'}, ensure_ascii=False))
"""]
format = "json"
timeout = "30s"

[steps.loop.body.script.env]
CODE_IMPL = "{{code-implement-or-fix}}"
CODE_REVIEW = "{{code-review}}"
WORKTREE_DIFF = "{{worktree-diff}}"

[steps.loop.body.validate]
format = "json"
required = ["approved", "implementation", "review", "diff", "blocked_reason"]

[[steps.loop.body]]
id = "commit-cycle"
title = "Create commit for approved cycle {{iteration}}"
depends_on = ["code-gate"]
condition = "code-gate.approved == true"
execution = "script"

[steps.loop.body.script]
command = ["python3", "-c", """
import json, subprocess

topic = '''{{architecture-gate.doc.topic}}'''.strip() or 'keep-coding cycle'
cycle = '''{{iteration}}'''

def run(cmd):
    p = subprocess.run(cmd, capture_output=True, text=True)
    return p.returncode, p.stdout.strip(), p.stderr.strip()

run(['git', 'add', '-A'])
msg = f"feat: cycle {cycle} - {topic}"
c1, out1, err1 = run(['git', 'commit', '-m', msg])
c2, out2, err2 = run(['git', 'rev-parse', 'HEAD'])
print(json.dumps({'commit_attempt_ok': c1 == 0, 'commit_stdout': out1, 'commit_stderr': err1, 'head': out2 if c2 == 0 else '', 'message': msg}, ensure_ascii=False))
"""]
format = "json"
timeout = "60s"
continue_on_error = true

[steps.loop.body.validate]
format = "json"
required = ["commit_attempt_ok", "commit_stdout", "commit_stderr", "head", "message"]

[[steps.loop.body]]
id = "cycle-report"
title = "Summarize cycle {{iteration}}"
depends_on = ["architecture-gate", "code-gate", "commit-cycle"]
input_context = ["codebase-research", "architecture-gate", "code-gate", "commit-cycle"]
description = """
你是 cycle reporter。总结本 cycle，必须说明：代码研究发现、开发文档主题、gate 是否通过、实现摘要、commit 情况、下一轮建议。

如果 architecture-gate 或 code-gate 未通过，也要输出 completed=false 和 blocked_reason，不要假装完成。

输出 ONLY compact JSON:
{"cycle":1,"completed":true,"topic":"...","research_summary":"...","implementation_summary":"...","commit_created":true,"commit":"...","blocked_reason":"","residual_risks":["..."],"next_focus":["..."]}
"""

[steps.loop.body.agent]
name = "reporter"

[steps.loop.body.validate]
format = "json"
required = ["cycle", "completed", "topic", "research_summary", "implementation_summary", "commit_created", "commit", "blocked_reason", "residual_risks", "next_focus"]

[[steps]]
id = "final-report"
title = "Final workflow report"
depends_on = ["cycle"]
input_context = ["cycle"]
description = """
输出中文 Markdown 最终报告。不要输出 JSON。

必须包含：
- 总体目标；
- 每一轮 cycle 的 topic、完成状态、commit、blocked_reason；
- 已完成的实际代码工作；
- 剩余风险和建议下一步。

保持简洁，结论先行。
"""

[steps.agent]
name = "reporter"

[steps.validate]
format = "markdown"
