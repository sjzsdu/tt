formula = "gongbu"
description = "在自动隔离 worktree 中完成代码类 feature：理解需求、调研代码、制定方案、实现、验证并按需提交；workspace policy 负责 worktree 与 sparse checkout。"
version = 1
type = "workflow"
workspace = { kind = "worktree", cleanup = false }

[vars]
feature_request = { description = "本次 feature 的目标、背景、验收标准或用户需求描述", required = true }
branch_name = { description = "可选覆盖：特性分支名；默认从 feature_request 推导为 feature/<slug>" }
base_branch = { description = "可选覆盖：起始分支/commit；默认 origin/main，不存在则自动 fallback 到 HEAD" }

[[steps]]
id = "prepare-branch"
title = "准备开发分支"
execution = "script"
description = "在 runtime 已创建的隔离 worktree 中 checkout 或创建目标开发分支。"

[steps.script]
command = [
  "python3",
  "-c",
  """
import json, os, re, subprocess, sys
feature_request, branch_override, base_override = sys.argv[1:4]
def empty_if_template(v):
    v = (v or '').strip()
    return '' if v.startswith('{{') and v.endswith('}}') else v
feature_request = empty_if_template(feature_request)
branch_override = empty_if_template(branch_override)
base_branch = empty_if_template(base_override) or 'origin/main'
def run(args, check=True):
    p = subprocess.run(args, text=True, capture_output=True)
    if check and p.returncode != 0:
        raise SystemExit((p.stderr or p.stdout or ('command failed: ' + ' '.join(args))).strip())
    return p.stdout.strip()
def slugify(text):
    text = text.lower()
    text = re.sub(r'[^a-z0-9]+', '-', text)
    text = re.sub(r'-+', '-', text).strip('-')
    return (text or 'feature')[:48].strip('-') or 'feature'
branch = branch_override or ('feature/' + slugify(feature_request))
if subprocess.run(['git', 'rev-parse', '--verify', base_branch + '^{commit}'], text=True, capture_output=True).returncode != 0:
    base_branch = 'HEAD'
current_branch = run(['git', 'branch', '--show-current'], check=False)
branch_exists = subprocess.run(['git', 'rev-parse', '--verify', branch], text=True, capture_output=True).returncode == 0
if current_branch != branch:
    if branch_exists:
        run(['git', 'checkout', branch])
    else:
        run(['git', 'checkout', '-b', branch, base_branch])
root = run(['git', 'rev-parse', '--show-toplevel'])
sparse_paths = [p.strip().strip('/') for p in run(['git', 'sparse-checkout', 'list'], check=False).splitlines() if p.strip()]
print(json.dumps({
    'feature_request': feature_request,
    'base_branch': base_branch,
    'branch_name': branch,
    'worktree_path': root,
    'workspace_cwd': os.environ.get('TT_WORKSPACE_CWD', root),
    'invocation_cwd': os.environ.get('TT_INVOCATION_CWD', ''),
    'formula_run_dir': os.environ.get('TT_FORMULA_RUN_DIR', ''),
    'sparse_paths': sparse_paths,
    'sparse_enabled': bool(sparse_paths),
    'checked_out': current_branch != branch,
}, ensure_ascii=False))
""",
  "{{feature_request}}",
  "{{branch_name}}",
  "{{base_branch}}",
]
format = "json"
timeout = "2m"

[steps.validate]
format = "json"
required = ["stdout"]

[[steps]]
id = "inspect-repo"
title = "收集仓库与 worktree 状态"
depends_on = ["prepare-branch"]
execution = "script"

[steps.script]
command = [
  "python3",
  "-c",
  """
import json, os, subprocess
def run(args):
    p = subprocess.run(args, text=True, capture_output=True)
    return {'command': args, 'exit_code': p.returncode, 'stdout': p.stdout, 'stderr': p.stderr}
root = subprocess.check_output(['git', 'rev-parse', '--show-toplevel'], text=True).strip()
print(json.dumps({
    'worktree_path': root,
    'workspace_cwd': os.environ.get('TT_WORKSPACE_CWD', root),
    'invocation_cwd': os.environ.get('TT_INVOCATION_CWD', ''),
    'formula_run_dir': os.environ.get('TT_FORMULA_RUN_DIR', ''),
    'status': run(['git', 'status', '--short', '--branch']),
    'tracked_files': run(['git', 'ls-files']),
}, ensure_ascii=False))
""",
]
format = "json"
timeout = "30s"

[steps.validate]
format = "json"
required = ["stdout"]

[[steps]]
id = "analyze-feature"
title = "理解 feature 需求并形成代码调研线索"
depends_on = ["inspect-repo"]
input_context = ["prepare-branch.stdout", "inspect-repo.stdout"]
form = true
description = """
基于 feature_request、prepare-branch.stdout 和 inspect-repo.stdout，理解本次 feature 的目标、边界和交付口径。当前执行目录已经是隔离 worktree，后续实施只在该 worktree 中进行。

如果信息不足以形成后续代码调研任务，可以动态澄清；只询问阻塞调研的必要信息。

输出 ONLY compact JSON：
{
  "feature_summary":"...",
  "business_goal":"...",
  "acceptance_criteria":["..."],
  "in_scope":["..."],
  "out_of_scope":["..."],
  "assumptions":["..."],
  "initial_search_targets":["..."],
  "needs_ui":true,
  "needs_docs":true,
  "needs_changelog":true
}
"""
agent.name = "product-manager"

[steps.validate]
format = "json"
required = ["feature_summary", "acceptance_criteria", "initial_search_targets"]

[[steps]]
id = "prepare-research-brief"
title = "生成代码调研摘要"
depends_on = ["analyze-feature"]
input_context = ["prepare-branch.stdout", "inspect-repo.stdout", "analyze-feature"]
description = """
基于需求理解和仓库状态生成后续 code-research 使用的统一摘要。

输出 ONLY compact JSON：
{
  "research_task":"...",
  "feature_summary":"...",
  "search_targets":["..."],
  "acceptance_criteria":["..."],
  "constraints":["..."],
  "notes":["..."]
}
"""
agent.name = "coder"

[steps.validate]
format = "json"
required = ["research_task", "search_targets", "acceptance_criteria"]

[[steps]]
id = "code-research"
title = "调研现有实现并定位 feature 落点"
depends_on = ["prepare-research-brief"]
input_context = ["prepare-research-brief"]
description = """
你是 code-research agent。调研当前隔离 worktree 中的代码库，重点使用代码上下文、grep、符号命名、调用链、配置入口与测试结构来理解现有实现。

输出 ONLY compact JSON：
{
  "existing_behavior":"...",
  "evidence":["..."],
  "code_scope":["..."],
  "minimal_change_scope":["..."],
  "risk_points":["..."],
  "implementation_options":[{"id":"option-a","summary":"...","pros":["..."],"cons":["..."],"recommended":true}],
  "verification_focus":["..."]
}
"""
agent.name = "code-research"

[steps.validate]
format = "json"
required = ["existing_behavior", "evidence", "code_scope", "implementation_options"]

[[steps]]
id = "plan-feature"
title = "制定最小可交付实施方案"
depends_on = ["code-research"]
input_context = ["analyze-feature", "prepare-research-brief", "code-research"]
description = """
基于需求理解和 code-research，输出可直接执行的最小实施方案，并判断是否需要让用户选择实现方案。

输出 ONLY compact JSON：
{
  "implementation_goal":"...",
  "selected_option_id":"option-a",
  "needs_strategy_choice":false,
  "strategy_choices":[{"id":"option-a","label":"...","description":"...","recommended":true}],
  "workstreams":[{"id":"backend|frontend|docs|tests|changelog","goal":"...","needed":true,"notes":"..."}],
  "code_scope":["..."],
  "test_strategy":["..."],
  "doc_targets":["..."],
  "changelog_target":"...",
  "sequence":["implement","test","docs","changelog"],
  "minimal_done_definition":["..."]
}
"""
agent.name = "planner"

[steps.validate]
format = "json"
required = ["implementation_goal", "needs_strategy_choice", "code_scope", "test_strategy"]

[[steps]]
id = "choose-strategy"
title = "必要时让用户选择实现方案"
depends_on = ["plan-feature"]
input_context = ["analyze-feature", "code-research", "plan-feature"]
condition = "plan-feature.needs_strategy_choice == true"
form = true
description = """
plan-feature 判断存在多个合理实现方案，需要让用户选择。请基于 plan-feature.strategy_choices 动态生成最小表单。

输出 ONLY compact JSON：
{"selected_option_id":"...","strategy_notes":"...","reason":"..."}
"""
agent.name = "product-manager"

[steps.validate]
format = "json"
required = ["selected_option_id"]

[[steps]]
id = "design-ui"
title = "设计必要的 UI/交互变更"
depends_on = ["plan-feature", "choose-strategy"]
input_context = ["analyze-feature", "code-research", "plan-feature", "choose-strategy"]
condition = "analyze-feature.needs_ui == true"
description = """
如果本次 feature 涉及用户界面或交互，请给出足够指导实现的 UI/交互说明。

输出 ONLY compact JSON：
{"ui_needed":true,"screens":["..."],"interaction_changes":["..."],"copy_suggestions":["..."],"edge_states":["..."]}
"""
agent.name = "ui"

[[steps]]
id = "implement-feature"
title = "实现 feature"
depends_on = ["plan-feature", "choose-strategy", "design-ui"]
input_context = ["analyze-feature", "code-research", "plan-feature", "choose-strategy", "design-ui"]
description = """
在当前隔离 worktree 中完成 feature 实现。不要修改原始仓库目录。

要求：
1. 只围绕 code_scope 修改代码；
2. 不顺手大改无关模块；
3. 保持实现与 acceptance_criteria 对齐；
4. 若某项无法完成，要明确说明阻塞点；
5. 如果 sparse worktree 缺少必要目录，可按需调整 sparse-checkout 或说明需要的目录。

输出 ONLY compact JSON：
{"implemented":true,"files_changed":["..."],"summary":"...","blocked_items":["..."],"notes":["..."]}
"""
agent.name = "full-stack"

[[steps]]
id = "run-tests"
title = "执行测试与基础验证"
depends_on = ["implement-feature"]
execution = "script"

[steps.script]
command = [
  "python3",
  "-c",
  """
import json, os, subprocess
commands = [(['go', 'test', './...'], 'go'), (['npm', 'test'], 'npm')]
selected = None
for cmd, marker in commands:
    if marker == 'go' and os.path.exists('go.mod'):
        selected = cmd
        break
    if marker == 'npm' and os.path.exists('package.json'):
        selected = cmd
        break
if selected is None:
    print(json.dumps({'attempted': False, 'command': [], 'exit_code': 0, 'stdout': '', 'stderr': 'no go.mod or package.json found; skipped automatic validation'}, ensure_ascii=False))
    raise SystemExit(0)
p = subprocess.run(selected, text=True, capture_output=True)
print(json.dumps({'attempted': True, 'command': selected, 'exit_code': p.returncode, 'stdout': p.stdout, 'stderr': p.stderr}, ensure_ascii=False))
raise SystemExit(0)
""",
]
format = "json"
timeout = "10m"
continue_on_error = true

[[steps]]
id = "review-quality"
title = "评估实现质量与测试覆盖"
depends_on = ["implement-feature", "run-tests"]
input_context = ["analyze-feature", "code-research", "plan-feature", "choose-strategy", "implement-feature", "run-tests"]
description = """
基于实现结果和测试输出，评估本次 feature 是否达到可交付状态。不要编造测试结果。

输出 ONLY compact JSON：
{"ready":true,"acceptance_status":"met|partial|failed","gaps":["..."],"followup_fixes":["..."],"doc_updates_needed":["..."],"changelog_needed":true}
"""
agent.name = "tester"

[[steps]]
id = "write-docs"
title = "补充文档"
depends_on = ["review-quality"]
input_context = ["analyze-feature", "code-research", "plan-feature", "choose-strategy", "implement-feature", "review-quality"]
condition = "analyze-feature.needs_docs == true"
description = """
在当前隔离 worktree 中补充必要文档，只覆盖本次 feature 真正新增或变化的部分。

输出 ONLY compact JSON：
{"updated":true,"doc_files":["..."],"summary":"..."}
"""
agent.name = "writer"

[[steps]]
id = "update-changelog"
title = "更新 changelog"
depends_on = ["review-quality"]
input_context = ["analyze-feature", "code-research", "plan-feature", "choose-strategy", "implement-feature", "review-quality", "write-docs"]
condition = "analyze-feature.needs_changelog == true && review-quality.changelog_needed == true"
description = """
在当前隔离 worktree 中为本次 feature 更新 changelog。只记录用户可感知或对集成方有意义的变化。

输出 ONLY compact JSON：
{"updated":true,"changelog_files":["..."],"entry_summary":"..."}
"""
agent.name = "writer"

[[steps]]
id = "final-check"
title = "做最终交付检查"
depends_on = ["write-docs", "update-changelog", "review-quality"]
input_context = ["prepare-branch.stdout", "inspect-repo.stdout", "analyze-feature", "code-research", "plan-feature", "choose-strategy", "implement-feature", "run-tests", "review-quality", "write-docs", "update-changelog"]
description = """
做最终交付检查，确认实现、测试、文档、changelog 是否形成闭环。

输出 ONLY compact JSON：
{"ready_to_commit":true,"final_gaps":["..."],"release_notes":"...","summary":"..."}
"""
agent.name = "tester"

[[steps]]
id = "commit-changes"
title = "提交代码"
depends_on = ["final-check"]
condition = "final-check.ready_to_commit == true"
execution = "script"
description = "在当前隔离 worktree 中提交代码；workspace policy cleanup=false，因此提交后保留 worktree 与分支。"

[steps.script]
command = [
  "python3",
  "-c",
  """
import json, subprocess
worktree_path = subprocess.check_output(['git', 'rev-parse', '--show-toplevel'], text=True).strip()
current_branch = subprocess.check_output(['git', 'branch', '--show-current'], text=True).strip()
msg = 'feat: ' + (current_branch.split('/')[-1] if current_branch else 'gongbu')
subprocess.run(['git', 'add', '-A'], check=False)
p = subprocess.run(['git', 'commit', '-m', msg], text=True, capture_output=True)
print(json.dumps({'worktree_path': worktree_path, 'branch_name': current_branch, 'commit_message': msg, 'exit_code': p.returncode, 'stdout': p.stdout, 'stderr': p.stderr}, ensure_ascii=False))
raise SystemExit(0)
""",
]
format = "json"
timeout = "60s"
continue_on_error = true

[steps.validate]
format = "json"
required = ["stdout"]

[[steps]]
id = "final-report"
title = "输出最终结论与报告"
depends_on = ["commit-changes", "final-check"]
input_context = ["prepare-branch.stdout", "inspect-repo.stdout", "analyze-feature", "code-research", "plan-feature", "choose-strategy", "implement-feature", "run-tests", "review-quality", "write-docs", "update-changelog", "final-check", "commit-changes"]
description = """
面向用户输出最终中文报告。结论先行，说明 feature 目标、实现内容、测试结果、文档/changelog、是否 commit、实际 branch_name 和 worktree_path、worktree 是否保留，以及未完成事项。

注意：worktree 的创建、默认 cwd、sparse checkout 和 .tt 目录保护由 workflow workspace policy 处理；本流程 cleanup=false，默认保留开发 worktree，不要声称已经清理删除。
"""
agent.name = "reporter"
