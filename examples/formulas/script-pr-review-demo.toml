formula = "script-pr-review-demo"
description = "Collect deterministic PR context with scripts, hand it to an agent for review, then optionally pause for explicit typed runtime sign-off before tests."
version = 2
type = "workflow"

[vars]
pr = { description = "Pull request number", required = true }

[[steps]]
id = "fetch-pr"
title = "Fetch PR metadata"
description = "Fetch PR metadata through GitHub CLI and save the structured result."
execution = "script"

[steps.script]
command = ["gh", "pr", "view", "{{pr}}", "--json", "number,title,body,author,files,commits,reviews"]
format = "json"
timeout = "30s"

[[steps]]
id = "diff-stat"
title = "Collect diff stat"
depends_on = ["fetch-pr"]
execution = "script"

[steps.script]
command = ["git", "diff", "--stat", "origin/main...HEAD"]
format = "text"
timeout = "15s"
continue_on_error = true

[[steps]]
id = "review"
title = "Review PR risk"
depends_on = ["fetch-pr", "diff-stat"]
input_context = ["fetch-pr", "diff-stat"]
description = "Review the PR metadata and diff stat. Summarize risks, missing tests, and suggested reviewer focus areas."

[steps.agent]
name = "coder"

[[steps]]
id = "test-approval"
title = "Approve running tests"
execution = "human_input"
depends_on = ["review"]
description = "Demonstrates explicit human input before running a local command."

[steps.form]
title = "Run local tests?"
description = "The next step runs `go test ./...` locally. Confirm before continuing."
submit_label = "Continue"

[[steps.form.fields]]
name = "approved"
label = "Run go test ./...?"
type = "radio"
required = true
options = ["yes", "no"]

[[steps]]
id = "test"
title = "Run Go tests"
depends_on = ["test-approval"]
condition = "test-approval.approved == yes"
execution = "script"

[steps.script]
command = ["go", "test", "./..."]
format = "text"
timeout = "2m"
continue_on_error = true

[[steps]]
id = "report"
title = "Write final report"
depends_on = ["test"]
input_context = ["review", "test-approval", "test"]
description = "Write a concise final PR review report using the analysis, explicit test approval, and test result if tests ran. If test_approval.approved != yes, say tests were intentionally skipped."

[steps.agent]
name = "reporter"
