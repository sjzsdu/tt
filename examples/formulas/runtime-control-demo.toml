formula = "runtime-control-demo"
description = "Demo: use typed runtime JSON output to choose a runtime branch, optionally pause for explicit human input, and stop an until loop."
version = 2
type = "workflow"

[vars]
topic = { default = "formula runtime control flow", description = "Topic to process" }

[[steps]]
id = "decide"
title = "Decide which implementation path to use"
description = """
Analyze {{topic}} and output ONLY compact JSON in this shape:
{"path":"frontend"} or {"path":"backend"}
For this demo, choose frontend.
"""

[[steps]]
id = "frontend-plan"
title = "Frontend path selected"
depends_on = ["decide"]
input_context = ["decide"]
condition = "decide.path == frontend"
description = "This step runs only when the decide step produced JSON with path=frontend. Output ONLY compact JSON: {\"plan\":\"...\",\"needs_user_choice\":false}."

[[steps]]
id = "choose-frontend-detail"
title = "Optional frontend detail choice"
execution = "human_input"
depends_on = ["frontend-plan"]
condition = "frontend-plan.needs_user_choice == true"
description = "Explicit typed runtime pause used only when frontend_plan says it needs user choice."

[steps.form]
title = "Choose frontend detail"
description = "This demonstrates first-class human input pause/resume."
submit_label = "Continue"

[[steps.form.fields]]
name = "detail"
label = "Detail to prioritize"
type = "radio"
required = true
options = ["accessibility", "performance", "state-management"]

[[steps]]
id = "backend-plan"
title = "Backend path selected"
depends_on = ["decide"]
input_context = ["decide"]
condition = "decide.path == backend"
description = "This step runs only when the decide step produced JSON with path=backend."

[[steps]]
id = "improve"
title = "Iterate until review approves"
depends_on = ["frontend-plan", "choose-frontend-detail"]
input_context = ["decide", "frontend-plan", "choose-frontend-detail"]
condition = "decide.path == frontend"
description = "Runtime loop: every iteration can use the latest agent output and decide whether to stop."

  [steps.loop]
  until = "review.approved == true"
  max = 3

  [[steps.loop.body]]
  id = "draft"
  title = "Draft iteration {{iteration}}"
  description = "Create or improve a short proposal for {{topic}}."

  [[steps.loop.body]]
  id = "review"
  title = "Review iteration {{iteration}}"
  input_context = ["draft"]
  description = """
Review the draft. Output ONLY compact JSON, for example:
{"approved":false,"reason":"needs more detail"}
or
{"approved":true,"reason":"good enough"}
For this demo, approve on the second pass if the draft is acceptable.
"""
