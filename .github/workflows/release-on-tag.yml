name: Release on tag

# The git tag is the single source of truth for the version: pushing v* builds
# every platform with that tag injected via ldflags and publishes the release.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout tt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version from git tag
        id: version
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="$(git describe --tags --abbrev=0)"
          fi
          if [[ -z "${tag}" ]]; then
            echo "Unable to resolve a git tag for the build" >&2
            exit 1
          fi

          version="${tag#v}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "Resolved tag: ${tag} (version ${version})"

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64

    steps:
      - name: Checkout tt
        uses: actions/checkout@v4
        with:
          path: tt

      - name: Checkout picoclaw sibling module
        uses: actions/checkout@v4
        with:
          repository: sjzsdu/picoclaw
          path: picoclaw

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: tt/go.mod
          cache-dependency-path: tt/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tt/web/package-lock.json

      - name: Build web assets
        working-directory: tt
        run: make web-build

      - name: Run tests
        working-directory: tt
        run: go test ./...

      - name: Build binary
        working-directory: tt
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          ext=""
          if [[ "${GOOS}" == "windows" ]]; then
            ext=".exe"
          fi
          artifact="tt_${VERSION}_${GOOS}_${GOARCH}"
          binary="${artifact}${ext}"
          GOOS="${GOOS}" GOARCH="${GOARCH}" CGO_ENABLED=0 \
            go build -trimpath -ldflags="-s -w -X github.com/sjzsdu/tt/cmd.version=${VERSION}" \
            -o "dist/${binary}" .
          cd dist
          if [[ "${GOOS}" == "windows" ]]; then
            zip "${artifact}.zip" "${binary}"
          else
            tar -czf "${artifact}.tar.gz" "${binary}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tt-${{ needs.prepare.outputs.version }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            tt/dist/*.tar.gz
            tt/dist/*.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs:
      - prepare
      - build
    # Publish whatever built successfully: a single platform failure (for
    # example a Windows-only compile issue) must not block the Linux assets.
    if: always() && needs.prepare.result == 'success' && needs.build.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create or update release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          files=(release-assets/*)
          if (( ${#files[@]} == 0 )); then
            echo "No release assets found" >&2
            exit 1
          fi

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${files[@]}" --clobber
          else
            gh release create "${TAG}" "${files[@]}" \
              --title "tt ${VERSION}" \
              --notes "Automated build for tt ${VERSION}."
          fi
