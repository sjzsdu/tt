formula = "flow360-release"
title = "Flow360 UI Next release"
category = "release"
tags = ["flow360-next", "deploy", "github-actions", "merge-conflict"]
description = "Flow360 发布流程：触发或复用固定 GitHub Actions workflow，循环检查指定 action 的 multi-branch job；成功则退出，否则固定重置 tmp branch、merge 指定分支、交给 agent 解冲突、merge --continue、push、rerun failed jobs，再等待后继续循环。"
version = 29
type = "workflow"

[preflight]

[[preflight.checks]]
type = "command"
name = "gh"
command = "gh"
message = "需要安装 GitHub CLI: https://cli.github.com/"

[[preflight.checks]]
type = "exec"
name = "gh-auth"
command = "gh auth status"
message = "GitHub CLI 未登录或不可用，请先执行 gh auth login"

[[preflight.checks]]
type = "command"
name = "git"
command = "git"
message = "需要安装 git"

[[preflight.checks]]
type = "command"
name = "jq"
command = "jq"
message = "需要安装 jq"

[[preflight.checks]]
type = "git"
name = "git-repo"
require_repo = true
require_remote = true
message = "需要在 flex 仓库或带 origin remote 的 git 仓库中运行"

[vars]
env_name = { description = "发布环境", required = true, enum = ["dev", "uat2", "preprod"] }
tag = { description = "可选 tag/branch；空或 - 时不传", default = "" }
fresh_deploy = { description = "是否 fresh deploy", default = "false", enum = ["true", "false"] }
resume_run_id = { description = "可选：复用已有 GitHub Actions run id，只监控/修复/重跑 failed jobs，不重新 dispatch", default = "" }
tmp_branch = { description = "要修复并 push 的临时部署分支", default = "tmp-deploy-c51db917" }
merge_branch = { description = "要合入 tmp branch 的冲突源分支", default = "flow360-ui/volume-render-ly" }
job_name_pattern = { description = "目标 job 名称关键字，默认匹配 multi-branch", default = "multi-branch" }
poll_interval_seconds = { description = "每轮等待秒数", default = "30", type = "int", pattern = "^[1-9][0-9]*$" }

[[steps]]
id = "dispatch-run"
title = "触发或复用 Flow360 CD workflow"
execution = "script"
description = "触发 flexcompute/flex 的 Flow360 CD workflow，并锁定本次 run id；如果提供 resume_run_id 则直接复用。"

  [steps.script]
  command = ["bash", "-lc", """
set -euo pipefail
repo='flexcompute/flex'
workflow='.github/workflows/frontend_flow360-ui-next-cd.yml'
env_name="${TT_ENV_NAME:-}"
tag="${TT_TAG:-}"
fresh="${TT_FRESH_DEPLOY:-false}"
resume_run_id="${TT_RESUME_RUN_ID:-}"
pass_tag=false
if [ -n "$tag" ] && [ "$tag" != "-" ]; then pass_tag=true; fi
emit() {
  jq -cn --arg repo "$repo" --arg workflow_path "$workflow" --arg env_name "$env_name" --arg tag "$tag" --arg fresh "$fresh" --arg original_run_id "${1:-}" --arg run_url "${2:-}" --arg dispatch_error "${3:-}" --argjson run_created "${4:-false}" --argjson pass_tag "$pass_tag" '{repo:$repo,workflow_path:$workflow_path,env_name:$env_name,tag:$tag,pass_tag:$pass_tag,fresh_deploy:($fresh=="true"),run_created:$run_created,original_run_id:$original_run_id,run_url:$run_url,dispatch_error:$dispatch_error}'
}
if [ -n "$resume_run_id" ] && [ "$resume_run_id" != "-" ]; then
  if run_data="$(gh run view "$resume_run_id" -R "$repo" --json databaseId,url 2>/dev/null)"; then
    emit "$resume_run_id" "$(jq -r '.url // ""' <<<"$run_data")" '' true
    exit 0
  fi
  emit '' '' "resume_run_id $resume_run_id was not found or is not accessible" false
  exit 1
fi
known="$(gh run list -R "$repo" --workflow "$workflow" --limit 20 --json databaseId 2>/dev/null | jq -r '.[].databaseId // empty' | sort -u || true)"
cmd=(gh workflow run "$workflow" -R "$repo" -f "envName=$env_name" -f "freshDeploy=$fresh")
if [ "$pass_tag" = true ]; then cmd+=(-f "tag=$tag"); fi
if ! dispatch_out="$("${cmd[@]}" 2>&1)"; then
  emit '' '' "$dispatch_out" false
  exit 1
fi
for _ in $(seq 1 12); do
  sleep 5
  runs="$(gh run list -R "$repo" --workflow "$workflow" --limit 20 --json databaseId,url,status,createdAt,event 2>/dev/null || true)"
  [ -n "$runs" ] || continue
  pick="$(jq -cn --argjson runs "$runs" --arg known "$known" '$known | split("\n") as $known_ids | ($runs | map(select(((.databaseId|tostring) as $id | $known_ids | index($id) | not))) | .[0]) // ($runs[0] // null)')"
  rid="$(jq -r '.databaseId // empty' <<<"$pick")"
  if [ -n "$rid" ]; then
    emit "$rid" "$(jq -r '.url // ""' <<<"$pick")" '' true
    exit 0
  fi
done
emit '' '' 'workflow dispatched but new run id was not visible within polling window' false
exit 1
"""]
format = "json"
  timeout = "90s"

  [steps.script.env]
  TT_ENV_NAME = "{{env_name}}"
  TT_TAG = "{{tag}}"
  TT_FRESH_DEPLOY = "{{fresh_deploy}}"
  TT_RESUME_RUN_ID = "{{resume_run_id}}"

[steps.validate]
format = "json"
required = ["stdout"]

[[steps]]
id = "monitor-and-rerun"
title = "监控 multi-branch、修冲突并 rerun"
depends_on = ["dispatch-run"]
description = "每轮先检查指定 run 中目标 multi-branch job；success 退出，否则固定 git fetch/reset/merge，agent 解冲突，merge --continue，push，rerun failed job，等待后继续。"

  [steps.loop]
  until = "release-progress.stdout.done == true"
  max = 80

  [[steps.loop.body]]
  id = "check-multi-branch-job"
  title = "获取目标 multi-branch job 状态"
  execution = "script"
  description = "只读取指定 action run 中名称匹配 job_name_pattern 的 job；job success 即结束，running/queued 则等待，failure 则进入修冲突。"

    [steps.loop.body.script]
    command = ["bash", "-lc", """
set -euo pipefail
repo='flexcompute/flex'
rid="${TT_ORIGINAL_RUN_ID:-}"
pattern="${TT_JOB_NAME_PATTERN:-multi-branch}"
pattern_lc="$(printf '%s' "$pattern" | tr '[:upper:]' '[:lower:]')"
emit() {
  jq -cn --arg repo "$repo" --arg original_run_id "$rid" --arg run_url "${1:-}" --argjson jobs "${2:-[]}" --arg action "${3:-block}" --arg final_state "${4:-blocked}" --arg reason "${5:-}" '{repo:$repo,original_run_id:$original_run_id,run_url:$run_url,jobs:$jobs,action:$action,final_state:$final_state,done:($final_state=="succeeded" or $final_state=="blocked"),reason:$reason}'
}
if [ -z "$rid" ]; then emit '' '[]' block blocked 'missing original_run_id'; exit 0; fi
if ! data="$(gh run view "$rid" -R "$repo" --json databaseId,url,status,conclusion,jobs 2>&1)"; then
  emit '' '[]' block blocked "$data"
  exit 0
fi
run_url="$(jq -r '.url // ""' <<<"$data")"
jobs="$(jq --arg p "$pattern_lc" '[.jobs[]? | select((.name // "" | ascii_downcase | contains($p)) or (((.name // "" | ascii_downcase | contains("multi")) and (.name // "" | ascii_downcase | contains("branch")))))]' <<<"$data")"
count="$(jq 'length' <<<"$jobs")"
if [ "$count" -eq 0 ]; then
  emit "$run_url" "$jobs" wait running "target job '$pattern' has not appeared yet"
  exit 0
fi
if jq -e 'any(.[]; (.status // "") != "completed")' <<<"$jobs" >/dev/null; then
  emit "$run_url" "$jobs" wait running "target multi-branch job is still running or queued"
  exit 0
fi
if jq -e 'all(.[]; (.conclusion // "") == "success")' <<<"$jobs" >/dev/null; then
  emit "$run_url" "$jobs" none succeeded "target multi-branch job completed successfully"
  exit 0
fi
if jq -e 'any(.[]; (.conclusion // "") == "failure")' <<<"$jobs" >/dev/null; then
  emit "$run_url" "$jobs" repair_conflict running "target multi-branch job failed; repair tmp branch then rerun failed jobs"
  exit 0
fi
emit "$run_url" "$jobs" block blocked "target multi-branch job completed with non-success conclusion"
"""]
format = "json"
    timeout = "60s"

    [steps.loop.body.script.env]
    TT_ORIGINAL_RUN_ID = "{{dispatch-run.stdout.original_run_id}}"
    TT_JOB_NAME_PATTERN = "{{job_name_pattern}}"

    [steps.loop.body.validate]
    format = "json"
    required = ["stdout"]

  [[steps.loop.body]]
  id = "prepare-conflict-merge"
  title = "重置 tmp branch 并 merge 指定分支"
  execution = "script"
  depends_on = ["check-multi-branch-job"]
  condition = "check-multi-branch-job.stdout.action == repair_conflict"
  description = "固定执行：git fetch origin；如果当前是 tmp branch 则 reset --hard origin/tmp，否则 checkout -B tmp origin/tmp；然后 git merge --no-ff origin/<merge_branch> -m auto_manual_merge。"

    [steps.loop.body.script]
    command = ["bash", "-lc", """
set -euo pipefail
repo_root="$(git rev-parse --show-toplevel 2>/dev/null || pwd)"
cd "$repo_root"
tmp_branch="${TT_TMP_BRANCH:-tmp-deploy-c51db917}"
merge_branch="${TT_MERGE_BRANCH:-flow360-ui/volume-render-ly}"
merge_head_path="$(git rev-parse --git-path MERGE_HEAD)"
if [ -e "$merge_head_path" ]; then git merge --abort >/tmp/tt-flow360-merge-abort.log 2>&1 || true; fi
git fetch origin
current="$(git branch --show-current 2>/dev/null || true)"
if [ "$current" = "$tmp_branch" ]; then
  git reset --hard "origin/$tmp_branch"
else
  git checkout -B "$tmp_branch" "origin/$tmp_branch"
fi
set +e
merge_out="$(git merge --no-ff "origin/$merge_branch" -m auto_manual_merge 2>&1)"
merge_rc=$?
set -e
conflicted_files="$(git diff --name-only --diff-filter=U | jq -R -s -c 'split("\n") | map(select(length>0))')"
touched_files="$(git diff --name-only HEAD | jq -R -s -c 'split("\n") | map(select(length>0))')"
if [ "$merge_rc" -eq 0 ]; then
  jq -cn --arg tmp_branch "$tmp_branch" --arg merge_branch "$merge_branch" --arg merge_out "$merge_out" --arg head "$(git rev-parse HEAD)" '{attempted:true,merge_complete:true,ready_for_agent:false,tmp_branch:$tmp_branch,merge_branch:$merge_branch,conflicted_files:[],touched_files:[],stdout:$merge_out,stderr:"",head:$head}'
  exit 0
fi
if [ "$conflicted_files" = "[]" ]; then
  jq -cn --arg tmp_branch "$tmp_branch" --arg merge_branch "$merge_branch" --arg merge_out "$merge_out" '{attempted:true,merge_complete:false,ready_for_agent:false,tmp_branch:$tmp_branch,merge_branch:$merge_branch,conflicted_files:[],touched_files:[],stdout:"",stderr:$merge_out,blocker_type:"merge_failed_without_conflicts"}'
  exit 0
fi
jq -cn --arg tmp_branch "$tmp_branch" --arg merge_branch "$merge_branch" --arg merge_out "$merge_out" --argjson conflicted_files "$conflicted_files" --argjson touched_files "$touched_files" '{attempted:true,merge_complete:false,ready_for_agent:true,tmp_branch:$tmp_branch,merge_branch:$merge_branch,conflicted_files:$conflicted_files,touched_files:$touched_files,stdout:$merge_out,stderr:""}'
"""]
format = "json"
    timeout = "5m"

    [steps.loop.body.script.env]
    TT_TMP_BRANCH = "{{tmp_branch}}"
    TT_MERGE_BRANCH = "{{merge_branch}}"

    [steps.loop.body.validate]
    format = "json"
    required = ["stdout"]

  [[steps.loop.body]]
  id = "resolve-conflicts"
  title = "agent 解决 merge 冲突"
  depends_on = ["prepare-conflict-merge"]
  condition = "prepare-conflict-merge.stdout.ready_for_agent == true"
  input_context = ["prepare-conflict-merge.stdout.tmp_branch", "prepare-conflict-merge.stdout.merge_branch", "prepare-conflict-merge.stdout.conflicted_files", "prepare-conflict-merge.stdout.touched_files", "prepare-conflict-merge.stdout.stdout"]
  description = """
当前工作区已经在 tmp branch 上执行了 git merge --no-ff origin/<merge_branch> -m auto_manual_merge，并停在冲突状态。

请只解决 prepare-conflict-merge.stdout.conflicted_files 中的冲突：
- 可以读取相关文件理解上下文。
- 不要 checkout/switch/reset/merge/rebase/push/gh。
- 不要创建 commit。
- 解决后 git add 已解决的文件。
- 确认没有 <<<<<<< / >>>>>>> 冲突标记。

输出 ONLY compact JSON object，不要 Markdown，不要代码块：
{"attempted":true,"resolved":true,"touched_files":[],"resolution_summary":"","validations_run":[],"blocker_type":"none|semantic_uncertainty|missing_context|validation_failed|unknown","blocker_summary":""}
"""

    [steps.loop.body.agent]
    name = "merge-conflict-resolver"

    [steps.loop.body.validate]
    format = "json"
    required = ["attempted", "resolved", "blocker_type"]

  [[steps.loop.body]]
  id = "continue-merge"
  title = "完成 merge commit"
  execution = "script"
  depends_on = ["prepare-conflict-merge", "resolve-conflicts"]
  condition = "prepare-conflict-merge.stdout.attempted == true"
  description = "无冲突或 agent 已解决冲突后，检查 unmerged 和 conflict marker，然后执行 git merge --continue；失败时 fallback 到 commit --no-edit。"

    [steps.loop.body.script]
    command = ["bash", "-lc", """
set -euo pipefail
repo_root="$(git rev-parse --show-toplevel 2>/dev/null || pwd)"
cd "$repo_root"
prep='${TT_PREPARE:-}'
resolver='${TT_RESOLVER:-}'
prep_json="$(jq -cn --arg s "$prep" 'if ($s|length)==0 then {} else (($s|fromjson?)//{}) end | if type=="object" and (.stdout|type=="object") then .stdout elif type=="object" and (.stdout|type=="string") then ((.stdout|fromjson?)//.) else . end')"
resolver_json="$(jq -cn --arg s "$resolver" 'if ($s|length)==0 then {} else (($s|fromjson?)//{}) end | if type=="object" and (.stdout|type=="object") then .stdout elif type=="object" and (.stdout|type=="string") then ((.stdout|fromjson?)//.) else . end')"
tmp_branch="$(jq -r '.tmp_branch // ""' <<<"$prep_json")"
merge_branch="$(jq -r '.merge_branch // ""' <<<"$prep_json")"
merge_complete="$(jq -r '.merge_complete == true' <<<"$prep_json")"
resolver_ok="$(jq -r '.resolved == true' <<<"$resolver_json")"
if [ "$merge_complete" != "true" ] && [ "$resolver_ok" != "true" ]; then
  blocker="$(jq -r '.blocker_summary // "resolver did not complete"' <<<"$resolver_json")"
  jq -cn --arg tmp_branch "$tmp_branch" --arg merge_branch "$merge_branch" --arg blocker "$blocker" '{attempted:true,resolved:false,tmp_branch:$tmp_branch,merge_branch:$merge_branch,local_commit:"",blocker_type:"resolver_failed",blocker_summary:$blocker,validations_run:[]}'
  exit 0
fi
unmerged="$(git diff --name-only --diff-filter=U | jq -R -s -c 'split("\n") | map(select(length>0))')"
if [ "$unmerged" != "[]" ]; then
  jq -cn --arg tmp_branch "$tmp_branch" --arg merge_branch "$merge_branch" --argjson unmerged "$unmerged" '{attempted:true,resolved:false,tmp_branch:$tmp_branch,merge_branch:$merge_branch,local_commit:"",blocker_type:"unmerged_files",blocker_summary:"unmerged files remain",remaining_conflicts:$unmerged,validations_run:["git diff --name-only --diff-filter=U"]}'
  exit 0
fi
marker_files="$(git diff --name-only HEAD | while IFS= read -r file; do [ -f "$file" ] && git grep -n -E '^(<<<<<<<|>>>>>>>)' -- "$file" 2>/dev/null | cut -d: -f1 || true; done | sort -u | jq -R -s -c 'split("\n") | map(select(length>0))')"
if [ "$marker_files" != "[]" ]; then
  jq -cn --arg tmp_branch "$tmp_branch" --arg merge_branch "$merge_branch" --argjson marker_files "$marker_files" '{attempted:true,resolved:false,tmp_branch:$tmp_branch,merge_branch:$merge_branch,local_commit:"",blocker_type:"conflict_markers",blocker_summary:"conflict markers remain",remaining_conflicts:$marker_files,validations_run:["git grep conflict markers"]}'
  exit 0
fi
git add -u
merge_head_path="$(git rev-parse --git-path MERGE_HEAD)"
if [ -e "$merge_head_path" ]; then
  set +e
  HUSKY=0 GIT_EDITOR=true GIT_MERGE_AUTOEDIT=no git -c core.hooksPath=/dev/null merge --continue >/tmp/tt-flow360-merge-continue.log 2>&1
  rc=$?
  if [ "$rc" -ne 0 ]; then
    HUSKY=0 GIT_EDITOR=true GIT_MERGE_AUTOEDIT=no git -c core.hooksPath=/dev/null commit --no-edit >>/tmp/tt-flow360-merge-continue.log 2>&1
    rc=$?
  fi
  set -e
  if [ "$rc" -ne 0 ]; then
    out="$(cat /tmp/tt-flow360-merge-continue.log 2>/dev/null || true)"
    jq -cn --arg tmp_branch "$tmp_branch" --arg merge_branch "$merge_branch" --arg out "$out" '{attempted:true,resolved:false,tmp_branch:$tmp_branch,merge_branch:$merge_branch,local_commit:"",blocker_type:"merge_continue_failed",blocker_summary:$out,validations_run:["git merge --continue"]}'
    exit 0
  fi
fi
jq -cn --arg tmp_branch "$tmp_branch" --arg merge_branch "$merge_branch" --arg head "$(git rev-parse HEAD)" '{attempted:true,resolved:true,tmp_branch:$tmp_branch,merge_branch:$merge_branch,local_commit:$head,blocker_type:"none",blocker_summary:"",validations_run:["git diff --name-only --diff-filter=U","git grep conflict markers","git merge --continue"]}'
"""]
format = "json"
    timeout = "5m"

    [steps.loop.body.script.env]
    TT_PREPARE = "{{prepare-conflict-merge.stdout}}"
    TT_RESOLVER = "{{resolve-conflicts}}"

    [steps.loop.body.validate]
    format = "json"
    required = ["stdout"]

  [[steps.loop.body]]
  id = "push-and-rerun"
  title = "push tmp branch 并 rerun failed job"
  execution = "script"
  depends_on = ["continue-merge"]
  condition = "continue-merge.stdout.resolved == true"
  description = "merge 完成后 push 当前 HEAD 到 origin/tmp_branch，然后 gh run rerun --failed。"

    [steps.loop.body.script]
    command = ["bash", "-lc", """
set -u
repo='flexcompute/flex'
rid="${TT_ORIGINAL_RUN_ID:-}"
tmp_branch="${TT_TMP_BRANCH:-tmp-deploy-c51db917}"
head_sha="$(git rev-parse HEAD 2>/dev/null || true)"
push_out="$(HUSKY=0 git push --no-verify origin "HEAD:${tmp_branch}" 2>&1)"
push_rc=$?
rerun_out=''
rerun_rc=1
if [ "$push_rc" -eq 0 ]; then
  rerun_out="$(gh run rerun "$rid" -R "$repo" --failed 2>&1)"
  rerun_rc=$?
fi
jq -cn --arg tmp_branch "$tmp_branch" --arg head "$head_sha" --arg push_out "$push_out" --arg rerun_out "$rerun_out" --arg original_run_id "$rid" --argjson pushed "$([ "$push_rc" -eq 0 ] && echo true || echo false)" --argjson rerun_requested "$([ "$rerun_rc" -eq 0 ] && echo true || echo false)" '{tmp_branch:$tmp_branch,head:$head,original_run_id:$original_run_id,pushed:$pushed,rerun_requested:$rerun_requested,push_stdout:(if $pushed then $push_out else "" end),push_stderr:(if $pushed then "" else $push_out end),rerun_stdout:(if $rerun_requested then $rerun_out else "" end),rerun_stderr:(if $rerun_requested then "" else $rerun_out end)}'
"""]
format = "json"
    timeout = "120s"

    [steps.loop.body.script.env]
    TT_ORIGINAL_RUN_ID = "{{dispatch-run.stdout.original_run_id}}"
    TT_TMP_BRANCH = "{{tmp_branch}}"

    [steps.loop.body.validate]
    format = "json"
    required = ["stdout"]

  [[steps.loop.body]]
  id = "wait-next-poll"
  title = "等待下一轮"
  execution = "script"
  depends_on = ["check-multi-branch-job", "push-and-rerun"]
  condition = "check-multi-branch-job.stdout.action == wait or push-and-rerun.stdout.rerun_requested == true"

    [steps.loop.body.script]
    command = ["bash", "-lc", """
s=${1:-30}
sleep "$s"
jq -cn --argjson wait_seconds "$s" '{wait_seconds:$wait_seconds}'
""", "--", "{{poll_interval_seconds}}"]
format = "json"
    timeout = "300s"

    [steps.loop.body.validate]
    format = "json"
    required = ["stdout"]

  [[steps.loop.body]]
  id = "release-progress"
  title = "更新发布进度"
  execution = "script"
  depends_on = ["check-multi-branch-job", "continue-merge", "push-and-rerun", "wait-next-poll"]
  description = "汇总本轮状态：success 退出；wait 或 rerun 后继续；修复/push/rerun 失败则阻塞退出。"

    [steps.loop.body.script]
    command = ["bash", "-lc", """
set -euo pipefail
jq -cn --arg check "${TT_CHECK:-}" --arg cont "${TT_CONTINUE:-}" --arg push "${TT_PUSH:-}" '
  def obj($s): if ($s|length)==0 then {} else (($s|fromjson?)//{}) end | if type=="object" and (.stdout|type=="object") then .stdout elif type=="object" and (.stdout|type=="string") then ((.stdout|fromjson?)//.) else . end;
  obj($check) as $check |
  obj($cont) as $cont |
  obj($push) as $push |
  if $check.final_state == "succeeded" then
    {done:true,final_state:"succeeded",summary:($check.reason // "multi-branch job succeeded"),run_url:($check.run_url // ""),jobs:($check.jobs // []),tmp_branch:"",merge_branch:"",local_commit:"",pushed:false,rerun_requested:false,blocker_type:"none",blocker_summary:""}
  elif $check.action == "wait" then
    {done:false,final_state:"running",summary:($check.reason // "waiting"),run_url:($check.run_url // ""),jobs:($check.jobs // []),tmp_branch:"",merge_branch:"",local_commit:"",pushed:false,rerun_requested:false,blocker_type:"none",blocker_summary:""}
  elif $check.action == "repair_conflict" then
    if ($cont.resolved != true) then
      {done:true,final_state:"blocked",summary:"merge conflict repair failed",run_url:($check.run_url // ""),jobs:($check.jobs // []),tmp_branch:($cont.tmp_branch // ""),merge_branch:($cont.merge_branch // ""),local_commit:"",pushed:false,rerun_requested:false,blocker_type:($cont.blocker_type // "repair_failed"),blocker_summary:($cont.blocker_summary // "")}
    elif ($push.pushed == true and $push.rerun_requested == true) then
      {done:false,final_state:"running",summary:"conflict repaired, pushed, rerun failed jobs requested; continue polling",run_url:($check.run_url // ""),jobs:($check.jobs // []),tmp_branch:($push.tmp_branch // $cont.tmp_branch // ""),merge_branch:($cont.merge_branch // ""),local_commit:($cont.local_commit // $push.head // ""),pushed:true,rerun_requested:true,blocker_type:"none",blocker_summary:""}
    else
      {done:true,final_state:"blocked",summary:"push or rerun failed",run_url:($check.run_url // ""),jobs:($check.jobs // []),tmp_branch:($push.tmp_branch // $cont.tmp_branch // ""),merge_branch:($cont.merge_branch // ""),local_commit:($cont.local_commit // $push.head // ""),pushed:($push.pushed == true),rerun_requested:($push.rerun_requested == true),blocker_type:(if ($push.pushed == true) then "rerun_failed" else "push_failed" end),blocker_summary:($push.push_stderr // $push.rerun_stderr // "")}
    end
  else
    {done:true,final_state:"blocked",summary:($check.reason // "blocked"),run_url:($check.run_url // ""),jobs:($check.jobs // []),tmp_branch:"",merge_branch:"",local_commit:"",pushed:false,rerun_requested:false,blocker_type:"job_failed",blocker_summary:($check.reason // "")}
  end'
"""]
format = "json"
    timeout = "30s"

    [steps.loop.body.script.env]
    TT_CHECK = "{{check-multi-branch-job.stdout}}"
    TT_CONTINUE = "{{continue-merge.stdout}}"
    TT_PUSH = "{{push-and-rerun.stdout}}"

    [steps.loop.body.validate]
    format = "json"
    required = ["stdout"]

[[steps]]
id = "final-report"
title = "输出发布报告"
depends_on = ["monitor-and-rerun"]
input_context = ["dispatch-run.stdout.repo", "dispatch-run.stdout.workflow_path", "dispatch-run.stdout.original_run_id", "dispatch-run.stdout.run_url", "dispatch-run.stdout.dispatch_error", "release-progress.stdout.final_state", "release-progress.stdout.summary", "release-progress.stdout.run_url", "release-progress.stdout.jobs", "release-progress.stdout.tmp_branch", "release-progress.stdout.merge_branch", "release-progress.stdout.local_commit", "release-progress.stdout.pushed", "release-progress.stdout.rerun_requested", "release-progress.stdout.blocker_type", "release-progress.stdout.blocker_summary"]
description = """
输出中文发布报告，结论先行，简明说明：
- repo/workflow/run id/run url
- 目标 multi-branch job 最终状态
- 如果修复过冲突，说明 tmp_branch、merge_branch、local_commit、push、rerun failed jobs 结果
- 如果 blocked，明确 blocker_type/blocker_summary 和下一步
不要输出长日志，不要编造 input_context 中没有的信息。
"""

[steps.agent]
name = "reporter"
