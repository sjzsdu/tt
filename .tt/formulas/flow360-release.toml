formula = "flow360-release"
title = "Flow360 UI Next release"
category = "release"
tags = ["flow360-next", "deploy", "github-actions", "merge-conflict"]
description = "Flow360 专用发布流程：触发固定 GitHub Actions workflow，记录本次参数和 original_run_id，持续监视；遇到 multi-branch merge conflict 时修复 tmp branch 后 rerun failed jobs，直到发布成功或进入人工审批。"
version = 3
type = "workflow"

[vars]
env_name = { description = "发布环境", required = true, enum = ["dev", "uat2", "preprod"] }
tag = { description = "可选 tag/branch；空或 - 时不传", default = "" }
fresh_deploy = { description = "是否 fresh deploy", default = "false", enum = ["true", "false"] }
poll_interval_seconds = { description = "轮询间隔秒数", default = "30", type = "int", pattern = "^[1-9][0-9]*$" }

[[steps]]
id = "dispatch-run"
title = "触发 Flow360 CD workflow"
execution = "script"
input_context = ["env"]
description = "hard-code Flow360 repo 和 workflow，执行一次 gh workflow run，并锁定本次 original_run_id。"

  [steps.script]
  command = ["python3", "-c", """
import json, os, subprocess, time

REPO = 'flexcompute/Flow360'
WORKFLOW = '.github/workflows/frontend_flow360-ui-next-cd.yml'
ENV_NAME = os.environ['TT_ENV_NAME'].strip()
TAG = os.environ.get('TT_TAG','').strip()
FRESH = os.environ.get('TT_FRESH_DEPLOY','false').strip().lower()
PASS_TAG = bool(TAG and TAG != '-')

def run(cmd):
    p = subprocess.run(cmd, text=True, capture_output=True)
    return p.returncode, p.stdout.strip(), p.stderr.strip()

result = {
    'repo': REPO,
    'workflow_path': WORKFLOW,
    'env_name': ENV_NAME,
    'tag': TAG,
    'pass_tag': PASS_TAG,
    'fresh_deploy': FRESH == 'true',
    'run_created': False,
    'original_run_id': '',
    'active_run_id': '',
    'run_url': '',
    'dispatch_error': '',
}

before_rc, before_out, _ = run(['gh','run','list','-R',REPO,'--workflow',WORKFLOW,'--limit','20','--json','databaseId'])
known = set()
if before_rc == 0 and before_out:
    try:
        known = {str(x.get('databaseId','')) for x in json.loads(before_out)}
    except Exception:
        known = set()

cmd = ['gh','workflow','run',WORKFLOW,'-R',REPO,'-f',f'envName={ENV_NAME}','-f',f'freshDeploy={FRESH}']
if PASS_TAG:
    cmd += ['-f', f'tag={TAG}']
rc, out, err = run(cmd)
if rc != 0:
    result['dispatch_error'] = err or out or 'gh workflow run failed'
    print(json.dumps(result, separators=(',', ':')))
    raise SystemExit(0)

for _ in range(12):
    time.sleep(5)
    rc, out, _ = run(['gh','run','list','-R',REPO,'--workflow',WORKFLOW,'--limit','20','--json','databaseId,url,status,createdAt,headBranch,event'])
    if rc != 0 or not out:
        continue
    try:
        runs = json.loads(out)
    except Exception:
        continue
    pick = None
    for item in runs:
        rid = str(item.get('databaseId',''))
        if rid and rid not in known:
            pick = item
            break
    if pick is None and runs:
        pick = runs[0]
    if pick and pick.get('databaseId'):
        rid = str(pick['databaseId'])
        result.update(run_created=True, original_run_id=rid, active_run_id=rid, run_url=pick.get('url',''))
        break

if not result['run_created']:
    result['dispatch_error'] = 'workflow dispatched but new run id was not visible within polling window'
print(json.dumps(result, separators=(',', ':')))
"""]
  format = "json"
  timeout = "90s"

  [steps.script.env]
  TT_ENV_NAME = "{{env_name}}"
  TT_TAG = "{{tag}}"
  TT_FRESH_DEPLOY = "{{fresh_deploy}}"

[[steps]]
id = "monitor-and-rerun"
title = "监视状态、修冲突并 rerun"
depends_on = ["dispatch-run"]
input_context = ["env", "dispatch-run"]
description = """
这是 Flow360 专用发布推进步骤。你要用 gh/git 工具监视 dispatch-run.original_run_id，必要时修复 merge conflict，并 rerun failed jobs，直到成功、blocked 或进入人工审批。

hard-coded 事实：
- repo: flexcompute/Flow360
- workflow: .github/workflows/frontend_flow360-ui-next-cd.yml
- 本次 run id: dispatch-run.original_run_id
- 轮询间隔：{{poll_interval_seconds}} 秒
- 当前本地目录：{{env.cwd}}
- 启动分支：{{env.git.branch}}

工作流：
1. 如果 dispatch-run.run_created=false，直接输出 blocked，summary 写明 dispatch-run.dispatch_error。
2. 循环执行：gh run view <original_run_id> -R flexcompute/Flow360 --json status,conclusion,url,jobs。
3. 如果 status/conclusion 表示成功，输出 final_state=succeeded。
4. 如果进入人工审批或环境等待状态，输出 final_state=approval_required。
5. 如果仍 running/queued/in_progress，等待 {{poll_interval_seconds}} 秒后继续监视。
6. 如果失败：读取失败 job 日志，只判断是否为 Flow360 multi-branch merge conflict。
7. 如果不是 merge conflict，输出 final_state=blocked。
8. 如果是 merge conflict：
   - 从日志提取 tmp_branch、remaining_queue、conflicted_branches。
   - git fetch origin。
   - 从 origin/<tmp_branch> 建立/重建本地工作分支。
   - rebase origin/<tmp_branch>。
   - 按 remaining_queue 顺序 merge origin/<branch>，解决冲突并 commit。
   - 运行必要的轻量验证。
   - push 回 tmp_branch；如果普通 push 只因 hook-only 失败，可用 --no-verify。
   - 对 original_run_id 执行 gh run rerun --failed。
   - rerun 后继续监视同一个 original_run_id，禁止新建 workflow run。

输出 ONLY compact JSON：
{"final_state":"succeeded|approval_required|blocked","run_url":"","original_run_id":"","tmp_branch":"","conflicted_branches":[],"repair_attempted":false,"repair_resolved":false,"rerun_requested":false,"validations_run":[],"blocker_type":"none|dispatch|non_conflict_failure|git_state|validation_failed|auth|unknown","summary":""}
"""

[steps.agent]
name = "coder"

[steps.validate]
format = "json"
required = ["final_state", "original_run_id", "summary", "rerun_requested", "blocker_type"]

[[steps]]
id = "approval-checkpoint"
title = "人工确认审批状态"
execution = "human_input"
depends_on = ["monitor-and-rerun"]
condition = "monitor-and-rerun.final_state == approval_required"
input_context = ["monitor-and-rerun"]
description = "workflow 进入人工审批时暂停，记录审批状态。"

  [steps.form]
  title = "Flow360 release 等待审批"
  submit_label = "记录"

  [[steps.form.fields]]
  name = "approval_status"
  label = "审批状态"
  type = "select"
  required = true
  options = ["waiting", "approved", "rejected", "unknown"]

  [[steps.form.fields]]
  name = "notes"
  label = "补充说明"
  type = "textarea"

[[steps]]
id = "final-report"
title = "输出发布报告"
depends_on = ["monitor-and-rerun", "approval-checkpoint"]
input_context = ["env", "dispatch-run", "monitor-and-rerun", "approval-checkpoint"]
description = """
输出中文发布报告，包含：env_name、tag、fresh_deploy、repo/workflow、original_run_id/run_url、最终状态、是否人工审批、是否修复 merge conflict、tmp_branch、冲突分支、rerun failed jobs 结果、验证项和 blocker。强调本次 original_run_id 只属于当前 formula run，下一次执行必须重新 dispatch。
"""

[steps.agent]
name = "reporter"
