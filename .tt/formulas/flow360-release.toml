formula = "flow360-release"
title = "Flow360 UI Next release"
category = "release"
tags = ["flow360-next", "deploy", "github-actions", "merge-conflict"]
description = "Flow360 发布流程：触发固定 GitHub Actions workflow，锁定 original_run_id，循环监控状态；遇到 multi-branch merge conflict 时修复 tmp branch、push --no-verify、rerun failed jobs，直到成功、进入审批等待或阻塞。"
version = 5
type = "workflow"

[vars]
env_name = { description = "发布环境", required = true, enum = ["dev", "uat2", "preprod"] }
tag = { description = "可选 tag/branch；空或 - 时不传", default = "" }
fresh_deploy = { description = "是否 fresh deploy", default = "false", enum = ["true", "false"] }
poll_interval_seconds = { description = "轮询间隔秒数", default = "30", type = "int", pattern = "^[1-9][0-9]*$" }

[[steps]]
id = "dispatch-run"
title = "触发 Flow360 CD workflow"
execution = "script"
description = "触发 flexcompute/flex 的 Flow360 CD workflow，并锁定本次 run id。"

  [steps.script]
  command = ["python3", "-c", """
import json, os, subprocess, time
REPO = 'flexcompute/flex'
WORKFLOW = '.github/workflows/frontend_flow360-ui-next-cd.yml'
ENV_NAME = os.environ['TT_ENV_NAME'].strip()
TAG = os.environ.get('TT_TAG', '').strip()
FRESH = os.environ.get('TT_FRESH_DEPLOY', 'false').strip().lower()
PASS_TAG = bool(TAG and TAG != '-')

def run(cmd):
    p = subprocess.run(cmd, text=True, capture_output=True)
    return p.returncode, p.stdout.strip(), p.stderr.strip()

def emit(**kw):
    base = dict(repo=REPO, workflow_path=WORKFLOW, env_name=ENV_NAME, tag=TAG, pass_tag=PASS_TAG, fresh_deploy=FRESH == 'true', run_created=False, original_run_id='', active_run_id='', run_url='', dispatch_error='')
    base.update(kw)
    print(json.dumps(base, separators=(',', ':')))

rc, out, _ = run(['gh', 'run', 'list', '-R', REPO, '--workflow', WORKFLOW, '--limit', '20', '--json', 'databaseId'])
known = set()
if rc == 0 and out:
    try:
        known = {str(x.get('databaseId') or '') for x in json.loads(out)}
    except Exception:
        pass

cmd = ['gh', 'workflow', 'run', WORKFLOW, '-R', REPO, '-f', f'envName={ENV_NAME}', '-f', f'freshDeploy={FRESH}']
if PASS_TAG:
    cmd += ['-f', f'tag={TAG}']
rc, out, err = run(cmd)
if rc != 0:
    emit(dispatch_error=err or out or 'gh workflow run failed')
    raise SystemExit(1)

for _ in range(12):
    time.sleep(5)
    rc, out, _ = run(['gh', 'run', 'list', '-R', REPO, '--workflow', WORKFLOW, '--limit', '20', '--json', 'databaseId,url,status,createdAt,event'])
    if rc != 0 or not out:
        continue
    try:
        runs = json.loads(out)
    except Exception:
        continue
    pick = next((item for item in runs if str(item.get('databaseId') or '') not in known), runs[0] if runs else None)
    if pick and pick.get('databaseId'):
        rid = str(pick['databaseId'])
        emit(run_created=True, original_run_id=rid, active_run_id=rid, run_url=pick.get('url', ''))
        raise SystemExit(0)

emit(dispatch_error='workflow dispatched but new run id was not visible within polling window')
raise SystemExit(1)
"""]
  format = "json"
  timeout = "90s"

  [steps.script.env]
  TT_ENV_NAME = "{{env_name}}"
  TT_TAG = "{{tag}}"
  TT_FRESH_DEPLOY = "{{fresh_deploy}}"

[[steps]]
id = "monitor-and-rerun"
title = "监控 run、修冲突并 rerun"
depends_on = ["dispatch-run"]
description = "循环检查 original_run_id；成功或审批等待即结束；检测到 Flow360 multi-branch merge conflict 时自动修复 tmp branch 并 rerun failed jobs。"

  [steps.loop]
  until = "release-progress.done == true"
  max = 80

  [[steps.loop.body]]
  id = "fetch-run-info"
  title = "获取 run 和失败日志"
  execution = "script"
  description = "读取 original_run_id 的 run/job 信息，只抓取失败 job 日志，避免拉取所有 completed job 日志。"

    [steps.loop.body.script]
    command = ["python3", "-c", """
import json, os, subprocess
REPO = 'flexcompute/flex'
RID = os.environ.get('TT_ORIGINAL_RUN_ID', '').strip()

def run(cmd):
    p = subprocess.run(cmd, text=True, capture_output=True)
    return p.returncode, p.stdout.strip(), p.stderr.strip()

def emit(**kw):
    base = dict(repo=REPO, original_run_id=RID, run_url='', status='', conclusion='', jobs=[], failed_job_logs=[], error='')
    base.update(kw)
    print(json.dumps(base, separators=(',', ':')))

if not RID:
    emit(error='missing original_run_id')
    raise SystemExit(0)

rc, out, err = run(['gh', 'run', 'view', RID, '-R', REPO, '--json', 'databaseId,url,status,conclusion,jobs'])
if rc != 0:
    emit(error=err or out or 'gh run view failed')
    raise SystemExit(0)
try:
    data = json.loads(out)
except Exception as exc:
    emit(error=f'parse gh run view failed: {exc}')
    raise SystemExit(0)

jobs = data.get('jobs') or []
failed_logs = []
for job in jobs:
    if (job.get('conclusion') or '').lower() != 'failure':
        continue
    jid = str(job.get('databaseId') or '')
    if not jid:
        continue
    rc, log, _ = run(['gh', 'run', 'view', RID, '-R', REPO, '--job', jid, '--log'])
    if rc == 0 and log:
        failed_logs.append({'job_id': jid, 'name': job.get('name', ''), 'log_excerpt': log[-20000:]})

emit(run_url=data.get('url', ''), status=data.get('status', ''), conclusion=data.get('conclusion') or '', jobs=jobs, failed_job_logs=failed_logs)
"""]
    format = "json"
    timeout = "60s"

    [steps.loop.body.script.env]
    TT_ORIGINAL_RUN_ID = "{{dispatch-run.original_run_id}}"

  [[steps.loop.body]]
  id = "classify-run-state"
  title = "判断 run 状态"
  depends_on = ["fetch-run-info"]
  input_context = ["dispatch-run", "fetch-run-info"]
  description = """
根据 fetch-run-info 输出判断本轮动作。

规则：
- dispatch-run.run_created=false 或 fetch-run-info.error 非空 -> done=true, action=block, final_state=blocked。
- GitHub Actions 等待人工 approval / waiting / environment protection -> done=true, action=none, final_state=approval_required。
- conclusion=success -> done=true, action=none, final_state=succeeded。
- status 为 queued/in_progress/running -> done=false, action=wait, final_state=running。
- 失败且 failed_job_logs 是 Flow360 multi-branch merge conflict -> done=false, action=repair_conflict，并提取 tmp_branch、remaining_queue、conflicted_branches。
- 其他失败 -> done=true, action=block, final_state=blocked。

输出 ONLY compact JSON：
{"done":false,"final_state":"running|succeeded|approval_required|blocked","action":"wait|repair_conflict|block|none","run_url":"","tmp_branch":"","remaining_queue":[],"conflicted_branches":[],"reason":""}
"""

    [steps.loop.body.agent]
    name = "coder"

    [steps.loop.body.validate]
    format = "json"
    required = ["done", "final_state", "action", "reason"]

  [[steps.loop.body]]
  id = "repair-conflict"
  title = "修复 multi-branch merge conflict"
  depends_on = ["classify-run-state"]
  condition = "classify-run-state.action == repair_conflict"
  input_context = ["env", "dispatch-run", "fetch-run-info", "classify-run-state"]
  description = """
根据 classify-run-state 的 tmp_branch、remaining_queue、conflicted_branches 修复冲突。

必须执行：
1. git fetch origin。
2. 从 origin/<tmp_branch> 建立/重建本地工作分支。
3. rebase origin/<tmp_branch>。
4. 按 remaining_queue 顺序 merge origin/<branch>。
5. 解决冲突并 commit。
6. 运行必要轻量验证。
7. push 回 tmp_branch，必须使用 `git push --no-verify origin HEAD:<tmp_branch>`。

禁止新建 workflow run，禁止 rerun，本步骤只负责修复并 push tmp branch。
输出 ONLY compact JSON：
{"attempted":true,"resolved":true,"tmp_branch":"","handled_branches":[],"touched_files":[],"validations_run":[],"push_completed":true,"blocker_type":"none|git_state|validation_failed|auth|unknown","blocker_summary":""}
"""

    [steps.loop.body.agent]
    name = "coder"

    [steps.loop.body.validate]
    format = "json"
    required = ["attempted", "resolved", "tmp_branch", "push_completed", "blocker_type"]

  [[steps.loop.body]]
  id = "rerun-failed-jobs"
  title = "rerun failed jobs"
  execution = "script"
  depends_on = ["repair-conflict"]
  condition = "repair-conflict.resolved == true"
  description = "修复 tmp branch 后只 rerun failed jobs，继续监视同一个 original_run_id。"

    [steps.loop.body.script]
    command = ["python3", "-c", """
import json, os, subprocess
REPO = 'flexcompute/flex'
RID = os.environ.get('TT_ORIGINAL_RUN_ID', '').strip()
p = subprocess.run(['gh', 'run', 'rerun', RID, '-R', REPO, '--failed'], text=True, capture_output=True)
print(json.dumps({'requested': p.returncode == 0, 'original_run_id': RID, 'stdout': p.stdout.strip(), 'stderr': p.stderr.strip()}, separators=(',', ':')))
"""]
    format = "json"
    timeout = "60s"

    [steps.loop.body.script.env]
    TT_ORIGINAL_RUN_ID = "{{dispatch-run.original_run_id}}"

  [[steps.loop.body]]
  id = "wait-next-poll"
  title = "等待下一轮轮询"
  execution = "script"
  depends_on = ["classify-run-state"]
  condition = "classify-run-state.action == wait"

    [steps.loop.body.script]
    command = ["python3", "-c", "import json,time,sys; s=int(sys.argv[1]); time.sleep(s); print(json.dumps({'wait_seconds':s},separators=(',',':')))", "{{poll_interval_seconds}}"]
    format = "json"
    timeout = "120s"

  [[steps.loop.body]]
  id = "release-progress"
  title = "更新发布进度"
  execution = "script"
  depends_on = ["classify-run-state", "repair-conflict", "rerun-failed-jobs", "wait-next-poll"]
  description = "用确定性脚本汇总本轮结果，避免额外 agent 漂移。"

    [steps.loop.body.script]
    command = ["python3", "-c", """
import json, os

def load(name, default=None):
    raw = os.environ.get(name, '').strip()
    if not raw:
        return default if default is not None else {}
    try:
        return json.loads(raw)
    except Exception:
        return default if default is not None else {}

cls = load('TT_CLASSIFY', {})
repair = load('TT_REPAIR', {})
rerun = load('TT_RERUN', {})
dispatch = load('TT_DISPATCH', {})
fetch = load('TT_FETCH', {})

action = cls.get('action') or 'block'
repair_attempted = bool(repair.get('attempted'))
repair_resolved = bool(repair.get('resolved'))
rerun_requested = bool(rerun.get('requested'))

done = bool(cls.get('done'))
final_state = cls.get('final_state') or 'running'
blocker_type = 'none'
summary = cls.get('reason') or ''

if action == 'repair_conflict':
    if repair_attempted and not repair_resolved:
        done, final_state = True, 'blocked'
        blocker_type = repair.get('blocker_type') or 'unknown'
        summary = repair.get('blocker_summary') or summary or 'repair failed'
    elif repair_resolved and rerun_requested:
        done, final_state = False, 'running'
        summary = 'conflict repaired and failed jobs rerun; continue monitoring original run'
    else:
        done, final_state = True, 'blocked'
        blocker_type = 'unknown'
        summary = summary or 'repair or rerun did not complete'
elif action == 'wait':
    done, final_state = False, 'running'
elif action == 'block':
    done, final_state = True, 'blocked'
    blocker_type = 'dispatch' if dispatch.get('dispatch_error') else 'non_conflict_failure'

out = {
    'done': done,
    'final_state': final_state,
    'run_url': cls.get('run_url') or fetch.get('run_url') or dispatch.get('run_url') or '',
    'original_run_id': dispatch.get('original_run_id') or fetch.get('original_run_id') or '',
    'tmp_branch': cls.get('tmp_branch') or repair.get('tmp_branch') or '',
    'conflicted_branches': cls.get('conflicted_branches') or [],
    'repair_attempted': repair_attempted,
    'repair_resolved': repair_resolved,
    'rerun_requested': rerun_requested,
    'validations_run': repair.get('validations_run') or [],
    'blocker_type': blocker_type,
    'summary': summary,
}
print(json.dumps(out, separators=(',', ':')))
"""]
    format = "json"
    timeout = "30s"

    [steps.loop.body.script.env]
    TT_DISPATCH = "{{dispatch-run}}"
    TT_FETCH = "{{fetch-run-info}}"
    TT_CLASSIFY = "{{classify-run-state}}"
    TT_REPAIR = "{{repair-conflict}}"
    TT_RERUN = "{{rerun-failed-jobs}}"

[[steps]]
id = "final-report"
title = "输出发布报告"
depends_on = ["monitor-and-rerun"]
input_context = ["dispatch-run", "release-progress", "fetch-run-info", "classify-run-state", "repair-conflict", "rerun-failed-jobs"]
description = """
输出中文发布报告，包含环境、tag、fresh_deploy、repo/workflow、original_run_id/run_url、最终状态、是否进入人工审批阶段、是否修复 merge conflict、tmp_branch、冲突分支、rerun failed jobs 结果、验证项和 blocker。强调本次 original_run_id 只属于当前 formula run，下一次执行必须重新 dispatch。
"""

[steps.agent]
name = "reporter"
