formula = "bug-detect"
description = "Scan the current working directory from multiple angles, identify concrete code issues, create Jira tickets for confirmed issues, and summarize the submitted tickets with severity and rationale."
version = 4
type = "workflow"

[preflight]

[[preflight.checks]]
type = "command"
name = "jira"
command = "jira"
message = "需要安装并配置 Jira CLI；bug-detect 会使用 jira create 创建 ticket"

[[preflight.checks]]
type = "exec"
name = "jira-callable"
command = "jira --help"
message = "Jira CLI 不可调用，请先确认 jira 已配置并能正常执行"

[vars]
scan_path = { description = "Directory to inspect. Defaults to the current working directory.", default = "{{env.cwd}}" }
jira_project = { description = "Jira project key used when creating tickets. This is not a Jira issue key/ticket id.", default = "FLOW360" }
max_tickets = { description = "Maximum number of Jira tickets to create in one run.", default = "10" }

[[steps]]
id = "collect-repo-facts"
title = "Collect repository facts"
execution = "script"

[steps.script]
command = ["python3", "-c", """
import json, os, subprocess
raw_scan_path = os.environ.get("SCAN_PATH", ".")
candidate = os.path.abspath(os.path.expanduser(raw_scan_path))
if "{{" in raw_scan_path or "}}" in raw_scan_path or not os.path.isdir(candidate):
    cwd = os.getcwd()
else:
    cwd = candidate
def run(cmd):
    try:
        p = subprocess.run(cmd, cwd=cwd, capture_output=True, text=True, timeout=30)
        return {
            "ok": p.returncode == 0,
            "code": p.returncode,
            "stdout": p.stdout.strip(),
            "stderr": p.stderr.strip(),
        }
    except Exception as e:
        return {"ok": False, "code": -1, "stdout": "", "stderr": str(e)}

out = {
    "scan_path": cwd,
    "git_root": run(["git", "rev-parse", "--show-toplevel"]),
    "git_branch": run(["git", "rev-parse", "--abbrev-ref", "HEAD"]),
    "git_status": run(["git", "status", "--short"]),
    "top_entries": sorted(os.listdir(cwd))[:200],
    "env": {
        "os": os.uname().sysname if hasattr(os, "uname") else "",
    },
}
print(json.dumps(out, ensure_ascii=False))
"""]
format = "json"
timeout = "1m"

[steps.script.env]
SCAN_PATH = "{{scan_path}}"

[steps.validate]
format = "json"
required = ["stdout"]

[[steps]]
id = "collect-file-index"
title = "Collect source file index"
depends_on = ["collect-repo-facts"]
execution = "script"

[steps.script]
command = ["python3", "-c", """
import json, os
raw_scan_path = os.environ.get("SCAN_PATH", ".")
candidate = os.path.abspath(os.path.expanduser(raw_scan_path))
if "{{" in raw_scan_path or "}}" in raw_scan_path or not os.path.isdir(candidate):
    cwd = os.getcwd()
else:
    cwd = candidate
skip_dirs = {
    ".git", ".hg", ".svn", "node_modules", "vendor", "dist", "build",
    ".next", ".nuxt", "coverage", ".turbo", ".idea", ".vscode", "__pycache__"
}
exts = {
    ".go", ".py", ".js", ".jsx", ".ts", ".tsx", ".java", ".kt", ".rb", ".rs",
    ".c", ".cc", ".cpp", ".h", ".hpp", ".cs", ".php", ".swift", ".m", ".mm",
    ".scala", ".sh", ".sql", ".yaml", ".yml", ".json", ".toml"
}
files = []
for root, dirs, names in os.walk(cwd):
    dirs[:] = [d for d in dirs if d not in skip_dirs]
    for name in names:
        path = os.path.join(root, name)
        rel = os.path.relpath(path, cwd)
        ext = os.path.splitext(name)[1].lower()
        if ext not in exts:
            continue
        try:
            size = os.path.getsize(path)
        except OSError:
            continue
        files.append({"path": rel, "ext": ext, "size": size})
files.sort(key=lambda x: (x["ext"], x["path"]))
summary = {}
for f in files:
    summary[f["ext"]] = summary.get(f["ext"], 0) + 1
print(json.dumps({
    "scan_path": cwd,
    "file_count": len(files),
    "by_ext": summary,
    "files": files[:2000]
}, ensure_ascii=False))
"""]
format = "json"
timeout = "2m"

[steps.script.env]
SCAN_PATH = "{{scan_path}}"

[steps.validate]
format = "json"
required = ["stdout"]

[[steps]]
id = "run-static-checks"
title = "Run deterministic static checks"
depends_on = ["collect-repo-facts", "collect-file-index"]
execution = "script"

[steps.script]
command = ["python3", "-c", """
import json, os, re
raw_scan_path = os.environ.get("SCAN_PATH", ".")
candidate = os.path.abspath(os.path.expanduser(raw_scan_path))
if "{{" in raw_scan_path or "}}" in raw_scan_path or not os.path.isdir(candidate):
    cwd = os.getcwd()
else:
    cwd = candidate
skip_dirs = {
    ".git", ".hg", ".svn", "node_modules", "vendor", "dist", "build",
    ".next", ".nuxt", "coverage", ".turbo", ".idea", ".vscode", "__pycache__"
}
targets = {
    ".go", ".py", ".js", ".jsx", ".ts", ".tsx", ".java", ".kt", ".rb", ".rs",
    ".c", ".cc", ".cpp", ".h", ".hpp", ".cs", ".php", ".swift", ".m", ".mm",
    ".scala", ".sh"
}
patterns = [
    ("debug_print", re.compile(r"\\b(console\\.log|print\\(|fmt\\.Println\\(|System\\.out\\.println\\()")),
    ("todo_fixme", re.compile(r"\\b(TODO|FIXME|HACK|XXX)\\b")),
    ("empty_catch", re.compile(r"catch\\s*\\([^)]*\\)\\s*\\{\\s*\\}")),
    ("bare_except", re.compile(r"except\\s*:\\s*(pass)?")),
    ("panic_usage", re.compile(r"\\bpanic\\s*\\(")),
    ("hardcoded_localhost", re.compile(r"localhost|127\\.0\\.0\\.1")),
    ("hardcoded_secret_like", re.compile(r"(AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]+PRIVATE KEY-----|api[_-]?key\\s*[:=]|secret\\s*[:=]|password\\s*[:=])", re.I)),
]
findings = []
for root, dirs, names in os.walk(cwd):
    dirs[:] = [d for d in dirs if d not in skip_dirs]
    for name in names:
        ext = os.path.splitext(name)[1].lower()
        if ext not in targets:
            continue
        path = os.path.join(root, name)
        rel = os.path.relpath(path, cwd)
        try:
            with open(path, "r", encoding="utf-8", errors="ignore") as f:
                for lineno, line in enumerate(f, start=1):
                    for kind, rx in patterns:
                        if rx.search(line):
                            findings.append({
                                "path": rel,
                                "line": lineno,
                                "kind": kind,
                                "snippet": line.strip()[:240]
                            })
        except Exception:
            continue
print(json.dumps({
    "scan_path": cwd,
    "finding_count": len(findings),
    "findings": findings[:1000]
}, ensure_ascii=False))
"""]
format = "json"
timeout = "3m"
continue_on_error = true

[steps.script.env]
SCAN_PATH = "{{scan_path}}"

[steps.validate]
format = "json"
required = ["stdout"]

[[steps]]
id = "run-tests"
title = "Run available tests when recognizable"
depends_on = ["collect-repo-facts", "collect-file-index"]
execution = "script"

[steps.script]
command = ["python3", "-c", """
import json, os, subprocess
raw_scan_path = os.environ.get("SCAN_PATH", ".")
candidate = os.path.abspath(os.path.expanduser(raw_scan_path))
if "{{" in raw_scan_path or "}}" in raw_scan_path or not os.path.isdir(candidate):
    cwd = os.getcwd()
else:
    cwd = candidate

def exists(*parts):
    return os.path.exists(os.path.join(cwd, *parts))

def run(cmd, timeout):
    try:
        p = subprocess.run(cmd, cwd=cwd, capture_output=True, text=True, timeout=timeout)
        return {
            "command": cmd,
            "ok": p.returncode == 0,
            "code": p.returncode,
            "stdout": p.stdout[-12000:],
            "stderr": p.stderr[-12000:],
        }
    except Exception as e:
        return {
            "command": cmd,
            "ok": False,
            "code": -1,
            "stdout": "",
            "stderr": str(e),
        }

attempts = []
if exists("go.mod"):
    attempts.append(run(["go", "test", "./..."], 300))
elif exists("package.json"):
    attempts.append(run(["npm", "test", "--", "--runInBand"], 300))
elif exists("pytest.ini") or exists("pyproject.toml") or exists("requirements.txt"):
    attempts.append(run(["pytest", "-q"], 300))
else:
    attempts.append({
        "command": [],
        "ok": True,
        "code": 0,
        "stdout": "",
        "stderr": "",
        "skipped": True,
        "reason": "No recognized test runner configuration found."
    })

print(json.dumps({
    "scan_path": cwd,
    "attempt_count": len(attempts),
    "attempts": attempts
}, ensure_ascii=False))
"""]
format = "json"
timeout = "6m"
continue_on_error = true

[steps.script.env]
SCAN_PATH = "{{scan_path}}"

[steps.validate]
format = "json"
required = ["stdout"]

[[steps]]
id = "review-code"
title = "Review the codebase from multiple angles"
depends_on = ["collect-repo-facts", "collect-file-index", "run-static-checks", "run-tests"]
input_context = ["collect-repo-facts.stdout", "collect-file-index.stdout", "run-static-checks.stdout", "run-tests.stdout"]
description = """
You are auditing the code under {{scan_path}}.

Review the repository from multiple angles:
- correctness and bug risk
- error handling and edge cases
- concurrency or state issues
- configuration and environment assumptions
- test gaps and failing signals
- security and data safety
- maintainability issues that are likely to cause defects soon

Use the deterministic evidence from prior steps first. Only report concrete, actionable issues with enough evidence to justify creating a Jira ticket.

Output ONLY compact JSON in this shape:
{
  "repo_summary":"short summary",
  "issues":[
    {
      "title":"short Jira-ready summary",
      "severity":"critical|high|medium|low",
      "category":"correctness|reliability|security|performance|maintainability|test-gap|config",
      "problem":"what is wrong",
      "impact":"why it matters",
      "evidence":[
        {"path":"relative/path","line":1,"detail":"specific evidence"}
      ],
      "recommended_fix":"specific next action",
      "confidence":0.0
    }
  ]
}

Rules:
- Report at most {{max_tickets}} issues.
- Keep only issues with confidence >= 0.7.
- Do not invent file paths or line numbers.
- If there is no justified issue, return an empty issues array.
"""

[steps.agent]
name = "coder"

[steps.validate]
format = "json"
required = ["repo_summary", "issues"]

[[steps]]
id = "triage-issues"
title = "Triage and normalize issues"
depends_on = ["review-code"]
input_context = ["review-code"]
description = """
Normalize and deduplicate the detected issues for Jira creation.

All Jira-facing fields must be written in English, including title, problem, impact, evidence_summary, and recommended_fix. Do not output Chinese in issue fields.

Output ONLY compact JSON:
{
  "create_tickets": true,
  "issues":[
    {
      "title":"short Jira-ready summary",
      "severity":"critical|high|medium|low",
      "priority":"P0|P1|P2|P3",
      "category":"correctness|reliability|security|performance|maintainability|test-gap|config",
      "problem":"what is wrong",
      "impact":"why it matters",
      "evidence_summary":"concise evidence summary",
      "recommended_fix":"specific next action",
      "confidence":0.0
    }
  ],
  "summary":"one paragraph summary"
}

Rules:
- Deduplicate overlapping issues.
- Keep at most {{max_tickets}} issues.
- Set create_tickets to false when issues is empty.
- Map severity to priority consistently.
"""

[steps.agent]
name = "product-manager"

[steps.validate]
format = "json"
required = ["create_tickets", "issues", "summary"]

[[steps]]
id = "create-jira-tickets"
title = "Create Jira tickets for confirmed issues"
depends_on = ["triage-issues"]
condition = "triage-issues.create_tickets == true"
execution = "script"

[steps.script]
command = ["python3", "-c", """
import json, os, subprocess, sys

raw = os.environ.get("TRIAGE_JSON", "")
project = os.environ.get("JIRA_PROJECT", "").strip()
if not raw:
    print(json.dumps({"created_count": 0, "tickets": [], "error": "missing triage json"}, ensure_ascii=False))
    sys.exit(0)

triage = json.loads(raw)
issues = triage.get("issues", [])
tickets = []

for issue in issues:
    payload = {
        "project": project,
        "summary": issue.get("title", ""),
        "severity": issue.get("severity", ""),
        "priority": issue.get("priority", ""),
        "category": issue.get("category", ""),
        "problem": issue.get("problem", ""),
        "impact": issue.get("impact", ""),
        "evidence_summary": issue.get("evidence_summary", ""),
        "recommended_fix": issue.get("recommended_fix", ""),
        "confidence": issue.get("confidence", 0),
    }
    body = json.dumps(payload, ensure_ascii=False, indent=2)
    cmd = [
        "jira", "issue", "create",
        "--project", project,
        "--type", "Task",
        "--summary", payload["summary"],
        "--body", body,
        "--no-input",
        "--raw",
    ]
    try:
        p = subprocess.run(cmd, capture_output=True, text=True, timeout=60)
        ticket = {
            "ok": p.returncode == 0,
            "summary": payload["summary"],
            "severity": payload["severity"],
            "priority": payload["priority"],
            "category": payload["category"],
            "stdout": p.stdout.strip(),
            "stderr": p.stderr.strip(),
        }
        tickets.append(ticket)
    except Exception as e:
        tickets.append({
            "ok": False,
            "summary": payload["summary"],
            "severity": payload["severity"],
            "priority": payload["priority"],
            "category": payload["category"],
            "stdout": "",
            "stderr": str(e),
        })

created_count = sum(1 for ticket in tickets if ticket.get("ok"))
print(json.dumps({
    "created_count": created_count,
    "attempted_count": len(tickets),
    "tickets": tickets
}, ensure_ascii=False))
"""]
format = "json"
timeout = "15m"
continue_on_error = true

[steps.script.env]
TRIAGE_JSON = "{{triage-issues}}"
JIRA_PROJECT = "{{jira_project}}"

[steps.validate]
format = "json"
required = ["stdout"]

[[steps]]
id = "no-issues"
title = "Summarize when no issue is found"
depends_on = ["triage-issues"]
condition = "triage-issues.create_tickets != true"
input_context = ["collect-repo-facts.stdout", "collect-file-index.stdout", "run-static-checks.stdout", "run-tests.stdout", "triage-issues"]
description = """
Write a concise final report explaining that no sufficiently justified issue was found for Jira creation.

Include:
- what was scanned
- what evidence sources were used
- why no ticket was created
- what follow-up checks are still recommended

Return normal prose.
"""

[steps.agent]
name = "reporter"

[[steps]]
id = "final-report"
title = "Summarize detected issues and Jira tickets"
depends_on = ["triage-issues", "create-jira-tickets"]
condition = "triage-issues.create_tickets == true"
input_context = ["collect-repo-facts.stdout", "run-static-checks.stdout", "run-tests.stdout", "triage-issues", "create-jira-tickets.stdout"]
description = """
Write the final user-facing report in Chinese.

The report must summarize:
- what repository/path was scanned
- what angles were checked
- which concrete issues were selected
- each issue's severity and priority
- which Jira tickets were attempted or created
- any failed ticket creation attempts
- the most urgent next actions

The Jira ticket content itself is created in English. In this Chinese report, include a Markdown table named `Jira 创建结果` with one row per attempted ticket and these fixed columns: `Issue`, `Priority`, `Category`, `Created`, `Key/URL`, `Error`. Use `create-jira-tickets.stdout.tickets` as the source. If stdout contains raw JSON from Jira, extract the issue key or URL when available; otherwise put `未提供`. For failures, include the concise stderr reason.

Be concise but complete. Prefer the Jira result table plus short bullets and a short conclusion.
"""

[steps.agent]
name = "reporter"
